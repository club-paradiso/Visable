name: manual-260807-top-tier-family-apply

on:
  push:
    branches:
      - fix/manual-260807-top-tier-family

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-260807-top-tier-family

      - name: Apply canonical authoring refresh
        run: python3 scripts/visa/apply_manual_260807_top_tier_family_refresh.py

      - name: Verify generated data
        run: |
          python3 scripts/visa/apply_manual_260807_top_tier_family_refresh.py --check
          python3 scripts/visa/build_visa_data.py --check

      - name: Commit generated refresh
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/data/visa_authoring/statuses/F-2.json \
            backend/data/visa_authoring/statuses/F-3.json \
            backend/data/visa_authoring/statuses/F-5.json \
            visa_data.json \
            backend/data/visas.json
          git commit -m "fix(manual): materialize Top-Tier family subcodes"
          git push origin HEAD:fix/manual-260807-top-tier-family
