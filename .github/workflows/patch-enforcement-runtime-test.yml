name: Patch Enforcement Runtime Test

on:
  push:
    branches:
      - fix/enforcement-provider-budget-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforcement-provider-budget-20260904

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update stale enforcement role contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/test_ai_runtime.py')
          text = p.read_text()
          old = '''    def test_enforcement_structured_role_uses_fast_chain_then_verifier(self):
        plan = rt.resolve_task_models(rt.TaskRole.ENFORCEMENT_STRUCTURED)
        fast = rt.resolve_task_models(rt.TaskRole.FAST_FINAL_ANSWER)["candidates"]
        verifier = rt.resolve_task_models(rt.TaskRole.VERIFIER)["candidates"][0]
        self.assertEqual(plan["task_role"], "enforcement_structured")
        self.assertEqual(plan["candidates"][:len(fast)], fast)
        self.assertIn(verifier, plan["candidates"])
'''
          new = '''    def test_enforcement_structured_role_uses_dedicated_bounded_chain(self):
        plan = rt.resolve_task_models(rt.TaskRole.ENFORCEMENT_STRUCTURED)
        fast = rt.resolve_task_models(rt.TaskRole.FAST_FINAL_ANSWER)["candidates"]
        verifier = rt.resolve_task_models(rt.TaskRole.VERIFIER)["candidates"][0]
        self.assertEqual(plan["task_role"], "enforcement_structured")
        self.assertEqual(
            plan["candidates"],
            ["google/gemma-4-26b-a4b-it:free", "openai/gpt-oss-20b:free"],
        )
        self.assertEqual(len(plan["candidates"]), 2)
        self.assertNotEqual(plan["candidates"], fast)
        self.assertNotIn(verifier, plan["candidates"])
'''
          if text.count(old) != 1:
              raise SystemExit('expected stale enforcement role test exactly once')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused runtime contract
        run: python -m unittest backend.tests.test_ai_runtime -v

      - name: Commit corrected test contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-enforcement-runtime-test.yml
          git add backend/tests/test_ai_runtime.py
          git commit -m 'test(enforcement): assert dedicated bounded runtime chain'
          git push origin HEAD:fix/enforcement-provider-budget-20260904
