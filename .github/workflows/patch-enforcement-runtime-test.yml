name: Patch Enforcement Runtime Test

on:
  push:
    branches:
      - fix/enforcement-provider-budget-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforcement-provider-budget-20260904

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply stale runtime-test contract patch
        run: python scripts/_patch_enforcement_runtime_test.py

      - name: Run focused runtime contract
        run: python -m unittest backend.tests.test_ai_runtime -v

      - name: Commit corrected test contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-enforcement-runtime-test.yml scripts/_patch_enforcement_runtime_test.py
          git add backend/tests/test_ai_runtime.py
          git commit -m 'test(enforcement): assert dedicated bounded runtime chain'
          git push origin HEAD:fix/enforcement-provider-budget-20260904
