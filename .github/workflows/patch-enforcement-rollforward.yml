name: Patch Enforcement Rollforward

on:
  push:
    branches:
      - fix/enforcement-provider-budget-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforcement-provider-budget-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch bounded enforcement AI path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Give enforcement its own model policy so stale deploy-wide Fast env
          # overrides cannot silently route this high-cost path through obsolete chains.
          replace_once(
              'backend/services/model_policy.py',
              'DEFAULT_VERIFIER_MODEL = "openai/gpt-oss-120b:free"\n',
              '''# Enforcement structured extraction/prediction is deliberately isolated from\n# the deploy-wide Fast answer env overrides. Railway can carry older Fast-tier\n# settings for unrelated features; enforcement must not inherit those silently.\n# Keep this chain short: both models are current free OpenRouter endpoints with\n# structured-output support, and the caller applies a hard total latency budget.\nDEFAULT_ENFORCEMENT_STRUCTURED_MODEL = "google/gemma-4-26b-a4b-it:free"\nDEFAULT_ENFORCEMENT_STRUCTURED_MODEL_CANDIDATES: List[str] = [\n    "google/gemma-4-26b-a4b-it:free",\n    "openai/gpt-oss-20b:free",\n]\n\nDEFAULT_VERIFIER_MODEL = "openai/gpt-oss-120b:free"\n'''
          )
          replace_once(
              'backend/services/model_policy.py',
              '    final_candidates = _dedupe_preserve_order(\n        [final_model, *_csv_env("OPENROUTER_MODEL_CANDIDATES", DEFAULT_FINAL_ANSWER_MODEL_CANDIDATES)]\n    )\n\n    return {\n',
              '''    final_candidates = _dedupe_preserve_order(\n        [final_model, *_csv_env("OPENROUTER_MODEL_CANDIDATES", DEFAULT_FINAL_ANSWER_MODEL_CANDIDATES)]\n    )\n    enforcement_model = _env(\n        "OPENROUTER_ENFORCEMENT_MODEL", DEFAULT_ENFORCEMENT_STRUCTURED_MODEL\n    )\n    enforcement_candidates = _dedupe_preserve_order(\n        [\n            enforcement_model,\n            *_csv_env(\n                "OPENROUTER_ENFORCEMENT_MODEL_CANDIDATES",\n                DEFAULT_ENFORCEMENT_STRUCTURED_MODEL_CANDIDATES,\n            ),\n        ]\n    )\n\n    return {\n'''
          )
          replace_once(
              'backend/services/model_policy.py',
              '        "verifier_model": _env("AI_VERIFIER_MODEL", DEFAULT_VERIFIER_MODEL),\n',
              '''        "verifier_model": _env("AI_VERIFIER_MODEL", DEFAULT_VERIFIER_MODEL),\n        "enforcement_structured_model": enforcement_model,\n        "enforcement_structured_model_candidates": enforcement_candidates,\n'''
          )

          # 2) ENFORCEMENT_STRUCTURED now uses only its dedicated two-model chain.
          replace_once(
              'backend/services/ai_runtime.py',
              '''    elif task == TaskRole.ENFORCEMENT_STRUCTURED:\n        # Extraction/prediction already runs behind deterministic legal rules and\n        # strict typed validation. Lead with the low-latency structured-output\n        # chain; keep the verifier model as the final deep fallback without\n        # paying the general 405B Basic-answer primary on every request.\n        candidates = chain(fast["candidates"], policy["verifier_model"])\n''',
              '''    elif task == TaskRole.ENFORCEMENT_STRUCTURED:\n        # Enforcement already has deterministic legal rules and strict typed\n        # validation. Do not inherit deploy-wide Fast overrides or a deep verifier\n        # tail: both caused minute-scale latency when every candidate failed.\n        candidates = chain(policy["enforcement_structured_model_candidates"])\n'''
          )

          # 3) Do not call an LLM when the conservative local extractor already has
          # the material classification + duration. An LLM cannot infer omitted facts.
          replace_once(
              'backend/services/enforcement_service.py',
              '''    fallback = _heuristic_extract(text, assessment_date=assessment_date)\n    if provider is None:\n        return fallback\n\n    try:\n''',
              '''    fallback = _heuristic_extract(text, assessment_date=assessment_date)\n    heuristic_complete = bool(\n        fallback.status_of_stay\n        and fallback.violation_code\n        and fallback.duration_days is not None\n        and not fallback.extraction_warnings\n    )\n    if provider is None or heuristic_complete:\n        return fallback\n\n    try:\n'''
          )

          # 4) Hard-cap the ENTIRE enforcement candidate chain. This covers both
          # ambiguous extraction and prediction and cancels nested httpx awaits.
          replace_once(
              'backend/paradiso_backend.py',
              'import json\nimport logging\n',
              'import asyncio\nimport json\nimport logging\n'
          )
          replace_once(
              'backend/paradiso_backend.py',
              'OPENROUTER_TIMEOUT_SECONDS: float = _env_float("OPENROUTER_TIMEOUT_SECONDS", 60.0)\n',
              '''OPENROUTER_TIMEOUT_SECONDS: float = _env_float("OPENROUTER_TIMEOUT_SECONDS", 60.0)\n# Enforcement is synchronous from the user\'s perspective, so a long provider\n# fallback chain is worse than returning the deterministic legal baseline.\n# This is a total budget for the whole enforcement model chain, not per model.\nENFORCEMENT_AI_BUDGET_SECONDS: float = min(12.0, max(1.0, _env_float("ENFORCEMENT_AI_BUDGET_SECONDS", 8.0)))\n'''
          )
          replace_once(
              'backend/paradiso_backend.py',
              '''async def _enforcement_ai_provider(prompt: str) -> Dict[str, Any]:\n    """Shared-runtime structured role for enforcement extraction/prediction."""\n    plan = _ai_runtime.resolve_task_models(_ai_runtime.TaskRole.ENFORCEMENT_STRUCTURED)\n    return await _openrouter_complete_with_candidates(\n        prompt,\n        requested_model=plan["primary"],\n        candidate_models=plan["candidates"],\n        max_tokens=1800,\n    )\n''',
              '''async def _enforcement_ai_provider(prompt: str) -> Dict[str, Any]:\n    """Bounded shared-runtime provider for enforcement extraction/prediction."""\n    plan = _ai_runtime.resolve_task_models(_ai_runtime.TaskRole.ENFORCEMENT_STRUCTURED)\n    try:\n        return await asyncio.wait_for(\n            _openrouter_complete_with_candidates(\n                prompt,\n                requested_model=plan["primary"],\n                candidate_models=plan["candidates"],\n                max_tokens=900,\n            ),\n            timeout=ENFORCEMENT_AI_BUDGET_SECONDS,\n        )\n    except asyncio.TimeoutError:\n        logger.warning(\n            "enforcement_ai_budget_exhausted: budget=%.1fs candidates=%d",\n            ENFORCEMENT_AI_BUDGET_SECONDS,\n            len(plan["candidates"]),\n        )\n        return {\n            "ok": False,\n            "answer": None,\n            "primary_model": plan["primary"],\n            "model_candidates": list(plan["candidates"]),\n            "attempted_models": [],\n            "final_model": None,\n            "provider_error_type": "enforcement_total_timeout",\n        }\n'''
          )

          # 5) Regression tests: clear cases skip the provider, role isolation stays
          # intact, and the public model chain is intentionally short.
          test_path = Path('backend/tests/test_enforcement_latency_budget.py')
          test_path.write_text(r'''from __future__ import annotations

import asyncio
import os
import sys
import unittest
from datetime import date
from pathlib import Path
from unittest.mock import patch

REPO_ROOT = Path(__file__).resolve().parents[2]
BACKEND_DIR = REPO_ROOT / "backend"
if str(BACKEND_DIR) not in sys.path:
    sys.path.insert(0, str(BACKEND_DIR))

from services import ai_runtime
from services.enforcement_service import extract_structured_case


class EnforcementLatencyBudgetTests(unittest.IsolatedAsyncioTestCase):
    async def test_clear_heuristic_case_skips_ai_provider(self):
        calls = 0

        async def provider(_prompt):
            nonlocal calls
            calls += 1
            raise AssertionError("provider should not be called for a complete local parse")

        case = await extract_structured_case(
            "D-2 유학생인데 시간제취업 허가 없이 음식점에서 18일 아르바이트했습니다. 이번이 처음입니다.",
            provider=provider,
            assessment_date=date(2026, 9, 4),
        )
        self.assertEqual(calls, 0)
        self.assertEqual(case.violation_code, "STATUS_OUTSIDE_ACTIVITY_ART20")
        self.assertEqual(case.duration_days, 18)
        self.assertEqual(case.prior_violations, 0)

    async def test_ambiguous_case_still_uses_ai_provider(self):
        calls = 0

        async def provider(_prompt):
            nonlocal calls
            calls += 1
            return {"ok": False, "answer": None}

        await extract_structured_case(
            "F-2인데 다른 곳에서 허가 없이 10일 일했습니다.",
            provider=provider,
            assessment_date=date(2026, 9, 4),
        )
        self.assertEqual(calls, 1)

    def test_enforcement_role_isolated_from_fast_env_overrides(self):
        with patch.dict(
            os.environ,
            {
                "OPENROUTER_FAST_MODEL": "stale/example-model:free",
                "OPENROUTER_FAST_MODEL_CANDIDATES": "stale/example-model:free",
            },
            clear=False,
        ):
            plan = ai_runtime.resolve_task_models(ai_runtime.TaskRole.ENFORCEMENT_STRUCTURED)
        self.assertEqual(plan["primary"], "google/gemma-4-26b-a4b-it:free")
        self.assertEqual(
            plan["candidates"],
            ["google/gemma-4-26b-a4b-it:free", "openai/gpt-oss-20b:free"],
        )
        self.assertNotIn("stale/example-model:free", plan["candidates"])
        self.assertEqual(len(plan["candidates"]), 2)


if __name__ == "__main__":
    unittest.main()
''')
          PY

          python -m unittest backend.tests.test_enforcement_latency_budget -v
          python -m unittest backend.tests.test_enforcement_intelligence -v
          python scripts/check_ai_architecture.py

      - name: Commit bounded roll-forward
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-enforcement-rollforward.yml
          git add backend/services/model_policy.py backend/services/ai_runtime.py backend/services/enforcement_service.py backend/paradiso_backend.py backend/tests/test_enforcement_latency_budget.py
          git commit -m 'fix(enforcement): bound AI latency and isolate structured models'
          git push origin HEAD:fix/enforcement-provider-budget-20260904
