name: Patch Enforcement Rollforward

on:
  push:
    branches:
      - fix/enforcement-provider-budget-20260904

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforcement-provider-budget-20260904

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply bounded enforcement patch
        run: python scripts/_patch_enforcement_rollforward.py

      - name: Run focused enforcement checks
        run: |
          python -m unittest backend.tests.test_enforcement_latency_budget -v
          python -m unittest backend.tests.test_enforcement_intelligence -v
          python scripts/check_ai_architecture.py

      - name: Commit roll-forward
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-enforcement-rollforward.yml scripts/_patch_enforcement_rollforward.py
          git add backend/services/model_policy.py backend/services/ai_runtime.py backend/services/enforcement_service.py backend/paradiso_backend.py backend/tests/test_enforcement_latency_budget.py
          git commit -m 'fix(enforcement): bound AI latency and isolate structured models'
          git push origin HEAD:fix/enforcement-provider-budget-20260904
