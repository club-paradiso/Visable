name: HiKorea Manual Board Monitor

# Watches the official HiKorea boards where 자격별 안내 매뉴얼 are published and
# opens/updates a tracking issue when a board changes — so a new manual is
# noticed automatically instead of a maintainer checking the site by hand.
#
# It NEVER downloads a manual, edits production data, or bumps its own baseline.
# On a detected change it only opens an issue for a human to look. When the
# government site blocks CI egress (403/timeout) the run reports "unreachable"
# and opens no issue (the brief is uploaded as an artifact for inspection).

on:
  schedule:
    # Weekly, Monday 00:30 UTC (09:30 KST). Manual updates are infrequent.
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      allow_network:
        description: 'Fetch the allowlisted HiKorea boards (off = dry run)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run board monitor
        id: monitor
        run: |
          set +e
          ALLOW=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.allow_network }}" = "true" ]; then
            ALLOW="--allow-network"
          fi
          mkdir -p build/board-monitor
          python3 scripts/monitor_hikorea_manual_board.py $ALLOW \
            --out-json build/board-monitor/result.json \
            --out-md build/board-monitor/brief.md
          rc=$?
          echo "monitor exit code: $rc"
          CHANGED=$(python3 -c "import json;print('true' if json.load(open('build/board-monitor/result.json'))['changed'] else 'false')")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          # Never fail the job on a detected change (rc 3) — that is a normal
          # signal, handled by the issue step below. Only a real error (rc 2)
          # should fail.
          if [ "$rc" = "2" ]; then exit 1; fi
          exit 0

      - name: Upload monitor brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikorea-board-monitor
          path: build/board-monitor/

      - name: Open or update tracking issue on change
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const brief = fs.readFileSync('build/board-monitor/brief.md', 'utf8');
            const label = 'hikorea-manual-detected';
            const marker = '<!-- hikorea-manual-board-monitor -->';
            const title = 'HiKorea 매뉴얼 게시판 변경 감지 — 새 매뉴얼 확인 필요';
            const body = `${marker}\n\n${brief}\n\n_자동 생성: HiKorea Manual Board Monitor (run ${context.runId})._`;

            // Ensure the label exists (ignore if it already does).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'B60205',
                description: 'HiKorea manual board change detected by the monitor',
              });
            } catch (e) { /* label exists */ }

            // Find an existing open monitor issue (by our marker) and update it,
            // else open a new one — so repeated detections don't spam issues.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const existing = open.data.find(i => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
