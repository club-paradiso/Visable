name: Manual Code Coverage

on:
  pull_request:
    paths:
      - 'visa_data.json'
      - 'backend/data/visas.json'
      - 'backend/data/visa_authoring/**'
      - 'scripts/check_manual_code_coverage.py'
      - 'scripts/visa/**'
      - 'docs/source-manuals/**'
  push:
    branches:
      - main
    paths:
      - 'visa_data.json'
      - 'backend/data/visas.json'
      - 'backend/data/visa_authoring/**'
      - 'scripts/check_manual_code_coverage.py'
      - 'scripts/visa/**'
      - 'docs/source-manuals/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated data is current
        run: python3 scripts/visa/build_visa_data.py --check
      - name: Check official-manual code coverage
        run: python3 scripts/check_manual_code_coverage.py
