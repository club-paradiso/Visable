name: HiKorea Source Monitor Smoke

# Manual-trigger only. No push, pull_request, or schedule.
# This workflow is report-only:
# - it runs the existing HiKorea/KIS source-monitor smoke helper,
# - it defaults to no network,
# - it writes JSON/Markdown/log artifacts for operator review,
# - it never creates GitHub Issues,
# - it never commits generated output back to the repository.
on:
  workflow_dispatch:
    inputs:
      allow_network:
        description: "Explicitly allow the guarded allowlisted fetch path"
        required: true
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run HiKorea/KIS monitor smoke helper
        shell: bash
        env:
          ALLOW_NETWORK: ${{ inputs.allow_network }}
        run: |
          set -euo pipefail

          output_dir="tmp/source-monitor-smoke"
          run_label="workflow_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          log_path="${output_dir}/${run_label}_command.log"
          metadata_path="${output_dir}/${run_label}_workflow_metadata.json"
          mkdir -p "${output_dir}"

          {
            echo "HiKorea/KIS source monitor smoke workflow"
            echo "run_label=${run_label}"
            echo "allow_network=${ALLOW_NETWORK}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_ref=${GITHUB_REF}"
            echo ""
            echo "Safety guardrails:"
            echo "- workflow_dispatch only; no schedule"
            echo "- no automatic GitHub Issue creation"
            echo "- no generated-output commits"
            echo "- existing adapter guardrails remain in force when allow_network=true"
            echo "- login, transaction, e-Application, visit reservation, validity check, and personal-data flows are out of scope"
            echo ""

            cmd=(python3 scripts/run_hikorea_monitor_smoke.py --run-label "${run_label}" --output-dir "${output_dir}")
            if [[ "${ALLOW_NETWORK}" == "true" ]]; then
              cmd+=(--allow-network)
            fi

            printf "Running:"
            printf " %q" "${cmd[@]}"
            printf "\n\n"
            "${cmd[@]}"
          } 2>&1 | tee "${log_path}"

          python3 - <<PY
          import json
          from pathlib import Path

          path = Path("${metadata_path}")
          path.write_text(json.dumps({
              "run_label": "${run_label}",
              "allow_network": "${ALLOW_NETWORK}",
              "github_run_id": "${GITHUB_RUN_ID}",
              "github_run_attempt": "${GITHUB_RUN_ATTEMPT}",
              "source_monitor_json": f"${output_dir}/${run_label}_source_monitor.json",
              "markdown_brief": f"${output_dir}/${run_label}_source_update_brief.md",
              "command_log": "${log_path}",
              "github_issues_created": False,
              "scheduled_monitoring_enabled": False,
              "generated_outputs_committed": False
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate generated smoke artifacts
        shell: bash
        run: |
          set -euo pipefail

          run_label="workflow_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          output_dir="tmp/source-monitor-smoke"
          python3 -m json.tool "${output_dir}/${run_label}_source_monitor.json" >/dev/null
          python3 -m json.tool "${output_dir}/${run_label}_workflow_metadata.json" >/dev/null
          test -s "${output_dir}/${run_label}_source_update_brief.md"
          test -s "${output_dir}/${run_label}_command.log"

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          ALLOW_NETWORK: ${{ inputs.allow_network }}
        run: |
          set -euo pipefail

          output_dir="tmp/source-monitor-smoke"
          run_label="workflow_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          artifact_name="hikorea-source-monitor-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mode="no-network"
          if [[ "${ALLOW_NETWORK}" == "true" ]]; then
            mode="allow-network"
          fi

          source_json="${output_dir}/${run_label}_source_monitor.json"
          markdown_brief="${output_dir}/${run_label}_source_update_brief.md"
          command_log="${output_dir}/${run_label}_command.log"
          metadata_json="${output_dir}/${run_label}_workflow_metadata.json"

          generated_status() {
            if [[ -s "$1" ]]; then
              printf "yes"
            else
              printf "no"
            fi
          }

          {
            echo "## HiKorea/KIS source monitor smoke"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | \`${mode}\` |"
            echo "| Run label | \`${run_label}\` |"
            echo "| Artifact | \`${artifact_name}\` |"
            echo "| Source monitor JSON | $(generated_status "${source_json}") |"
            echo "| Markdown brief | $(generated_status "${markdown_brief}") |"
            echo "| Command log | $(generated_status "${command_log}") |"
            echo "| Workflow metadata | $(generated_status "${metadata_json}") |"
            echo ""
            echo "### Safety"
            echo ""
            echo "- No automatic GitHub Issue creation."
            echo "- No automatic user-facing legal update."
            echo "- Generated files are workflow artifacts only and must be reviewed manually before any downstream source or data action."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hikorea-source-monitor-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            tmp/source-monitor-smoke/*_source_monitor.json
            tmp/source-monitor-smoke/*_source_update_brief.md
            tmp/source-monitor-smoke/*_command.log
            tmp/source-monitor-smoke/*_workflow_metadata.json
