name: Repo Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements-dev.txt

      - name: Run repository validation
        run: bash scripts/check_repo.sh

  mobile-render-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Render iPhone viewport QA
        run: node scripts/mobile_render_qa.mjs

      - name: Upload mobile QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-render-qa
          path: artifacts/mobile-render-qa/
          if-no-files-found: error
          retention-days: 7

  mobile-webkit-qa:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install WebKit runtime
        run: npx playwright install --with-deps webkit

      - name: Render iPhone WebKit QA
        run: node scripts/mobile_webkit_qa.mjs

      - name: Upload WebKit QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-qa
          path: artifacts/mobile-webkit-qa/
          if-no-files-found: error
          retention-days: 7
