name: Enforcement Runtime Diagnostic

on:
  push:
    branches:
      - perf/enforcement-benchmark-20260904
    paths:
      - .github/workflows/enforcement-runtime-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Railway enforcement runtime with one synthetic case
        env:
          BASE_URL: https://web-production-14f9a.up.railway.app
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = os.environ['BASE_URL'].rstrip('/')

          def get(path):
              req = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'Visable-Diagnostic/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except Exception: body={}
                  return e.code, body

          def post(path, payload):
              req = urllib.request.Request(base + path, data=json.dumps(payload).encode(), headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Visable-Diagnostic/1.0'}, method='POST')
              started=time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, json.loads(r.read().decode()), round((time.perf_counter()-started)*1000,1)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except Exception: body={}
                  return e.code, body, round((time.perf_counter()-started)*1000,1)

          health_status, health = get('/health')
          safe_health = {
              'status': health_status,
              'provider': health.get('provider') or health.get('llm_provider'),
              'model': health.get('model') or health.get('llm_model'),
              'providers': health.get('providers') or health.get('providers_configured'),
              'openrouterConfigured': health.get('openrouter_configured'),
              'warnings': health.get('warnings'),
              'lawGroundingMode': health.get('law_grounding_mode'),
          }
          print('SAFE_HEALTH=' + json.dumps(safe_health, ensure_ascii=False))

          extract_status, extract, extract_ms = post('/api/enforcement/extract', {
              'text': 'D-2 유학생인데 시간제취업 허가 없이 음식점에서 18일 아르바이트했습니다. 이번이 처음입니다.',
              'assessmentDate': '2026-09-04'
          })
          print('EXTRACT=' + json.dumps({'status':extract_status,'ms':extract_ms,'code':(extract.get('case') or {}).get('violationCode'),'warnings':(extract.get('case') or {}).get('extractionWarnings')}, ensure_ascii=False))
          case = extract.get('case') or {}
          analyze_status, analyze, analyze_ms = post('/api/enforcement/analyze', {'caseData':case})
          prediction = analyze.get('prediction') or {}
          baseline = analyze.get('legalBaseline') or {}
          safe_analysis = {
              'status': analyze_status,
              'ms': analyze_ms,
              'baselineStatus': baseline.get('status'),
              'predictionStatus': prediction.get('status'),
              'modelId': prediction.get('modelId'),
              'limitations': prediction.get('limitations'),
              'confidence': prediction.get('confidence'),
          }
          print('ANALYZE=' + json.dumps(safe_analysis, ensure_ascii=False))
          PY
