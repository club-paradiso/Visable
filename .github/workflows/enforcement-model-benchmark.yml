name: Enforcement Model Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated exact OpenRouter model ids
        required: false
        default: google/gemma-4-31b-it:free,openai/gpt-oss-120b:free
      repetitions:
        description: Repetitions per synthetic case
        required: false
        default: "1"
  push:
    branches:
      - perf/enforcement-benchmark-20260904
    paths:
      - scripts/benchmark_enforcement_models.py
      - .github/workflows/enforcement-model-benchmark.yml

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate synthetic fixtures and prompts without network
        run: python3 scripts/benchmark_enforcement_models.py --dry-run
      - name: Inspect enforcement route wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/paradiso_backend.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          needle = '/api/enforcement/analyze'
          matches = [i for i, line in enumerate(lines) if needle in line]
          if not matches:
              raise SystemExit('enforcement analyze route not found')
          for i in matches:
              start=max(0, i-25); end=min(len(lines), i+90)
              print(f'--- {path}:{i+1} ---')
              for n in range(start, end):
                  print(f'{n+1:05d}: {lines[n]}')
          PY

  live-model-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: validate-harness
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BENCHMARK_MODELS: ${{ inputs.models }}
      BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Check benchmark credential availability
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Compare exact models
        run: |
          python3 scripts/benchmark_enforcement_models.py \
            --models "$BENCHMARK_MODELS" \
            --repetitions "$BENCHMARK_REPETITIONS" \
            --timeout 60 \
            --delay 3 \
            --output /tmp/enforcement-model-benchmark.json
          echo '### Enforcement exact-model benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/enforcement-model-benchmark.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
