name: Railway Live Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  railway-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe Railway backend, Open Law, and enforcement runtime
        env:
          BACKEND_URL: https://web-production-14f9a.up.railway.app
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 -u - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["BACKEND_URL"].rstrip("/")
          expected_commit = (os.environ.get("EXPECTED_COMMIT") or "").strip().lower()
          request_timeout = 6.0
          law_search_timeout = 18.0
          # Long enough to outlast a real Railway build, but only ever spent
          # when the backend reports a commit that is not yet ours. A backend
          # that reports no commit at all is not worth waiting on, because
          # nothing in its response will ever change to say the deploy landed.
          deploy_attempts = 30
          deploy_sleep_seconds = 10.0

          def request_json(path: str, *, method: str = "GET", payload=None, timeout: float = request_timeout):
              body = None
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Visable-Railway-Live-Smoke/7",
              }
              if payload is not None:
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(base + path, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      return int(getattr(response, "status", 200) or 200), json.loads(raw)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {}
                  return int(exc.code), parsed

          health = None
          law_result = None
          health_status = None
          law_status = None
          last_error = "not_started"
          deployed_commit = ""
          commit_reported = False
          commit_matches = False

          # Railway deploys asynchronously after main moves, and the PREVIOUS
          # deploy keeps answering /health with "ok" the whole time. Treating a
          # healthy process as a ready one therefore tested the code the merge
          # had just replaced — a backend fix could not fail this smoke and could
          # not pass it either. /health now reports the commit it was built from,
          # so wait for OUR commit before believing anything downstream.
          for attempt in range(1, deploy_attempts + 1):
              try:
                  health_status, candidate = request_json("/health")
                  health = candidate
                  build = candidate.get("build") or {}
                  deployed_commit = str(build.get("commit") or "").strip().lower()
                  commit_reported = bool(build.get("commit_reported"))
                  commit_matches = bool(
                      commit_reported and expected_commit and deployed_commit == expected_commit
                  )
                  if health_status != 200 or candidate.get("status") != "ok":
                      last_error = f"health_http_{health_status}"
                      print(f"deploy probe {attempt}/{deploy_attempts}: {last_error}", flush=True)
                  elif commit_reported and expected_commit and not commit_matches:
                      # A previous deploy is still serving. This is the one case
                      # worth waiting out, and the only one the wait can resolve.
                      last_error = f"stale_deploy:{deployed_commit[:12] or 'unknown'}"
                      print(
                          f"deploy probe {attempt}/{deploy_attempts}: health=ok but serving "
                          f"{deployed_commit[:12] or 'unknown'}, waiting for {expected_commit[:12]}",
                          flush=True,
                      )
                      if attempt < deploy_attempts:
                          time.sleep(deploy_sleep_seconds)
                      continue
                  else:
                      query = urllib.parse.quote("출입국관리법")
                      law_status, law_candidate = request_json(
                          f"/api/legal/laws/search?q={query}",
                          timeout=law_search_timeout,
                      )
                      law_result = law_candidate
                      count = int(law_candidate.get("count") or 0)
                      law_ok = law_status == 200 and law_candidate.get("ok") is True
                      print(
                          f"deploy probe {attempt}/{deploy_attempts}: health=ok "
                          f"law_http={law_status} law_ok={law_ok} law_count={count} "
                          f"law_reason={law_candidate.get('reason') or law_candidate.get('error') or ''}",
                          flush=True,
                      )
                      if law_ok and count > 0:
                          last_error = ""
                          break
                      last_error = (
                          "law_empty_result"
                          if law_ok
                          else f"law_http_{law_status}:{law_candidate.get('reason') or law_candidate.get('error') or 'not_ok'}"
                      )
              except Exception as exc:
                  last_error = f"{type(exc).__name__}:{str(exc)[:120]}"
                  print(f"deploy probe {attempt}/{deploy_attempts}: {last_error}", flush=True)
              if attempt < deploy_attempts:
                  time.sleep(deploy_sleep_seconds)
          else:
              print("Railway deploy/readiness probe exhausted: " + last_error, file=sys.stderr, flush=True)

          law = (health or {}).get("law_api") or {}
          providers = (health or {}).get("providers") or {}
          provider_status = (health or {}).get("provider_status") or {}
          law_count = int((law_result or {}).get("count") or 0)
          law_ok = bool(law_result and law_result.get("ok") is True)
          summary = {
              "backend_status": (health or {}).get("status"),
              "service": (health or {}).get("service"),
              "health_http_status": health_status,
              "openrouter_configured": bool(providers.get("openrouter")),
              "law_api_configured": bool(law.get("law_api_configured")),
              "law_api_credential_source": law.get("law_api_credential_source") or None,
              "law_api_oc_configured": bool(law.get("law_api_oc_configured")),
              "law_api_key_fallback_configured": bool(law.get("law_api_key_fallback_configured")),
              "law_grounding_mode": (health or {}).get("law_grounding_mode"),
              "law_grounding_effective_mode": (health or {}).get("law_grounding_effective_mode"),
              "law_grounding_active": bool((health or {}).get("law_grounding_active")),
              "legal_evidence_configured": bool((provider_status.get("legal_evidence") or {}).get("configured")),
              "law_search_http_status": law_status,
              "law_search_ok": law_ok,
              "law_search_count": law_count,
              "law_search_nonempty": bool(law_ok and law_count > 0),
              "expected_commit": expected_commit or None,
              "deployed_commit": deployed_commit or None,
              "deployed_commit_reported": commit_reported,
              "deployed_commit_verified": commit_matches,
              "failure_label": None if law_ok and law_count > 0 else last_error,
          }
          print("readiness: " + json.dumps(summary, ensure_ascii=False, sort_keys=True), flush=True)

          # Everything below asserts against whatever process answered. Say so
          # when that process is not provably this commit, otherwise a red build
          # gets blamed on the merge that triggered it and a green one is read
          # as proof the merge works. Neither conclusion is available here.
          unverified_note = ""
          if not commit_matches:
              if not commit_reported:
                  reason = "the backend does not report a build commit"
              elif not expected_commit:
                  reason = "this run has no expected commit to compare against"
              else:
                  reason = (
                      f"it is serving {deployed_commit[:12] or 'unknown'}, not {expected_commit[:12]}"
                  )
              unverified_note = (
                  " NOTE: the tested process is not verified as this commit — " + reason
                  + ". The result below may describe a previous deploy."
              )
              print("deploy verification: UNVERIFIED —" + unverified_note, flush=True)
          else:
              print(
                  f"deploy verification: serving {deployed_commit[:12]}, matches this commit",
                  flush=True,
              )

          if summary["health_http_status"] != 200 or summary["backend_status"] != "ok":
              print("Railway backend health check failed." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if not summary["openrouter_configured"]:
              print("Railway OpenRouter is not configured." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if not summary["law_api_configured"] or not summary["law_grounding_active"]:
              print("Railway Open Law credential is not active." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if not summary["law_search_nonempty"]:
              print("Railway Open Law live search returned no usable law rows." + unverified_note, file=sys.stderr)
              sys.exit(1)

          # Exercise the actual Waymaker /api/ask route with the exact class of
          # question reported by users. This is deliberately BUFFERED because
          # ai.html uses the buffered path by default; a green enforcement model
          # does not prove Waymaker can answer.
          waymaker_question = "D-2 체류기간 연장 시 필수 서류는 무엇인가요?"
          started = time.perf_counter()
          waymaker_status, waymaker = request_json(
              "/api/ask",
              method="POST",
              payload={
                  "question": waymaker_question,
                  "visa_code": "D-2",
                  "answer_mode": "basic",
                  # Engineering smoke: explicit diagnostics opt-in, because the
                  # public /api/ask projection omits provider/model fields.
                  "diagnostics": True,
                  "stream": False,
              },
              timeout=65.0,
          )
          waymaker_elapsed_ms = int(round((time.perf_counter() - started) * 1000))
          # Error envelopes (503 etc.) carry the diagnostics under "detail";
          # read them there so a failure is never logged as all-null fields.
          if waymaker_status != 200 and isinstance(waymaker, dict) and isinstance(waymaker.get("detail"), dict):
              waymaker = {**waymaker["detail"], "error_envelope": True}
          waymaker_answer = str(waymaker.get("answer") or "") if isinstance(waymaker, dict) else ""
          waymaker_live = (
              waymaker_status == 200
              and bool(waymaker_answer.strip())
              and not bool(waymaker.get("deterministic_fallback_answer_used"))
              and bool(waymaker.get("final_model") or waymaker.get("selected_model") or waymaker.get("model"))
              and (waymaker.get("provider") or waymaker.get("llm_provider")) not in {"deterministic_fallback", ""}
          )
          waymaker_summary = {
              "http_status": waymaker_status,
              "elapsed_ms": waymaker_elapsed_ms,
              "live_model_answer": waymaker_live,
              "provider": waymaker.get("provider") or waymaker.get("llm_provider") or None,
              "final_model": waymaker.get("final_model") or waymaker.get("selected_model") or waymaker.get("model") or None,
              "attempted_models": waymaker.get("attempted_models") or [],
              "upstream_statuses": waymaker.get("upstream_statuses") or [],
              "skipped_models_due_to_cooldown": waymaker.get("skipped_models_due_to_cooldown") or [],
              "cooling_down_models": waymaker.get("cooling_down_models") or [],
              "provider_error_type": waymaker.get("provider_error_type") or waymaker.get("error") or None,
              "chain_budget_exhausted": bool(waymaker.get("chain_budget_exhausted")),
              "deterministic_fallback": bool(waymaker.get("deterministic_fallback_answer_used")),
              "visa_code_detected": waymaker.get("visa_code_detected") or None,
              "task_type_detected": waymaker.get("task_type_detected") or None,
              "manual_grounding_status": waymaker.get("manual_grounding_status") or None,
              "answer_chars": len(waymaker_answer),
          }
          print("waymaker_d2: " + json.dumps(waymaker_summary, ensure_ascii=False, sort_keys=True), flush=True)

          if waymaker_status != 200:
              print("Production Waymaker /api/ask did not return HTTP 200 for the D-2 extension fixture." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if not waymaker_live:
              print(
                  "Production Waymaker did not produce a live model answer for the D-2 extension fixture."
                  + unverified_note,
                  file=sys.stderr,
              )
              sys.exit(1)
          if waymaker.get("visa_code_detected") != "D-2":
              print("Production Waymaker failed to detect D-2 in the extension fixture." + unverified_note, file=sys.stderr)
              sys.exit(1)

          # Public-contract check: the ORDINARY response a browser receives
          # (no diagnostics opt-in, Fast selected) must carry the structured
          # D-2 checklist and must not reveal providers, model ids, internal
          # source-revision metadata, or raw Markdown headings. These are
          # deterministic properties, so they hold even on a fallback answer.
          public_status, public = request_json(
              "/api/ask",
              method="POST",
              payload={
                  "question": "D-2 연장시 필수 서류",
                  "visa_code": "D-2",
                  "answer_mode": "fast",
                  "stream": False,
              },
              timeout=65.0,
          )
          public_text = json.dumps(public, ensure_ascii=False) if isinstance(public, dict) else ""
          public_lower = public_text.lower()
          leaked = [
              term for term in (
                  "openrouter", "groq", "ollama", "nemotron", "gemma", "nvidia",
                  "inkling", "source file", "source_file", "source_revision_date",
              )
              if term in public_lower
          ]
          internal_fields = [
              key for key in ("provider", "model", "final_model", "selected_model", "primary_model", "attempted_models", "llm_provider")
              if isinstance(public, dict) and key in public
          ]
          public_answer = str(public.get("answer") or "") if isinstance(public, dict) else ""
          structured = public.get("structured_answer") if isinstance(public, dict) else None
          structured_docs = (structured or {}).get("required_documents") or {}
          public_summary = {
              "http_status": public_status,
              "answer_mode_requested": public.get("answer_mode_requested") if isinstance(public, dict) else None,
              "answer_mode": public.get("answer_mode") if isinstance(public, dict) else None,
              "answer_mode_auto_escalated": public.get("answer_mode_auto_escalated") if isinstance(public, dict) else None,
              "structured_answer": bool(structured),
              "common_documents": len(structured_docs.get("common") or []),
              "conditional_documents": len(structured_docs.get("conditional") or []),
              "leaked_terms": leaked,
              "internal_fields": internal_fields,
              "markdown_heading": bool(re.search(r"(?m)^\s*#{1,6}\s", public_answer)),
          }
          print("waymaker_public_d2: " + json.dumps(public_summary, ensure_ascii=False, sort_keys=True), flush=True)
          # Leak checks apply to every public body, error envelopes included.
          if leaked or internal_fields or public_summary["markdown_heading"]:
              print("Production Waymaker public /api/ask response leaks internal routing/source metadata or raw Markdown." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if public_status != 200:
              # The public projection deliberately hides the provider error, so
              # repeat the same Fast request with the explicit diagnostics
              # opt-in and log the routing detail engineers need.
              diag_status, diag = request_json(
                  "/api/ask",
                  method="POST",
                  payload={
                      "question": "D-2 연장시 필수 서류",
                      "visa_code": "D-2",
                      "answer_mode": "fast",
                      "stream": False,
                      "diagnostics": True,
                  },
                  timeout=65.0,
              )
              diag_body = diag.get("detail") if isinstance(diag, dict) and isinstance(diag.get("detail"), dict) else (diag if isinstance(diag, dict) else {})
              diag_summary = {
                  "http_status": diag_status,
                  "error": diag_body.get("error") or None,
                  "provider_error_type": diag_body.get("provider_error_type") or None,
                  "answer_mode": diag_body.get("answer_mode") or None,
                  "answer_mode_requested": diag_body.get("answer_mode_requested") or None,
                  "model_candidates": diag_body.get("model_candidates") or [],
                  "attempted_models": diag_body.get("attempted_models") or [],
                  "upstream_statuses": diag_body.get("upstream_statuses") or [],
                  "retryable_provider_error": diag_body.get("retryable_provider_error"),
                  "final_model": diag_body.get("final_model") or None,
              }
              print("waymaker_public_d2_diagnostics: " + json.dumps(diag_summary, ensure_ascii=False, sort_keys=True), flush=True)
              print(
                  f"Production Waymaker Fast /api/ask returned HTTP {public_status} for the public D-2 request"
                  " (see waymaker_public_d2_diagnostics)." + unverified_note,
                  file=sys.stderr,
              )
              sys.exit(1)
          if not structured or not public_summary["common_documents"] or public_summary["answer_mode_requested"] != "fast":
              print("Production Waymaker did not return the structured D-2 checklist for a Fast public request." + unverified_note, file=sys.stderr)
              sys.exit(1)

          # Exercise the actual user-facing enforcement path with synthetic,
          # non-personal structured facts. This is stronger evidence than a
          # provider-only probe because it covers provider routing, JSON mode,
          # normalization, validators, deterministic law rules, and response
          # integration in one request.
          synthetic_case = {
              "caseData": {
                  "schemaVersion": "1",
                  "statusOfStay": "D-2",
                  "violationCode": "STATUS_OUTSIDE_ACTIVITY_ART20",
                  "violationCandidates": ["STATUS_OUTSIDE_ACTIVITY_ART20"],
                  "authorizationObtained": False,
                  "durationDays": 18,
                  "assessmentDate": "2026-09-08",
                  "priorViolations": 0,
                  "unknownFacts": [],
                  "extractionWarnings": [],
              }
          }
          started = time.perf_counter()
          enforcement_status, enforcement = request_json(
              "/api/enforcement/analyze",
              method="POST",
              payload=synthetic_case,
              timeout=20.0,
          )
          elapsed_ms = int(round((time.perf_counter() - started) * 1000))
          baseline = enforcement.get("legalBaseline") or {}
          prediction = enforcement.get("prediction") or {}
          prediction_live = (
              prediction.get("status") != "UNAVAILABLE"
              and bool(prediction.get("modelId"))
              and bool(prediction.get("monetaryPrediction"))
          )
          enforcement_summary = {
              "http_status": enforcement_status,
              "elapsed_ms": elapsed_ms,
              "baseline_status": baseline.get("status"),
              "baseline_amount_krw": baseline.get("baselineAmountKrw"),
              "prediction_status": prediction.get("status"),
              "prediction_model": prediction.get("modelId") or None,
              "monetary_prediction_present": bool(prediction.get("monetaryPrediction")),
              "structured_prediction_live": prediction_live,
          }
          print("enforcement: " + json.dumps(enforcement_summary, ensure_ascii=False, sort_keys=True), flush=True)

          if enforcement_status != 200:
              print("Production enforcement endpoint did not return HTTP 200." + unverified_note, file=sys.stderr)
              sys.exit(1)
          if baseline.get("status") != "AVAILABLE" or baseline.get("baselineAmountKrw") != 2_000_000:
              print("Production enforcement deterministic baseline is incorrect for the synthetic D-2 fixture." + unverified_note, file=sys.stderr)
              sys.exit(1)

          if prediction_live:
              # Do not issue a second model generation after the complete
              # end-to-end path already succeeded. The standalone probe can
              # legitimately consume the enforcement budget on a slower sample,
              # creating a false red build and unnecessary provider spend.
              print(
                  "provider probe: skipped; real structured enforcement prediction already verified",
                  flush=True,
              )
          else:
              # Diagnostic fallback only. If the real path degraded, probe the
              # provider contract separately to distinguish routing/capacity
              # failures from downstream prediction validation failures.
              probe = {}
              probe_status = None
              for probe_attempt in range(1, 3):
                  try:
                      probe_status, probe = request_json("/api/enforcement/provider-probe", timeout=20.0)
                  except Exception as exc:
                      probe = {"ok": False, "providerErrorType": type(exc).__name__}
                      probe_status = None
                  probe_summary = {
                      "attempt": probe_attempt,
                      "http_status": probe_status,
                      "configured": bool(probe.get("configured")),
                      "ok": bool(probe.get("ok")),
                      "json_object_returned": bool(probe.get("jsonObjectReturned")),
                      "prediction_contract_ok": bool(probe.get("predictionContractOk")),
                      "final_model": probe.get("finalModel") or None,
                      "provider_error_type": probe.get("providerErrorType") or None,
                  }
                  print("provider probe: " + json.dumps(probe_summary, ensure_ascii=False, sort_keys=True), flush=True)
                  if (
                      probe_status == 200
                      and probe.get("configured") is True
                      and probe.get("ok") is True
                      and probe.get("jsonObjectReturned") is True
                      and probe.get("predictionContractOk") is True
                      and probe.get("finalModel")
                  ):
                      break
                  if probe_attempt == 1:
                      time.sleep(3)
              else:
                  print(
                      "Production enforcement provider did not produce a valid structured prediction contract."
                      + unverified_note,
                      file=sys.stderr,
                  )
                  sys.exit(1)

              print(
                  "Production enforcement analysis still degraded to an unavailable AI prediction."
                  + unverified_note,
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              "Railway live smoke passed: backend, law grounding, Waymaker D-2 live completion, deterministic baseline, and structured AI prediction are live."
              + unverified_note,
              flush=True,
          )
          PY
