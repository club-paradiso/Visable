name: Golden Suite

# Behaviour contract for the frontend rebuild (tests/golden/README.md).
# Separate from repo-validation.yml on purpose: the existing workflows stay untouched.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against this deployment URL instead of a local static server (e.g. https://visable-mu.vercel.app)'
        required: false
        default: ''
  deployment_status:

permissions:
  contents: read

concurrency:
  group: golden-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.deployment_status.deployment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  golden-local:
    # Local static server over the checkout (later phases: GOLDEN_SERVE_DIR=dist).
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.base_url == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Typecheck the extracted modules (src/, Phase 3)
        run: npm run typecheck
      - name: Build (Vite multi-page, Phase 2)
        run: npm run build
      - name: URL status parity (source vs dist)
        run: node scripts/check_url_parity.mjs
      - name: Run the golden suite against the build output (desktop + phone)
        env:
          CI: '1'
          GOLDEN_SERVE_DIR: dist
        run: ./node_modules/.bin/playwright test -c playwright.golden.config.mjs --project=desktop-1280 --project=mobile-390
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  golden-visual:
    # Visual baselines are generated on this runner the first time (ADR-005) into
    # tests/golden/__screenshots__/ci and committed back to the PR branch (same-repo
    # PRs only; a fork cannot receive the push). From then on they are compared with
    # the configured anti-aliasing tolerance. Local runs use a separate `local` set.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.base_url == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build (Vite multi-page, Phase 2)
        run: npm run build
      - name: Compare (or create) visual baselines
        id: visual
        env:
          CI: '1'
          GOLDEN_SERVE_DIR: dist
        run: |
          # Committed baselines are compared; a state without one (a new test, or the very first run)
          # is generated on this runner and committed back by the next step. Mismatches still fail.
          if [ ! -d tests/golden/__screenshots__/ci ]; then
            echo "::notice::No committed CI baselines yet — generating tests/golden/__screenshots__/ci on this runner."
          fi
          ./node_modules/.bin/playwright test -c playwright.golden.config.mjs --project=visual-desktop --project=visual-mobile --update-snapshots missing
          if [ -n "$(git status --porcelain -- tests/golden/__screenshots__/ci)" ]; then
            echo "::notice::New visual baselines were generated: $(git status --porcelain -- tests/golden/__screenshots__/ci | wc -l) file(s)."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the generated CI baselines to the PR branch
        # Only when this run generated baselines (first run, or a new visual state), only for branches of this
        # repository (a fork's PR cannot be pushed to). The next run compares against them, so there is no loop.
        if: steps.visual.outputs.created == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/__screenshots__/ci
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "golden: CI visual baselines (generated on the GitHub runner's Chromium)" \
            -m "Generated by the golden-visual job of run ${{ github.run_id }}; compared, not regenerated, from the next run on."
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload baselines / diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/golden/__screenshots__/ci/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

  golden-deployment:
    # Against a Vercel preview (deployment_status success) or any URL on demand.
    # Previews are SSO-protected, so the automatic path is gated on the repository
    # variable GOLDEN_PREVIEW_ENABLED=true, which the owner sets together with the
    # VERCEL_AUTOMATION_BYPASS_SECRET repository secret (docs/rebuild/STATUS.md,
    # owner decision 1). Until then the job is skipped, not red. A manual dispatch
    # with base_url always runs and fails loudly when the target is unreachable.
    if: >-
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.target_url != '' && vars.GOLDEN_PREVIEW_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.base_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Resolve target
        id: target
        env:
          BASE_URL: ${{ github.event.inputs.base_url || github.event.deployment_status.target_url }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "has_bypass=$HAS_BYPASS" >> "$GITHUB_OUTPUT"
          echo "Target: $BASE_URL (bypass secret present: $HAS_BYPASS)"
      - name: Probe the target
        id: probe
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: ${BYPASS}" "$BASE_URL/index.html" || true)
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "GET $BASE_URL/index.html → $code"
      - name: Stop when the deployment is not reachable
        if: steps.probe.outputs.http != '200'
        run: |
          echo "::error::Deployment returned HTTP ${{ steps.probe.outputs.http }}. Vercel SSO protection needs the VERCEL_AUTOMATION_BYPASS_SECRET repository secret (Vercel → Project → Settings → Deployment Protection → Protection Bypass for Automation)."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run the golden suite against the deployment
        env:
          CI: '1'
          GOLDEN_BASE_URL: ${{ steps.target.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: ./node_modules/.bin/playwright test -c playwright.golden.config.mjs --project=desktop-1280 --project=mobile-390
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
