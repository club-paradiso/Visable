name: short-stay-freshness

# Date-based freshness watch for the short-stay entry checker data.
# Official sites cannot be crawled from CI (HTTP 403), so this monitors source
# dates + the K-ETA exemption window and opens/updates a tracking issue when a
# refresh is due. See audits/short-stay-country-checker/UPDATE_WORKFLOW.md.

on:
  schedule:
    - cron: '0 0 1 * *'   # 매월 1일 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: short-stay-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run freshness check
        id: check
        continue-on-error: true
        run: node scripts/check_short_stay_freshness.mjs --report freshness_report.md

      - name: Open or update tracking issue (stale)
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('freshness_report.md', 'utf8');
            const label = 'short-stay-freshness';
            const title = 'Short-stay 데이터 신선도 — 재확인 필요';
            const body = [
              '이 이슈는 `short-stay-freshness` 예약 워크플로가 자동으로 관리합니다.',
              '해결 방법: `audits/short-stay-country-checker/UPDATE_WORKFLOW.md`',
              '',
              report,
              '',
              `_마지막 업데이트: ${new Date().toISOString()} · run ${context.runId}_`
            ].join('\n');
            const { owner, repo } = context.repo;
            // ensure the label exists (ignore "already exists")
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'E68A3A',
                description: 'Short-stay checker data needs an official refresh' });
            } catch (e) { /* 422 already exists */ }
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 1 });
            if (existing.data.length) {
              const n = existing.data[0].number;
              await github.rest.issues.update({ owner, repo, issue_number: n, body });
              console.log(`Updated issue #${n}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              console.log(`Created issue #${created.data.number}`);
            }

      - name: Close tracking issue (fresh)
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'short-stay-freshness';
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10 });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `신선도 검사 통과(✅ OK) — ${new Date().toISOString()}. 자동으로 닫습니다.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              console.log(`Closed issue #${issue.number}`);
            }
