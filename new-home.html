<!DOCTYPE html>
<html lang="ko" data-theme="civic_editorial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<meta name="description" content="Paradiso: New Home — 귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램(KIIP), 면접, 귀화 후 절차까지 단계별 안내. Step-by-step guidance for Korean nationality and naturalization.">
<title>Paradiso: New Home — 국적·귀화 안내</title>
<link rel="icon" type="image/png" href="assets/brand/paradiso-favicon-o.png?v=2">

<!-- Editorial theme bootstrap (shared with the Paradiso main page). Runs before
     paint so the page never flashes the wrong palette. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('paradiso:editorial-theme');
    if (t === 'civic_editorial' || t === 'archive_diary') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>

<!-- Pretendard — already used across Paradiso; no new external font is introduced. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ── Design tokens (mirrors the Paradiso main page so the look is shared) ── */
:root {
  --ff: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --bg0: #f5f2ea; --bg1: #fcfaf5; --bg2: #f1ece2; --bg3: #e7dece;
  --bd: #d1c6b4; --bd2: #ddd3c3;
  --t1: #202221; --t2: #4f5552; --t3: #757a76;
  --ac: #2f5e67; --ac2: #2a4f57; --acG: rgba(47,94,103,0.10); --acL: #e1eaec;
  --cy: #FF6B5B; --cyL: #FFE2DB; --cyT: #8A3426;
  --ok: #0EA37B; --warn: #E68A3A;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px;
  --sh1: 0 1px 2px rgba(24,28,26,0.05);
  --sh2: 0 10px 28px -10px rgba(24,28,26,0.18);
  --shCard: 0 2px 12px rgba(31,107,94,0.08);
  --maxw: 1040px;
}
/* Brightness: dark mode lives on <body data-theme="dark"> */
[data-theme="dark"] {
  --bg0: #0B2A24; --bg1: #113B32; --bg2: #184B40; --bg3: #205A4E;
  --bd: #2D5A50; --bd2: #224A41;
  --t1: #F3EEDF; --t2: #C7BFA8; --t3: #8C8572;
  --ac: #34D4A8; --ac2: #17B388; --acG: rgba(52,212,168,0.14); --acL: #163E36;
  --cy: #FF8B7A; --cyL: #3A1E1A; --cyT: #FFB5A5;
  --sh1: 0 1px 4px rgba(0,0,0,0.35);
  --sh2: 0 12px 32px -10px rgba(0,0,0,0.55);
  --shCard: 0 6px 20px rgba(0,0,0,0.4);
}
/* Editorial-pop (kitsch) theme — shared archive_diary palette */
:root[data-theme="archive_diary"] {
  --k-cream: #FFF7E8; --k-ink: #141414; --k-pink: #FF8ED1; --k-pink-deep: #F451B0;
  --k-blue: #2F5EFC; --k-butter: #FFE45E; --k-lime: #C2FF44;
  --bg0: #EEF3FF; --bg1: #FFFFFF; --bg2: #F4F7FF; --bg3: #E6EDFF;
  --bd: #C2D2EE; --bd2: #DCE5F8;
  --t1: #141414; --t2: #353A45; --t3: #6B7280;
  --ac: #2F5EFC; --ac2: #1B36C9; --acG: rgba(47,94,252,0.12); --acL: #E3EAFF;
  --cy: #F451B0; --cyL: #FFE3F4; --cyT: #8A0F58;
  --ok: #1F8A5B; --warn: #EF8A2C;
  --shCard: 4px 4px 0 var(--k-ink);
  --sh2: 5px 6px 0 rgba(20,20,40,0.14);
}
:root[data-theme="archive_diary"] [data-theme="dark"] {
  --bg0: #14182B; --bg1: #1B2138; --bg2: #232B47; --bg3: #2C3656;
  --bd: #38456A; --bd2: #2B3658;
  --t1: #EEF2FF; --t2: #BAC5E4; --t3: #8C97BE;
  --ac: #6EC6FF; --ac2: #2F5EFC; --acG: rgba(110,198,255,0.14); --acL: #1E2746;
  --cy: #FF8ED1; --cyL: #2E1B2A; --cyT: #FFC4E8;
  --shCard: 4px 4px 0 #0A0D17;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--ff);
  background: var(--bg0);
  color: var(--t1);
  line-height: 1.6;
  font-size: clamp(15px, 1.2vw, 16px);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ac); }
h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 4px; }

/* ── Top bar ── */
.nh-topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  padding: 0.7rem clamp(1rem, 4vw, 2rem);
  background: color-mix(in srgb, var(--bg1) 86%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd2);
}
.nh-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  min-height: 40px; padding: 0 0.85rem;
  font-weight: 700; font-size: 0.9rem; text-decoration: none;
  color: var(--t1); border: 1px solid var(--bd); border-radius: 999px; background: var(--bg2);
  transition: border-color 0.18s, background 0.18s, transform 0.18s;
}
.nh-back:hover { border-color: var(--ac); transform: translateX(-2px); }
.nh-back-label-short { display: none; }
.nh-controls { display: flex; gap: 0.4rem; }
.nh-ctl {
  min-height: 40px; min-width: 40px; padding: 0 0.75rem;
  font-family: var(--ff); font-weight: 700; font-size: 0.85rem;
  color: var(--t2); background: var(--bg2); border: 1px solid var(--bd); border-radius: 999px; cursor: pointer;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}
.nh-ctl:hover { border-color: var(--ac); color: var(--t1); }

.nh-section-nav {
  position: sticky; top: 64px; z-index: 45;
  display: flex; justify-content: center; gap: 0.35rem;
  padding: 0.45rem clamp(1rem, 4vw, 2rem);
  overflow-x: auto; scrollbar-width: none;
  background: color-mix(in srgb, var(--bg0) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd2);
}
.nh-section-nav::-webkit-scrollbar { display: none; }
.nh-section-nav a {
  flex: 0 0 auto; padding: 0.42rem 0.72rem; border-radius: 999px;
  color: var(--t2); text-decoration: none; font-size: 0.78rem; font-weight: 800;
  border: 1px solid transparent;
}
.nh-section-nav a:hover, .nh-section-nav a:focus-visible { color: var(--t1); border-color: var(--bd); background: var(--bg1); }

main { display: block; }
.nh-wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }

/* ── Hero ── */
.nh-hero {
  position: relative; overflow: hidden;
  padding: clamp(2.4rem, 6vw, 4.2rem) clamp(1rem, 4vw, 2rem) clamp(1.8rem, 4vw, 2.6rem);
  background:
    radial-gradient(120% 90% at 90% -10%, var(--cyL) 0%, transparent 55%),
    radial-gradient(110% 80% at -10% 0%, var(--acL) 0%, transparent 50%),
    var(--bg1);
  border-bottom: 1px solid var(--bd2);
}
.nh-hero-inner { max-width: var(--maxw); margin: 0 auto; position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, 0.7fr); gap: clamp(1.4rem, 4vw, 3rem); align-items: center; }
.nh-hero-copy { min-width: 0; }
.nh-kicker {
  display: inline-block; margin: 0 0 0.8rem;
  font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ac2); padding: 0.3rem 0.7rem; border: 1px solid var(--bd); border-radius: 999px; background: var(--bg2);
}
.nh-title { margin: 0; font-size: clamp(2rem, 6vw, 3.3rem); font-weight: 800; }
.nh-tagline { margin: 0.35rem 0 0; font-size: clamp(1.1rem, 2.6vw, 1.5rem); font-weight: 700; font-style: italic; color: var(--cyT); }
.nh-lead { margin: 1rem 0 0; max-width: 60ch; font-size: clamp(0.98rem, 1.6vw, 1.1rem); color: var(--t2); }
.nh-cta-row { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; }
.nh-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 50px; padding: 0 1.4rem;
  font-family: var(--ff); font-weight: 800; font-size: 0.98rem; cursor: pointer;
  border-radius: var(--r-md); border: 1px solid transparent; text-decoration: none;
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s, border-color 0.18s;
}
.nh-btn-primary { background: var(--ac); color: #fff; box-shadow: var(--sh2); }
.nh-btn-primary:hover { transform: translateY(-2px); }
.nh-btn-secondary { background: var(--bg1); color: var(--t1); border-color: var(--bd); }
.nh-btn-secondary:hover { border-color: var(--ac); transform: translateY(-2px); }
.nh-proof-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.85rem; }
.nh-proof-row span { padding: 0.28rem 0.62rem; border-radius: 999px; border: 1px solid var(--bd); background: color-mix(in srgb, var(--bg1) 86%, transparent); color: var(--t2); font-size: 0.76rem; font-weight: 750; }
.nh-hero-guide { padding: 1.1rem; border: 1px solid var(--bd); border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg1) 88%, transparent); box-shadow: var(--shCard); }
.nh-hero-guide h2 { margin: 0 0 0.25rem; font-size: 1rem; }
.nh-hero-guide p { margin: 0 0 0.75rem; color: var(--t2); font-size: 0.82rem; }
.nh-guide-link { width: 100%; display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: 0.55rem; padding: 0.68rem 0.72rem; margin-top: 0.45rem; border: 1px solid var(--bd); border-radius: var(--r-md); background: var(--bg1); color: var(--t1); font-family: var(--ff); text-align: left; text-decoration: none; cursor: pointer; }
.nh-guide-link:hover { border-color: var(--ac); }
.nh-guide-num, .nh-card-icon, .nh-path-icon { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.nh-guide-num { font-size: 0.72rem; font-weight: 900; color: var(--ac); }
.nh-guide-link strong { font-size: 0.86rem; }
.nh-guide-arrow { color: var(--ac); font-weight: 900; }
.nh-notice {
  display: flex; gap: 0.6rem; align-items: flex-start;
  margin-top: 1.6rem; max-width: 72ch; padding: 0.85rem 1rem;
  background: var(--acG); border: 1px solid color-mix(in srgb, var(--ac) 28%, transparent);
  border-radius: var(--r-md); color: var(--t2); font-size: 0.88rem;
}
.nh-notice-icon { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border: 1px solid var(--bd); border-radius: 999px; color: var(--ac); font-size: 0.72rem; font-weight: 900; font-family: ui-serif, Georgia, serif; }

/* ── Sections ── */
section.nh-block, .nh-dashboard, .nh-pathway, .nh-caution, .nh-sources { padding: clamp(2rem, 5vw, 3rem) 0; }
.nh-section-h { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.nh-section-h h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); }
.nh-section-intro { margin: 0.6rem 0 1.4rem; max-width: 70ch; color: var(--t2); }

/* ── Dashboard grid ── */
.nh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: clamp(0.8rem, 1.6vw, 1.1rem); }
.nh-card {
  display: flex; flex-direction: column; gap: 0.5rem; text-align: left;
  padding: 1.2rem 1.25rem; min-height: 168px;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-lg);
  box-shadow: var(--shCard); cursor: pointer; font-family: var(--ff); color: var(--t1);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
}
.nh-card:hover, .nh-card:focus-visible { transform: translateY(-3px); border-color: var(--ac); }
.nh-card-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 12px; font-size: 0.78rem; font-weight: 900;
  background: var(--acG); border: 1px solid color-mix(in srgb, var(--ac) 24%, transparent);
}
.nh-card-label { font-size: 1.08rem; font-weight: 800; }
.nh-card-desc { font-size: 0.88rem; color: var(--t2); flex: 1; }
.nh-card-cta { font-size: 0.85rem; font-weight: 800; color: var(--ac); display: inline-flex; align-items: center; gap: 0.3rem; }
.nh-card-cta::after { content: "→"; transition: transform 0.18s; }
.nh-card:hover .nh-card-cta::after { transform: translateX(3px); }
.nh-card[data-variant="waymaker"] .nh-card-icon { background: var(--cyL); border-color: color-mix(in srgb, var(--cy) 40%, transparent); color: var(--cyT); }

/* ── Pathway preview ── */
.nh-pathway { background: var(--bg2); border-top: 1px solid var(--bd2); border-bottom: 1px solid var(--bd2); }
.nh-pathway-steps { list-style: none; counter-reset: step; margin: 1.2rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: stretch; }
.nh-pathway-steps li {
  counter-increment: step; position: relative; flex: 1 1 170px;
  padding: 0.9rem 1rem 0.9rem 2.6rem;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md);
  font-size: 0.88rem; font-weight: 600; color: var(--t1);
}
.nh-pathway-steps li::before {
  content: counter(step); position: absolute; left: 0.8rem; top: 0.85rem;
  width: 1.4rem; height: 1.4rem; border-radius: 999px; background: var(--ac); color: #fff;
  font-size: 0.78rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
}

/* ── Generic content blocks ── */
.nh-block { border-bottom: 1px solid var(--bd2); }
.nh-sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.8rem; margin-top: 1.2rem; }
.nh-sub-item { padding: 1rem 1.1rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); }
.nh-sub-item h3 { margin: 0 0 0.35rem; font-size: 0.98rem; }
.nh-sub-item p { margin: 0; font-size: 0.85rem; color: var(--t2); }
.nh-inline-note {
  margin-top: 1.1rem; padding: 0.75rem 0.95rem; font-size: 0.85rem; color: var(--t2);
  background: color-mix(in srgb, var(--warn) 10%, var(--bg1)); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent); border-radius: var(--r-md);
}

/* ── Checklist ── */
.nh-checklist { list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: 0.55rem; }
.nh-checklist li { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.8rem 1rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); }
.nh-check-box { flex-shrink: 0; width: 1.3rem; height: 1.3rem; border: 2px solid var(--ac); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--ac); font-size: 0.85rem; font-weight: 800; }
.nh-check-body strong { display: block; font-size: 0.95rem; }
.nh-check-body span { font-size: 0.83rem; color: var(--t2); }
.nh-check-caution { color: var(--cyT) !important; font-weight: 700; }

/* ── Hub ── */
.nh-hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.7rem; margin-top: 1.2rem; }
.nh-hub-item { text-align: left; padding: 1rem 1.05rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); cursor: pointer; font-family: var(--ff); color: var(--t1); transition: transform 0.18s, border-color 0.18s; }
.nh-hub-item:hover, .nh-hub-item:focus-visible { transform: translateY(-2px); border-color: var(--ac); }
.nh-hub-item h3 { margin: 0 0 0.3rem; font-size: 0.98rem; }
.nh-hub-item p { margin: 0; font-size: 0.82rem; color: var(--t2); }

/* ── Waymaker block ── */
.nh-waymaker .nh-waymaker-inner {
  display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;
  margin-top: 1.2rem; padding: 1.4rem 1.5rem;
  background: linear-gradient(120deg, var(--acG), var(--cyL));
  border: 1px solid var(--bd); border-radius: var(--r-lg);
}
.nh-waymaker-text { max-width: 56ch; }
.nh-waymaker-text h3 { margin: 0 0 0.4rem; font-size: 1.15rem; }
.nh-waymaker-text p { margin: 0; font-size: 0.9rem; color: var(--t2); }
.nh-waymaker-note { margin-top: 0.7rem !important; font-size: 0.8rem !important; color: var(--t3) !important; }

/* ── Caution + sources ── */
.nh-caution .nh-caution-inner { padding: 1.4rem 1.5rem; background: color-mix(in srgb, var(--warn) 9%, var(--bg1)); border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent); border-radius: var(--r-lg); }
.nh-caution h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
.nh-caution p { margin: 0; color: var(--t2); }
.nh-source-list { list-style: none; margin: 1.1rem 0 0; padding: 0; display: grid; gap: 0.5rem; }
.nh-source-list li { display: flex; flex-wrap: wrap; gap: 0.5rem 0.7rem; align-items: center; padding: 0.7rem 0.95rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); font-size: 0.88rem; }
.nh-source-flag { font-size: 0.72rem; font-weight: 800; color: var(--t3); border: 1px dashed var(--bd); border-radius: 999px; padding: 0.1rem 0.5rem; }

/* ── Status chips (never color-only: each has a glyph + text) ── */
.nh-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.2rem 0.6rem; border-radius: 999px;
  font-size: 0.76rem; font-weight: 800; line-height: 1.3;
  border: 1px solid var(--bd); background: var(--bg2); color: var(--t2);
}
.nh-chip-glyph { font-size: 0.8rem; }
.nh-chip[data-tone="go"] { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, var(--bg1)); color: color-mix(in srgb, var(--ok) 72%, var(--t1)); }
.nh-chip[data-tone="warn"] { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--bg1)); color: color-mix(in srgb, var(--warn) 72%, var(--t1)); }
.nh-chip[data-tone="neutral"] { border-color: var(--bd); background: var(--bg2); color: var(--t2); }

/* ── Footer ── */
.nh-footer { padding: 2rem clamp(1rem,4vw,2rem) 3rem; background: var(--bg2); border-top: 1px solid var(--bd2); }
.nh-footer-inner { max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }
.nh-footer p { margin: 0; font-size: 0.85rem; color: var(--t3); max-width: 80ch; }
.nh-footer a { font-weight: 800; text-decoration: none; }
.nh-footer a:hover { text-decoration: underline; }

/* ── Modal ── */
.nh-modal-overlay {
  position: fixed; inset: 0; z-index: 200; display: none;
  align-items: center; justify-content: center; padding: 1rem;
  background: rgba(12,16,14,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity 0.25s;
}
.nh-modal-overlay.active { display: flex; opacity: 1; }
.nh-modal {
  width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-xl);
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.5);
  transform: translateY(10px) scale(0.98); transition: transform 0.25s;
}
.nh-modal-overlay.active .nh-modal { transform: none; }
.nh-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--bd2); }
.nh-modal-title { margin: 0; font-size: 1.1rem; font-weight: 800; }
.nh-modal-close {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--bd); color: var(--t2); font-size: 1.1rem;
  display: inline-flex; align-items: center; justify-content: center; transition: background 0.18s, color 0.18s, transform 0.2s;
}
.nh-modal-close:hover { color: var(--t1); transform: rotate(90deg); }
.nh-modal-body { padding: 1.3rem; overflow-y: auto; }
.nh-modal-foot { padding: 1rem 1.3rem; border-top: 1px solid var(--bd2); display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: space-between; align-items: center; }
.nh-modal-disclaimer { font-size: 0.78rem; color: var(--t3); flex: 1 1 240px; }

·평가 확인":"KIIP·評価の確認","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"社会統合プログラムの教育·評価と国籍手続きが互いに異なる点を確認し、Socinet と法務部の公式案内へつなぎます。","준비 항목 보기":"準備項目を見る","귀화 후 절차":"帰化後の手続き","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"官報告示の確認から家族関係登録、住民登録、外国国籍の整理まで、許可後の行政手続きをチェックリストで確認します。","체크리스트 보기":"チェックリストを見る","국적업무 허브":"国籍業務ハブ","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"帰化·国籍回復·国籍判定·国籍選択·複数国籍·外国国籍不行使誓約など、国籍業務全般を一箇所で見渡します。","허브 열기":"ハブを開く","Waymaker — 내 절차 찾기":"Waymaker — 自分の手続きを探す","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"在留資格と状況を選んで、準備すべきことと公式の根拠を確認しましょう。国籍·帰化の領域も併せてご案内します。","내 절차 찾기":"自分の手続きを探す","전체 흐름 미리보기":"全体の流れをプレビュー","KIIP·평가 공식 안내":"KIIP·評価の公式案内","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"社会統合プログラム（KIIP）の教育·評価と国籍手続きは互いに区別されます。ご本人に適用される課程·評価·面接や最新の日程は、Socinet または管轄機関で確認する必要があります。","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP は法務部の社会統合の教育·評価プログラムです。修了や評価結果が一部の在留·国籍手続きで考慮されることはありますが、それ自体で資格や許可を自動的に保証するものではありません。","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"KIIP 課程の修了、段階配置のための事前評価·中間評価、永住·帰化用の総合評価は、それぞれ異なる手続きです。帰化面接と総合評価も同じ手続きと断定することはできません。","내 KIIP 단계 확인":"自分の KIIP 段階を確認","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"配置された段階と次の段階、修了状況を社会統合情報網で確認する方法を整理します。","평가 유형 확인":"評価タイプを確認","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"事前評価·中間評価·永住用または帰化用の総合評価のうち、どの評価が関係するのかを公式の告知で確認します。","귀화면접 공식자료 찾기":"帰化面接の公式資料を探す","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"法務部の国籍業務民願案内で、面接審査に関する公式資料や最新の案内があるか確認します。","면제·인정 여부 확인":"免除·認定の可否を確認","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"KIIP の修了·評価結果がご本人の手続きでどのように認定されるかを、公式の案内と管轄機関で確認します。Paradiso は免除を判定しません。","공식 면접자료 확인":"公式の面接資料を確認","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"非公式の予想問題ではなく、法務部が公開した面接関連資料と管轄機関の案内を優先して確認します。","공식 일정 확인":"公式の日程を確認","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"評価の日程と申請は、社会統合情報網·評価ホームページで直接確認してください。Paradiso は日程を独自に表記しません。","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"評価の日程と詳細な基準は、社会統合情報網など公式の出典での確認が必要です。","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"許可後に確認できる行政手続きの例です。個人の状況によって項目や順序が異なる場合があり、すべての方に同一に適用される完全なリストではありません。","관보 고시 확인":"官報告示の確認","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"帰化·国籍に関する処分は官報告示で確認されます。","전자관보에서 본인 관련 고시를 확인하세요.":"電子官報でご本人に関する告示を確認してください。","가족관계등록 관련 확인":"家族関係登録に関する確認","가족관계등록 절차가 필요한지 확인합니다.":"家族関係登録の手続きが必要かどうかを確認します。","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"管轄機関の案内に従って、必要な書類と手続きを確認してください。","주민등록 관련 확인":"住民登録に関する確認","거주지 주민등록 절차를 확인합니다.":"居住地の住民登録手続きを確認します。","주소지 관할 행정기관에서 절차를 확인하세요.":"住所地を管轄する行政機関で手続きを確認してください。","주민등록증 발급":"住民登録証の発給","주민등록증 발급 절차를 확인합니다.":"住民登録証の発給手続きを確認します。","발급 요건·장소를 관할 기관에서 확인하세요.":"発給の要件·場所を管轄機関で確認してください。","외국인등록증 처리":"外国人登録証の処理","기존 외국인등록증 처리 방법을 확인합니다.":"従来の外国人登録証の処理方法を確認します。","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"処理方法を HiKorea·管轄の出入国官署で確認してください。","대한민국 여권 발급":"大韓民国パスポートの発給","대한민국 여권 발급 절차를 확인합니다.":"大韓民国パスポートの発給手続きを確認します。","여권 발급 기관 안내에 따라 준비하세요.":"パスポート発給機関の案内に従って準備してください。","은행/통신/보험/학교/직장 정보 변경":"銀行/通信/保険/学校/勤務先の情報変更","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"身分情報が紐づく機関に変更事項を反映します。","각 기관별 신원 정보 변경 절차를 확인하세요.":"各機関の身元情報変更手続きを確認してください。","외국국적 포기 또는 외국국적불행사서약 확인":"外国国籍の放棄または外国国籍不行使誓約の確認","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"ご本人にどの手続き（放棄または誓約）が適用されるかを確認します。","적용 절차와 기한을 관할기관에서 확인하세요.":"適用される手続きと期限を管轄機関で確認してください。","기한이 있을 수 있어 시기 확인이 중요합니다.":"期限がある場合があるため、時期の確認が重要です。","복수국적 관련 후속 의무 확인":"複数国籍に関する後続義務の確認","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"複数国籍が維持される場合に伴う後続義務を確認します。","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"ご本人の類型の義務を国籍法令·管轄機関で確認してください。","유형에 따라 의무가 다릅니다.":"類型によって義務が異なります。","병역 관련 확인이 필요한 경우":"兵役に関する確認が必要な場合","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"該当する可能性がある場合は、兵役に関する案内を別途確認します。","해당 여부와 절차를 관할기관에서 확인하세요.":"該当の可否と手続きを管轄機関で確認してください。","개인 상황에 따라 적용이 다릅니다.":"個人の状況によって適用が異なります。","자녀/가족관계 영향 확인이 필요한 경우":"子女/家族関係への影響の確認が必要な場合","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"子女や家族関係に影響があり得るかを確認します。","해당 가능성을 관할기관에서 확인하세요.":"該当の可能性を管轄機関で確認してください。","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"このチェックリストは参考用であり、すべての方に同一に適用される完全なリストではありません。機関ごとに手続きが異なる場合があるため、最終確認が必要です。","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"国籍に関する主な業務を一箇所に整理しました。各項目を押すと、簡単な説明とまず確認すべき事項、公式の出典を見ることができます。詳細な要件は公式の出典での確認が必要です。","일반귀화":"一般帰化","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"特別な事由なく一定期間以上居住した外国人が検討する基本的な帰化です。","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"長期居住中で、安定した在留基盤を備えた方","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"居住期間の要件と永住（F-5）などの在留基盤、KIIP/評価の修了状況","간이귀화":"簡易帰化","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"婚姻または家族関係など一定の事由がある場合に検討する帰化です。","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"韓国国民の配偶者がいる、または家族の国籍履歴がある方","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"ご本人に適用される事由の類型（婚姻·家族関係など）と関連する要件","특별귀화":"特別帰化","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"功労·能力など特別な事由が認められるときに検討する帰化です。","특별 인정 사유가 있을 수 있는 분":"特別な認定事由がある可能性のある方","인정 사유 해당 여부와 분야별 공식 기준":"認定事由に該当するかどうかと、分野別の公式基準","기준이 분야·정책에 따라 다릅니다.":"基準は分野·政策によって異なります。","우수인재 특별귀화":"優秀人材の特別帰化","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"特定分野の優秀人材と認められる場合に検討する特別帰化の類型です。","전문 분야 실적·추천이 있을 수 있는 분":"専門分野での実績·推薦がある可能性のある方","분야별 인정 기준과 추천·증빙 요건":"分野別の認定基準と推薦·証明の要件","정책에 따라 자주 갱신됩니다.":"政策によって頻繁に更新されます。","국적회복":"国籍回復","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"かつて韓国国籍を有していたが喪失·離脱した方が国籍を回復する手続きです。","과거 한국 국적 보유 이력이 있는 분":"かつて韓国国籍を保有していた履歴のある方","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"過去の国籍の保有·喪失の経緯と欠格事由、複数国籍への影響","국적판정":"国籍判定","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"韓国国籍の保有の有無が不明確なときに、それを判定してもらう手続きです。","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"出生·家族関係が複雑で、国籍保有の有無が不明確な方","출생·가족관계 기록과 국적 변동 이력":"出生·家族関係の記録と国籍変動の履歴","국적취득":"国籍取得","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"婚姻·認知など一定の事由により国籍を取得する場合を扱います。","출생 외 사유로 국적 취득을 검토하는 분":"出生以外の事由による国籍取得を検討する方","본인 사유에 맞는 취득 유형과 절차":"ご本人の事由に合った取得の類型と手続き","국적선택":"国籍選択","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"複数国籍者が定められた期間内に国籍を選択する手続きです。","복수국적이며 선택 시기가 다가오는 분":"複数国籍で、選択の時期が近づいている方","본인의 국적선택 기간과 방법, 관련 의무":"ご本人の国籍選択の期間と方法、関連する義務","기간 경과 시 불이익이 있을 수 있습니다.":"期間が経過すると不利益が生じる場合があります。","국적상실":"国籍喪失","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"一定の事由により韓国国籍を喪失する場合の確認事項です。","외국국적 취득 등으로 상실 여부가 궁금한 분":"外国国籍の取得などにより喪失の有無が気になる方","상실 사유 해당 여부와 신고·후속 절차":"喪失事由に該当するかどうかと、届出·後続手続き","국적이탈":"国籍離脱","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"複数国籍者が韓国国籍を離脱（放棄）する手続きの確認事項です。","외국에서 거주하며 국적이탈을 검토하는 분":"外国に居住し、国籍離脱を検討する方","이탈 가능 기간·요건과 병역 등 관련 의무":"離脱が可能な期間·要件と、兵役など関連する義務","기간·병역 등과 연결되어 복잡할 수 있습니다.":"期間·兵役などと関係し、複雑になる場合があります。","국적보유":"国籍保留","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"一定の場合に韓国国籍を継続して保有するための届出など、確認事項です。","출생 등으로 복수국적이 되었고 보유를 원하는 분":"出生などにより複数国籍となり、保留を希望する方","보유 신고 대상·기간 여부":"保留届出の対象·期間に該当するか","복수국적":"複数国籍","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"複数国籍が許容·制限される場合と、関連する確認事項を扱います。","복수국적 유지 가능 여부가 궁금한 분":"複数国籍を維持できるかどうかが気になる方","본인 유형의 허용·제한 여부와 관련 의무":"ご本人の類型が許容·制限されるかどうかと、関連する義務","외국국적불행사서약":"外国国籍不行使誓約","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"韓国で外国国籍を行使しないと誓約する制度の確認事項です。","귀화·국적회복 후 서약 적용이 궁금한 분":"帰化·国籍回復後に誓約が適用されるか気になる方","서약 적용 대상 여부와 절차·기한":"誓約の適用対象に該当するかどうかと、手続き·期限","귀화적격심사":"帰化適格審査","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"帰化申請後に要件·品行などを確認する審査段階についての案内です。","귀화 신청을 준비하거나 심사를 앞둔 분":"帰化申請を準備中、または審査を控えている方","심사에서 확인될 수 있는 항목과 본인 준비 상태":"審査で確認され得る項目と、ご本人の準備状況","국적 심사 진행상황 조회":"国籍審査の進捗状況の照会","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"申請後の進捗状況をオンラインで確認するサービスの案内です。","이미 신청하고 결과를 기다리는 분":"すでに申請し、結果を待っている方","조회에 필요한 정보와 접속 경로":"照会に必要な情報とアクセス経路","귀화허가 등 처분은 관보 고시로 확인합니다.":"帰化許可などの処分は官報告示で確認します。","허가 여부·시점을 확인하려는 분":"許可の可否·時点を確認したい方","전자관보 국적·귀화 테마에서 본인 관련 고시":"電子官報の国籍·帰化テーマでご本人に関する告示","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"各項目の詳細な要件·書類·手続きは、公式の出典を確認したうえで段階的に補強されます。","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker は公式の出典をもとに、あなたの手続き、書類、予約、次の行動を整理する手続きナビです。AI は生成された案内を説明する補助的な役割のみを担い、書類·手数料·期限を新たに作り出すことはありません。最終確認は HiKorea·1345·管轄の出入国機関で行ってください。","국적민원·귀화면접 준비":"国籍民願·帰化面接の準備","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"帰化、国籍回復、国籍喪失·離脱、複数国籍、国民宣誓、そして帰化面接の準備まで一箇所で確認しましょう。公式の法令と案内をもとに、ご自身の状況に近い流れを見ることができます。","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"予想質問カード · 模擬面接の練習 · 参考動画 · Waymaker コーチ","준비 시작하기":"準備を始める","꼭 확인하세요":"必ずご確認ください","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"国籍取得·帰化の結果は、個人の具体的な事実関係と管轄機関の審査によって異なります。Paradiso の案内は方向性を整理するための参考資料であり、最終的な資格·許可の可否を断定したり、法律相談に代わるものではありません。","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"国籍·KIIP に関する公式の出典を、種類と適用範囲ごとに整理しました。リンクと公開メタデータは 2026-06-28 に確認しており、申請前に各公式ページの最新の告知を再度確認してください。","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso は法務部·HiKorea·Socinet·ビザポータル·在外公館と提携または所属の関係はありません。これらのリンクは、管轄の公式機関の最新の案内を確認するための連携です。","Paradiso 메인으로 돌아가기":"Paradiso のメインページに戻る","검토 가능":"検討可能","공식 확인 필요":"公式の確認が必要","준비 단계":"準備段階","추가 확인 필요":"追加の確認が必要","판단 제한":"判断が限定的","검토 가능 경로":"検討可能な経路","먼저 확인할 항목":"まず確認する項目","준비하면 좋은 자료":"準備しておくとよい資料","주의할 리스크":"注意すべきリスク","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"8つの質問に1つずつお答えいただくと、どの帰化の経路を検討できるか方向性を整理します。この準備チェックは許可の可否を決定するものではなく、入力された情報に基づく参考案内です。","현재 한국에 체류 중인가요?":"現在、韓国に在留していますか？","예, 한국에 체류 중입니다":"はい、韓国に在留しています","아니요, 해외에 있습니다":"いいえ、海外にいます","잘 모르겠습니다":"よく分かりません","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"現在の在留資格または身分に最も近いものはどれですか？","F-5 영주자격":"F-5 永住資格","F-6 결혼이민":"F-6 結婚移民","F-4 재외동포":"F-4 在外同胞","E계열 취업 체류자격":"E系列の就労在留資格","D계열 유학/연수 체류자격":"D系列の留学/研修在留資格","기타 장기체류":"その他の長期在留","체류자격을 잘 모르겠습니다":"在留資格がよく分かりません","한국에 계속 거주한 기간은 어느 정도인가요?":"韓国に継続して居住した期間はどのくらいですか？","1년 미만":"1年未満","1년 이상 2년 미만":"1年以上2年未満","2년 이상 3년 미만":"2年以上3年未満","3년 이상 5년 미만":"3年以上5年未満","5년 이상":"5年以上","중간에 장기출국 또는 체류 공백이 있었습니다":"途中で長期出国または在留の空白がありました","한국 국민 배우자가 있나요?":"韓国国民の配偶者がいますか？","예, 혼인관계를 유지하고 있습니다":"はい、婚姻関係を維持しています","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"はい、ただし離婚/死別/別居などの変動があります","아니요":"いいえ","답변하기 어렵습니다":"回答しづらいです","부모 또는 가족의 한국 국적 이력이 있나요?":"両親または家族に韓国国籍の履歴がありますか？","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"両親のうち1人以上が韓国国民、または過去に韓国国民でした","본인이 과거 한국 국적을 가진 적이 있습니다":"本人が過去に韓国国籍を持っていたことがあります","재외동포/F-4 관련 이력이 있습니다":"在外同胞/F-4 に関する履歴があります","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"社会統合プログラム（KIIP）または帰化用の総合評価の履歴がありますか？","KIIP 5단계 수료 및 귀화용 종합평가 합격":"KIIP 第5段階の修了および帰化用総合評価の合格","KIIP를 일부 이수했습니다":"KIIP を一部修了しました","귀화용 종합평가만 응시/합격했습니다":"帰化用の総合評価のみ受験/合格しました","아직 없습니다":"まだありません","추가 확인이 필요한 사유가 있나요?":"追加の確認が必要な事由がありますか？","장기출국 또는 체류 공백":"長期出国または在留の空白","세금 체납 또는 소득 증빙 어려움":"税金の滞納または所得証明の困難","범죄·수사·행정처분 이력":"犯罪·捜査·行政処分の履歴","혼인관계 또는 가족관계 증빙이 복잡함":"婚姻関係または家族関係の証明が複雑","해당 없음":"該当なし","지금 가장 필요한 안내는 무엇인가요?":"今、最も必要な案内は何ですか？","내가 어떤 귀화 경로를 검토할 수 있는지":"自分がどの帰化の経路を検討できるか","먼저 F-5 또는 체류자격 정리가 필요한지":"まず F-5 または在留資格の整理が必要かどうか","서류와 증빙 준비":"書類と証明の準備","KIIP/면접 준비":"KIIP/面接の準備","신청 후 진행상황 확인":"申請後の進捗状況の確認","검토 방향 요약":"検討の方向性のまとめ","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"入力された情報をもとに、検討する価値のある方向性です。以下は可能性を整理したものであり、実際に申請できるかどうかや許可については、管轄機関の審査と公式基準の確認が必要です。","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"この結果は、利用者が提供した情報に基づく参考用の案内であり、最終的な法的判断や許可の決定ではありません。","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"最終的に申請できるかどうか、許可されるかどうかは、管轄機関の審査と公式基準（国籍法令·法務部·HiKorea）の確認が必要です。","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"まず永住（F-5）または在留資格を整理することが役立つ場合があります。ご本人の状況に合った順序は管轄機関で確認してください。","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"現在の在留資格を正確に確認すると検討がしやすくなります。外国人登録証または HiKorea で確認してください。","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"社会統合プログラム（KIIP）の修了または帰化用の総合評価の確認が必要な場合があります。社会統合情報網で段階と日程を確認してください。","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"身元·家族関係、国内での居住·在留、生計に関する証明を事前に整理しておくと役立ちます。","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"婚姻·家族関係に関する証明を整理しておくと役立ちます。","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"必要な書類は、法務部のオンライン民願の「民願分野別」案内で、ご本人の経路に合わせて確認してください。","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"在外同胞/F-4 の履歴がある場合は、帰化のほかに国籍回復·国籍判定も併せて検討してみてください。","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"すでに申請した場合は、「国籍審査の進捗状況の照会」で状況を確認できます。","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"許可後には官報告示の確認と登録手続きが続きます。「帰化後の手続き」を参考にしてください。","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"KIIP·面接の準備は、「KIIP·面接の準備」セクションと社会統合情報網を併せて活用してください。","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"長期出国·在留の空白は居住要件の計算に影響する場合があるため、事前に整理·確認が必要です。","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"税金·所得の証明は生計維持能力の確認に関係する場合があるため、事前のチェックが必要です。","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"犯罪·捜査·行政処分の履歴は品行に関する審査につながる場合があるため、事前の確認が重要です。","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"婚姻·家族関係の証明が複雑な場合、海外書類の準備に時間がかかることがあります。","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"入力された情報だけでは方向性を十分に絞り込むのが難しいです。在留資格·居住期間·家族関係を確認したうえで再度チェックするか、Waymaker の国籍相談モードをご利用ください。","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"法律用語を先に知っている必要はありません。1つずつ、今の状況に最も近いものを選べば、検討できる経路へご案内します。","무엇을 준비하고 있나요?":"何を準備していますか？","한국 국적을 취득하고 싶어요":"韓国国籍を取得したいです","한국 국민 배우자가 있어요":"韓国国民の配偶者がいます","부모 또는 가족의 한국 국적 이력이 있어요":"両親または家族に韓国国籍の履歴があります","재외동포/F-4 관련 경로가 궁금해요":"在外同胞/F-4 に関する経路が気になります","국적회복을 알아보고 있어요":"国籍回復について調べています","이미 신청했고 다음 절차가 궁금해요":"すでに申請しており、次の手続きが気になります","복수국적 또는 외국국적불행사서약이 궁금해요":"複数国籍または外国国籍不行使誓約について知りたいです","현재 상황에 가장 가까운 것은 무엇인가요?":"現在の状況に最も近いものはどれですか？","한국에 오래 거주했거나 장기체류 중입니다":"韓国に長く居住している、または長期在留中です","F-5 영주자격을 가지고 있습니다":"F-5 永住資格を持っています","F-5는 아직 없습니다":"F-5 はまだありません","혼인관계를 유지하고 있습니다":"婚姻関係を維持しています","이혼/사별/실종/별거 등 변동이 있습니다":"離婚/死別/失踪/別居などの変動があります","미성년 자녀를 양육 중입니다":"未成年の子女を養育中です","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"両親のうち1人以上が韓国国民、または過去に韓国国民です","입양 또는 출생 관련 이력이 있습니다":"養子縁組または出生に関する履歴があります","F-4 체류자격을 가지고 있습니다":"F-4 在留資格を持っています","F-4 신청을 준비 중입니다":"F-4 の申請を準備中です","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"国籍回復と帰化のどちらが合うのか分かりません","외국국적을 취득하면서 한국 국적을 상실했습니다":"外国国籍を取得した際に韓国国籍を喪失しました","과거 국적이탈/포기를 한 적이 있습니다":"過去に国籍離脱/放棄をしたことがあります","상실 경위가 분명하지 않습니다":"喪失の経緯が明確ではありません","접수 후 대기 중입니다":"受理後、待機中です","종합평가/면접 안내를 받았습니다":"総合評価/面接の案内を受けました","보완서류 요청을 받았습니다":"補完書類の要請を受けました","허가 통보 이후 절차가 궁금합니다":"許可通知後の手続きが気になります","출생 등으로 복수국적이 된 경우입니다":"出生などにより複数国籍となった場合です","귀화 후 외국국적불행사서약이 궁금합니다":"帰化後の外国国籍不行使誓約について知りたいです","국적선택 기간/의무가 궁금합니다":"国籍選択の期間/義務について知りたいです","위 상황과 정확히 맞지 않습니다":"上記の状況と正確には一致しません","현재 가장 막히는 부분은 무엇인가요?":"現在、最も行き詰まっている部分は何ですか？","요건을 모르겠습니다":"要件が分かりません","서류를 모르겠습니다":"書類が分かりません","방문예약/접수 절차가 어렵습니다":"訪問予約/受理の手続きが難しいです","KIIP/종합평가/면접이 어렵습니다":"KIIP/総合評価/面接が難しいです","진행상황 확인이 어렵습니다":"進捗状況の確認が難しいです","귀화 후 절차가 어렵습니다":"帰化後の手続きが難しいです","검토할 수 있는 경로":"検討できる経路","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"選択された状況に近い経路です。各経路の詳細な要件や適用の可否は公式の出典での確認が必要であり、唯一の最終的な答えではなく、検討の方向性です。","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"経路の案内は状況の分類を助ける参考資料であり、要件の充足や許可を保証するものではありません。","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"要件は、国籍法令と HiKorea の国籍/帰化案内で、ご本人の経路に合わせて確認してください。","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"必要な書類は、法務部のオンライン民願の「民願分野別」案内で確認してください。","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"訪問予約·受理は HiKorea の訪問予約で行ってください。","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"KIIP·総合評価·面接は、社会統合情報網と評価ホームページで日程·準備を確認してください。","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"申請後の状況は「国籍審査の進捗状況の照会」で確認してください。","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"許可後の手続きは「帰化後の手続き」セクションと官報告示の確認を参考にしてください。","다음 행동":"次の行動","막히는 부분에 대한 안내":"行き詰まっている部分への案内","법무부·출입국":"法務部·出入国","공식 확인·민원 창구":"公式の確認·民願窓口","사회통합·평가":"社会統合·評価","법령·관보":"法令·官報"},"vi":{"Paradiso로 돌아가기":"Quay lại Paradiso","테마 전환":"Chuyển giao diện","밝기 전환":"Chuyển độ sáng","닫기":"Đóng","열기":"Mở","다음":"Tiếp theo","이전":"Quay lại","처음부터":"Bắt đầu lại","결과 보기":"Xem kết quả","자세히 보기":"Xem chi tiết","이런 분께":"Dành cho ai","먼저 확인하세요":"Vui lòng kiểm tra trước","확인할 항목":"Các mục cần kiểm tra","준비 자료(범주)":"Tài liệu cần chuẩn bị (theo nhóm)","다음 단계":"Bước tiếp theo","공식 출처":"Nguồn chính thức","공식 출처로 확인":"Kiểm tra qua nguồn chính thức","공식 사이트에서 최신 내용 확인":"Kiểm tra nội dung mới nhất trên trang chính thức","적용 범위":"Phạm vi áp dụng","확인일":"Ngày truy cập","자료일":"Ngày của tài liệu","수정일":"Ngày cập nhật","시행일":"Ngày có hiệu lực","향후 시행 — 현재 기준 아님":"Có hiệu lực trong tương lai — không phải quy định hiện hành","법령":"Văn bản pháp luật / luật định","중앙정부 안내":"Cổng thông tin chính phủ trung ương","공식 서비스":"Dịch vụ chính thức","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Tài liệu tham khảo của chính phủ","공식 사이트":"Trang chính thức","경로":"Đường dẫn","내 절차 찾기 (Waymaker)":"Tìm thủ tục của tôi (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Không thể tải nội dung. Vui lòng thử lại sau giây lát hoặc truy cập từ trang chính của Paradiso.","시작하기":"Bắt đầu","KIIP·평가":"KIIP·đánh giá","허가 후":"Sau khi được cấp phép","국적업무":"Trung tâm nghiệp vụ quốc tịch","Paradiso 국적·귀화 플랫폼":"Nền tảng quốc tịch·nhập tịch Paradiso","나에게 맞는 국적·귀화 경로를 찾으세요":"Tìm con đường quốc tịch·nhập tịch phù hợp với bạn","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Hướng dẫn theo từng bước từ nhập tịch, khôi phục quốc tịch, xác định quốc tịch, đa quốc tịch, Chương trình Hội nhập Xã hội, phỏng vấn cho đến các thủ tục sau khi nhập tịch.","2분 준비 점검 시작":"Bắt đầu kiểm tra mức độ sẵn sàng trong 2 phút","상황별 경로 찾기":"Tìm con đường theo tình huống","약 2분":"Khoảng 2 phút","로그인 불필요":"Không cần đăng nhập","공식 출처 연결":"Kết nối với nguồn chính thức","지금 필요한 것부터":"Bắt đầu từ điều bạn cần ngay bây giờ","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Bạn có thể bắt đầu từ tình huống hiện tại mà không cần biết thuật ngữ pháp lý.","귀화 준비 항목 빠르게 점검":"Kiểm tra nhanh các mục chuẩn bị nhập tịch","내 상황을 단계별로 분류":"Phân loại tình huống của tôi theo từng bước","공식 근거와 확인 창구 보기":"Xem căn cứ chính thức và các đầu mối xác nhận","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Nghiệp vụ quốc tịch có thể thay đổi tùy theo hoàn cảnh cá nhân và các văn bản pháp luật·hướng dẫn mới nhất. Paradiso cung cấp hướng dẫn dựa trên căn cứ chính thức, còn phán quyết cuối cùng cần được xác nhận tại cơ quan có thẩm quyền.","무엇을 도와드릴까요?":"Chúng tôi có thể giúp gì cho bạn?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Hãy chọn thẻ phù hợp với tình huống của bạn để bắt đầu. Mỗi công cụ chỉ sắp xếp hướng xem xét dựa trên thông tin bạn nhập, chứ không quyết định việc được cấp phép hay không.","귀화 준비 점검":"Kiểm tra mức độ sẵn sàng nhập tịch","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Sắp xếp từng câu hỏi các mục cần kiểm tra để chuẩn bị như cư trú, quan hệ gia đình, KIIP·đánh giá và kết nối đến đường dẫn chính thức tương ứng.","준비 점검 시작":"Bắt đầu kiểm tra chuẩn bị","귀화 경로 찾기":"Tìm con đường nhập tịch","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Bạn không cần biết thuật ngữ pháp lý trước. Chỉ cần chọn tình huống hiện tại theo từng bước, chúng tôi sẽ hướng dẫn bạn đến những con đường có thể xem xét.","경로 찾기":"Tìm con đường","KIIP·평가 확인":"Kiểm tra KIIP·đánh giá","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Xác nhận điểm khác biệt giữa giáo dục·đánh giá của Chương trình Hội nhập Xã hội với thủ tục quốc tịch, và kết nối đến hướng dẫn chính thức của Socinet và Bộ Tư pháp.","준비 항목 보기":"Xem các mục chuẩn bị","귀화 후 절차":"Thủ tục sau khi nhập tịch","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"Điểm qua các thủ tục hành chính sau khi được cấp phép dưới dạng danh sách kiểm tra, từ xác nhận công bố trên công báo đến đăng ký quan hệ gia đình, đăng ký cư dân và xử lý quốc tịch nước ngoài.","체크리스트 보기":"Xem danh sách kiểm tra","국적업무 허브":"Trung tâm nghiệp vụ quốc tịch","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Xem toàn bộ nghiệp vụ quốc tịch tại một nơi, bao gồm nhập tịch·khôi phục quốc tịch·xác định quốc tịch·lựa chọn quốc tịch·đa quốc tịch·cam kết không thực thi quốc tịch nước ngoài.","허브 열기":"Mở trung tâm","Waymaker — 내 절차 찾기":"Waymaker — Tìm thủ tục của tôi","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Hãy chọn tư cách cư trú và tình huống để xác nhận những việc cần chuẩn bị và căn cứ chính thức. Lĩnh vực quốc tịch·nhập tịch cũng được hướng dẫn kèm theo.","내 절차 찾기":"Tìm thủ tục của tôi","전체 흐름 미리보기":"Xem trước toàn bộ tiến trình","KIIP·평가 공식 안내":"Hướng dẫn chính thức về KIIP·đánh giá","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"Giáo dục·đánh giá của Chương trình Hội nhập Xã hội (KIIP) và thủ tục quốc tịch là tách biệt với nhau. Khóa học·đánh giá·phỏng vấn áp dụng cho bạn cùng lịch trình mới nhất phải được xác nhận tại Socinet hoặc cơ quan có thẩm quyền.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP là chương trình giáo dục·đánh giá hội nhập xã hội của Bộ Tư pháp. Việc hoàn thành hoặc kết quả đánh giá có thể được xem xét trong một số thủ tục cư trú·quốc tịch, nhưng bản thân điều đó không tự động đảm bảo tư cách hay sự cấp phép.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"Việc hoàn thành khóa học KIIP, đánh giá đầu vào·đánh giá giữa kỳ để phân bổ giai đoạn, và đánh giá tổng hợp dùng cho cư trú vĩnh viễn·nhập tịch là những thủ tục khác nhau. Cũng không thể khẳng định phỏng vấn nhập tịch và đánh giá tổng hợp là cùng một thủ tục.","내 KIIP 단계 확인":"Kiểm tra giai đoạn KIIP của tôi","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Tổng hợp cách kiểm tra giai đoạn được phân bổ, giai đoạn tiếp theo và tình trạng hoàn thành trên Mạng thông tin Hội nhập Xã hội.","평가 유형 확인":"Xác nhận loại đánh giá","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Xác nhận trong thông báo chính thức xem loại đánh giá nào liên quan đến bạn trong số đánh giá đầu vào·đánh giá giữa kỳ·đánh giá tổng hợp dùng cho cư trú vĩnh viễn hoặc nhập tịch.","귀화면접 공식자료 찾기":"Tìm tài liệu chính thức về phỏng vấn nhập tịch","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Kiểm tra xem có tài liệu chính thức liên quan đến thẩm tra phỏng vấn và hướng dẫn mới nhất trong phần hướng dẫn dịch vụ hành chính nghiệp vụ quốc tịch của Bộ Tư pháp hay không.","면제·인정 여부 확인":"Xác nhận có được miễn·công nhận hay không","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Xác nhận qua hướng dẫn chính thức và cơ quan có thẩm quyền xem việc hoàn thành KIIP·kết quả đánh giá được công nhận như thế nào trong thủ tục của bạn. Paradiso không phán quyết việc miễn trừ.","공식 면접자료 확인":"Xác nhận tài liệu phỏng vấn chính thức","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Ưu tiên xác nhận tài liệu liên quan đến phỏng vấn do Bộ Tư pháp công bố và hướng dẫn của cơ quan có thẩm quyền, thay vì các câu hỏi dự đoán không chính thức.","공식 일정 확인":"Xác nhận lịch trình chính thức","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Vui lòng xác nhận trực tiếp lịch đánh giá và việc đăng ký tại Mạng thông tin Hội nhập Xã hội·trang đánh giá. Paradiso không tự ý ghi chú lịch trình.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Lịch đánh giá và tiêu chí chi tiết cần được xác nhận qua các nguồn chính thức như Mạng thông tin Hội nhập Xã hội.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Đây là ví dụ về các thủ tục hành chính có thể xem xét sau khi được cấp phép. Các mục và thứ tự có thể khác nhau tùy theo hoàn cảnh cá nhân, và đây không phải là danh sách đầy đủ áp dụng giống nhau cho tất cả mọi người.","관보 고시 확인":"Xác nhận công bố trên công báo","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Các quyết định liên quan đến nhập tịch·quốc tịch được xác nhận thông qua công bố trên công báo.","전자관보에서 본인 관련 고시를 확인하세요.":"Hãy kiểm tra công bố liên quan đến bạn trên công báo điện tử.","가족관계등록 관련 확인":"Xác nhận liên quan đến đăng ký quan hệ gia đình","가족관계등록 절차가 필요한지 확인합니다.":"Xác nhận xem có cần thủ tục đăng ký quan hệ gia đình hay không.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Hãy xác nhận giấy tờ và thủ tục cần thiết theo hướng dẫn của cơ quan có thẩm quyền.","주민등록 관련 확인":"Xác nhận liên quan đến đăng ký cư dân","거주지 주민등록 절차를 확인합니다.":"Xác nhận thủ tục đăng ký cư dân tại nơi cư trú.","주소지 관할 행정기관에서 절차를 확인하세요.":"Hãy xác nhận thủ tục tại cơ quan hành chính có thẩm quyền nơi bạn đăng ký địa chỉ.","주민등록증 발급":"Cấp thẻ đăng ký cư dân","주민등록증 발급 절차를 확인합니다.":"Xác nhận thủ tục cấp thẻ đăng ký cư dân.","발급 요건·장소를 관할 기관에서 확인하세요.":"Hãy xác nhận điều kiện·địa điểm cấp thẻ tại cơ quan có thẩm quyền.","외국인등록증 처리":"Xử lý thẻ đăng ký người nước ngoài","기존 외국인등록증 처리 방법을 확인합니다.":"Xác nhận cách xử lý thẻ đăng ký người nước ngoài hiện có.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Hãy xác nhận cách xử lý tại HiKorea·cơ quan xuất nhập cảnh có thẩm quyền.","대한민국 여권 발급":"Cấp hộ chiếu Đại Hàn Dân Quốc","대한민국 여권 발급 절차를 확인합니다.":"Xác nhận thủ tục cấp hộ chiếu Đại Hàn Dân Quốc.","여권 발급 기관 안내에 따라 준비하세요.":"Hãy chuẩn bị theo hướng dẫn của cơ quan cấp hộ chiếu.","은행/통신/보험/학교/직장 정보 변경":"Thay đổi thông tin ngân hàng/viễn thông/bảo hiểm/trường học/nơi làm việc","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Cập nhật các thay đổi tại những cơ quan có liên kết với thông tin nhân thân của bạn.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Hãy xác nhận thủ tục thay đổi thông tin nhân thân tại từng cơ quan.","외국국적 포기 또는 외국국적불행사서약 확인":"Xác nhận việc từ bỏ quốc tịch nước ngoài hoặc cam kết không thực thi quốc tịch nước ngoài","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Xác nhận xem thủ tục nào (từ bỏ hoặc cam kết) áp dụng cho bạn.","적용 절차와 기한을 관할기관에서 확인하세요.":"Hãy xác nhận thủ tục áp dụng và thời hạn tại cơ quan có thẩm quyền.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Có thể có thời hạn, nên việc xác nhận thời điểm là quan trọng.","복수국적 관련 후속 의무 확인":"Xác nhận nghĩa vụ tiếp theo liên quan đến đa quốc tịch","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Xác nhận các nghĩa vụ tiếp theo phát sinh trong trường hợp đa quốc tịch được duy trì.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Hãy xác nhận nghĩa vụ của loại hình của bạn tại Luật Quốc tịch·cơ quan có thẩm quyền.","유형에 따라 의무가 다릅니다.":"Nghĩa vụ khác nhau tùy theo loại hình.","병역 관련 확인이 필요한 경우":"Trường hợp cần xác nhận liên quan đến nghĩa vụ quân sự","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Trong trường hợp có thể áp dụng, hãy xác nhận riêng hướng dẫn liên quan đến nghĩa vụ quân sự.","해당 여부와 절차를 관할기관에서 확인하세요.":"Hãy xác nhận xem có áp dụng hay không và thủ tục tại cơ quan có thẩm quyền.","개인 상황에 따라 적용이 다릅니다.":"Việc áp dụng khác nhau tùy theo hoàn cảnh cá nhân.","자녀/가족관계 영향 확인이 필요한 경우":"Trường hợp cần xác nhận ảnh hưởng đến con cái/quan hệ gia đình","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Xác nhận xem có thể có ảnh hưởng đến con cái hoặc quan hệ gia đình hay không.","해당 가능성을 관할기관에서 확인하세요.":"Hãy xác nhận khả năng áp dụng tại cơ quan có thẩm quyền.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Danh sách kiểm tra này chỉ mang tính tham khảo và không phải là danh sách đầy đủ áp dụng giống nhau cho tất cả mọi người. Thủ tục có thể khác nhau tùy theo từng cơ quan, nên cần xác nhận cuối cùng.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Đã tổng hợp các nghiệp vụ chính liên quan đến quốc tịch tại một nơi. Khi nhấn vào từng mục, bạn có thể xem giải thích ngắn gọn, những điều cần xác nhận trước và nguồn chính thức. Các điều kiện chi tiết cần được xác nhận qua nguồn chính thức.","일반귀화":"Nhập tịch thông thường","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Là hình thức nhập tịch cơ bản dành cho người nước ngoài đã cư trú từ một thời gian nhất định trở lên mà không có lý do đặc biệt.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Người đang cư trú lâu dài và có nền tảng cư trú ổn định","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"Điều kiện về thời gian cư trú, nền tảng cư trú như cư trú vĩnh viễn (F-5), và tình trạng hoàn thành KIIP/đánh giá","간이귀화":"Nhập tịch giản dị","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Là hình thức nhập tịch được xem xét khi có lý do nhất định như hôn nhân hoặc quan hệ gia đình.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Người có vợ/chồng là công dân Hàn Quốc hoặc có lịch sử quốc tịch trong gia đình","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Loại lý do áp dụng cho bạn (hôn nhân·quan hệ gia đình) và các điều kiện liên quan","특별귀화":"Nhập tịch đặc biệt","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Là hình thức nhập tịch được xem xét khi có lý do đặc biệt như công lao·năng lực được công nhận.","특별 인정 사유가 있을 수 있는 분":"Người có thể có lý do được công nhận đặc biệt","인정 사유 해당 여부와 분야별 공식 기준":"Việc có thuộc lý do được công nhận hay không và tiêu chí chính thức theo từng lĩnh vực","기준이 분야·정책에 따라 다릅니다.":"Tiêu chí khác nhau tùy theo lĩnh vực·chính sách.","우수인재 특별귀화":"Nhập tịch đặc biệt cho nhân tài ưu tú","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Là loại hình nhập tịch đặc biệt được xem xét khi được công nhận là nhân tài ưu tú trong một lĩnh vực cụ thể.","전문 분야 실적·추천이 있을 수 있는 분":"Người có thể có thành tích·sự tiến cử trong lĩnh vực chuyên môn","분야별 인정 기준과 추천·증빙 요건":"Tiêu chí công nhận theo từng lĩnh vực và điều kiện về tiến cử·chứng minh","정책에 따라 자주 갱신됩니다.":"Được cập nhật thường xuyên theo chính sách.","국적회복":"Khôi phục quốc tịch","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Là thủ tục khôi phục quốc tịch dành cho người từng có quốc tịch Hàn Quốc rồi bị mất·ly thoát quốc tịch.","과거 한국 국적 보유 이력이 있는 분":"Người từng có lịch sử sở hữu quốc tịch Hàn Quốc","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Quá trình sở hữu·mất quốc tịch trong quá khứ, lý do không đủ tư cách và ảnh hưởng của đa quốc tịch","국적판정":"Xác định quốc tịch","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Là thủ tục để được xác định khi việc có sở hữu quốc tịch Hàn Quốc hay không là không rõ ràng.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Người có việc sở hữu quốc tịch không rõ ràng do xuất thân·quan hệ gia đình phức tạp","출생·가족관계 기록과 국적 변동 이력":"Hồ sơ về xuất thân·quan hệ gia đình và lịch sử thay đổi quốc tịch","국적취득":"Thủ đắc quốc tịch","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Đề cập đến trường hợp thủ đắc quốc tịch do một số lý do nhất định như hôn nhân·sự nhìn nhận con.","출생 외 사유로 국적 취득을 검토하는 분":"Người xem xét thủ đắc quốc tịch do lý do khác ngoài việc sinh ra","본인 사유에 맞는 취득 유형과 절차":"Loại hình và thủ tục thủ đắc phù hợp với lý do của bạn","국적선택":"Lựa chọn quốc tịch","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Là thủ tục để người đa quốc tịch lựa chọn quốc tịch trong thời hạn quy định.","복수국적이며 선택 시기가 다가오는 분":"Người có đa quốc tịch và thời điểm lựa chọn đang đến gần","본인의 국적선택 기간과 방법, 관련 의무":"Thời hạn, phương thức lựa chọn quốc tịch của bạn và các nghĩa vụ liên quan","기간 경과 시 불이익이 있을 수 있습니다.":"Có thể có bất lợi khi quá thời hạn.","국적상실":"Mất quốc tịch","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Là những điều cần xác nhận trong trường hợp mất quốc tịch Hàn Quốc do lý do nhất định.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Người muốn biết về việc mất quốc tịch do thủ đắc quốc tịch nước ngoài","상실 사유 해당 여부와 신고·후속 절차":"Việc có thuộc lý do mất quốc tịch hay không và thủ tục khai báo·thủ tục tiếp theo","국적이탈":"Ly thoát quốc tịch","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Là những điều cần xác nhận về thủ tục ly thoát (từ bỏ) quốc tịch Hàn Quốc của người đa quốc tịch.","외국에서 거주하며 국적이탈을 검토하는 분":"Người đang cư trú ở nước ngoài và xem xét ly thoát quốc tịch","이탈 가능 기간·요건과 병역 등 관련 의무":"Thời hạn·điều kiện có thể ly thoát và các nghĩa vụ liên quan như nghĩa vụ quân sự","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Có thể phức tạp do liên quan đến thời hạn·nghĩa vụ quân sự.","국적보유":"Bảo lưu quốc tịch","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Là những điều cần xác nhận như việc khai báo để tiếp tục bảo lưu quốc tịch Hàn Quốc trong một số trường hợp nhất định.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Người trở thành đa quốc tịch do sinh ra và muốn bảo lưu","보유 신고 대상·기간 여부":"Việc có thuộc đối tượng khai báo bảo lưu và thời hạn hay không","복수국적":"Đa quốc tịch","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Đề cập đến các trường hợp đa quốc tịch được cho phép·bị hạn chế và những điều cần xác nhận liên quan.","복수국적 유지 가능 여부가 궁금한 분":"Người muốn biết có thể duy trì đa quốc tịch hay không","본인 유형의 허용·제한 여부와 관련 의무":"Việc loại hình của bạn được cho phép·bị hạn chế hay không và các nghĩa vụ liên quan","외국국적불행사서약":"Cam kết không thực thi quốc tịch nước ngoài","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Là những điều cần xác nhận về chế độ cam kết không thực thi quốc tịch nước ngoài tại Hàn Quốc.","귀화·국적회복 후 서약 적용이 궁금한 분":"Người muốn biết việc áp dụng cam kết sau khi nhập tịch·khôi phục quốc tịch","서약 적용 대상 여부와 절차·기한":"Việc có thuộc đối tượng áp dụng cam kết hay không và thủ tục·thời hạn","귀화적격심사":"Thẩm tra tư cách nhập tịch","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Là hướng dẫn về giai đoạn thẩm tra kiểm tra điều kiện·phẩm hạnh sau khi nộp đơn nhập tịch.","귀화 신청을 준비하거나 심사를 앞둔 분":"Người đang chuẩn bị nộp đơn nhập tịch hoặc sắp bước vào thẩm tra","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Các mục có thể được kiểm tra trong thẩm tra và tình trạng chuẩn bị của bạn","국적 심사 진행상황 조회":"Tra cứu tình trạng tiến độ thẩm tra quốc tịch","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Là hướng dẫn về dịch vụ kiểm tra trực tuyến tình trạng tiến độ sau khi nộp đơn.","이미 신청하고 결과를 기다리는 분":"Người đã nộp đơn và đang chờ kết quả","조회에 필요한 정보와 접속 경로":"Thông tin cần thiết để tra cứu và đường dẫn truy cập","귀화허가 등 처분은 관보 고시로 확인합니다.":"Các quyết định như cấp phép nhập tịch được xác nhận thông qua công bố trên công báo.","허가 여부·시점을 확인하려는 분":"Người muốn xác nhận việc được cấp phép hay không và thời điểm","전자관보 국적·귀화 테마에서 본인 관련 고시":"Công bố liên quan đến bạn trong chuyên mục quốc tịch·nhập tịch của công báo điện tử","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Các điều kiện·giấy tờ·thủ tục chi tiết của từng mục sẽ được bổ sung theo từng giai đoạn sau khi xác nhận qua nguồn chính thức.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker là công cụ tìm đường thủ tục, sắp xếp thủ tục, giấy tờ, lịch hẹn và hành động tiếp theo của bạn dựa trên nguồn chính thức. AI chỉ đóng vai trò hỗ trợ giải thích hướng dẫn được tạo ra, chứ không tạo mới giấy tờ·lệ phí·thời hạn. Hãy thực hiện xác nhận cuối cùng tại HiKorea·1345·cơ quan xuất nhập cảnh có thẩm quyền.","국적민원·귀화면접 준비":"Dịch vụ hành chính quốc tịch·chuẩn bị phỏng vấn nhập tịch","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Hãy xác nhận tại một nơi từ nhập tịch, khôi phục quốc tịch, mất·ly thoát quốc tịch, đa quốc tịch, tuyên thệ công dân cho đến chuẩn bị phỏng vấn nhập tịch. Bạn có thể xem tiến trình gần với tình huống của mình dựa trên văn bản pháp luật và hướng dẫn chính thức.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Thẻ câu hỏi dự kiến · luyện phỏng vấn thử · video tham khảo · huấn luyện viên Waymaker","준비 시작하기":"Bắt đầu chuẩn bị","꼭 확인하세요":"Vui lòng nhất định kiểm tra","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"Kết quả của việc thủ đắc quốc tịch·nhập tịch thay đổi tùy theo các tình tiết thực tế cụ thể của cá nhân và sự thẩm tra của cơ quan có thẩm quyền. Hướng dẫn của Paradiso là tài liệu tham khảo giúp sắp xếp định hướng, không khẳng định tư cách·việc được cấp phép cuối cùng và không thay thế cho tư vấn pháp lý.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Đã tổng hợp các nguồn chính thức liên quan đến quốc tịch·KIIP theo loại và phạm vi áp dụng. Liên kết và siêu dữ liệu công khai đã được kiểm tra vào ngày 2026-06-28, vui lòng kiểm tra lại thông báo mới nhất của từng trang chính thức trước khi nộp đơn.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso không có quan hệ liên kết hay trực thuộc với Bộ Tư pháp·HiKorea·Socinet·Cổng thị thực·cơ quan đại diện ở nước ngoài. Liên kết này là kết nối để kiểm tra hướng dẫn mới nhất của cơ quan chính thức có thẩm quyền.","Paradiso 메인으로 돌아가기":"Quay lại trang chính của Paradiso","검토 가능":"Có thể xem xét","공식 확인 필요":"Cần xác nhận chính thức","준비 단계":"Giai đoạn chuẩn bị","추가 확인 필요":"Cần xác nhận thêm","판단 제한":"Hạn chế phán đoán","검토 가능 경로":"Con đường có thể xem xét","먼저 확인할 항목":"Các mục cần xác nhận trước","준비하면 좋은 자료":"Tài liệu nên chuẩn bị","주의할 리스크":"Rủi ro cần lưu ý","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Nếu bạn trả lời tám câu hỏi, mỗi lần một câu, chúng tôi sẽ sắp xếp định hướng về việc bạn có thể xem xét con đường nhập tịch nào. Việc kiểm tra chuẩn bị này không quyết định việc được cấp phép hay không, mà là hướng dẫn tham khảo dựa trên thông tin bạn nhập.","현재 한국에 체류 중인가요?":"Hiện tại bạn có đang cư trú ở Hàn Quốc không?","예, 한국에 체류 중입니다":"Có, tôi đang ở Hàn Quốc","아니요, 해외에 있습니다":"Không, tôi đang ở nước ngoài","잘 모르겠습니다":"Tôi không chắc","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Điều nào gần nhất với tư cách cư trú hoặc thân phận hiện tại của bạn?","F-5 영주자격":"Tư cách cư trú vĩnh viễn F-5","F-6 결혼이민":"F-6 nhập cư theo diện kết hôn","F-4 재외동포":"F-4 kiều bào","E계열 취업 체류자격":"Tư cách cư trú làm việc dòng E","D계열 유학/연수 체류자격":"Tư cách cư trú du học/tu nghiệp dòng D","기타 장기체류":"Cư trú dài hạn khác","체류자격을 잘 모르겠습니다":"Tôi không chắc về tư cách cư trú của mình","한국에 계속 거주한 기간은 어느 정도인가요?":"Bạn đã cư trú liên tục tại Hàn Quốc trong bao lâu?","1년 미만":"Dưới 1 năm","1년 이상 2년 미만":"Từ 1 năm đến dưới 2 năm","2년 이상 3년 미만":"Từ 2 năm đến dưới 3 năm","3년 이상 5년 미만":"Từ 3 năm đến dưới 5 năm","5년 이상":"Từ 5 năm trở lên","중간에 장기출국 또는 체류 공백이 있었습니다":"Có thời gian xuất cảnh dài hạn hoặc gián đoạn cư trú ở giữa","한국 국민 배우자가 있나요?":"Bạn có vợ/chồng là công dân Hàn Quốc không?","예, 혼인관계를 유지하고 있습니다":"Có, quan hệ hôn nhân vẫn đang được duy trì","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Có, nhưng có biến động như ly hôn/góa bụa/ly thân","아니요":"Không","답변하기 어렵습니다":"Tôi không tiện trả lời","부모 또는 가족의 한국 국적 이력이 있나요?":"Cha mẹ hoặc người thân của bạn có lịch sử quốc tịch Hàn Quốc không?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Ít nhất một trong cha mẹ là công dân Hàn Quốc hoặc từng là công dân Hàn Quốc","본인이 과거 한국 국적을 가진 적이 있습니다":"Bản thân tôi từng có quốc tịch Hàn Quốc","재외동포/F-4 관련 이력이 있습니다":"Tôi có lịch sử liên quan đến kiều bào/F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"Bạn có lịch sử Chương trình Hội nhập Xã hội (KIIP) hoặc đánh giá tổng hợp dùng cho nhập tịch không?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"Đã hoàn thành KIIP giai đoạn 5 và đậu đánh giá tổng hợp dùng cho nhập tịch","KIIP를 일부 이수했습니다":"Tôi đã hoàn thành một phần KIIP","귀화용 종합평가만 응시/합격했습니다":"Tôi chỉ tham dự/đậu đánh giá tổng hợp dùng cho nhập tịch","아직 없습니다":"Chưa có","추가 확인이 필요한 사유가 있나요?":"Có lý do nào cần xác nhận thêm không?","장기출국 또는 체류 공백":"Xuất cảnh dài hạn hoặc gián đoạn cư trú","세금 체납 또는 소득 증빙 어려움":"Nợ thuế hoặc khó chứng minh thu nhập","범죄·수사·행정처분 이력":"Lịch sử phạm tội·điều tra·xử phạt hành chính","혼인관계 또는 가족관계 증빙이 복잡함":"Việc chứng minh quan hệ hôn nhân hoặc quan hệ gia đình phức tạp","해당 없음":"Không có mục nào","지금 가장 필요한 안내는 무엇인가요?":"Hướng dẫn bạn cần nhất ngay bây giờ là gì?","내가 어떤 귀화 경로를 검토할 수 있는지":"Tôi có thể xem xét con đường nhập tịch nào","먼저 F-5 또는 체류자격 정리가 필요한지":"Tôi có cần sắp xếp F-5 hoặc tư cách cư trú trước hay không","서류와 증빙 준비":"Chuẩn bị giấy tờ và chứng cứ","KIIP/면접 준비":"Chuẩn bị KIIP/phỏng vấn","신청 후 진행상황 확인":"Kiểm tra tình trạng tiến độ sau khi nộp đơn","검토 방향 요약":"Tóm tắt định hướng xem xét","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Đây là những định hướng đáng xem xét dựa trên thông tin bạn nhập. Phần dưới đây chỉ là tổng hợp các khả năng, còn việc thực tế có thể nộp đơn hay không và việc cấp phép cần được thẩm tra bởi cơ quan có thẩm quyền và xác nhận tiêu chí chính thức.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Kết quả này là hướng dẫn tham khảo dựa trên thông tin người dùng cung cấp, không phải là phán quyết pháp lý cuối cùng hay quyết định cấp phép.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Việc cuối cùng có thể nộp đơn hay không và việc được cấp phép hay không cần được thẩm tra bởi cơ quan có thẩm quyền và xác nhận tiêu chí chính thức (Luật Quốc tịch·Bộ Tư pháp·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Việc sắp xếp cư trú vĩnh viễn (F-5) hoặc tư cách cư trú trước có thể hữu ích. Hãy xác nhận trình tự phù hợp với tình huống của bạn tại cơ quan có thẩm quyền.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Việc xác nhận chính xác tư cách cư trú hiện tại sẽ giúp việc xem xét dễ dàng hơn. Hãy kiểm tra trên thẻ đăng ký người nước ngoài hoặc HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Có thể cần xác nhận việc hoàn thành Chương trình Hội nhập Xã hội (KIIP) hoặc đánh giá tổng hợp dùng cho nhập tịch. Hãy kiểm tra giai đoạn và lịch trình trên Mạng thông tin Hội nhập Xã hội.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Việc chuẩn bị trước các chứng cứ liên quan đến nhân thân·quan hệ gia đình, cư trú·lưu trú trong nước và sinh kế sẽ hữu ích.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Việc chuẩn bị trước các chứng cứ liên quan đến hôn nhân·quan hệ gia đình sẽ hữu ích.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Hãy xác nhận giấy tờ cần thiết phù hợp với con đường của bạn trong phần hướng dẫn theo từng lĩnh vực dịch vụ hành chính của dịch vụ hành chính trực tuyến Bộ Tư pháp.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Nếu bạn có lịch sử kiều bào/F-4, ngoài nhập tịch hãy cùng xem xét cả khôi phục quốc tịch·xác định quốc tịch.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Nếu đã nộp đơn, bạn có thể kiểm tra tình trạng qua 'Tra cứu tình trạng tiến độ thẩm tra quốc tịch'.","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Sau khi được cấp phép sẽ tiếp nối việc xác nhận công bố trên công báo và thủ tục đăng ký. Hãy tham khảo 'Thủ tục sau khi nhập tịch'.","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Đối với việc chuẩn bị KIIP·phỏng vấn, hãy sử dụng kết hợp mục 'Chuẩn bị KIIP·phỏng vấn' và Mạng thông tin Hội nhập Xã hội.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Xuất cảnh dài hạn·gián đoạn cư trú có thể ảnh hưởng đến việc tính điều kiện cư trú, nên cần sắp xếp·xác nhận trước.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Chứng cứ thuế·thu nhập có thể liên quan đến việc xác nhận khả năng duy trì sinh kế, nên cần kiểm tra trước.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Lịch sử phạm tội·điều tra·xử phạt hành chính có thể liên quan đến việc thẩm tra phẩm hạnh, nên việc xác nhận trước là quan trọng.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Trong trường hợp chứng cứ hôn nhân·quan hệ gia đình phức tạp, việc chuẩn bị giấy tờ ở nước ngoài có thể mất thời gian.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Chỉ với thông tin bạn nhập thì khó thu hẹp định hướng một cách đầy đủ. Hãy xác nhận tư cách cư trú·thời gian cư trú·quan hệ gia đình rồi kiểm tra lại, hoặc thử dùng chế độ tư vấn quốc tịch của Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Bạn không cần biết thuật ngữ pháp lý trước. Mỗi lần một câu, chỉ cần chọn điều gần nhất với tình huống hiện tại, chúng tôi sẽ hướng dẫn bạn đến những con đường có thể xem xét.","무엇을 준비하고 있나요?":"Bạn đang chuẩn bị điều gì?","한국 국적을 취득하고 싶어요":"Tôi muốn thủ đắc quốc tịch Hàn Quốc","한국 국민 배우자가 있어요":"Tôi có vợ/chồng là công dân Hàn Quốc","부모 또는 가족의 한국 국적 이력이 있어요":"Cha mẹ hoặc người thân của tôi có lịch sử quốc tịch Hàn Quốc","재외동포/F-4 관련 경로가 궁금해요":"Tôi muốn tìm hiểu con đường liên quan đến kiều bào/F-4","국적회복을 알아보고 있어요":"Tôi đang tìm hiểu về khôi phục quốc tịch","이미 신청했고 다음 절차가 궁금해요":"Tôi đã nộp đơn và muốn biết thủ tục tiếp theo","복수국적 또는 외국국적불행사서약이 궁금해요":"Tôi muốn tìm hiểu về đa quốc tịch hoặc cam kết không thực thi quốc tịch nước ngoài","현재 상황에 가장 가까운 것은 무엇인가요?":"Điều nào gần nhất với tình huống hiện tại của bạn?","한국에 오래 거주했거나 장기체류 중입니다":"Tôi đã cư trú lâu ở Hàn Quốc hoặc đang cư trú dài hạn","F-5 영주자격을 가지고 있습니다":"Tôi có tư cách cư trú vĩnh viễn F-5","F-5는 아직 없습니다":"Tôi chưa có F-5","혼인관계를 유지하고 있습니다":"Quan hệ hôn nhân vẫn đang được duy trì","이혼/사별/실종/별거 등 변동이 있습니다":"Có biến động như ly hôn/góa bụa/mất tích/ly thân","미성년 자녀를 양육 중입니다":"Tôi đang nuôi dưỡng con chưa thành niên","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Ít nhất một trong cha mẹ là công dân Hàn Quốc hoặc từng là công dân Hàn Quốc","입양 또는 출생 관련 이력이 있습니다":"Có lịch sử liên quan đến nhận con nuôi hoặc việc sinh ra","F-4 체류자격을 가지고 있습니다":"Tôi có tư cách cư trú F-4","F-4 신청을 준비 중입니다":"Tôi đang chuẩn bị đơn xin F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Tôi không chắc giữa khôi phục quốc tịch và nhập tịch thì cái nào phù hợp","외국국적을 취득하면서 한국 국적을 상실했습니다":"Tôi đã mất quốc tịch Hàn Quốc khi thủ đắc quốc tịch nước ngoài","과거 국적이탈/포기를 한 적이 있습니다":"Tôi từng ly thoát/từ bỏ quốc tịch trong quá khứ","상실 경위가 분명하지 않습니다":"Quá trình mất quốc tịch không rõ ràng","접수 후 대기 중입니다":"Đã được tiếp nhận và đang chờ","종합평가/면접 안내를 받았습니다":"Tôi đã nhận được thông báo đánh giá tổng hợp/phỏng vấn","보완서류 요청을 받았습니다":"Tôi đã nhận được yêu cầu bổ sung giấy tờ","허가 통보 이후 절차가 궁금합니다":"Tôi muốn biết thủ tục sau khi nhận thông báo cấp phép","출생 등으로 복수국적이 된 경우입니다":"Đây là trường hợp trở thành đa quốc tịch do sinh ra","귀화 후 외국국적불행사서약이 궁금합니다":"Tôi muốn tìm hiểu về cam kết không thực thi quốc tịch nước ngoài sau khi nhập tịch","국적선택 기간/의무가 궁금합니다":"Tôi muốn tìm hiểu về thời hạn/nghĩa vụ lựa chọn quốc tịch","위 상황과 정확히 맞지 않습니다":"Không hoàn toàn khớp với các tình huống trên","현재 가장 막히는 부분은 무엇인가요?":"Phần khiến bạn vướng mắc nhất hiện nay là gì?","요건을 모르겠습니다":"Tôi không rõ các điều kiện","서류를 모르겠습니다":"Tôi không rõ giấy tờ","방문예약/접수 절차가 어렵습니다":"Thủ tục đặt lịch hẹn/tiếp nhận khó khăn","KIIP/종합평가/면접이 어렵습니다":"KIIP/đánh giá tổng hợp/phỏng vấn khó khăn","진행상황 확인이 어렵습니다":"Việc kiểm tra tình trạng tiến độ khó khăn","귀화 후 절차가 어렵습니다":"Thủ tục sau khi nhập tịch khó khăn","검토할 수 있는 경로":"Con đường có thể xem xét","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Đây là những con đường gần với tình huống bạn đã chọn. Các điều kiện chi tiết và việc có áp dụng hay không của từng con đường cần được xác nhận qua nguồn chính thức, và đây là định hướng xem xét chứ không phải một câu trả lời cuối cùng duy nhất.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"Hướng dẫn con đường là tài liệu tham khảo giúp phân loại tình huống, không đảm bảo việc đáp ứng tư cách hay được cấp phép.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Hãy xác nhận các điều kiện phù hợp với con đường của bạn tại Luật Quốc tịch và hướng dẫn quốc tịch/nhập tịch của HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Hãy xác nhận giấy tờ cần thiết trong phần hướng dẫn theo từng lĩnh vực dịch vụ hành chính của dịch vụ hành chính trực tuyến Bộ Tư pháp.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Hãy thực hiện việc đặt lịch hẹn·tiếp nhận tại mục đặt lịch hẹn của HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Đối với KIIP·đánh giá tổng hợp·phỏng vấn, hãy xác nhận lịch trình·việc chuẩn bị tại Mạng thông tin Hội nhập Xã hội và trang đánh giá.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Hãy xác nhận tình trạng sau khi nộp đơn qua 'Tra cứu tình trạng tiến độ thẩm tra quốc tịch'.","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Đối với thủ tục sau khi được cấp phép, hãy tham khảo mục 'Thủ tục sau khi nhập tịch' và việc xác nhận công bố trên công báo.","다음 행동":"Hành động tiếp theo","막히는 부분에 대한 안내":"Hướng dẫn cho phần vướng mắc","법무부·출입국":"Bộ Tư pháp·Xuất nhập cảnh","공식 확인·민원 창구":"Đầu mối xác nhận chính thức·dịch vụ hành chính","사회통합·평가":"Hội nhập Xã hội·đánh giá","법령·관보":"Văn bản pháp luật·công báo"},"tl":{"Paradiso로 돌아가기":"Bumalik sa Paradiso","테마 전환":"Palitan ang tema","밝기 전환":"Palitan ang liwanag","닫기":"Isara","열기":"Buksan","다음":"Susunod","이전":"Bumalik","처음부터":"Mula sa simula","결과 보기":"Tingnan ang resulta","자세히 보기":"Tingnan ang mga detalye","이런 분께":"Para kanino ito","먼저 확인하세요":"Tingnan muna ito","확인할 항목":"Mga bagay na dapat tingnan","준비 자료(범주)":"Mga ebidensiyang ihahanda (ayon sa kategorya)","다음 단계":"Mga susunod na hakbang","공식 출처":"Mga opisyal na pinagmumulan","공식 출처로 확인":"Tingnan sa mga opisyal na pinagmumulan","공식 사이트에서 최신 내용 확인":"Tingnan ang pinakabagong nilalaman sa opisyal na site","적용 범위":"Saklaw ng pag-aaply","확인일":"Petsa ng pag-akses","자료일":"Petsa ng pinagmumulan","수정일":"Petsa ng pagbabago","시행일":"Petsa ng pagkakabisa","향후 시행 — 현재 기준 아님":"Magkakabisa sa hinaharap — hindi pa ito ang kasalukuyang batas","법령":"Batas / estatuto","중앙정부 안내":"Portal ng pamahalaang sentral","공식 서비스":"Opisyal na serbisyo","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Sangguniang pampamahalaan","공식 사이트":"Opisyal na site","경로":"Landas","내 절차 찾기 (Waymaker)":"Hanapin ang aking proseso (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Hindi ma-load ang nilalaman. Pakisubukang muli pagkalipas ng ilang sandali o pumasok sa pamamagitan ng pangunahing pahina ng Paradiso.","시작하기":"Magsimula","KIIP·평가":"KIIP·ebalwasyon","허가 후":"Pagkatapos ng pag-apruba","국적업무":"Sentro ng nasyonalidad","Paradiso 국적·귀화 플랫폼":"Paradiso plataporma ng nasyonalidad·naturalisasyon","나에게 맞는 국적·귀화 경로를 찾으세요":"Hanapin ang landas ng nasyonalidad·naturalisasyon na bagay sa iyo","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Hakbang-hakbang na gabay mula sa naturalisasyon, pagpapanumbalik ng nasyonalidad, pagtukoy ng nasyonalidad, dalawahang nasyonalidad, programa ng panlipunang integrasyon, panayam, hanggang sa mga hakbang pagkatapos ng naturalisasyon.","2분 준비 점검 시작":"Simulan ang 2-minutong pagsusuri ng kahandaan","상황별 경로 찾기":"Hanapin ang landas ayon sa iyong sitwasyon","약 2분":"Mga 2 minuto","로그인 불필요":"Hindi kailangang mag-login","공식 출처 연결":"Nakakonekta sa mga opisyal na pinagmumulan","지금 필요한 것부터":"Magsimula sa kung ano ang kailangan mo ngayon","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Maaari kang magsimula mula sa iyong kasalukuyang sitwasyon kahit hindi mo alam ang mga legal na termino.","귀화 준비 항목 빠르게 점검":"Mabilis na suriin ang mga aytem ng paghahanda sa naturalisasyon","내 상황을 단계별로 분류":"Iuri ang aking sitwasyon nang hakbang-hakbang","공식 근거와 확인 창구 보기":"Tingnan ang mga opisyal na batayan at mga puntong panukatan","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Ang mga usapin sa nasyonalidad ay maaaring magkaiba ayon sa personal na kalagayan at sa pinakabagong mga batas·patnubay. Ang Paradiso ay nagbibigay ng gabay na nakabatay sa mga opisyal na batayan, ngunit ang panghuling pagpapasya ay nangangailangan ng kumpirmasyon mula sa may kapangyarihang ahensiya.","무엇을 도와드릴까요?":"Ano ang maitutulong namin sa iyo?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Piliin ang card na bagay sa iyong sitwasyon upang magsimula. Ang bawat kasangkapan ay nag-aayos lamang ng direksiyon ng pagsusuri batay sa impormasyong iyong inilagay, at hindi nagpapasya kung aaprubahan o hindi.","귀화 준비 점검":"Pagsusuri ng Kahandaan sa Naturalisasyon","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Inaayos ang mga aytem na dapat tingnan sa paghahanda gaya ng paninirahan, relasyong pampamilya, at KIIP·ebalwasyon nang tig-iisang tanong, at ikinokonekta sa kaukulang opisyal na landas.","준비 점검 시작":"Simulan ang pagsusuri","귀화 경로 찾기":"Hanapin ang Iyong Landas Patungo sa Pagkamamamayang Koreano","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Hindi mo kailangang alamin muna ang mga legal na termino. Kapag pinili mo ang iyong kasalukuyang sitwasyon nang hakbang-hakbang, gagabayan ka namin sa mga landas na maaari mong suriin.","경로 찾기":"Hanapin ang landas","KIIP·평가 확인":"Pagtingin sa KIIP·Ebalwasyon","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Tingnan ang pagkakaiba ng edukasyon·ebalwasyon ng programa ng panlipunang integrasyon at ng mga proseso ng nasyonalidad, at ikonekta sa Socinet at sa opisyal na gabay ng Ministry of Justice.","준비 항목 보기":"Tingnan ang paghahanda","귀화 후 절차":"Mga Hakbang Pagkatapos ng Pag-apruba","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"Sinusuri ang mga administratibong hakbang pagkatapos ng pag-apruba sa pamamagitan ng checklist — mula sa pagtingin sa abiso sa opisyal na gazette, pagpaparehistro ng relasyong pampamilya, pagpaparehistro ng residente, hanggang sa pag-aayos ng banyagang nasyonalidad.","체크리스트 보기":"Tingnan ang checklist","국적업무 허브":"Sentro ng Nasyonalidad","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Tingnan sa iisang lugar ang buong larangan ng mga usapin sa nasyonalidad gaya ng naturalisasyon·pagpapanumbalik ng nasyonalidad·pagtukoy ng nasyonalidad·pagpili ng nasyonalidad·dalawahang nasyonalidad·panunumpang hindi gagamitin ang banyagang nasyonalidad.","허브 열기":"Buksan ang sentro","Waymaker — 내 절차 찾기":"Waymaker — Hanapin ang aking proseso","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Piliin ang iyong status ng paninirahan at sitwasyon upang tingnan ang mga dapat ihanda at ang mga opisyal na batayan. Kasama rin ang gabay sa larangan ng nasyonalidad·naturalisasyon.","내 절차 찾기":"Hanapin ang aking proseso","전체 흐름 미리보기":"Silip sa buong daloy","KIIP·평가 공식 안내":"Opisyal na Gabay sa KIIP·Ebalwasyon","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"Ang edukasyon·ebalwasyon ng programa ng panlipunang integrasyon (KIIP) at ang mga proseso ng nasyonalidad ay magkaibang bagay. Ang kursong·ebalwasyong·panayam na umaaplay sa iyo at ang pinakabagong iskedyul ay dapat tingnan sa Socinet o sa may kapangyarihang ahensiya.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"Ang KIIP ay programa ng edukasyon·ebalwasyon sa panlipunang integrasyon ng Ministry of Justice. Maaaring isaalang-alang ang pagkakumpleto o resulta ng ebalwasyon sa ilang proseso ng paninirahan·nasyonalidad, ngunit hindi nito kusang ginagarantiya ang karapatan o pag-apruba.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"Magkakaibang proseso ang pagkumpleto ng kurso sa KIIP, ang paunang ebalwasyon·gitnang ebalwasyon para sa pagtatalaga ng antas, at ang komprehensibong ebalwasyon para sa permanenteng paninirahan·naturalisasyon. Hindi rin maaaring ituring na iisang proseso ang panayam sa naturalisasyon at ang komprehensibong ebalwasyon.","내 KIIP 단계 확인":"Tingnan ang aking antas sa KIIP","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Inaayos kung paano titingnan sa Social Integration Information Network ang itinalagang antas, ang susunod na antas, at ang katayuan ng pagkakumpleto.","평가 유형 확인":"Tingnan ang uri ng ebalwasyon","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Tingnan sa opisyal na abiso kung aling ebalwasyon ang may kaugnayan sa iyo sa pagitan ng paunang ebalwasyon·gitnang ebalwasyon·komprehensibong ebalwasyon para sa permanenteng paninirahan o para sa naturalisasyon.","귀화면접 공식자료 찾기":"Hanapin ang opisyal na materyales sa panayam sa naturalisasyon","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Tingnan sa gabay sa serbisyo ng nasyonalidad ng Ministry of Justice kung may opisyal na materyales at pinakabagong gabay tungkol sa pagsusuri sa panayam.","면제·인정 여부 확인":"Tingnan kung may pagbubukod·pagkilala","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Tingnan sa opisyal na gabay at sa may kapangyarihang ahensiya kung paano kinikilala ang pagkumpleto sa KIIP·resulta ng ebalwasyon sa iyong proseso. Hindi nagpapasya ang Paradiso ng pagbubukod.","공식 면접자료 확인":"Tingnan ang opisyal na materyales sa panayam","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Sa halip na mga di-opisyal na inaasahang tanong, unahing tingnan ang materyales tungkol sa panayam na inilabas ng Ministry of Justice at ang gabay ng may kapangyarihang ahensiya.","공식 일정 확인":"Tingnan ang opisyal na iskedyul","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Tingnan nang direkta ang iskedyul ng ebalwasyon at ang aplikasyon sa Social Integration Information Network·website ng ebalwasyon. Hindi basta-basta nagtatala ang Paradiso ng iskedyul.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Ang iskedyul ng ebalwasyon at ang mga detalyadong pamantayan ay kailangang tingnan sa mga opisyal na pinagmumulan gaya ng Social Integration Information Network.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Mga halimbawa ng administratibong hakbang na maaaring tingnan pagkatapos ng pag-apruba. Maaaring magkaiba ang mga aytem at pagkakasunod-sunod ayon sa personal na sitwasyon, at hindi ito kumpletong listahang pantay na umaaplay sa lahat.","관보 고시 확인":"Tingnan ang abiso sa opisyal na gazette","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Ang mga desisyon kaugnay ng naturalisasyon·nasyonalidad ay kinukumpirma sa pamamagitan ng abiso sa opisyal na gazette.","전자관보에서 본인 관련 고시를 확인하세요.":"Tingnan sa e-gazette ang abisong may kaugnayan sa iyo.","가족관계등록 관련 확인":"Pagtingin kaugnay ng pagpaparehistro ng relasyong pampamilya","가족관계등록 절차가 필요한지 확인합니다.":"Tinitingnan kung kailangan ang proseso ng pagpaparehistro ng relasyong pampamilya.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Tingnan ang mga kinakailangang dokumento at hakbang ayon sa gabay ng may kapangyarihang ahensiya.","주민등록 관련 확인":"Pagtingin kaugnay ng pagpaparehistro ng residente","거주지 주민등록 절차를 확인합니다.":"Tinitingnan ang proseso ng pagpaparehistro ng residente sa iyong tirahan.","주소지 관할 행정기관에서 절차를 확인하세요.":"Tingnan ang proseso sa administratibong ahensiyang nasasakupan ng iyong address.","주민등록증 발급":"Pag-isyu ng resident registration card","주민등록증 발급 절차를 확인합니다.":"Tinitingnan ang proseso ng pag-isyu ng resident registration card.","발급 요건·장소를 관할 기관에서 확인하세요.":"Tingnan ang mga kahingian·lugar ng pag-isyu sa may kapangyarihang ahensiya.","외국인등록증 처리":"Pag-aayos ng alien registration card","기존 외국인등록증 처리 방법을 확인합니다.":"Tinitingnan ang paraan ng pag-aayos sa dating alien registration card (ARC).","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Tingnan ang paraan ng pag-aayos sa HiKorea·nasasakupang tanggapan ng imigrasyon.","대한민국 여권 발급":"Pag-isyu ng pasaporte ng Republika ng Korea","대한민국 여권 발급 절차를 확인합니다.":"Tinitingnan ang proseso ng pag-isyu ng pasaporte ng Republika ng Korea.","여권 발급 기관 안내에 따라 준비하세요.":"Maghanda ayon sa gabay ng tanggapan ng pag-isyu ng pasaporte.","은행/통신/보험/학교/직장 정보 변경":"Pagbabago ng impormasyon sa bangko/telekomunikasyon/seguro/paaralan/trabaho","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Iniaaplay ang mga pagbabago sa mga institusyong nakakabit sa iyong impormasyon ng pagkakakilanlan.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Tingnan ang proseso ng pagbabago ng impormasyon ng pagkakakilanlan sa bawat institusyon.","외국국적 포기 또는 외국국적불행사서약 확인":"Pagtingin sa pagbitaw ng banyagang nasyonalidad o panunumpang hindi gagamitin ang banyagang nasyonalidad","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Tinitingnan kung aling hakbang (pagbitaw o panunumpa) ang umaaplay sa iyo.","적용 절차와 기한을 관할기관에서 확인하세요.":"Tingnan ang umaaplay na hakbang at takdang panahon sa may kapangyarihang ahensiya.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Maaaring may takdang panahon kaya mahalaga ang pagtingin sa panahon.","복수국적 관련 후속 의무 확인":"Pagtingin sa mga susunod na obligasyon kaugnay ng dalawahang nasyonalidad","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Tinitingnan ang mga susunod na obligasyong kasunod kapag napananatili ang dalawahang nasyonalidad.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Tingnan ang mga obligasyon ng iyong uri sa Batas ng Nasyonalidad·may kapangyarihang ahensiya.","유형에 따라 의무가 다릅니다.":"Iba-iba ang obligasyon ayon sa uri.","병역 관련 확인이 필요한 경우":"Kung kailangan ng pagtingin kaugnay ng serbisyong militar","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Kung maaaring umaaplay, hiwalay na tingnan ang gabay kaugnay ng serbisyong militar.","해당 여부와 절차를 관할기관에서 확인하세요.":"Tingnan sa may kapangyarihang ahensiya kung umaaplay ito at ang proseso nito.","개인 상황에 따라 적용이 다릅니다.":"Iba-iba ang pag-aaply ayon sa personal na sitwasyon.","자녀/가족관계 영향 확인이 필요한 경우":"Kung kailangang tingnan ang epekto sa anak/relasyong pampamilya","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Tinitingnan k
