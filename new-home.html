관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Только по введённым вами данным трудно достаточно сузить направление. Проверьте статус пребывания·срок проживания·семейные отношения и пройдите проверку снова либо воспользуйтесь режимом консультации по гражданству в Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Знать юридические термины заранее необязательно. По одному за раз выбирайте то, что ближе всего к вашей текущей ситуации, и мы укажем пути, которые можно рассмотреть.","무엇을 준비하고 있나요?":"Что вы готовите?","한국 국적을 취득하고 싶어요":"Я хочу получить корейское гражданство","한국 국민 배우자가 있어요":"У меня есть супруг — гражданин Кореи","부모 또는 가족의 한국 국적 이력이 있어요":"У моих родителей или членов семьи есть история корейского гражданства","재외동포/F-4 관련 경로가 궁금해요":"Меня интересуют пути, связанные с зарубежными корейцами/статусом F-4","국적회복을 알아보고 있어요":"Я изучаю восстановление гражданства","이미 신청했고 다음 절차가 궁금해요":"Я уже подал заявление и хочу узнать о следующих процедурах","복수국적 또는 외국국적불행사서약이 궁금해요":"Меня интересует множественное гражданство или обязательство о неиспользовании иностранного гражданства","현재 상황에 가장 가까운 것은 무엇인가요?":"Что ближе всего к вашей текущей ситуации?","한국에 오래 거주했거나 장기체류 중입니다":"Я долго проживаю в Корее или нахожусь в долгосрочном пребывании","F-5 영주자격을 가지고 있습니다":"У меня есть статус постоянного жителя F-5 (ПМЖ)","F-5는 아직 없습니다":"F-5 у меня пока нет","혼인관계를 유지하고 있습니다":"Брак сохраняется","이혼/사별/실종/별거 등 변동이 있습니다":"Есть изменения (развод/смерть супруга/безвестное отсутствие/раздельное проживание)","미성년 자녀를 양육 중입니다":"Я воспитываю несовершеннолетнего ребёнка","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Хотя бы один из родителей является или ранее был гражданином Кореи","입양 또는 출생 관련 이력이 있습니다":"Есть история, связанная с усыновлением или рождением","F-4 체류자격을 가지고 있습니다":"У меня есть статус пребывания F-4","F-4 신청을 준비 중입니다":"Я готовлю заявление на F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Я не уверен, что мне подходит — восстановление гражданства или натурализация","외국국적을 취득하면서 한국 국적을 상실했습니다":"Я утратил корейское гражданство, приобретя иностранное","과거 국적이탈/포기를 한 적이 있습니다":"В прошлом я выходил из гражданства/отказывался от него","상실 경위가 분명하지 않습니다":"Обстоятельства утраты неясны","접수 후 대기 중입니다":"Заявление принято, ожидаю","종합평가/면접 안내를 받았습니다":"Я получил уведомление о комплексном оценивании/собеседовании","보완서류 요청을 받았습니다":"Я получил запрос на дополнительные документы","허가 통보 이후 절차가 궁금합니다":"Меня интересуют процедуры после получения уведомления о разрешении","출생 등으로 복수국적이 된 경우입니다":"Это случай, когда множественное гражданство возникло, например, по рождению","귀화 후 외국국적불행사서약이 궁금합니다":"Меня интересует обязательство о неиспользовании иностранного гражданства после натурализации","국적선택 기간/의무가 궁금합니다":"Меня интересует срок/обязанность выбора гражданства","위 상황과 정확히 맞지 않습니다":"Ни одна из ситуаций выше не подходит точно","현재 가장 막히는 부분은 무엇인가요?":"Что для вас сейчас является главным препятствием?","요건을 모르겠습니다":"Я не знаю требований","서류를 모르겠습니다":"Я не знаю, какие нужны документы","방문예약/접수 절차가 어렵습니다":"Запись на приём/процедура подачи затруднительна","KIIP/종합평가/면접이 어렵습니다":"KIIP/комплексное оценивание/собеседование затруднительно","진행상황 확인이 어렵습니다":"Проверять ход рассмотрения затруднительно","귀화 후 절차가 어렵습니다":"Процедуры после натурализации затруднительны","검토할 수 있는 경로":"Пути, которые можно рассмотреть","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Это пути, близкие к выбранной вами ситуации. Подробные требования каждого пути и его применимость требуют проверки по официальным источникам; это не единственный окончательный ответ, а направление для рассмотрения.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"Руководство по путям — это справочный материал, помогающий классифицировать ситуацию; оно не гарантирует соответствия требованиям или выдачи разрешения.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Требования проверьте по вашему пути в Законе о гражданстве и руководстве по гражданству/натурализации HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Необходимые документы проверьте в руководстве по областям обращений в онлайн-приёмной обращений Министерства юстиции.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Запись на приём·подачу оформляйте через запись на приём в HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Расписание·подготовку к KIIP·комплексному оцениванию·собеседованию проверяйте в информационной сети социальной интеграции и на сайте оценивания.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Статус после подачи заявления проверяйте через «Запрос о ходе рассмотрения дела о гражданстве».","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Для процедур после одобрения см. раздел «Процедуры после натурализации» и проверку публикации в официальном вестнике.","다음 행동":"Следующее действие","막히는 부분에 대한 안내":"Руководство по вашему препятствию","법무부·출입국":"Министерство юстиции·Иммиграционная служба","공식 확인·민원 창구":"Каналы официального подтверждения·обращений","사회통합·평가":"Социальная интеграция·оценивание","법령·관보":"Законы·официальный вестник"},"fr":{"Paradiso로 돌아가기":"Retour a Paradiso","테마 전환":"Changer de theme","밝기 전환":"Changer la luminosite","닫기":"Fermer","열기":"Ouvrir","다음":"Suivant","이전":"Precedent","처음부터":"Recommencer","결과 보기":"Voir le resultat","자세히 보기":"Voir les details","이런 분께":"Pour qui c'est concu","먼저 확인하세요":"A verifier en premier","확인할 항목":"Elements a verifier","준비 자료(범주)":"Justificatifs a preparer (par categorie)","다음 단계":"Etapes suivantes","공식 출처":"Sources officielles","공식 출처로 확인":"Verifier aupres des sources officielles","공식 사이트에서 최신 내용 확인":"Verifier les informations a jour sur le site officiel","적용 범위":"Champ d'application","확인일":"Date de consultation","자료일":"Date de la source","수정일":"Date de mise a jour","시행일":"Date d'entree en vigueur","향후 시행 — 현재 기준 아님":"Entree en vigueur future — pas la reglementation en vigueur","법령":"Loi / texte legislatif","중앙정부 안내":"Portail du gouvernement central","공식 서비스":"Service officiel","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Reference gouvernementale","공식 사이트":"Site officiel","경로":"Chemin d'acces","내 절차 찾기 (Waymaker)":"Trouver ma procedure (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Le contenu n'a pas pu etre charge. Veuillez reessayer dans un instant ou y acceder depuis la page principale de Paradiso.","시작하기":"Commencer","KIIP·평가":"KIIP·evaluation","허가 후":"Apres l'autorisation","국적업무":"Services de nationalite","Paradiso 국적·귀화 플랫폼":"Plateforme de nationalite et de naturalisation Paradiso","나에게 맞는 국적·귀화 경로를 찾으세요":"Trouvez le parcours de nationalite et de naturalisation qui vous convient","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Un accompagnement etape par etape pour la naturalisation, la reintegration dans la nationalite, la determination de la nationalite, la double nationalite, le Programme d'integration sociale, l'entretien et les demarches posterieures a la naturalisation.","2분 준비 점검 시작":"Lancer la verification de preparation en 2 minutes","상황별 경로 찾기":"Trouver un parcours adapte a ma situation","약 2분":"Environ 2 minutes","로그인 불필요":"Aucune connexion requise","공식 출처 연결":"Relie aux sources officielles","지금 필요한 것부터":"Commencez par ce dont vous avez besoin maintenant","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Vous pouvez partir de votre situation actuelle, meme sans connaitre les termes juridiques.","귀화 준비 항목 빠르게 점검":"Verifiez rapidement vos elements de preparation a la naturalisation","내 상황을 단계별로 분류":"Classer ma situation etape par etape","공식 근거와 확인 창구 보기":"Consulter les bases officielles et les points de contact de verification","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Les questions de nationalite peuvent varier selon la situation personnelle et les lois et directives officielles les plus recentes. Paradiso fournit un accompagnement fonde sur des bases officielles, mais la decision finale necessite une confirmation aupres de l'autorite competente.","무엇을 도와드릴까요?":"Que pouvons-nous faire pour vous ?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Choisissez la carte qui correspond a votre situation pour commencer. Chaque outil se contente d'organiser une direction d'examen a partir des informations que vous saisissez ; il ne decide pas de l'octroi de l'autorisation.","귀화 준비 점검":"Verification de preparation a la naturalisation","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Nous organisons, une question a la fois, les elements a verifier — sejour, relations familiales, KIIP et evaluations — et vous orientons vers le parcours officiel correspondant.","준비 점검 시작":"Lancer la verification","귀화 경로 찾기":"Trouver votre parcours vers la nationalite coreenne","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Pas besoin de connaitre d'abord les termes juridiques. Choisissez votre situation actuelle etape par etape, et nous vous orientons vers les parcours a examiner.","경로 찾기":"Trouver un parcours","KIIP·평가 확인":"Verification KIIP et evaluations","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Comprenez en quoi la formation et les evaluations du Programme d'integration sociale different des procedures de nationalite, puis poursuivez vers Socinet et l'information officielle du ministere de la Justice.","준비 항목 보기":"Voir les elements de preparation","귀화 후 절차":"Demarches apres la naturalisation","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"De la verification de la publication au Journal officiel a l'enregistrement des relations familiales, l'enregistrement de residence et la regularisation de la nationalite etrangere, nous passons en revue, sous forme de liste de controle, les demarches administratives posterieures a l'autorisation.","체크리스트 보기":"Voir la liste de controle","국적업무 허브":"Centre des services de nationalite","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Examinez en un seul endroit l'ensemble des services de nationalite : naturalisation, reintegration dans la nationalite, determination de la nationalite, choix de nationalite, double nationalite, engagement de non-exercice de la nationalite etrangere, etc.","허브 열기":"Ouvrir le centre","Waymaker — 내 절차 찾기":"Waymaker — Trouver ma procedure","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Selectionnez votre statut de sejour et votre situation pour connaitre ce qu'il faut preparer et les bases officielles. Le domaine de la nationalite et de la naturalisation est egalement couvert.","내 절차 찾기":"Trouver ma procedure","전체 흐름 미리보기":"Apercu du parcours complet","KIIP·평가 공식 안내":"Information officielle sur le KIIP et les evaluations","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"La formation et les evaluations du Programme d'integration sociale (KIIP) se distinguent des procedures de nationalite. Le cours, l'evaluation ou l'entretien qui s'appliquent a vous, ainsi que le calendrier le plus recent, doivent etre verifies sur Socinet ou aupres de l'autorite competente.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"Le KIIP est le programme de formation et d'evaluation a l'integration sociale du ministere de la Justice. L'achevement ou les resultats d'evaluation peuvent etre pris en compte dans certaines procedures de sejour ou de nationalite, mais ne garantissent pas automatiquement, a eux seuls, l'eligibilite ou l'autorisation.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"L'achevement du cours KIIP, les evaluations preliminaires et intermediaires pour l'affectation par niveau, et l'evaluation globale pour la residence permanente ou la naturalisation sont des procedures distinctes. L'entretien de naturalisation et l'evaluation globale ne peuvent pas non plus etre assimiles a une seule et meme procedure.","내 KIIP 단계 확인":"Verifier mon niveau KIIP","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Nous expliquons comment verifier sur le reseau d'information de l'integration sociale votre niveau d'affectation, le niveau suivant et l'etat d'achevement.","평가 유형 확인":"Verifier le type d'evaluation","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Verifiez dans les avis officiels laquelle des evaluations vous concerne : evaluation preliminaire, intermediaire, ou evaluation globale pour la residence permanente ou la naturalisation.","귀화면접 공식자료 찾기":"Trouver les documents officiels de l'entretien de naturalisation","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Verifiez aupres de l'information sur les demarches de nationalite du ministere de la Justice s'il existe des documents officiels et des informations a jour concernant l'examen d'entretien.","면제·인정 여부 확인":"Verifier l'exemption ou la reconnaissance","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Verifiez aupres de l'information officielle et de l'autorite competente comment l'achevement du KIIP ou les resultats d'evaluation sont reconnus dans votre procedure. Paradiso ne statue pas sur les exemptions.","공식 면접자료 확인":"Consulter les documents officiels de l'entretien","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Privilegiez les documents relatifs a l'entretien publies par le ministere de la Justice et l'information de l'autorite competente plutot que des listes de questions presumees non officielles.","공식 일정 확인":"Verifier le calendrier officiel","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Verifiez directement le calendrier et l'inscription aux evaluations sur le reseau d'information de l'integration sociale ou le site des evaluations. Paradiso n'indique pas de calendrier de son propre chef.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Le calendrier des evaluations et les criteres detailles doivent etre verifies aupres de sources officielles telles que le reseau d'information de l'integration sociale.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Voici des exemples de demarches administratives a envisager apres l'autorisation. Les elements et leur ordre peuvent varier selon la situation personnelle, et il ne s'agit pas d'une liste exhaustive s'appliquant de maniere identique a chacun.","관보 고시 확인":"Verifier la publication au Journal officiel","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Les decisions relatives a la naturalisation et a la nationalite sont confirmees par publication au Journal officiel.","전자관보에서 본인 관련 고시를 확인하세요.":"Verifiez sur le Journal officiel electronique la publication qui vous concerne.","가족관계등록 관련 확인":"Verification relative a l'enregistrement des relations familiales","가족관계등록 절차가 필요한지 확인합니다.":"Verifiez si une procedure d'enregistrement des relations familiales est necessaire.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Verifiez les documents et demarches necessaires selon l'information de l'organisme competent.","주민등록 관련 확인":"Verification relative a l'enregistrement de residence","거주지 주민등록 절차를 확인합니다.":"Verifiez la procedure d'enregistrement de residence de votre lieu de domicile.","주소지 관할 행정기관에서 절차를 확인하세요.":"Verifiez la procedure aupres de l'organisme administratif competent de votre domicile.","주민등록증 발급":"Delivrance de la carte d'enregistrement de residence","주민등록증 발급 절차를 확인합니다.":"Verifiez la procedure de delivrance de la carte d'enregistrement de residence.","발급 요건·장소를 관할 기관에서 확인하세요.":"Verifiez les conditions et le lieu de delivrance aupres de l'organisme competent.","외국인등록증 처리":"Traitement de la carte d'enregistrement des etrangers","기존 외국인등록증 처리 방법을 확인합니다.":"Verifiez comment est traitee votre ancienne carte d'enregistrement des etrangers.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Verifiez la marche a suivre aupres de HiKorea ou du service d'immigration competent.","대한민국 여권 발급":"Delivrance du passeport de la Republique de Coree","대한민국 여권 발급 절차를 확인합니다.":"Verifiez la procedure de delivrance du passeport de la Republique de Coree.","여권 발급 기관 안내에 따라 준비하세요.":"Preparez-vous selon l'information de l'organisme de delivrance des passeports.","은행/통신/보험/학교/직장 정보 변경":"Mise a jour des informations bancaires, telecom, assurance, ecole et employeur","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Reportez les changements aupres des organismes lies a vos donnees d'identite.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Verifiez la procedure de mise a jour des informations d'identite propre a chaque organisme.","외국국적 포기 또는 외국국적불행사서약 확인":"Renonciation a la nationalite etrangere ou engagement de non-exercice de la nationalite etrangere","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Verifiez quelle demarche (renonciation ou engagement) s'applique a vous.","적용 절차와 기한을 관할기관에서 확인하세요.":"Verifiez la demarche applicable et son delai aupres de l'autorite competente.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Il peut y avoir un delai : la verification du moment opportun est importante.","복수국적 관련 후속 의무 확인":"Verification des obligations de suivi liees a la double nationalite","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Verifiez les obligations de suivi applicables lorsque la double nationalite est maintenue.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Verifiez les obligations propres a votre cas aupres de la loi sur la nationalite ou de l'autorite competente.","유형에 따라 의무가 다릅니다.":"Les obligations different selon le cas.","병역 관련 확인이 필요한 경우":"Cas ou une verification relative au service militaire est necessaire","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Le cas echeant, verifiez separement l'information relative au service militaire.","해당 여부와 절차를 관할기관에서 확인하세요.":"Verifiez si cela s'applique et la marche a suivre aupres de l'autorite competente.","개인 상황에 따라 적용이 다릅니다.":"L'application varie selon la situation personnelle.","자녀/가족관계 영향 확인이 필요한 경우":"Cas ou une verification de l'impact sur les enfants ou les relations familiales est necessaire","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Verifiez s'il peut y avoir un impact sur les enfants ou les relations familiales.","해당 가능성을 관할기관에서 확인하세요.":"Verifiez l'eventualite de cet impact aupres de l'autorite competente.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Cette liste de controle est fournie a titre indicatif et n'est pas une liste exhaustive s'appliquant de maniere identique a chacun. Les procedures pouvant varier selon les organismes, une verification finale est necessaire.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Nous avons regroupe en un seul endroit les principaux services lies a la nationalite. Cliquez sur chaque element pour voir une breve explication, les points a verifier en premier et les sources officielles. Les conditions detaillees doivent etre verifiees aupres de sources officielles.","일반귀화":"Naturalisation ordinaire","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Naturalisation de base examinee pour les etrangers ayant reside pendant la duree requise, sans motif particulier.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Personnes en residence de longue duree disposant d'une base de sejour stable","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"La condition de duree de residence, votre base de sejour telle que la residence permanente (F-5), et l'achevement du KIIP ou des evaluations","간이귀화":"Naturalisation simplifiee","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Naturalisation examinee lorsqu'il existe certains motifs, tels que le mariage ou une relation familiale.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Personnes ayant un conjoint citoyen coreen ou des antecedents de nationalite familiale","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Le type de motif qui s'applique a vous (mariage, relation familiale, etc.) et les conditions associees","특별귀화":"Naturalisation speciale","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Naturalisation examinee lorsque des motifs particuliers (merite, competence) sont reconnus.","특별 인정 사유가 있을 수 있는 분":"Personnes susceptibles d'avoir des motifs de reconnaissance particuliers","인정 사유 해당 여부와 분야별 공식 기준":"L'application ou non d'un motif de reconnaissance et les criteres officiels propres a chaque domaine","기준이 분야·정책에 따라 다릅니다.":"Les criteres different selon le domaine et la politique.","우수인재 특별귀화":"Naturalisation speciale pour talent exceptionnel","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Type de naturalisation speciale examine lorsqu'une personne est reconnue comme talent exceptionnel dans un domaine donne.","전문 분야 실적·추천이 있을 수 있는 분":"Personnes susceptibles d'avoir des resultats ou recommandations dans un domaine specialise","분야별 인정 기준과 추천·증빙 요건":"Les criteres de reconnaissance propres a chaque domaine et les conditions de recommandation et de justificatifs","정책에 따라 자주 갱신됩니다.":"Mis a jour frequemment selon la politique.","국적회복":"Reintegration dans la nationalite","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Procedure permettant de recouvrer la nationalite pour ceux qui ont autrefois detenu la nationalite coreenne puis l'ont perdue ou quittee.","과거 한국 국적 보유 이력이 있는 분":"Personnes ayant deja detenu la nationalite coreenne par le passe","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Les circonstances de la detention et de la perte anterieures de la nationalite, les motifs d'inadmissibilite et l'incidence sur la double nationalite","국적판정":"Determination de la nationalite","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Procedure visant a faire determiner la nationalite lorsqu'il n'est pas clair que l'on detient la nationalite coreenne.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Personnes dont la detention de la nationalite est incertaine en raison d'antecedents de naissance ou de relations familiales complexes","출생·가족관계 기록과 국적 변동 이력":"Les registres de naissance et de relations familiales et l'historique des changements de nationalite","국적취득":"Acquisition de la nationalite","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Traite les cas d'acquisition de la nationalite pour certains motifs tels que le mariage ou la reconnaissance.","출생 외 사유로 국적 취득을 검토하는 분":"Personnes envisageant d'acquerir la nationalite pour un motif autre que la naissance","본인 사유에 맞는 취득 유형과 절차":"Le type d'acquisition et la procedure correspondant a votre motif","국적선택":"Choix de nationalite","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Procedure par laquelle une personne ayant plusieurs nationalites en choisit une dans le delai imparti.","복수국적이며 선택 시기가 다가오는 분":"Personnes ayant la double nationalite dont la periode de choix approche","본인의 국적선택 기간과 방법, 관련 의무":"Votre periode et methode de choix de nationalite, ainsi que les obligations associees","기간 경과 시 불이익이 있을 수 있습니다.":"Le depassement du delai peut entrainer des consequences defavorables.","국적상실":"Perte de la nationalite","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Points a verifier dans les cas de perte de la nationalite coreenne pour certains motifs.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Personnes s'interrogeant sur une eventuelle perte, par exemple apres l'acquisition d'une nationalite etrangere","상실 사유 해당 여부와 신고·후속 절차":"L'application ou non d'un motif de perte et les demarches de declaration et de suivi","국적이탈":"Renonciation a la nationalite","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Points a verifier dans la procedure par laquelle une personne ayant la double nationalite renonce a (abandonne) la nationalite coreenne.","외국에서 거주하며 국적이탈을 검토하는 분":"Personnes residant a l'etranger qui envisagent de renoncer a la nationalite","이탈 가능 기간·요건과 병역 등 관련 의무":"La periode et les conditions de renonciation possibles et les obligations associees telles que le service militaire","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Cela peut etre complexe car lie au delai, au service militaire, etc.","국적보유":"Conservation de la nationalite","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Points a verifier, tels que la declaration de conservation, pour conserver la nationalite coreenne dans certains cas.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Personnes devenues binationales (par exemple par la naissance) souhaitant la conserver","보유 신고 대상·기간 여부":"Si l'on est concerne par une declaration de conservation et son delai","복수국적":"Double nationalite","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Traite les cas ou la double nationalite est autorisee ou restreinte, et les points a verifier associes.","복수국적 유지 가능 여부가 궁금한 분":"Personnes s'interrogeant sur la possibilite de conserver la double nationalite","본인 유형의 허용·제한 여부와 관련 의무":"L'autorisation ou la restriction propre a votre cas et les obligations associees","외국국적불행사서약":"Engagement de non-exercice de la nationalite etrangere","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Points a verifier concernant le dispositif par lequel on s'engage a ne pas exercer sa nationalite etrangere en Coree.","귀화·국적회복 후 서약 적용이 궁금한 분":"Personnes s'interrogeant sur l'application de l'engagement apres la naturalisation ou la reintegration dans la nationalite","서약 적용 대상 여부와 절차·기한":"Si l'on est concerne par l'engagement, ainsi que sa procedure et son delai","귀화적격심사":"Examen d'aptitude a la naturalisation","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Information sur l'etape d'examen qui verifie les conditions, la conduite, etc., apres le depot de la demande de naturalisation.","귀화 신청을 준비하거나 심사를 앞둔 분":"Personnes preparant une demande de naturalisation ou sur le point d'etre examinees","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Les elements susceptibles d'etre verifies lors de l'examen et votre etat de preparation","국적 심사 진행상황 조회":"Consultation de l'etat d'avancement de l'examen de nationalite","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Information sur le service permettant de verifier en ligne l'etat d'avancement apres le depot de la demande.","이미 신청하고 결과를 기다리는 분":"Personnes ayant deja depose leur demande et en attente du resultat","조회에 필요한 정보와 접속 경로":"Les informations necessaires a la consultation et le chemin d'acces","귀화허가 등 처분은 관보 고시로 확인합니다.":"Les decisions telles que l'autorisation de naturalisation sont confirmees par publication au Journal officiel.","허가 여부·시점을 확인하려는 분":"Personnes souhaitant verifier l'octroi de l'autorisation et son moment","전자관보 국적·귀화 테마에서 본인 관련 고시":"La publication qui vous concerne dans le theme nationalite et naturalisation du Journal officiel electronique","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Les conditions detaillees, documents et procedures de chaque element seront renforces par etapes apres verification aupres des sources officielles.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker est un guide de procedure qui, sur la base de sources officielles, organise votre procedure, vos documents, votre prise de rendez-vous et votre prochaine action. L'IA ne joue qu'un role auxiliaire en expliquant l'information generee et ne cree pas de nouveaux documents, frais ou delais. Faites la verification finale aupres de HiKorea, du 1345 ou du service d'immigration competent.","국적민원·귀화면접 준비":"Services de nationalite et preparation a l'entretien de naturalisation","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Verifiez en un seul endroit la naturalisation, la reintegration dans la nationalite, la perte et la renonciation de nationalite, la double nationalite, le serment de citoyen et la preparation a l'entretien de naturalisation. Sur la base de la loi et de l'information officielles, vous pouvez examiner un parcours proche de votre situation.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Cartes de questions probables · entrainement a l'entretien simule · videos de reference · coach Waymaker","준비 시작하기":"Commencer la preparation","꼭 확인하세요":"A garder a l'esprit","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"Les resultats de l'acquisition de la nationalite et de la naturalisation dependent des faits propres a chaque personne et de l'examen de l'autorite competente. L'accompagnement de Paradiso est un document de reference qui aide a organiser une direction ; il ne prejuge pas de l'eligibilite ou de l'autorisation finales et ne remplace pas un conseil juridique.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Nous avons organise les sources officielles relatives a la nationalite et au KIIP par type et par champ d'application. Les liens et les metadonnees publiques ont ete verifies le 2026-06-28 ; reverifiez le dernier avis officiel de chaque page officielle avant de deposer votre demande.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso n'a aucun lien de partenariat ou d'appartenance avec le ministere de la Justice, HiKorea, Socinet, le portail des visas ou les missions diplomatiques a l'etranger. Ces liens servent a verifier l'information a jour de l'autorite officielle competente.","Paradiso 메인으로 돌아가기":"Retour a la page principale de Paradiso","검토 가능":"A examiner","공식 확인 필요":"Verification officielle requise","준비 단계":"Etape de preparation","추가 확인 필요":"Verification supplementaire requise","판단 제한":"Jugement limite","검토 가능 경로":"Parcours a examiner","먼저 확인할 항목":"Elements a verifier en premier","준비하면 좋은 자료":"Documents qu'il est utile de preparer","주의할 리스크":"Risques a surveiller","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"En repondant aux huit questions, une a la fois, nous organisons pour vous la direction des parcours de naturalisation que vous pouvez examiner. Cette verification de preparation ne decide pas de l'octroi de l'autorisation ; il s'agit d'une information de reference fondee sur les informations que vous saisissez.","현재 한국에 체류 중인가요?":"Sejournez-vous actuellement en Coree ?","예, 한국에 체류 중입니다":"Oui, je sejourne en Coree","아니요, 해외에 있습니다":"Non, je suis a l'etranger","잘 모르겠습니다":"Je ne sais pas","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Qu'est-ce qui correspond le mieux a votre statut de sejour ou a votre situation actuelle ?","F-5 영주자격":"F-5 residence permanente","F-6 결혼이민":"F-6 immigration par mariage","F-4 재외동포":"F-4 Coreen de l'etranger","E계열 취업 체류자격":"Statut de sejour d'emploi de la serie E","D계열 유학/연수 체류자격":"Statut de sejour d'etudes/formation de la serie D","기타 장기체류":"Autre sejour de longue duree","체류자격을 잘 모르겠습니다":"Je ne connais pas bien mon statut de sejour","한국에 계속 거주한 기간은 어느 정도인가요?":"Depuis combien de temps residez-vous de maniere continue en Coree ?","1년 미만":"Moins de 1 an","1년 이상 2년 미만":"De 1 a 2 ans","2년 이상 3년 미만":"De 2 a 3 ans","3년 이상 5년 미만":"De 3 a 5 ans","5년 이상":"5 ans ou plus","중간에 장기출국 또는 체류 공백이 있었습니다":"Il y a eu des absences prolongees ou des interruptions de sejour","한국 국민 배우자가 있나요?":"Avez-vous un conjoint citoyen coreen ?","예, 혼인관계를 유지하고 있습니다":"Oui, la relation conjugale est maintenue","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Oui, mais il y a des changements (divorce/veuvage/separation, etc.)","아니요":"Non","답변하기 어렵습니다":"Je prefere ne pas repondre","부모 또는 가족의 한국 국적 이력이 있나요?":"Vos parents ou des membres de votre famille ont-ils des antecedents de nationalite coreenne ?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Au moins l'un de mes parents est citoyen coreen ou l'a ete par le passe","본인이 과거 한국 국적을 가진 적이 있습니다":"J'ai moi-meme deja detenu la nationalite coreenne par le passe","재외동포/F-4 관련 이력이 있습니다":"J'ai des antecedents lies aux Coreens de l'etranger / F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"Avez-vous des antecedents de Programme d'integration sociale (KIIP) ou d'evaluation globale pour la naturalisation ?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"KIIP niveau 5 acheve et evaluation globale pour la naturalisation reussie","KIIP를 일부 이수했습니다":"J'ai partiellement acheve le KIIP","귀화용 종합평가만 응시/합격했습니다":"J'ai uniquement passe/reussi l'evaluation globale pour la naturalisation","아직 없습니다":"Pas encore","추가 확인이 필요한 사유가 있나요?":"Y a-t-il des motifs necessitant une verification supplementaire ?","장기출국 또는 체류 공백":"Absences prolongees ou interruptions de sejour","세금 체납 또는 소득 증빙 어려움":"Impots impayes ou difficulte a justifier les revenus","범죄·수사·행정처분 이력":"Antecedents penaux, d'enquete ou de sanction administrative","혼인관계 또는 가족관계 증빙이 복잡함":"Justificatifs de relation conjugale ou de relations familiales complexes","해당 없음":"Non applicable","지금 가장 필요한 안내는 무엇인가요?":"Quelle est l'information dont vous avez le plus besoin maintenant ?","내가 어떤 귀화 경로를 검토할 수 있는지":"Quels parcours de naturalisation je peux examiner","먼저 F-5 또는 체류자격 정리가 필요한지":"Si je dois d'abord regulariser la residence permanente (F-5) ou mon statut de sejour","서류와 증빙 준비":"Preparer les documents et les justificatifs","KIIP/면접 준비":"Preparation au KIIP / a l'entretien","신청 후 진행상황 확인":"Verifier l'etat d'avancement apres le depot de la demande","검토 방향 요약":"Resume des directions a examiner","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Voici les directions qu'il vaut la peine d'examiner d'apres les informations que vous avez saisies. Ce qui suit n'organise que des possibilites ; la possibilite reelle de deposer une demande et l'autorisation necessitent l'examen de l'autorite competente et la verification des criteres officiels.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Ce resultat est une information de reference fondee sur les informations fournies par l'utilisateur ; il ne constitue pas une determination juridique finale ni une decision d'autorisation.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"La possibilite finale de deposer une demande et l'octroi de l'autorisation necessitent l'examen de l'autorite competente et la verification des criteres officiels (loi sur la nationalite, ministere de la Justice, HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Il peut etre utile de regulariser d'abord la residence permanente (F-5) ou votre statut de sejour. Verifiez l'ordre adapte a votre situation aupres de l'autorite competente.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Confirmer precisement votre statut de sejour facilite l'examen. Verifiez-le sur votre carte d'enregistrement des etrangers ou sur HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Il peut etre necessaire de verifier l'achevement du Programme d'integration sociale (KIIP) ou l'evaluation globale pour la naturalisation. Verifiez votre niveau et le calendrier sur le reseau d'information de l'integration sociale.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Il est utile d'organiser a l'avance les justificatifs relatifs a l'identite et aux relations familiales, a la residence et au sejour en Coree, et aux moyens de subsistance.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Il est utile d'organiser a l'avance les justificatifs relatifs au mariage et aux relations familiales.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Verifiez les documents necessaires selon votre parcours dans l'information par domaine du service de demarches en ligne du ministere de la Justice.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Si vous avez des antecedents lies aux Coreens de l'etranger / F-4, examinez aussi, outre la naturalisation, la reintegration dans la nationalite et la determination de la nationalite.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Si vous avez deja depose une demande, vous pouvez verifier l'etat via la « Consultation de l'etat d'avancement de l'examen de nationalite ».","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Apres l'autorisation suivent la verification de la publication au Journal officiel et les demarches d'enregistrement. Reportez-vous aux « Demarches apres la naturalisation ».","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Pour la preparation au KIIP et a l'entretien, utilisez la section « Preparation au KIIP et a l'entretien » avec le reseau d'information de l'integration sociale.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Les absences prolongees et les interruptions de sejour peuvent influer sur le calcul de la condition de residence ; il faut donc les organiser et les verifier a l'avance.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Les justificatifs d'impots et de revenus peuvent etre lies a la verification de la capacite de subsistance ; il faut donc les examiner a l'avance.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Les antecedents penaux, d'enquete ou de sanction administrative peuvent etre lies a l'examen relatif a la conduite ; il est donc important de les verifier au prealable.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Lorsque les justificatifs de mariage et de relations familiales sont complexes, la preparation des documents etrangers peut prendre du temps.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Les seules informations que vous avez saisies ne suffisent pas a affiner suffisamment la direction. Verifiez votre statut de sejour, votre duree de residence et vos relations familiales, puis reprenez la verification, ou essayez le mode consultation nationalite de Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Pas besoin de connaitre d'abord les termes juridiques. Une question a la fois : choisissez ce qui correspond le mieux a votre situation actuelle, et nous vous orientons vers les parcours a examiner.","무엇을 준비하고 있나요?":"Que preparez-vous ?","한국 국적을 취득하고 싶어요":"Je veux acquerir la nationalite coreenne","한국 국민 배우자가 있어요":"J'ai un conjoint citoyen coreen","부모 또는 가족의 한국 국적 이력이 있어요":"Mes parents ou des membres de ma famille ont des antecedents de nationalite coreenne","재외동포/F-4 관련 경로가 궁금해요":"Je m'interroge sur les parcours lies aux Coreens de l'etranger / F-4","국적회복을 알아보고 있어요":"Je me renseigne sur la reintegration dans la nationalite","이미 신청했고 다음 절차가 궁금해요":"J'ai deja depose ma demande et je m'interroge sur les demarches suivantes","복수국적 또는 외국국적불행사서약이 궁금해요":"Je m'interroge sur la double nationalite ou l'engagement de non-exercice de la nationalite etrangere","현재 상황에 가장 가까운 것은 무엇인가요?":"Qu'est-ce qui correspond le mieux a votre situation actuelle ?","한국에 오래 거주했거나 장기체류 중입니다":"Je reside en Coree depuis longtemps ou j'y suis en sejour de longue duree","F-5 영주자격을 가지고 있습니다":"Je detiens la residence permanente F-5","F-5는 아직 없습니다":"Je n'ai pas encore le F-5","혼인관계를 유지하고 있습니다":"La relation conjugale est maintenue","이혼/사별/실종/별거 등 변동이 있습니다":"Il y a des changements (divorce/veuvage/disparition/separation, etc.)","미성년 자녀를 양육 중입니다":"J'eleve un enfant mineur","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Au moins l'un de mes parents est citoyen coreen ou l'a ete par le passe","입양 또는 출생 관련 이력이 있습니다":"Il existe des antecedents lies a une adoption ou a la naissance","F-4 체류자격을 가지고 있습니다":"Je detiens le statut de sejour F-4","F-4 신청을 준비 중입니다":"Je prepare une demande de F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Je ne sais pas si la reintegration dans la nationalite ou la naturalisation me convient","외국국적을 취득하면서 한국 국적을 상실했습니다":"J'ai perdu la nationalite coreenne en acquerant une nationalite etrangere","과거 국적이탈/포기를 한 적이 있습니다":"J'ai deja renonce a / abandonne la nationalite par le passe","상실 경위가 분명하지 않습니다":"Les circonstances de la perte ne sont pas claires","접수 후 대기 중입니다":"En attente apres le depot","종합평가/면접 안내를 받았습니다":"J'ai recu une convocation a l'evaluation globale / l'entretien","보완서류 요청을 받았습니다":"J'ai recu une demande de documents complementaires","허가 통보 이후 절차가 궁금합니다":"Je m'interroge sur les demarches apres la notification de l'autorisation","출생 등으로 복수국적이 된 경우입니다":"Il s'agit du cas ou je suis devenu binational par la naissance, etc.","귀화 후 외국국적불행사서약이 궁금합니다":"Je m'interroge sur l'engagement de non-exercice de la nationalite etrangere apres la naturalisation","국적선택 기간/의무가 궁금합니다":"Je m'interroge sur la periode / l'obligation de choix de nationalite","위 상황과 정확히 맞지 않습니다":"Aucune de ces situations ne correspond exactement","현재 가장 막히는 부분은 무엇인가요?":"Quel est l'obstacle le plus important pour vous en ce moment ?","요건을 모르겠습니다":"Je ne connais pas les conditions","서류를 모르겠습니다":"Je ne connais pas les documents","방문예약/접수 절차가 어렵습니다":"La prise de rendez-vous / le depot est difficile","KIIP/종합평가/면접이 어렵습니다":"Le KIIP / l'evaluation globale / l'entretien est difficile","진행상황 확인이 어렵습니다":"Verifier l'etat d'avancement est difficile","귀화 후 절차가 어렵습니다":"Les demarches apres la naturalisation sont difficiles","검토할 수 있는 경로":"Parcours que vous pouvez examiner","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Voici des parcours proches de la situation que vous avez choisie. Les conditions detaillees de chaque parcours et leur applicabilite necessitent une verification aupres des sources officielles ; il s'agit de directions a examiner et non d'une unique reponse finale.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"L'information sur les parcours est un document de reference qui aide a classer votre situation ; elle ne garantit ni le respect des conditions ni l'autorisation.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Verifiez les conditions selon votre parcours dans la loi sur la nationalite et l'information nationalite/naturalisation de HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Verifiez les documents necessaires dans l'information par domaine du service de demarches en ligne du ministere de la Justice.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Effectuez la prise de rendez-vous et le depot via la prise de rendez-vous de HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Pour le KIIP, l'evaluation globale et l'entretien, verifiez le calendrier et la preparation sur le reseau d'information de l'integration sociale et le site des evaluations.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Apres le depot de la demande, verifiez l'etat via la « Consultation de l'etat d'avancement de l'examen de nationalite ».","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Pour les demarches apres l'autorisation, reportez-vous a la section « Demarches apres la naturalisation » et a la verification de la publication au Journal officiel.","다음 행동":"Prochaine action","막히는 부분에 대한 안내":"Information sur votre obstacle","법무부·출입국":"Ministere de la Justice · Immigration","공식 확인·민원 창구":"Guichets de verification et de demarches officiels","사회통합·평가":"Integration sociale · evaluation","법령·관보":"Lois · Journal officiel"},"es":{"Paradiso로 돌아가기":"Volver a Paradiso","테마 전환":"Cambiar tema","밝기 전환":"Cambiar brillo","닫기":"Cerrar","열기":"Abrir","다음":"Siguiente","이전":"Atrás","처음부터":"Empezar de nuevo","결과 보기":"Ver resultado","자세히 보기":"Ver detalles","이런 분께":"Para quién es esto","먼저 확인하세요":"Confirme esto primero","확인할 항목":"Elementos a confirmar","준비 자료(범주)":"Documentación a preparar (por categoría)","다음 단계":"Próximos pasos","공식 출처":"Fuentes oficiales","공식 출처로 확인":"Confirmar en fuentes oficiales","공식 사이트에서 최신 내용 확인":"Confirme la información actualizada en el sitio oficial","적용 범위":"Ámbito de aplicación","확인일":"Fecha de consulta","자료일":"Fecha del material","수정일":"Fecha de actualización","시행일":"Fecha de entrada en vigor","향후 시행 — 현재 기준 아님":"Entrada en vigor futura — no es la normativa vigente","법령":"Ley / norma","중앙정부 안내":"Portal del gobierno central","공식 서비스":"Servicio oficial","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Material de referencia gubernamental","공식 사이트":"Sitio oficial","경로":"Ruta","내 절차 찾기 (Waymaker)":"Encontrar mi trámite (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"No se pudo cargar el contenido. Vuelva a intentarlo en unos momentos o acceda desde la página principal de Paradiso.","시작하기":"Empezar","KIIP·평가":"KIIP·evaluación","허가 후":"Después de la aprobación","국적업무":"Centro de trámites de nacionalidad","Paradiso 국적·귀화 플랫폼":"Plataforma de nacionalidad·naturalización de Paradiso","나에게 맞는 국적·귀화 경로를 찾으세요":"Encuentre su ruta de nacionalidad·naturalización","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Le guiamos paso a paso por la naturalización, la recuperación de la nacionalidad, la determinación de la nacionalidad, la doble nacionalidad, el Programa de Integración Social, la entrevista y los trámites posteriores a la naturalización.","2분 준비 점검 시작":"Iniciar la verificación de preparación de 2 minutos","상황별 경로 찾기":"Buscar una ruta según mi situación","약 2분":"Unos 2 minutos","로그인 불필요":"No requiere iniciar sesión","공식 출처 연결":"Conectado a fuentes oficiales","지금 필요한 것부터":"Empiece por lo que necesita ahora","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Puede empezar desde su situación actual aunque no conozca los términos legales.","귀화 준비 항목 빠르게 점검":"Revise rápidamente los elementos de preparación para la naturalización","내 상황을 단계별로 분류":"Clasifique mi situación paso a paso","공식 근거와 확인 창구 보기":"Ver el fundamento oficial y las ventanillas de consulta","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Los trámites de nacionalidad pueden variar según las circunstancias personales y la normativa y directrices oficiales más recientes. Paradiso ofrece orientación basada en fuentes oficiales, pero la decisión final requiere confirmación del organismo competente.","무엇을 도와드릴까요?":"¿En qué podemos ayudarle?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Seleccione la tarjeta que se ajuste a su situación para empezar. Cada herramienta solo organiza una dirección de revisión a partir de la información que introduce; no decide si se concede la autorización.","귀화 준비 점검":"Verificación de preparación para la naturalización","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Organiza, una pregunta a la vez, los elementos a confirmar como la residencia, las relaciones familiares y el KIIP·evaluaciones, y le conecta con la ruta oficial correspondiente.","준비 점검 시작":"Iniciar la verificación","귀화 경로 찾기":"Encuentre su ruta hacia la ciudadanía coreana","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"No necesita conocer primero los términos legales. Si elige su situación actual paso a paso, le guiamos hacia las rutas que puede revisar.","경로 찾기":"Buscar ruta","KIIP·평가 확인":"Verificación de KIIP·evaluación","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Confirme las diferencias entre la formación·evaluación del Programa de Integración Social y los trámites de nacionalidad, y conéctese con la orientación oficial de Socinet y el Ministerio de Justicia.","준비 항목 보기":"Ver los elementos de preparación","귀화 후 절차":"Trámites posteriores a la naturalización","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"Repasamos en forma de lista de verificación los trámites administrativos posteriores a la aprobación: desde la confirmación de la notificación en el boletín oficial hasta el registro de relaciones familiares, el registro de residente y la regularización de la nacionalidad extranjera.","체크리스트 보기":"Ver la lista de verificación","국적업무 허브":"Centro de trámites de nacionalidad","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Revise en un solo lugar el conjunto de los trámites de nacionalidad: naturalización, recuperación de la nacionalidad, determinación de la nacionalidad, elección de nacionalidad, doble nacionalidad, juramento de no ejercicio de la nacionalidad extranjera, entre otros.","허브 열기":"Abrir el centro","Waymaker — 내 절차 찾기":"Waymaker — Encontrar mi trámite","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Seleccione su estatus de residencia y su situación para confirmar lo que debe preparar y el fundamento oficial. También ofrecemos orientación sobre el ámbito de la nacionalidad·naturalización.","내 절차 찾기":"Encontrar mi trámite","전체 흐름 미리보기":"Vista previa del flujo completo","KIIP·평가 공식 안내":"Orientación oficial de KIIP·evaluación","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"La formación·evaluación del Programa de Integración Social (KIIP) y los trámites de nacionalidad son cosas distintas. El curso, la evaluación, la entrevista que le corresponden y el calendario más reciente debe confirmarlos en Socinet o en el organismo competente.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"El KIIP es el programa de formación y evaluación de integración social del Ministerio de Justicia. Su finalización o los resultados de la evaluación pueden tenerse en cuenta en algunos trámites de residencia o nacionalidad, pero por sí mismos no garantizan automáticamente la elegibilidad ni la autorización.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"La finalización del curso KIIP, las evaluaciones previa·intermedia para la asignación de nivel y la evaluación integral para residencia permanente·naturalización son trámites distintos entre sí. La entrevista de naturalización y la evaluación integral tampoco pueden darse por supuestas como el mismo trámite.","내 KIIP 단계 확인":"Confirmar mi nivel de KIIP","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Resumimos cómo confirmar en la red de información de integración social el nivel asignado, el siguiente nivel y el estado de finalización.","평가 유형 확인":"Confirmar el tipo de evaluación","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Confirme en los avisos oficiales cuál de las evaluaciones le corresponde: la previa, la intermedia, o la integral para residencia permanente o para naturalización.","귀화면접 공식자료 찾기":"Buscar el material oficial de la entrevista de naturalización","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Confirme en la información de trámites de nacionalidad del Ministerio de Justicia si hay material oficial y orientación reciente sobre el examen de entrevista.","면제·인정 여부 확인":"Confirmar si hay exención·reconocimiento","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Confirme en la orientación oficial y en el organismo competente cómo se reconocen, en su trámite, la finalización·resultados de evaluación del KIIP. Paradiso no determina las exenciones.","공식 면접자료 확인":"Revisar el material oficial de la entrevista","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"En lugar de listas de preguntas previstas no oficiales, confirme con prioridad el material relacionado con la entrevista publicado por el Ministerio de Justicia y la orientación del organismo competente.","공식 일정 확인":"Confirmar el calendario oficial","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Confirme el calendario de evaluación y la inscripción directamente en la red de información de integración social·la página de evaluación. Paradiso no indica calendarios por su cuenta.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"El calendario de evaluación y los criterios detallados requieren confirmación en fuentes oficiales como la red de información de integración social.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Estos son ejemplos de trámites administrativos que puede revisar tras la aprobación. Los elementos y su orden pueden variar según la situación personal y no constituyen una lista completa que se aplique por igual a todas las personas.","관보 고시 확인":"Confirmar la notificación en el boletín oficial","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Las resoluciones relativas a la naturalización·nacionalidad se confirman mediante la notificación en el boletín oficial.","전자관보에서 본인 관련 고시를 확인하세요.":"Confirme en el boletín oficial electrónico la notificación que le concierne.","가족관계등록 관련 확인":"Confirmación relativa al registro de relaciones familiares","가족관계등록 절차가 필요한지 확인합니다.":"Confirme si es necesario el trámite de registro de relaciones familiares.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Confirme los documentos y trámites necesarios según la orientación del organismo competente.","주민등록 관련 확인":"Confirmación relativa al registro de residente","거주지 주민등록 절차를 확인합니다.":"Confirme el trámite de registro de residente de su lugar de residencia.","주소지 관할 행정기관에서 절차를 확인하세요.":"Confirme el trámite en el organismo administrativo competente de su domicilio.","주민등록증 발급":"Expedición del documento de identidad de residente","주민등록증 발급 절차를 확인합니다.":"Confirme el trámite de expedición del documento de identidad de residente.","발급 요건·장소를 관할 기관에서 확인하세요.":"Confirme los requisitos y el lugar de expedición en el organismo competente.","외국인등록증 처리":"Tramitación del carné de extranjería","기존 외국인등록증 처리 방법을 확인합니다.":"Confirme cómo se tramita el carné de extranjería anterior.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Confirme el procedimiento de tramitación en HiKorea·la oficina de inmigración competente.","대한민국 여권 발급":"Expedición del pasaporte de la República de Corea","대한민국 여권 발급 절차를 확인합니다.":"Confirme el trámite de expedición del pasaporte de la República de Corea.","여권 발급 기관 안내에 따라 준비하세요.":"Prepárese según la orientación del organismo expedidor del pasaporte.","은행/통신/보험/학교/직장 정보 변경":"Actualización de datos en banco/telecomunicaciones/seguros/centro educativo/empleo","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Refleje los cambios en las instituciones vinculadas a sus datos de identidad.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Confirme el trámite de actualización de datos de identidad en cada institución.","외국국적 포기 또는 외국국적불행사서약 확인":"Confirmación de la renuncia a la nacionalidad extranjera o del juramento de no ejercicio de la nacionalidad extranjera","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Confirme qué trámite le corresponde a usted (renuncia o juramento).","적용 절차와 기한을 관할기관에서 확인하세요.":"Confirme el trámite aplicable y el plazo en el organismo competente.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Pueden existir plazos, por lo que es importante confirmar los tiempos.","복수국적 관련 후속 의무 확인":"Confirmación de las obligaciones posteriores relativas a la doble nacionalidad","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Confirme las obligaciones posteriores que corresponden cuando se mantiene la doble nacionalidad.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Confirme las obligaciones de su tipo en la normativa de nacionalidad·el organismo competente.","유형에 따라 의무가 다릅니다.":"Las obligaciones difieren según el tipo.","병역 관련 확인이 필요한 경우":"Cuando sea necesaria una confirmación relativa al servicio militar","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Cuando pueda corresponder, confirme por separado la orientación relativa al servicio militar.","해당 여부와 절차를 관할기관에서 확인하세요.":"Confirme si le corresponde y el trámite en el organismo competente.","개인 상황에 따라 적용이 다릅니다.":"La aplicación varía según la situación personal.","자녀/가족관계 영향 확인이 필요한 경우":"Cuando sea necesario confirmar el impacto en los hijos/relaciones familiares","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Confirme si puede haber efectos sobre los hijos o las relaciones familiares.","해당 가능성을 관할기관에서 확인하세요.":"Confirme cualquier posibilidad de que le corresponda en el organismo competente.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Esta lista de verificación es solo orientativa y no es una lista completa que se aplique por igual a todas las personas. Los trámites pueden diferir según la institución, por lo que se requiere una confirmación final.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Hemos reunido en un solo lugar los principales trámites relativos a la nacionalidad. Al pulsar cada elemento podrá ver una breve explicación, lo que debe confirmar primero y las fuentes oficiales. Los requisitos detallados requieren confirmación en fuentes oficiales.","일반귀화":"Naturalización general","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Es la naturalización básica que consideran los extranjeros que han residido durante el período exigido o más sin motivos especiales.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Personas que residen a largo plazo y cuentan con una base de residencia estable","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"El requisito del período de residencia, la base de estancia como la residencia permanente (F-5) y el estado de finalización del KIIP/evaluación","간이귀화":"Naturalización simplificada","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Es la naturalización que se considera cuando existen ciertos motivos, como el matrimonio o una relación familiar.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Personas con cónyuge ciudadano coreano o con antecedentes de nacionalidad familiar","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"El tipo de motivo que le corresponde (matrimonio·relación familiar, etc.) y sus requisitos relacionados","특별귀화":"Naturalización especial","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Es la naturalización que se considera cuando se reconocen motivos especiales, como méritos o aptitudes.","특별 인정 사유가 있을 수 있는 분":"Personas que podrían tener motivos de reconocimiento especial","인정 사유 해당 여부와 분야별 공식 기준":"Si le corresponde un motivo reconocido y los criterios oficiales por ámbito","기준이 분야·정책에 따라 다릅니다.":"Los criterios difieren según el ámbito·la política.","우수인재 특별귀화":"Naturalización especial por talento destacado","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Es un tipo de naturalización especial que se considera cuando se reconoce a la persona como talento destacado en un ámbito concreto.","전문 분야 실적·추천이 있을 수 있는 분":"Personas que podrían tener logros·recomendaciones en un ámbito especializado","분야별 인정 기준과 추천·증빙 요건":"Los criterios de reconocimiento por ámbito y los requisitos de recomendación·acreditación","정책에 따라 자주 갱신됩니다.":"Se actualiza con frecuencia según la política.","국적회복":"Recuperación de la nacionalidad","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Es el trámite mediante el cual recuperan la nacionalidad las personas que tuvieron la nacionalidad coreana en el pasado y la perdieron·abandonaron.","과거 한국 국적 보유 이력이 있는 분":"Personas con antecedentes de haber tenido la nacionalidad coreana en el pasado","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Las circunstancias de la posesión·pérdida de la nacionalidad anterior, los motivos de inhabilitación y el impacto en la doble nacionalidad","국적판정":"Determinación de la nacionalidad","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Es el trámite para que se determine si se posee la nacionalidad coreana cuando ello no está claro.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Personas cuya posesión de la nacionalidad no está clara debido a un nacimiento·relaciones familiares complejos","출생·가족관계 기록과 국적 변동 이력":"Los registros de nacimiento·relaciones familiares y el historial de cambios de nacionalidad","국적취득":"Adquisición de la nacionalidad","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Trata los casos de adquisición de la nacionalidad por ciertos motivos, como el matrimonio·el reconocimiento.","출생 외 사유로 국적 취득을 검토하는 분":"Personas que consideran adquirir la nacionalidad por motivos distintos del nacimiento","본인 사유에 맞는 취득 유형과 절차":"El tipo de adquisición y el trámite que se ajustan a su motivo","국적선택":"Elección de nacionalidad","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Es el trámite por el cual una persona con doble nacionalidad elige su nacionalidad dentro de un plazo determinado.","복수국적이며 선택 시기가 다가오는 분":"Personas con doble nacionalidad cuyo plazo de elección se aproxima","본인의 국적선택 기간과 방법, 관련 의무":"Su plazo y método de elección de nacionalidad, y las obligaciones relacionadas","기간 경과 시 불이익이 있을 수 있습니다.":"Si transcurre el plazo, pueden producirse perjuicios.","국적상실":"Pérdida de la nacionalidad","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Son los puntos a confirmar en los casos en que se pierde la nacionalidad coreana por ciertos motivos.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Personas que se preguntan si la han perdido, p. ej., por adquirir una nacionalidad extranjera","상실 사유 해당 여부와 신고·후속 절차":"Si le corresponde un motivo de pérdida y los trámites de declaración·posteriores","국적이탈":"Renuncia a la nacionalidad","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Son los puntos a confirmar del trámite por el cual una persona con doble nacionalidad renuncia (abandona) la nacionalidad coreana.","외국에서 거주하며 국적이탈을 검토하는 분":"Personas que residen en el extranjero y consideran renunciar a la nacionalidad","이탈 가능 기간·요건과 병역 등 관련 의무":"El plazo·requisitos en que es posible la renuncia y las obligaciones relacionadas, como el servicio militar","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Puede ser complejo al estar vinculado con plazos·servicio militar, etc.","국적보유":"Retención de la nacionalidad","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Son los puntos a confirmar, como la declaración para seguir conservando la nacionalidad coreana en ciertos casos.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Personas que adquirieron la doble nacionalidad (p. ej., por nacimiento) y desean conservarla","보유 신고 대상·기간 여부":"Si es objeto de la declaración de retención y si le corresponde un plazo","복수국적":"Doble nacionalidad","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Trata los casos en que se permite·restringe la doble nacionalidad y los puntos a confirmar relacionados.","복수국적 유지 가능 여부가 궁금한 분":"Personas que se preguntan si pueden conservar la doble nacionalidad","본인 유형의 허용·제한 여부와 관련 의무":"Si su tipo está permitido·restringido y las obligaciones relacionadas","외국국적불행사서약":"Juramento de no ejercicio de la nacionalidad extranjera","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Son los puntos a confirmar del régimen por el cual se jura no ejercer la nacionalidad extranjera en Corea.","귀화·국적회복 후 서약 적용이 궁금한 분":"Personas que se preguntan si el juramento les corresponde tras la naturalización·recuperación de la nacionalidad","서약 적용 대상 여부와 절차·기한":"Si es objeto de aplicación del juramento y su trámite·plazo","귀화적격심사":"Examen de aptitud para la naturalización","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Es la orientación sobre la fase de examen que confirma los requisitos·la conducta, entre otros, tras solicitar la naturalización.","귀화 신청을 준비하거나 심사를 앞둔 분":"Personas que preparan la solicitud de naturalización o que están próximas al examen","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Los aspectos que puede confirmar el examen y su propio estado de preparación","국적 심사 진행상황 조회":"Consulta del estado del examen de nacionalidad","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Es la orientación sobre el servicio para confirmar en línea el estado de avance tras la solicitud.","이미 신청하고 결과를 기다리는 분":"Personas que ya han solicitado y esperan el resultado","조회에 필요한 정보와 접속 경로":"La información necesaria para la consulta y la ruta de acceso","귀화허가 등 처분은 관보 고시로 확인합니다.":"Las resoluciones como la concesión de la naturalización se confirman mediante la notificación en el boletín oficial.","허가 여부·시점을 확인하려는 분":"Personas que desean confirmar si se ha concedido la autorización y cuándo","전자관보 국적·귀화 테마에서 본인 관련 고시":"La notificación que le concierne en la sección de nacionalidad·naturalización del boletín oficial electrónico","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Los requisitos·documentos·trámites detallados de cada elemento se irán reforzando por fases tras su verificación en fuentes oficiales.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker es un guía de trámites que, sobre la base de fuentes oficiales, organiza su trámite, documentos, reservas y siguiente acción. La IA solo desempeña un papel auxiliar de explicar la orientación generada y no crea documentos·tasas·plazos nuevos. La confirmación final hágala en HiKorea·1345·la oficina de inmigración competente.","국적민원·귀화면접 준비":"Trámites de nacionalidad·preparación de la entrevista de naturalización","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Confirme en un solo lugar la naturalización, la recuperación de la nacionalidad, la pérdida·renuncia de la nacionalidad, la doble nacionalidad, el juramento como ciudadano y la preparación de la entrevista de naturalización. Con base en la normativa y orientación oficiales, puede revisar el flujo más cercano a su situación.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Tarjetas de preguntas previstas · práctica de entrevista simulada · vídeos de referencia · coach Waymaker","준비 시작하기":"Empezar a prepararse","꼭 확인하세요":"Téngalo muy en cuenta","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"El resultado de la adquisición de la nacionalidad·naturalización depende de los hechos concretos de cada persona y del examen del organismo competente. La orientación de Paradiso es material de referencia que ayuda a organizar una dirección, y no determina la elegibilidad·autorización final ni sustituye al asesoramiento jurídico.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Hemos organizado las fuentes oficiales relativas a la nacionalidad·KIIP por tipo y ámbito de aplicación. Los enlaces y los metadatos públicos se verificaron el 2026-06-28; antes de solicitar, vuelva a confirmar el aviso más reciente de cada página oficial.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso no tiene relación de asociación ni de pertenencia con el Ministerio de Justicia·HiKorea·Socinet·el portal de visados·las representaciones diplomáticas en el extranjero. Estos enlaces son una conexión para confirmar la orientación más reciente del organismo oficial competente.","Paradiso 메인으로 돌아가기":"Volver a la página principal de Paradiso","검토 가능":"Se puede revisar","공식 확인 필요":"Se requiere confirmación oficial","준비 단계":"Fase de preparación","추가 확인 필요":"Se requiere más información","판단 제한":"Determinación limitada","검토 가능 경로":"Rutas que se pueden revisar","먼저 확인할 항목":"Elementos a confirmar primero","준비하면 좋은 자료":"Materiales conviene preparar","주의할 리스크":"Riesgos a tener en cuenta","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Si responde a ocho preguntas, una a la vez, le organizamos en qué dirección puede revisar qué ruta de naturalización. Esta verificación de preparación no decide si se concede la autorización; es orientación de referencia basada en la información que introduce.","현재 한국에 체류 중인가요?":"¿Se encuentra actualmente en Corea?","예, 한국에 체류 중입니다":"Sí, estoy en Corea","아니요, 해외에 있습니다":"No, estoy en el extranjero","잘 모르겠습니다":"No estoy seguro/a","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"¿Cuál se aproxima más a su estatus de residencia o condición actual?","F-5 영주자격":"F-5 residencia permanente","F-6 결혼이민":"F-6 migrante por matrimonio","F-4 재외동포":"F-4 coreano de ultramar","E계열 취업 체류자격":"Estatus de empleo de la serie E","D계열 유학/연수 체류자격":"Estatus de estudio/formación de la serie D","기타 장기체류":"Otra estancia de larga duración","체류자격을 잘 모르겠습니다":"No estoy seguro/a de mi estatus de residencia","한국에 계속 거주한 기간은 어느 정도인가요?":"¿Cuánto tiempo lleva residiendo de forma continua en Corea?","1년 미만":"Menos de 1 año","1년 이상 2년 미만":"1 año o más, menos de 2","2년 이상 3년 미만":"2 años o más, menos de 3","3년 이상 5년 미만":"3 años o más, menos de 5","5년 이상":"5 años o más","중간에 장기출국 또는 체류 공백이 있었습니다":"Hubo salidas prolongadas o lagunas en la estancia en algún momento","한국 국민 배우자가 있나요?":"¿Tiene cónyuge ciudadano coreano?","예, 혼인관계를 유지하고 있습니다":"Sí, mantengo la relación matrimonial","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Sí, pero hay cambios como divorcio/viudez/separación","아니요":"No","답변하기 어렵습니다":"Prefiero no responder","부모 또는 가족의 한국 국적 이력이 있나요?":"¿Tiene usted, sus padres o algún familiar antecedentes de nacionalidad coreana?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Al menos uno de mis padres es ciudadano coreano o lo fue en el pasado","본인이 과거 한국 국적을 가진 적이 있습니다":"Yo mismo/a tuve la nacionalidad coreana en el pasado","재외동포/F-4 관련 이력이 있습니다":"Tengo antecedentes relacionados con coreanos de ultramar/F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"¿Tiene antecedentes del Programa de Integración Social (KIIP) o de la evaluación integral para naturalización?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"He finalizado el nivel 5 del KIIP y he aprobado la evaluación integral para naturalización","KIIP를 일부 이수했습니다":"He finalizado el KIIP en parte","귀화용 종합평가만 응시/합격했습니다":"Solo me he presentado/he aprobado la evaluación integral para naturalización","아직 없습니다":"Todavía no","추가 확인이 필요한 사유가 있나요?":"¿Hay algún motivo que requiera una confirmación adicional?","장기출국 또는 체류 공백":"Salidas prolongadas o lagunas en la estancia","세금 체납 또는 소득 증빙 어려움":"Impagos de impuestos o dificultad para acreditar ingresos","범죄·수사·행정처분 이력":"Antecedentes penales·de investigación·de sanción administrativa","혼인관계 또는 가족관계 증빙이 복잡함":"La acreditación de la relación matrimonial o familiar es compleja","해당 없음":"No corresponde","지금 가장 필요한 안내는 무엇인가요?":"¿Qué orientación necesita más en este momento?","내가 어떤 귀화 경로를 검토할 수 있는지":"Qué rutas de naturalización puedo revisar","먼저 F-5 또는 체류자격 정리가 필요한지":"Si primero necesito regularizar el F-5 o el estatus de residencia","서류와 증빙 준비":"Preparar documentos y acreditaciones","KIIP/면접 준비":"Preparación de KIIP/entrevista","신청 후 진행상황 확인":"Confirmar el estado de avance tras solicitar","검토 방향 요약":"Resumen de la dirección de revisión","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Estas son las direcciones que conviene examinar según la información que ha introducido. Lo siguiente solo organiza posibilidades; si realmente puede solicitar y la autorización requieren el examen del organismo competente y la confirmación de los criterios oficiales.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Este resultado es orientación de referencia basada en la información que el usuario ha proporcionado, y no es una determinación legal final ni una decisión de autorización.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Si finalmente puede solicitar y si se concede la autorización requieren el examen del organismo competente y la confirmación de los criterios oficiales (normativa de nacionalidad·Ministerio de Justicia·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Primero puede ayudarle regularizar la residencia permanente (F-5) o el estatus de residencia. Confirme el orden adecuado para su situación en el organismo competente.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Si confirma con exactitud su estatus de residencia actual, la revisión será más sencilla. Confírmelo en el carné de extranjería o en HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Puede ser necesario confirmar la finalización del Programa de Integración Social (KIIP) o la evaluación integral para naturalización. Confirme el nivel y el calendario en la red de información de integración social.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Ayuda organizar de antemano las acreditaciones de identidad·relaciones familiares, de residencia·estancia en el país y de sustento económico.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Ayuda organizar de antemano las acreditaciones relativas al matrimonio·relaciones familiares.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Confirme los documentos necesarios para su ruta en la orientación por ámbito de trámite del servicio de trámites en línea del Ministerio de Justicia.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Si tiene antecedentes de coreano de ultramar/F-4, además de la naturalización considere también la recuperación de la nacionalidad·la determinación de la nacionalidad.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Si ya ha solicitado, puede confirmar el estado mediante la «Consulta del estado del examen de nacionalidad».","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Tras la aprobación siguen la confirmación de la notificación en el boletín oficial y los trámites de registro. Consulte «Trámites posteriores a la naturalización».","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Para la preparación de KIIP·entrevista, utilice conjuntamente la sección «KIIP·preparación de la entrevista» y la red de información de integración social.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Las salidas prolongadas·lagunas en la estancia pueden afectar al cálculo del requisito de residencia, por lo que es necesario organizarlas·confirmarlas de antemano.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Las acreditaciones de impuestos·ingresos pueden estar relacionadas con la verificación de la capacidad de sustento, por lo que es necesario revisarlas de antemano.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Los antecedentes penales·de investigación·de sanción administrativa pueden estar relacionados con el examen de conducta, por lo que es importante confirmarlos con antelación.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Si la acreditación del matrimonio·relaciones familiares es compleja, la preparación de los documentos extranjeros puede llevar tiempo.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Solo con la información que ha introducido es difícil acotar suficientemente una dirección. Vuelva a verificar tras confirmar su estatus de residencia·período de residencia·relaciones familiares, o pruebe el modo de consulta de nacionalidad de Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"No necesita conocer primero los términos legales. Una a la vez, si elige lo que más se aproxima a su situación actual, le guiamos hacia las rutas que puede revisar.","무엇을 준비하고 있나요?":"¿Qué está preparando?","한국 국적을 취득하고 싶어요":"Quiero adquirir la nacionalidad coreana","한국 국민 배우자가 있어요":"Tengo cónyuge ciudadano coreano","부모 또는 가족의 한국 국적 이력이 있어요":"Mis padres o algún familiar tienen antecedentes de nacionalidad coreana","재외동포/F-4 관련 경로가 궁금해요":"Me interesa la ruta relativa a coreanos de ultramar/F-4","국적회복을 알아보고 있어요":"Estoy informándome sobre la recuperación de la nacionalidad","이미 신청했고 다음 절차가 궁금해요":"Ya he solicitado y me interesa el siguiente trámite","복수국적 또는 외국국적불행사서약이 궁금해요":"Me interesan la doble nacionalidad o el juramento de no ejercicio de la nacionalidad extranjera","현재 상황에 가장 가까운 것은 무엇인가요?":"¿Cuál se aproxima más a su situación actual?","한국에 오래 거주했거나 장기체류 중입니다":"He residido mucho tiempo en Corea o estoy en estancia de larga duración","F-5 영주자격을 가지고 있습니다":"Tengo la residencia permanente F-5","F-5는 아직 없습니다":"Todavía no tengo el F-5","혼인관계를 유지하고 있습니다":"Mantengo la relación matrimonial","이혼/사별/실종/별거 등 변동이 있습니다":"Hay cambios como divorcio/viudez/desaparición/separación","미성년 자녀를 양육 중입니다":"Estoy criando a un hijo menor de edad","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Al menos uno de mis padres es ciudadano coreano o lo fue en el pasado","입양 또는 출생 관련 이력이 있습니다":"Hay antecedentes relacionados con adopción o nacimiento","F-4 체류자격을 가지고 있습니다":"Tengo el estatus de residencia F-4","F-4 신청을 준비 중입니다":"Estoy preparando una solicitud de F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"No sé qué me corresponde, si la recuperación de la nacionalidad o la naturalización","외국국적을 취득하면서 한국 국적을 상실했습니다":"Perdí la nacionalidad coreana al adquirir una nacionalidad extranjera","과거 국적이탈/포기를 한 적이 있습니다":"En el pasado renuncié/abandoné la nacionalidad","상실 경위가 분명하지 않습니다":"Las circunstancias de la pérdida no están claras","접수 후 대기 중입니다":"Solicitud recibida y en espera","종합평가/면접 안내를 받았습니다":"He recibido el aviso de la evaluación integral/entrevista","보완서류 요청을 받았습니다":"He recibido una solicitud de documentos complementarios","허가 통보 이후 절차가 궁금합니다":"Me interesa el trámite posterior a la notificación de la autorización","출생 등으로 복수국적이 된 경우입니다":"Es el caso de quien adquirió la doble nacionalidad por nacimiento, etc.","귀화 후 외국국적불행사서약이 궁금합니다":"Me interesa el juramento de no ejercicio de la nacionalidad extranjera posterior a la naturalización","국적선택 기간/의무가 궁금합니다":"Me interesan el plazo/la obligación de elección de nacionalidad","위 상황과 정확히 맞지 않습니다":"No se ajusta exactamente a las situaciones anteriores","현재 가장 막히는 부분은 무엇인가요?":"¿Cuál es ahora mismo el mayor obstáculo?","요건을 모르겠습니다":"No conozco los requisitos","서류를 모르겠습니다":"No conozco los documentos","방문예약/접수 절차가 어렵습니다":"El trámite de reserva de visita/recepción me resulta difícil","KIIP/종합평가/면접이 어렵습니다":"El KIIP/la evaluación integral/la entrevista me resultan difíciles","진행상황 확인이 어렵습니다":"Confirmar el estado de avance me resulta difícil","귀화 후 절차가 어렵습니다":"Los trámites posteriores a la naturalización me resultan difíciles","검토할 수 있는 경로":"Rutas que puede revisar","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Estas son las rutas próximas a la situación que ha seleccionado. Los requisitos detallados de cada ruta y si le corresponden requieren confirmación en fuentes oficiales, y son una dirección de revisión, no una única respuesta final.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"La orientación sobre rutas es material de referencia que ayuda a clasificar la situación, y no garantiza el cumplimiento de los requisitos ni la autorización.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Confirme los requisitos para su ruta en la normativa de nacionalidad y en la orientación de nacionalidad/naturalización de HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Confirme los documentos necesarios en la orientación por ámbito de trámite del servicio de trámites en línea del Ministerio de Justicia.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"La reserva de visita·recepción gestiónela en la reserva de visita de HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Para KIIP·evaluación integral·entrevista, confirme el calendario·la preparación en la red de información de integración social y la página de evaluación.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"El estado tras la solicitud confírmelo mediante la «Consulta del estado del examen de nacionalidad».","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Para los trámites posteriores a la aprobación, consulte la sección «Trámites posteriores a la naturalización» y la confirmación de la notificación en el boletín oficial.","다음 행동":"Siguiente acción","막히는 부분에 대한 안내":"Orientación sobre su obstáculo","법무부·출입국":"Ministerio de Justicia·Inmigración","공식 확인·민원 창구":"Ventanillas oficiales de confirmación·trámites","사회통합·평가":"Integración social·evaluación","법령·관보":"Normativa·boletín oficial"},"ar":{"Paradiso로 돌아가기":"العودة إلى Paradiso","테마 전환":"تبديل السمة","밝기 전환":"تبديل السطوع","닫기":"إغلاق","열기":"فتح","다음":"التالي","이전":"السابق","처음부터":"البدء من جديد","결과 보기":"عرض النتيجة","자세히 보기":"عرض التفاصيل","이런 분께":"لمن هذا مناسب","먼저 확인하세요":"تحقّق من هذا أولاً","확인할 항목":"بنود يجب التحقّق منها","준비 자료(범주)":"الأدلة المطلوب تجهيزها (حسب الفئة)","다음 단계":"الخطوات التالية","공식 출처":"المصادر الرسمية","공식 출처로 확인":"التحقّق عبر المصادر الرسمية","공식 사이트에서 최신 내용 확인":"تحقّق من أحدث المعلومات على الموقع الرسمي","적용 범위":"نطاق التطبيق","확인일":"تاريخ الاطّلاع","자료일":"تاريخ المصدر","수정일":"تاريخ التحديث","시행일":"تاريخ السريان","향후 시행 — 현재 기준 아님":"يسري مستقبلاً — ليس القانون الحالي","법령":"القانون / التشريع","중앙정부 안내":"بوّابة الحكومة المركزية","공식 서비스":"خدمة رسمية","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"مرجع حكومي","공식 사이트":"الموقع الرسمي","경로":"المسار","내 절차 찾기 (Waymaker)":"البحث عن إجراءاتي (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"تعذّر تحميل المحتوى. يُرجى المحاولة مرة أخرى بعد قليل أو العودة عبر الصفحة الرئيسية لـ Paradiso.","시작하기":"البدء","KIIP·평가":"KIIP والتقييم","허가 후":"بعد الموافقة","국적업무":"مركز شؤون الجنسية","Paradiso 국적·귀화 플랫폼":"منصّة Paradiso للجنسية والتجنّس","나에게 맞는 국적·귀화 경로를 찾으세요":"اعثر على مسار الجنسية والتجنّس المناسب لك","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"نقدّم لك إرشاداً خطوة بخطوة بشأن التجنّس واستعادة الجنسية وتحديد الجنسية وتعدّد الجنسيات وبرنامج الاندماج الاجتماعي والمقابلة وإجراءات ما بعد التجنّس.","2분 준비 점검 시작":"ابدأ فحص الجاهزية الذي يستغرق دقيقتين","상황별 경로 찾기":"اعثر على مسار يناسب وضعك","약 2분":"دقيقتان تقريباً","로그인 불필요":"لا حاجة إلى تسجيل الدخول","공식 출처 연결":"مرتبط بالمصادر الرسمية","지금 필요한 것부터":"ابدأ بما تحتاجه الآن","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"يمكنك البدء من وضعك الحالي حتى دون معرفة المصطلحات القانونية.","귀화 준비 항목 빠르게 점검":"افحص بنود تجهيز التجنّس بسرعة","내 상황을 단계별로 분류":"صنّف وضعك خطوة بخطوة","공식 근거와 확인 창구 보기":"اطّلع على الأسس الرسمية وجهات التحقّق","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"قد تختلف شؤون الجنسية تبعاً للظروف الشخصية وأحدث القوانين والتوجيهات. تقدّم Paradiso إرشاداً مبنياً على مصادر رسمية، أمّا القرار النهائي فيتطلّب التحقّق من الجهة المختصّة.","무엇을 도와드릴까요?":"بماذا يمكننا مساعدتك؟","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"اختر البطاقة المناسبة لوضعك للبدء. كل أداة تنظّم اتجاه المرا
