ung maaaring may epekto sa mga anak o relasyong pampamilya.","해당 가능성을 관할기관에서 확인하세요.":"Tingnan sa may kapangyarihang ahensiya kung may ganitong posibilidad.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Ang checklist na ito ay panggabay lamang at hindi kumpletong listahang pantay na umaaplay sa lahat. Maaaring magkaiba ang proseso bawat ahensiya, kaya kailangan ng panghuling kumpirmasyon.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Inayos sa iisang lugar ang mga pangunahing usapin kaugnay ng nasyonalidad. Kapag pinindot mo ang bawat aytem, makikita mo ang maikling paliwanag, ang mga bagay na unang tingnan, at ang mga opisyal na pinagmumulan. Ang mga detalyadong kahingian ay kailangang tingnan sa mga opisyal na pinagmumulan.","일반귀화":"Pangkalahatang naturalisasyon","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Pangunahing naturalisasyon na sinusuri ng mga dayuhang naninirahan nang lampas sa itinakdang panahon nang walang espesyal na dahilan.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Mga matagal nang naninirahan at may matatag na batayan ng paninirahan","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"Ang kahingian sa panahon ng paninirahan, ang batayan ng paninirahan gaya ng permanenteng paninirahan (F-5), at ang katayuan ng pagkumpleto sa KIIP/ebalwasyon","간이귀화":"Pinasimpleng naturalisasyon","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Naturalisasyon na sinusuri kapag may tiyak na dahilan gaya ng kasal o relasyong pampamilya.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Mga may asawang Koreanong mamamayan o may kasaysayan ng nasyonalidad sa pamilya","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Ang uri ng dahilan na umaaplay sa iyo (kasal·relasyong pampamilya, atbp.) at ang mga kaugnay na kahingian","특별귀화":"Espesyal na naturalisasyon","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Naturalisasyon na sinusuri kapag kinilala ang espesyal na dahilan gaya ng kontribusyon·kakayahan.","특별 인정 사유가 있을 수 있는 분":"Mga maaaring may espesyal na dahilan ng pagkilala","인정 사유 해당 여부와 분야별 공식 기준":"Kung umaaplay ang kinikilalang dahilan at ang mga opisyal na pamantayan ayon sa larangan","기준이 분야·정책에 따라 다릅니다.":"Iba-iba ang pamantayan ayon sa larangan·patakaran.","우수인재 특별귀화":"Espesyal na naturalisasyon para sa mahuhusay na talento","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Uri ng espesyal na naturalisasyon na sinusuri kapag kinilala bilang mahusay na talento sa isang tiyak na larangan.","전문 분야 실적·추천이 있을 수 있는 분":"Mga maaaring may tagumpay·rekomendasyon sa propesyonal na larangan","분야별 인정 기준과 추천·증빙 요건":"Ang pamantayan ng pagkilala ayon sa larangan at ang mga kahingian sa rekomendasyon·patunay","정책에 따라 자주 갱신됩니다.":"Madalas itong na-a-update ayon sa patakaran.","국적회복":"Pagpapanumbalik ng nasyonalidad","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Proseso ng pagpapanumbalik ng nasyonalidad para sa mga dating may Koreanong nasyonalidad na nawala·tumiwalag dito.","과거 한국 국적 보유 이력이 있는 분":"Mga may kasaysayan ng paghawak ng Koreanong nasyonalidad noon","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Ang pangyayari ng paghawak·pagkawala ng nasyonalidad noon, ang mga dahilan ng diskwalipikasyon, at ang epekto sa dalawahang nasyonalidad","국적판정":"Pagtukoy ng nasyonalidad","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Proseso ng pagpapatukoy nito kapag hindi malinaw kung may hawak na Koreanong nasyonalidad.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Mga taong hindi malinaw ang paghawak ng nasyonalidad dahil sa masalimuot na kasaysayan ng kapanganakan·relasyong pampamilya","출생·가족관계 기록과 국적 변동 이력":"Mga talaan ng kapanganakan·relasyong pampamilya at ang kasaysayan ng pagbabago ng nasyonalidad","국적취득":"Pagkamit ng nasyonalidad","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Sumasaklaw sa pagkamit ng nasyonalidad sa pamamagitan ng tiyak na dahilan gaya ng kasal·pagkilala.","출생 외 사유로 국적 취득을 검토하는 분":"Mga taong sumusuri sa pagkamit ng nasyonalidad sa dahilang iba sa kapanganakan","본인 사유에 맞는 취득 유형과 절차":"Ang uri at proseso ng pagkamit na bagay sa iyong dahilan","국적선택":"Pagpili ng nasyonalidad","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Proseso kung paano pipili ng isang nasyonalidad ang isang may maraming nasyonalidad sa loob ng itinakdang panahon.","복수국적이며 선택 시기가 다가오는 분":"Mga may dalawahang nasyonalidad na palapit na ang panahon ng pagpili","본인의 국적선택 기간과 방법, 관련 의무":"Ang iyong panahon ng pagpili ng nasyonalidad, ang paraan, at ang mga kaugnay na obligasyon","기간 경과 시 불이익이 있을 수 있습니다.":"Maaaring may di-kasiya-siyang epekto kapag lumampas sa panahon.","국적상실":"Pagkawala ng nasyonalidad","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Mga dapat tingnan para sa mga kaso kung saan nawawala ang Koreanong nasyonalidad sa tiyak na dahilan.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Mga nagtataka tungkol sa pagkawala, hal. dahil sa pagkamit ng banyagang nasyonalidad","상실 사유 해당 여부와 신고·후속 절차":"Kung umaaplay ang dahilan ng pagkawala at ang mga hakbang sa pag-uulat·kasunod","국적이탈":"Pagtiwalag ng nasyonalidad","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Mga dapat tingnan sa proseso ng pagtiwalag (pagbitaw) ng Koreanong nasyonalidad ng isang may dalawahang nasyonalidad.","외국에서 거주하며 국적이탈을 검토하는 분":"Mga naninirahan sa ibang bansa na sumusuri ng pagtiwalag","이탈 가능 기간·요건과 병역 등 관련 의무":"Ang panahon·kahingian ng pagtiwalag at ang mga kaugnay na obligasyon gaya ng serbisyong militar","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Maaaring masalimuot dahil nakakabit ito sa panahon·serbisyong militar atbp.","국적보유":"Pagpapanatili ng nasyonalidad","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Mga dapat tingnan gaya ng deklarasyon ng pagpapanatili upang panatilihin ang Koreanong nasyonalidad sa tiyak na mga kaso.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Mga naging may dalawahang nasyonalidad (hal. sa kapanganakan) na nais magpanatili nito","보유 신고 대상·기간 여부":"Kung sakop ng deklarasyon ng pagpapanatili at ang panahon nito","복수국적":"Dalawahang nasyonalidad","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Sumasaklaw sa mga kaso kung saan pinapayagan·nililimitahan ang dalawahang nasyonalidad at ang mga kaugnay na dapat tingnan.","복수국적 유지 가능 여부가 궁금한 분":"Mga nagtataka kung maaari nilang panatilihin ang dalawahang nasyonalidad","본인 유형의 허용·제한 여부와 관련 의무":"Kung pinapayagan·nililimitahan ang iyong uri at ang mga kaugnay na obligasyon","외국국적불행사서약":"Panunumpang hindi gagamitin ang banyagang nasyonalidad","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Mga dapat tingnan sa sistema ng panunumpang hindi gagamitin sa Korea ang sariling banyagang nasyonalidad.","귀화·국적회복 후 서약 적용이 궁금한 분":"Mga nagtataka kung umaaplay ang panunumpa pagkatapos ng naturalisasyon·pagpapanumbalik ng nasyonalidad","서약 적용 대상 여부와 절차·기한":"Kung sakop ng panunumpa at ang proseso·takdang panahon nito","귀화적격심사":"Pagsusuri ng kaangkupan sa naturalisasyon","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Gabay tungkol sa yugto ng pagsusuri na tumitingin sa mga kahingian·asal pagkatapos ng aplikasyon sa naturalisasyon.","귀화 신청을 준비하거나 심사를 앞둔 분":"Mga naghahanda mag-aplay ng naturalisasyon o malapit nang masuri","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Ang mga aytem na maaaring tingnan sa pagsusuri at ang iyong kahandaan","국적 심사 진행상황 조회":"Pagtingin sa progreso ng pagsusuri sa nasyonalidad","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Gabay sa serbisyong nagpapatingin online ng katayuan ng progreso pagkatapos mag-aplay.","이미 신청하고 결과를 기다리는 분":"Mga nakapag-aplay na at naghihintay ng resulta","조회에 필요한 정보와 접속 경로":"Ang impormasyong kailangan sa pagtingin at ang landas ng pag-akses","귀화허가 등 처분은 관보 고시로 확인합니다.":"Ang mga desisyon gaya ng pag-apruba ng naturalisasyon ay kinukumpirma sa pamamagitan ng abiso sa opisyal na gazette.","허가 여부·시점을 확인하려는 분":"Mga nais kumpirmahin kung naaprubahan at kung kailan","전자관보 국적·귀화 테마에서 본인 관련 고시":"Ang abisong may kaugnayan sa iyo sa temang nasyonalidad·naturalisasyon ng e-gazette","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Ang mga detalyadong kahingian·dokumento·proseso ng bawat aytem ay paunti-unting palalakasin pagkatapos tingnan ang mga opisyal na pinagmumulan.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Ang Waymaker ay isang tagagabay sa proseso na nag-aayos, batay sa mga opisyal na pinagmumulan, ng iyong proseso, mga dokumento, reserbasyon, at susunod na aksiyon. Ang AI ay gumaganap lamang ng papel na pantulong sa pagpapaliwanag ng nagawang gabay, at hindi gumagawa ng bagong dokumento·bayarin·takdang panahon. Para sa panghuling kumpirmasyon, magtungo sa HiKorea·1345·nasasakupang ahensiya ng imigrasyon.","국적민원·귀화면접 준비":"Serbisyo ng nasyonalidad·paghahanda sa panayam sa naturalisasyon","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Tingnan sa iisang lugar ang naturalisasyon, pagpapanumbalik ng nasyonalidad, pagkawala·pagtiwalag ng nasyonalidad, dalawahang nasyonalidad, ang panunumpa ng mamamayan, hanggang sa paghahanda sa panayam sa naturalisasyon. Maaari mong suriin ang daloy na malapit sa iyong sitwasyon batay sa mga opisyal na batas at gabay.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Mga card ng inaasahang tanong · pagsasanay sa mock na panayam · mga sangguniang video · Waymaker coach","준비 시작하기":"Simulan ang paghahanda","꼭 확인하세요":"Pakatandaan","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"Ang resulta ng pagkamit ng nasyonalidad·naturalisasyon ay nakadepende sa tiyak na mga katotohanan ng bawat tao at sa pagsusuri ng may kapangyarihang ahensiya. Ang gabay ng Paradiso ay sangguniang materyales na tumutulong mag-ayos ng direksiyon; hindi nito tinitiyak ang panghuling karapatan·pag-apruba, at hindi rin pumapalit sa legal na payo.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Inayos ang mga opisyal na pinagmumulan kaugnay ng nasyonalidad·KIIP ayon sa uri at saklaw ng pag-aaply. Ang mga link at pampublikong metadata ay tiningnan noong 2026-06-28; muling tingnan ang pinakabagong abiso ng bawat opisyal na pahina bago mag-aplay.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Ang Paradiso ay walang kaugnayan o pagkasapi sa Ministry of Justice·HiKorea·Socinet·Korea Visa Portal·mga misyon sa ibang bansa. Ang mga link na ito ay mga koneksiyon upang tingnan ang pinakabagong gabay mula sa nasasakupang opisyal na ahensiya.","Paradiso 메인으로 돌아가기":"Bumalik sa pangunahing pahina ng Paradiso","검토 가능":"Maaaring suriin","공식 확인 필요":"Kailangan ng opisyal na pagtingin","준비 단계":"Yugto ng paghahanda","추가 확인 필요":"Kailangan ng karagdagang impormasyon","판단 제한":"Limitado ang pagtaya","검토 가능 경로":"Mga landas na maaaring suriin","먼저 확인할 항목":"Mga aytem na unang tingnan","준비하면 좋은 자료":"Mga materyales na mabuting ihanda","주의할 리스크":"Mga panganib na dapat bantayan","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Kapag sinagot mo ang walong tanong nang tig-iisa, aayusin namin ang direksiyon kung aling landas ng naturalisasyon ang maaari mong suriin. Ang pagsusuri ng kahandaang ito ay hindi nagpapasya kung aaprubahan o hindi, at ito ay sangguniang gabay batay sa impormasyong iyong inilagay.","현재 한국에 체류 중인가요?":"Kasalukuyan ka bang naninirahan sa Korea?","예, 한국에 체류 중입니다":"Oo, naninirahan ako sa Korea","아니요, 해외에 있습니다":"Hindi, nasa ibang bansa ako","잘 모르겠습니다":"Hindi ako sigurado","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Alin ang pinakamalapit sa iyong kasalukuyang status ng paninirahan o katayuan?","F-5 영주자격":"F-5 permanenteng paninirahan","F-6 결혼이민":"F-6 marriage migrant","F-4 재외동포":"F-4 overseas Korean","E계열 취업 체류자격":"E-series na status ng paninirahan para sa trabaho","D계열 유학/연수 체류자격":"D-series na status ng paninirahan para sa pag-aaral/pagsasanay","기타 장기체류":"Iba pang pangmatagalang paninirahan","체류자격을 잘 모르겠습니다":"Hindi ako sigurado sa aking status ng paninirahan","한국에 계속 거주한 기간은 어느 정도인가요?":"Gaano katagal ka nang tuluy-tuloy na naninirahan sa Korea?","1년 미만":"Wala pang 1 taon","1년 이상 2년 미만":"1 taon pataas ngunit wala pang 2 taon","2년 이상 3년 미만":"2 taon pataas ngunit wala pang 3 taon","3년 이상 5년 미만":"3 taon pataas ngunit wala pang 5 taon","5년 이상":"5 taon pataas","중간에 장기출국 또는 체류 공백이 있었습니다":"May mahabang pag-alis sa bansa o puwang sa paninirahan sa pagitan","한국 국민 배우자가 있나요?":"May asawa ka bang Koreanong mamamayan?","예, 혼인관계를 유지하고 있습니다":"Oo, napananatili ang relasyon ng kasal","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Oo, ngunit may mga pagbabago tulad ng diborsyo/pagkamatay ng asawa/paghihiwalay","아니요":"Hindi","답변하기 어렵습니다":"Mahirap sagutin","부모 또는 가족의 한국 국적 이력이 있나요?":"May kasaysayan ba ng Koreanong nasyonalidad ang iyong magulang o pamilya?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Isa o higit pa sa aking mga magulang ay Koreanong mamamayan o dating Koreanong mamamayan","본인이 과거 한국 국적을 가진 적이 있습니다":"Ako mismo ay may hawak ng Koreanong nasyonalidad noon","재외동포/F-4 관련 이력이 있습니다":"May kasaysayan akong kaugnay ng overseas Korean/F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"May kasaysayan ka ba ng programa ng panlipunang integrasyon (KIIP) o komprehensibong ebalwasyon para sa naturalisasyon?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"Nakumpleto ang KIIP antas 5 at nakapasa sa komprehensibong ebalwasyon para sa naturalisasyon","KIIP를 일부 이수했습니다":"Bahagyang nakumpleto ko ang KIIP","귀화용 종합평가만 응시/합격했습니다":"Kumuha/nakapasa lamang ako sa komprehensibong ebalwasyon para sa naturalisasyon","아직 없습니다":"Wala pa","추가 확인이 필요한 사유가 있나요?":"May mga dahilan ba na nangangailangan ng karagdagang pagtingin?","장기출국 또는 체류 공백":"Mahabang pag-alis sa bansa o puwang sa paninirahan","세금 체납 또는 소득 증빙 어려움":"Hindi nabayarang buwis o hirap sa pagpapatunay ng kita","범죄·수사·행정처분 이력":"Kasaysayan ng krimen·imbestigasyon·administratibong parusa","혼인관계 또는 가족관계 증빙이 복잡함":"Masalimuot ang patunay ng relasyon ng kasal o relasyong pampamilya","해당 없음":"Walang umaaplay","지금 가장 필요한 안내는 무엇인가요?":"Anong gabay ang pinakakailangan mo ngayon?","내가 어떤 귀화 경로를 검토할 수 있는지":"Kung aling landas ng naturalisasyon ang maaari kong suriin","먼저 F-5 또는 체류자격 정리가 필요한지":"Kung kailangan ko munang ayusin ang F-5 o status ng paninirahan","서류와 증빙 준비":"Paghahanda ng mga dokumento at patunay","KIIP/면접 준비":"Paghahanda sa KIIP/panayam","신청 후 진행상황 확인":"Pagtingin sa progreso pagkatapos mag-aplay","검토 방향 요약":"Buod ng direksiyon ng pagsusuri","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Ito ang mga direksiyong sulit tingnan batay sa impormasyong iyong inilagay. Ang nasa ibaba ay pag-aayos lamang ng mga posibilidad; ang aktwal na kakayahang mag-aplay at ang pag-apruba ay nangangailangan ng pagsusuri ng may kapangyarihang ahensiya at pagtingin sa mga opisyal na pamantayan.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Ang resultang ito ay sangguniang gabay na nakabatay sa impormasyong ibinigay ng gumagamit, at hindi ito panghuling legal na pagpapasiya o desisyon ng pag-apruba.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Ang panghuling kakayahang mag-aplay at kung aaprubahan ay parehong nangangailangan ng pagsusuri ng may kapangyarihang ahensiya at pagtingin sa mga opisyal na pamantayan (Batas ng Nasyonalidad·Ministry of Justice·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Maaaring makatulong na ayusin muna ang permanenteng paninirahan (F-5) o status ng paninirahan. Tingnan sa may kapangyarihang ahensiya ang tamang pagkakasunod-sunod para sa iyong sitwasyon.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Kapag tumpak mong natiyak ang iyong kasalukuyang status ng paninirahan, magiging mas madali ang pagsusuri. Tingnan ito sa alien registration card (ARC) o sa HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Maaaring kailangan tingnan ang pagkumpleto sa programa ng panlipunang integrasyon (KIIP) o ang komprehensibong ebalwasyon para sa naturalisasyon. Tingnan ang antas at iskedyul sa Social Integration Information Network.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Nakakatulong na maagang ayusin ang mga patunay kaugnay ng pagkakakilanlan·relasyong pampamilya, paninirahan·pananatili sa loob ng bansa, at kabuhayan.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Nakakatulong na ayusin ang mga patunay kaugnay ng kasal·relasyong pampamilya.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Tingnan ang mga kinakailangang dokumento para sa iyong landas sa gabay na 'ayon sa larangan' ng online na petisyon ng Ministry of Justice.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Kung may kasaysayan kang overseas Korean/F-4, bukod sa naturalisasyon ay isaalang-alang din ang pagpapanumbalik ng nasyonalidad·pagtukoy ng nasyonalidad.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Kung nakapag-aplay ka na, maaari mong tingnan ang katayuan sa pamamagitan ng 'Pagtingin sa progreso ng pagsusuri sa nasyonalidad'.","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Pagkatapos ng pag-apruba, susunod ang pagtingin sa abiso sa opisyal na gazette at ang mga hakbang sa pagpaparehistro. Tingnan ang 'Mga Hakbang Pagkatapos ng Pag-apruba'.","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Para sa paghahanda sa KIIP·panayam, gamitin nang magkasama ang seksiyong 'Paghahanda sa KIIP·Panayam' at ang Social Integration Information Network.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Ang mahabang pag-alis sa bansa·puwang sa paninirahan ay maaaring makaapekto sa pagkukwenta ng kahingian sa paninirahan, kaya kailangang maagang ayusin·tingnan.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Ang patunay ng buwis·kita ay maaaring may kaugnayan sa pagtingin sa kakayahang itaguyod ang sarili, kaya kailangang maagang suriin.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Ang kasaysayan ng krimen·imbestigasyon·administratibong parusa ay maaaring nakakabit sa pagsusuri kaugnay ng asal, kaya mahalaga ang maagang pagtingin.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Kung masalimuot ang patunay ng kasal·relasyong pampamilya, maaaring matagal ang paghahanda ng mga dokumento mula sa ibang bansa.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Sa impormasyon mo lamang na inilagay ay mahirap sapat na paliitin ang direksiyon. Pagkatapos mong tingnan ang status ng paninirahan·panahon ng paninirahan·relasyong pampamilya, muling suriin, o subukan ang mode ng konsultasyon sa nasyonalidad ng Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Hindi mo kailangang malaman muna ang mga legal na termino. Tig-iisa sa bawat pagkakataon — kapag pinili mo ang pinakamalapit sa iyong kasalukuyang sitwasyon, gagabayan ka namin sa mga landas na maaaring suriin.","무엇을 준비하고 있나요?":"Ano ang inihahanda mo?","한국 국적을 취득하고 싶어요":"Gusto kong maging Koreanong mamamayan","한국 국민 배우자가 있어요":"May asawa akong Koreanong mamamayan","부모 또는 가족의 한국 국적 이력이 있어요":"May kasaysayan ng Koreanong nasyonalidad ang aking magulang o pamilya","재외동포/F-4 관련 경로가 궁금해요":"Gusto kong malaman ang landas kaugnay ng overseas Korean/F-4","국적회복을 알아보고 있어요":"Inaalam ko ang tungkol sa pagpapanumbalik ng nasyonalidad","이미 신청했고 다음 절차가 궁금해요":"Nakapag-aplay na ako at gusto kong malaman ang susunod na proseso","복수국적 또는 외국국적불행사서약이 궁금해요":"Gusto kong malaman ang tungkol sa dalawahang nasyonalidad o sa panunumpang hindi gagamitin ang banyagang nasyonalidad","현재 상황에 가장 가까운 것은 무엇인가요?":"Alin ang pinakamalapit sa iyong kasalukuyang sitwasyon?","한국에 오래 거주했거나 장기체류 중입니다":"Matagal na akong naninirahan sa Korea o nasa pangmatagalang paninirahan","F-5 영주자격을 가지고 있습니다":"May hawak akong F-5 permanenteng paninirahan","F-5는 아직 없습니다":"Wala pa akong F-5","혼인관계를 유지하고 있습니다":"Napananatili ko ang relasyon ng kasal","이혼/사별/실종/별거 등 변동이 있습니다":"May mga pagbabago tulad ng diborsyo/pagkamatay ng asawa/pagkawala/paghihiwalay","미성년 자녀를 양육 중입니다":"Nag-aalaga ako ng menor de edad na anak","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Isa o higit pa sa aking mga magulang ay Koreanong mamamayan o dating Koreanong mamamayan","입양 또는 출생 관련 이력이 있습니다":"May kasaysayang kaugnay ng pag-aampon o kapanganakan","F-4 체류자격을 가지고 있습니다":"May hawak akong F-4 status","F-4 신청을 준비 중입니다":"Naghahanda ako ng aplikasyon sa F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Hindi ko sigurado kung pagpapanumbalik ng nasyonalidad o naturalisasyon ang bagay sa akin","외국국적을 취득하면서 한국 국적을 상실했습니다":"Nawala ko ang Koreanong nasyonalidad nang makamit ko ang isang banyaga","과거 국적이탈/포기를 한 적이 있습니다":"May pagkakataon noon na tumiwalag/bumitaw ako ng nasyonalidad","상실 경위가 분명하지 않습니다":"Hindi malinaw ang pangyayari ng pagkawala","접수 후 대기 중입니다":"Naisumite na at naghihintay","종합평가/면접 안내를 받았습니다":"Nakatanggap ako ng abiso sa komprehensibong ebalwasyon/panayam","보완서류 요청을 받았습니다":"Nakatanggap ako ng kahilingan para sa karagdagang dokumento","허가 통보 이후 절차가 궁금합니다":"Gusto kong malaman ang proseso pagkatapos ng abiso ng pag-apruba","출생 등으로 복수국적이 된 경우입니다":"Kaso ito ng pagiging may dalawahang nasyonalidad dahil sa kapanganakan atbp.","귀화 후 외국국적불행사서약이 궁금합니다":"Gusto kong malaman ang tungkol sa panunumpang hindi gagamitin ang banyagang nasyonalidad pagkatapos ng naturalisasyon","국적선택 기간/의무가 궁금합니다":"Gusto kong malaman ang tungkol sa panahon/obligasyon ng pagpili ng nasyonalidad","위 상황과 정확히 맞지 않습니다":"Hindi eksaktong tumutugma sa mga sitwasyon sa itaas","현재 가장 막히는 부분은 무엇인가요?":"Ano ang pinakanakahaharang sa iyo ngayon?","요건을 모르겠습니다":"Hindi ko alam ang mga kahingian","서류를 모르겠습니다":"Hindi ko alam ang mga dokumento","방문예약/접수 절차가 어렵습니다":"Mahirap ang proseso ng reserbasyon ng pagbisita/pagsusumite","KIIP/종합평가/면접이 어렵습니다":"Mahirap ang KIIP/komprehensibong ebalwasyon/panayam","진행상황 확인이 어렵습니다":"Mahirap tingnan ang progreso","귀화 후 절차가 어렵습니다":"Mahirap ang mga hakbang pagkatapos ng pag-apruba","검토할 수 있는 경로":"Mga landas na maaari mong suriin","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Ang mga landas na ito ay malapit sa sitwasyong iyong pinili. Ang mga detalye ng bawat landas at kung umaaplay ito ay nangangailangan ng pagtingin sa mga opisyal na pinagmumulan, at ang mga ito ay direksiyon ng pagsusuri, hindi iisang panghuling sagot.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"Ang gabay sa landas ay sangguniang materyales na tumutulong sa pag-uri ng sitwasyon, at hindi nagagarantiya ng pagtugon sa mga kahingian o ng pag-apruba.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Tingnan ang mga kahingian para sa iyong landas sa Batas ng Nasyonalidad at sa gabay sa nasyonalidad/naturalisasyon ng HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Tingnan ang mga kinakailangang dokumento sa gabay na 'ayon sa larangan' ng online na petisyon ng Ministry of Justice.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Ang reserbasyon ng pagbisita·pagsusumite ay isagawa sa reserbasyon ng pagbisita ng HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Tingnan ang iskedyul·paghahanda para sa KIIP·komprehensibong ebalwasyon·panayam sa Social Integration Information Network at sa website ng ebalwasyon.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Ang katayuan pagkatapos mag-aplay ay tingnan sa pamamagitan ng 'Pagtingin sa progreso ng pagsusuri sa nasyonalidad'.","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Para sa proseso pagkatapos ng pag-apruba, tingnan ang seksiyong 'Mga Hakbang Pagkatapos ng Pag-apruba' at ang pagtingin sa abiso sa opisyal na gazette.","다음 행동":"Susunod na aksiyon","막히는 부분에 대한 안내":"Gabay para sa nakahaharang sa iyo","법무부·출입국":"Ministry of Justice·Imigrasyon","공식 확인·민원 창구":"Mga opisyal na puntong panukatan·serbisyo","사회통합·평가":"Panlipunang Integrasyon·Ebalwasyon","법령·관보":"Batas·Opisyal na Gazette"},"id":{"Paradiso로 돌아가기":"Kembali ke Paradiso","테마 전환":"Ganti tema","밝기 전환":"Ganti kecerahan","닫기":"Tutup","열기":"Buka","다음":"Berikutnya","이전":"Sebelumnya","처음부터":"Mulai dari awal","결과 보기":"Lihat hasil","자세히 보기":"Lihat detail","이런 분께":"Untuk Anda yang","먼저 확인하세요":"Periksa ini terlebih dahulu","확인할 항목":"Hal yang perlu diperiksa","준비 자료(범주)":"Bukti yang perlu disiapkan (per kategori)","다음 단계":"Langkah berikutnya","공식 출처":"Sumber resmi","공식 출처로 확인":"Periksa melalui sumber resmi","공식 사이트에서 최신 내용 확인":"Periksa informasi terbaru di situs resmi","적용 범위":"Cakupan penerapan","확인일":"Tanggal diakses","자료일":"Tanggal sumber","수정일":"Tanggal diperbarui","시행일":"Tanggal berlaku","향후 시행 — 현재 기준 아님":"Berlaku di masa mendatang — bukan ketentuan yang berlaku saat ini","법령":"Peraturan perundang-undangan","중앙정부 안내":"Portal pemerintah pusat","공식 서비스":"Layanan resmi","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Bahan rujukan pemerintah","공식 사이트":"Situs resmi","경로":"Jalur","내 절차 찾기 (Waymaker)":"Temukan prosedur saya (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Konten tidak dapat dimuat. Silakan coba lagi sebentar lagi atau akses melalui halaman utama Paradiso.","시작하기":"Mulai","KIIP·평가":"KIIP·evaluasi","허가 후":"Setelah persetujuan","국적업무":"Pusat urusan kewarganegaraan","Paradiso 국적·귀화 플랫폼":"Platform kewarganegaraan·naturalisasi Paradiso","나에게 맞는 국적·귀화 경로를 찾으세요":"Temukan jalur kewarganegaraan·naturalisasi yang sesuai untuk Anda","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Kami memandu Anda langkah demi langkah mulai dari naturalisasi, pemulihan kewarganegaraan, penetapan kewarganegaraan, kewarganegaraan ganda, Program Integrasi Sosial, wawancara, hingga prosedur setelah naturalisasi.","2분 준비 점검 시작":"Mulai pemeriksaan kesiapan 2 menit","상황별 경로 찾기":"Temukan jalur berdasarkan situasi","약 2분":"Sekitar 2 menit","로그인 불필요":"Tanpa perlu login","공식 출처 연결":"Terhubung ke sumber resmi","지금 필요한 것부터":"Mulai dari yang Anda butuhkan sekarang","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Anda dapat memulai dari situasi Anda saat ini, tanpa perlu memahami istilah hukum.","귀화 준비 항목 빠르게 점검":"Periksa cepat item persiapan naturalisasi","내 상황을 단계별로 분류":"Klasifikasikan situasi saya langkah demi langkah","공식 근거와 확인 창구 보기":"Lihat dasar resmi dan loket konfirmasi","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Urusan kewarganegaraan dapat berbeda tergantung keadaan pribadi serta peraturan·pedoman terbaru. Paradiso memberikan panduan yang berlandaskan dasar resmi, dan penentuan akhir memerlukan konfirmasi dari instansi yang berwenang.","무엇을 도와드릴까요?":"Apa yang bisa kami bantu?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Pilih kartu yang sesuai dengan situasi Anda untuk memulai. Setiap alat hanya menyusun arah peninjauan berdasarkan informasi yang Anda masukkan, dan tidak menentukan apakah disetujui atau tidak.","귀화 준비 점검":"Pemeriksaan Kesiapan Naturalisasi","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Kami menyusun item pemeriksaan yang perlu disiapkan seperti izin tinggal, hubungan keluarga, KIIP·evaluasi satu pertanyaan demi pertanyaan, lalu menghubungkannya ke jalur resmi terkait.","준비 점검 시작":"Mulai pemeriksaan persiapan","귀화 경로 찾기":"Temukan Jalur Anda Menuju Kewarganegaraan Korea","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Anda tidak perlu mengetahui istilah hukum terlebih dahulu. Pilih situasi Anda saat ini langkah demi langkah, dan kami akan memandu Anda ke jalur yang dapat ditinjau.","경로 찾기":"Temukan jalur","KIIP·평가 확인":"Panduan KIIP·Evaluasi","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Pahami perbedaan antara pendidikan·evaluasi Program Integrasi Sosial dan prosedur kewarganegaraan, lalu terhubung ke Socinet dan panduan resmi Kementerian Kehakiman.","준비 항목 보기":"Lihat item persiapan","귀화 후 절차":"Prosedur Setelah Naturalisasi","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"Kami menelusuri prosedur administrasi setelah persetujuan dalam bentuk daftar periksa, mulai dari konfirmasi pengumuman lembaran resmi negara, pencatatan hubungan keluarga, pendaftaran penduduk, hingga penyelesaian kewarganegaraan asing.","체크리스트 보기":"Lihat daftar periksa","국적업무 허브":"Pusat Urusan Kewarganegaraan","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Telusuri keseluruhan urusan kewarganegaraan di satu tempat — naturalisasi·pemulihan kewarganegaraan·penetapan kewarganegaraan·pemilihan kewarganegaraan·kewarganegaraan ganda·ikrar untuk tidak menggunakan kewarganegaraan asing, dan lainnya.","허브 열기":"Buka pusat","Waymaker — 내 절차 찾기":"Waymaker — Temukan prosedur saya","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Pilih status izin tinggal dan situasi Anda untuk memeriksa hal-hal yang perlu disiapkan beserta dasar resminya. Bidang kewarganegaraan·naturalisasi juga turut dipandu.","내 절차 찾기":"Temukan prosedur saya","전체 흐름 미리보기":"Pratinjau keseluruhan alur","KIIP·평가 공식 안내":"Panduan Resmi KIIP·Evaluasi","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"Pendidikan·evaluasi Program Integrasi Sosial (KIIP) dan prosedur kewarganegaraan adalah hal yang terpisah. Kursus·evaluasi·wawancara yang berlaku bagi Anda serta jadwal terbarunya harus dikonfirmasi di Socinet atau pada instansi yang berwenang.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP adalah program pendidikan·evaluasi integrasi sosial dari Kementerian Kehakiman. Penyelesaian atau hasil evaluasi dapat dipertimbangkan dalam sebagian prosedur izin tinggal·kewarganegaraan, tetapi hal itu sendiri tidak secara otomatis menjamin kelayakan atau persetujuan.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"Penyelesaian kursus KIIP, evaluasi awal·evaluasi tengah untuk penempatan tahap, serta evaluasi komprehensif untuk izin tinggal tetap·naturalisasi adalah prosedur yang berbeda. Wawancara naturalisasi dan evaluasi komprehensif pun tidak dapat dianggap sebagai prosedur yang sama.","내 KIIP 단계 확인":"Periksa tahap KIIP saya","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Kami merangkum cara memeriksa tahap yang ditempatkan, tahap berikutnya, dan status penyelesaian di Jaringan Informasi Integrasi Sosial.","평가 유형 확인":"Periksa jenis evaluasi","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Periksa pada pengumuman resmi evaluasi mana yang relevan di antara evaluasi awal·evaluasi tengah·evaluasi komprehensif untuk izin tinggal tetap atau naturalisasi.","귀화면접 공식자료 찾기":"Temukan bahan resmi wawancara naturalisasi","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Periksa apakah terdapat bahan resmi dan panduan terbaru terkait pemeriksaan wawancara pada panduan layanan urusan kewarganegaraan Kementerian Kehakiman.","면제·인정 여부 확인":"Periksa apakah ada pengecualian·pengakuan","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Konfirmasikan melalui panduan resmi dan instansi yang berwenang bagaimana penyelesaian·hasil evaluasi KIIP diakui dalam prosedur Anda. Paradiso tidak menentukan pengecualian.","공식 면접자료 확인":"Periksa bahan wawancara resmi","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Utamakan memeriksa bahan terkait wawancara yang dipublikasikan Kementerian Kehakiman dan panduan instansi yang berwenang, alih-alih soal prediksi tidak resmi.","공식 일정 확인":"Periksa jadwal resmi","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Periksa jadwal evaluasi dan pendaftaran langsung di Jaringan Informasi Integrasi Sosial·situs evaluasi. Paradiso tidak mencantumkan jadwal secara sepihak.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Jadwal evaluasi dan kriteria rinci perlu dikonfirmasi melalui sumber resmi seperti Jaringan Informasi Integrasi Sosial.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Ini adalah contoh prosedur administrasi yang dapat ditelusuri setelah persetujuan. Item dan urutannya dapat berbeda tergantung situasi pribadi, dan ini bukan daftar lengkap yang berlaku sama bagi semua orang.","관보 고시 확인":"Konfirmasi pengumuman lembaran resmi negara","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Keputusan terkait naturalisasi·kewarganegaraan dikonfirmasi melalui pengumuman lembaran resmi negara.","전자관보에서 본인 관련 고시를 확인하세요.":"Periksa pengumuman yang berkaitan dengan Anda pada lembaran resmi negara elektronik.","가족관계등록 관련 확인":"Konfirmasi terkait pencatatan hubungan keluarga","가족관계등록 절차가 필요한지 확인합니다.":"Periksa apakah prosedur pencatatan hubungan keluarga diperlukan.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Periksa dokumen dan prosedur yang diperlukan sesuai panduan instansi yang berwenang.","주민등록 관련 확인":"Konfirmasi terkait pendaftaran penduduk","거주지 주민등록 절차를 확인합니다.":"Periksa prosedur pendaftaran penduduk untuk tempat tinggal Anda.","주소지 관할 행정기관에서 절차를 확인하세요.":"Periksa prosedurnya di instansi administrasi yang berwenang atas alamat Anda.","주민등록증 발급":"Penerbitan kartu pendaftaran penduduk","주민등록증 발급 절차를 확인합니다.":"Periksa prosedur penerbitan kartu pendaftaran penduduk.","발급 요건·장소를 관할 기관에서 확인하세요.":"Periksa syarat·tempat penerbitan pada instansi yang berwenang.","외국인등록증 처리":"Pengurusan kartu pendaftaran orang asing","기존 외국인등록증 처리 방법을 확인합니다.":"Periksa cara penanganan kartu pendaftaran orang asing yang lama.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Periksa cara penanganannya di HiKorea·kantor imigrasi yang berwenang.","대한민국 여권 발급":"Penerbitan paspor Republik Korea","대한민국 여권 발급 절차를 확인합니다.":"Periksa prosedur penerbitan paspor Republik Korea.","여권 발급 기관 안내에 따라 준비하세요.":"Persiapkan sesuai panduan instansi penerbit paspor.","은행/통신/보험/학교/직장 정보 변경":"Perubahan informasi bank/telekomunikasi/asuransi/sekolah/tempat kerja","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Cerminkan perubahan tersebut pada instansi yang terkait dengan informasi identitas Anda.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Periksa prosedur perubahan informasi identitas di masing-masing instansi.","외국국적 포기 또는 외국국적불행사서약 확인":"Konfirmasi pelepasan kewarganegaraan asing atau ikrar untuk tidak menggunakan kewarganegaraan asing","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Periksa prosedur mana (pelepasan atau ikrar) yang berlaku bagi Anda.","적용 절차와 기한을 관할기관에서 확인하세요.":"Periksa prosedur yang berlaku dan batas waktunya pada instansi yang berwenang.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Mungkin ada batas waktu, sehingga penting untuk memastikan waktunya.","복수국적 관련 후속 의무 확인":"Konfirmasi kewajiban lanjutan terkait kewarganegaraan ganda","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Periksa kewajiban lanjutan yang menyertai apabila kewarganegaraan ganda tetap dipertahankan.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Periksa kewajiban untuk jenis Anda pada Undang-Undang Kewarganegaraan·instansi yang berwenang.","유형에 따라 의무가 다릅니다.":"Kewajiban berbeda menurut jenisnya.","병역 관련 확인이 필요한 경우":"Apabila perlu konfirmasi terkait wajib militer","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Apabila mungkin berlaku, periksa panduan terkait wajib militer secara terpisah.","해당 여부와 절차를 관할기관에서 확인하세요.":"Periksa apakah berlaku dan prosedurnya pada instansi yang berwenang.","개인 상황에 따라 적용이 다릅니다.":"Penerapannya berbeda tergantung situasi pribadi.","자녀/가족관계 영향 확인이 필요한 경우":"Apabila perlu konfirmasi dampak terhadap anak/hubungan keluarga","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Periksa apakah mungkin ada dampak terhadap anak atau hubungan keluarga.","해당 가능성을 관할기관에서 확인하세요.":"Periksa kemungkinan keberlakuannya pada instansi yang berwenang.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Daftar periksa ini hanya untuk rujukan dan bukan daftar lengkap yang berlaku sama bagi semua orang. Prosedur dapat berbeda antar instansi, sehingga konfirmasi akhir diperlukan.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Kami merangkum urusan utama terkait kewarganegaraan di satu tempat. Dengan menekan setiap item, Anda dapat melihat penjelasan singkat, hal yang perlu diperiksa terlebih dahulu, dan sumber resmi. Syarat rinci perlu dikonfirmasi melalui sumber resmi.","일반귀화":"Naturalisasi umum","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Naturalisasi dasar yang ditinjau oleh orang asing yang telah bertempat tinggal selama periode tertentu atau lebih tanpa alasan khusus.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Mereka yang bertempat tinggal jangka panjang dan memiliki dasar izin tinggal yang stabil","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"Syarat periode tempat tinggal, dasar izin tinggal seperti izin tinggal tetap (F-5), serta status penyelesaian KIIP/evaluasi","간이귀화":"Naturalisasi sederhana","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Naturalisasi yang ditinjau apabila terdapat alasan tertentu seperti perkawinan atau hubungan keluarga.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Mereka yang memiliki pasangan warga negara Korea atau memiliki riwayat kewarganegaraan keluarga","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Jenis alasan yang berlaku bagi Anda (perkawinan·hubungan keluarga, dll.) dan syarat terkait","특별귀화":"Naturalisasi khusus","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Naturalisasi yang ditinjau apabila alasan khusus seperti jasa·kemampuan diakui.","특별 인정 사유가 있을 수 있는 분":"Mereka yang mungkin memiliki alasan pengakuan khusus","인정 사유 해당 여부와 분야별 공식 기준":"Apakah alasan pengakuan berlaku dan kriteria resmi per bidang","기준이 분야·정책에 따라 다릅니다.":"Kriteria berbeda menurut bidang·kebijakan.","우수인재 특별귀화":"Naturalisasi khusus talenta unggul","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Jenis naturalisasi khusus yang ditinjau apabila seseorang diakui sebagai talenta unggul di bidang tertentu.","전문 분야 실적·추천이 있을 수 있는 분":"Mereka yang mungkin memiliki prestasi·rekomendasi di bidang profesional","분야별 인정 기준과 추천·증빙 요건":"Kriteria pengakuan per bidang dan syarat rekomendasi·bukti","정책에 따라 자주 갱신됩니다.":"Sering diperbarui sesuai kebijakan.","국적회복":"Pemulihan kewarganegaraan","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Prosedur pemulihan kewarganegaraan bagi mereka yang sebelumnya memiliki kewarganegaraan Korea lalu kehilangan·melepaskannya.","과거 한국 국적 보유 이력이 있는 분":"Mereka yang sebelumnya pernah memiliki kewarganegaraan Korea","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Latar belakang kepemilikan·kehilangan kewarganegaraan sebelumnya, alasan ketidaklayakan, dan dampak kewarganegaraan ganda","국적판정":"Penetapan kewarganegaraan","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Prosedur untuk mendapatkan penetapan ketika tidak jelas apakah seseorang memiliki kewarganegaraan Korea.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Mereka yang kepemilikan kewarganegaraannya tidak jelas karena riwayat kelahiran·hubungan keluarga yang rumit","출생·가족관계 기록과 국적 변동 이력":"Catatan kelahiran·hubungan keluarga dan riwayat perubahan kewarganegaraan","국적취득":"Perolehan kewarganegaraan","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Mencakup hal-hal memperoleh kewarganegaraan melalui alasan tertentu seperti perkawinan·pengakuan.","출생 외 사유로 국적 취득을 검토하는 분":"Mereka yang meninjau perolehan kewarganegaraan melalui alasan selain kelahiran","본인 사유에 맞는 취득 유형과 절차":"Jenis perolehan dan prosedur yang sesuai dengan alasan Anda","국적선택":"Pemilihan kewarganegaraan","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Prosedur bagi penyandang kewarganegaraan ganda untuk memilih kewarganegaraan dalam periode yang ditentukan.","복수국적이며 선택 시기가 다가오는 분":"Mereka yang menyandang kewarganegaraan ganda dan masa pemilihannya semakin dekat","본인의 국적선택 기간과 방법, 관련 의무":"Periode dan cara pemilihan kewarganegaraan Anda, serta kewajiban terkait","기간 경과 시 불이익이 있을 수 있습니다.":"Apabila periode terlewat, dapat ada kerugian.","국적상실":"Kehilangan kewarganegaraan","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Hal-hal yang perlu diperiksa dalam kasus kehilangan kewarganegaraan Korea karena alasan tertentu.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Mereka yang ingin mengetahui apakah kewarganegaraannya hilang, misalnya setelah memperoleh kewarganegaraan asing","상실 사유 해당 여부와 신고·후속 절차":"Apakah alasan kehilangan berlaku serta prosedur pelaporan·lanjutan","국적이탈":"Pelepasan kewarganegaraan","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Hal-hal yang perlu diperiksa dalam prosedur penyandang kewarganegaraan ganda melepaskan (melepas) kewarganegaraan Korea.","외국에서 거주하며 국적이탈을 검토하는 분":"Mereka yang bertempat tinggal di luar negeri dan meninjau pelepasan kewarganegaraan","이탈 가능 기간·요건과 병역 등 관련 의무":"Periode·syarat yang memungkinkan pelepasan dan kewajiban terkait seperti wajib militer","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Dapat menjadi rumit karena terkait dengan periode·wajib militer, dll.","국적보유":"Retensi kewarganegaraan","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Hal-hal yang perlu diperiksa seperti pelaporan untuk tetap mempertahankan kewarganegaraan Korea dalam kasus tertentu.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Mereka yang menjadi penyandang kewarganegaraan ganda (mis. karena kelahiran) dan ingin mempertahankannya","보유 신고 대상·기간 여부":"Apakah termasuk objek pelaporan retensi dan periodenya","복수국적":"Kewarganegaraan ganda","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Mencakup kasus di mana kewarganegaraan ganda diizinkan·dibatasi dan hal-hal terkait yang perlu diperiksa.","복수국적 유지 가능 여부가 궁금한 분":"Mereka yang ingin mengetahui apakah dapat mempertahankan kewarganegaraan ganda","본인 유형의 허용·제한 여부와 관련 의무":"Apakah jenis Anda diizinkan·dibatasi dan kewajiban terkait","외국국적불행사서약":"Ikrar untuk tidak menggunakan kewarganegaraan asing","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Hal-hal yang perlu diperiksa pada sistem ikrar untuk tidak menggunakan kewarganegaraan asing di Korea.","귀화·국적회복 후 서약 적용이 궁금한 분":"Mereka yang ingin mengetahui apakah ikrar berlaku setelah naturalisasi·pemulihan kewarganegaraan","서약 적용 대상 여부와 절차·기한":"Apakah termasuk objek penerapan ikrar serta prosedur·batas waktunya","귀화적격심사":"Pemeriksaan kelayakan naturalisasi","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Panduan mengenai tahap pemeriksaan yang memeriksa syarat·perilaku, dll. setelah pengajuan naturalisasi.","귀화 신청을 준비하거나 심사를 앞둔 분":"Mereka yang sedang mempersiapkan pengajuan naturalisasi atau akan menghadapi pemeriksaan","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Item yang mungkin diperiksa dalam pemeriksaan dan status kesiapan Anda","국적 심사 진행상황 조회":"Pengecekan status proses pemeriksaan kewarganegaraan","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Panduan layanan untuk memeriksa status proses secara online setelah pengajuan.","이미 신청하고 결과를 기다리는 분":"Mereka yang telah mengajukan dan menunggu hasil","조회에 필요한 정보와 접속 경로":"Informasi yang diperlukan untuk pengecekan dan jalur aksesnya","귀화허가 등 처분은 관보 고시로 확인합니다.":"Keputusan seperti persetujuan naturalisasi dikonfirmasi melalui pengumuman lembaran resmi negara.","허가 여부·시점을 확인하려는 분":"Mereka yang ingin memastikan apakah disetujui dan kapan waktunya","전자관보 국적·귀화 테마에서 본인 관련 고시":"Pengumuman yang berkaitan dengan Anda pada tema kewarganegaraan·naturalisasi di lembaran resmi negara elektronik","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Syarat·dokumen·prosedur rinci untuk setiap item akan dilengkapi secara bertahap setelah dikonfirmasi melalui sumber resmi.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker adalah pemandu prosedur yang menyusun prosedur, dokumen, reservasi, dan tindakan berikutnya bagi Anda berdasarkan sumber resmi. AI hanya berperan sebagai pembantu untuk menjelaskan panduan yang dihasilkan, dan tidak membuat dokumen·biaya·batas waktu baru. Lakukan konfirmasi akhir di HiKorea·1345·kantor imigrasi yang berwenang.","국적민원·귀화면접 준비":"Layanan kewarganegaraan·persiapan wawancara naturalisasi","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Periksa di satu tempat mulai dari naturalisasi, pemulihan kewarganegaraan, kehilangan·pelepasan kewarganegaraan, kewarganegaraan ganda, ikrar kewarganegaraan, hingga persiapan wawancara naturalisasi. Berdasarkan peraturan dan panduan resmi, Anda dapat menelusuri alur yang dekat dengan situasi Anda.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Kartu pertanyaan perkiraan · latihan wawancara simulasi · video rujukan · pelatih Waymaker","준비 시작하기":"Mulai persiapan","꼭 확인하세요":"Harap perhatikan","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"Hasil perolehan kewarganegaraan·naturalisasi bergantung pada keadaan fakta spesifik tiap individu dan pemeriksaan instansi yang berwenang. Panduan Paradiso adalah bahan rujukan yang menyusun arah, dan tidak memastikan kelayakan·persetujuan akhir maupun menggantikan nasihat hukum.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Kami merangkum sumber resmi terkait kewarganegaraan·KIIP berdasarkan jenis dan cakupan penerapannya. Tautan dan metadata publik diperiksa pada 2026-06-28; sebelum mengajukan, periksa kembali pengumuman terbaru di setiap halaman resmi.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso tidak memiliki hubungan kemitraan atau afiliasi dengan Kementerian Kehakiman·HiKorea·Socinet·Portal Visa·perwakilan di luar negeri. Tautan ini adalah penghubung untuk memeriksa panduan terbaru dari instansi resmi yang berwenang.","Paradiso 메인으로 돌아가기":"Kembali ke halaman utama Paradiso","검토 가능":"Dapat ditinjau","공식 확인 필요":"Perlu konfirmasi resmi","준비 단계":"Tahap persiapan","추가 확인 필요":"Perlu konfirmasi lebih lanjut","판단 제한":"Penilaian terbatas","검토 가능 경로":"Jalur yang dapat ditinjau","먼저 확인할 항목":"Item yang perlu diperiksa terlebih dahulu","준비하면 좋은 자료":"Bahan yang sebaiknya disiapkan","주의할 리스크":"Risiko yang perlu diwaspadai","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Apabila Anda menjawab delapan pertanyaan satu per satu, kami akan menyusun arah mengenai jalur naturalisasi mana yang dapat ditinjau. Pemeriksaan persiapan ini tidak menentukan apakah disetujui, dan merupakan panduan rujukan berdasarkan informasi yang Anda masukkan.","현재 한국에 체류 중인가요?":"Apakah Anda saat ini sedang tinggal di Korea?","예, 한국에 체류 중입니다":"Ya, saya berada di Korea","아니요, 해외에 있습니다":"Tidak, saya berada di luar negeri","잘 모르겠습니다":"Saya tidak yakin","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Manakah yang paling menggambarkan status izin tinggal atau identitas Anda saat ini?","F-5 영주자격":"Izin tinggal tetap F-5","F-6 결혼이민":"Migran perkawinan F-6","F-4 재외동포":"Etnis Korea di luar negeri F-4","E계열 취업 체류자격":"Status izin tinggal kerja seri E","D계열 유학/연수 체류자격":"Status izin tinggal studi/pelatihan seri D","기타 장기체류":"Izin tinggal jangka panjang ungan keluarga yang rumit","해당 없음":"Tidak ada yang berlaku","지금 가장 필요한 안내는 무엇인가요?":"Panduan apa yang paling Anda butuhkan saat ini?","내가 어떤 귀화 경로를 검토할 수 있는지":"Jalur naturalisasi mana yang dapat saya tinjau","먼저 F-5 또는 체류자격 정리가 필요한지":"Apakah saya perlu membereskan F-5 atau status izin tinggal terlebih dahulu","서류와 증빙 준비":"Persiapan dokumen dan bukti","KIIP/면접 준비":"Persiapan KIIP/wawancara","신청 후 진행상황 확인":"Memeriksa status proses setelah pengajuan","검토 방향 요약":"Ringkasan arah peninjauan","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Ini adalah arah yang layak ditelusuri berdasarkan informasi yang Anda masukkan. Berikut ini hanya menyusun kemungkinan; apakah Anda benar-benar dapat mengajukan dan persetujuannya memerlukan pemeriksaan instansi yang berwenang serta konfirmasi kriteria resmi.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Hasil ini adalah panduan rujukan berdasarkan informasi yang Anda berikan, dan bukan penentuan hukum akhir maupun keputusan persetujuan.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Kelayakan untuk mengajukan dan keputusan akhir keduanya memerlukan pemeriksaan instansi yang berwenang serta konfirmasi kriteria resmi (Undang-Undang Kewarganegaraan·Kementerian Kehakiman·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Membereskan izin tinggal tetap (F-5) atau status izin tinggal Anda terlebih dahulu mungkin akan membantu. Periksa urutan yang sesuai dengan situasi Anda pada instansi yang berwenang.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Memastikan status izin tinggal Anda secara tepat akan mempermudah peninjauan. Periksa pada kartu pendaftaran orang asing atau HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Mungkin perlu memeriksa penyelesaian Program Integrasi Sosial (KIIP) atau evaluasi komprehensif untuk naturalisasi. Periksa tahap dan jadwal di Jaringan Informasi Integrasi Sosial.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Akan membantu jika Anda menyiapkan terlebih dahulu bukti terkait identitas·hubungan keluarga, tempat tinggal·izin tinggal di dalam negeri, dan penghidupan.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Akan membantu jika Anda menyiapkan bukti terkait perkawinan·hubungan keluarga.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Periksa dokumen yang diperlukan sesuai jalur Anda pada panduan per bidang layanan di layanan daring Kementerian Kehakiman.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Apabila Anda memiliki riwayat etnis Korea di luar negeri/F-4, selain naturalisasi pertimbangkan juga pemulihan kewarganegaraan·penetapan kewarganegaraan.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Apabila Anda sudah mengajukan, Anda dapat memeriksa status melalui 'Pengecekan status proses pemeriksaan kewarganegaraan'.","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Setelah persetujuan, konfirmasi pengumuman lembaran resmi negara dan prosedur pendaftaran akan menyusul. Lihat 'Prosedur Setelah Naturalisasi'.","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Untuk persiapan KIIP·wawancara, manfaatkan bagian 'Persiapan KIIP·wawancara' bersama dengan Jaringan Informasi Integrasi Sosial.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Kepergian ke luar negeri jangka panjang·jeda izin tinggal dapat memengaruhi perhitungan syarat tempat tinggal, sehingga perlu disusun·dikonfirmasi terlebih dahulu.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Bukti pajak·penghasilan dapat berkaitan dengan pemeriksaan kemampuan menghidupi diri, sehingga perlu diperiksa terlebih dahulu.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Riwayat tindak pidana·penyidikan·sanksi administratif dapat berkaitan dengan pemeriksaan terkait perilaku, sehingga pemeriksaan dini penting.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Apabila bukti perkawinan·hubungan keluarga rumit, penyiapan dokumen luar negeri dapat memakan waktu.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Hanya dengan informasi yang Anda masukkan, sulit untuk mempersempit arah secara memadai. Periksa status izin tinggal·periode tempat tinggal·hubungan keluarga lalu lakukan pemeriksaan kembali, atau coba mode konsultasi kewarganegaraan Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Anda tidak perlu mengetahui istilah hukum terlebih dahulu. Satu pertanyaan setiap kali, pilih yang paling dekat dengan situasi Anda saat ini, dan kami akan memandu Anda ke jalur yang dapat ditinjau.","무엇을 준비하고 있나요?":"Apa yang sedang Anda persiapkan?","한국 국적을 취득하고 싶어요":"Saya ingin memperoleh kewarganegaraan Korea","한국 국민 배우자가 있어요":"Saya menikah dengan warga negara Korea","부모 또는 가족의 한국 국적 이력이 있어요":"Orang tua atau anggota keluarga saya memiliki riwayat kewarganegaraan Korea","재외동포/F-4 관련 경로가 궁금해요":"Saya ingin mengetahui jalur terkait etnis Korea di luar negeri/F-4","국적회복을 알아보고 있어요":"Saya sedang mencari tahu tentang pemulihan kewarganegaraan","이미 신청했고 다음 절차가 궁금해요":"Saya sudah mengajukan dan ingin mengetahui prosedur berikutnya","복수국적 또는 외국국적불행사서약이 궁금해요":"Saya ingin mengetahui tentang kewarganegaraan ganda atau ikrar untuk tidak menggunakan kewarganegaraan asing","현재 상황에 가장 가까운 것은 무엇인가요?":"Manakah yang paling dekat dengan situasi Anda saat ini?","한국에 오래 거주했거나 장기체류 중입니다":"Saya telah lama tinggal di Korea atau sedang dalam izin tinggal jangka panjang","F-5 영주자격을 가지고 있습니다":"Saya memiliki izin tinggal tetap F-5","F-5는 아직 없습니다":"Saya belum memiliki F-5","혼인관계를 유지하고 있습니다":"Hubungan perkawinan masih utuh","이혼/사별/실종/별거 등 변동이 있습니다":"Ada perubahan seperti perceraian/kematian pasangan/hilang/pisah ranjang","미성년 자녀를 양육 중입니다":"Saya sedang mengasuh anak di bawah umur","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Setidaknya satu dari orang tua adalah warga negara Korea atau dulu pernah menjadi warga negara Korea","입양 또는 출생 관련 이력이 있습니다":"Ada riwayat terkait adopsi atau kelahiran","F-4 체류자격을 가지고 있습니다":"Saya memiliki status izin tinggal F-4","F-4 신청을 준비 중입니다":"Saya sedang mempersiapkan pengajuan F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Saya tidak yakin mana yang sesuai antara pemulihan kewarganegaraan dan naturalisasi","외국국적을 취득하면서 한국 국적을 상실했습니다":"Saya kehilangan kewarganegaraan Korea ketika memperoleh kewarganegaraan asing","과거 국적이탈/포기를 한 적이 있습니다":"Saya pernah melepaskan/melepas kewarganegaraan di masa lalu","상실 경위가 분명하지 않습니다":"Latar belakang kehilangannya tidak jelas","접수 후 대기 중입니다":"Telah diterima dan sedang menunggu","종합평가/면접 안내를 받았습니다":"Saya telah menerima pemberitahuan evaluasi komprehensif/wawancara","보완서류 요청을 받았습니다":"Saya menerima permintaan dokumen pelengkap","허가 통보 이후 절차가 궁금합니다":"Saya ingin mengetahui prosedur setelah menerima pemberitahuan persetujuan","출생 등으로 복수국적이 된 경우입니다":"Ini adalah kasus menjadi penyandang kewarganegaraan ganda karena kelahiran, dll.","귀화 후 외국국적불행사서약이 궁금합니다":"Saya ingin mengetahui tentang ikrar untuk tidak menggunakan kewarganegaraan asing setelah naturalisasi","국적선택 기간/의무가 궁금합니다":"Saya ingin mengetahui tentang periode/kewajiban pemilihan kewarganegaraan","위 상황과 정확히 맞지 않습니다":"Tidak persis sesuai dengan situasi di atas","현재 가장 막히는 부분은 무엇인가요?":"Apa bagian yang paling menghambat Anda saat ini?","요건을 모르겠습니다":"Saya tidak mengetahui syaratnya","서류를 모르겠습니다":"Saya tidak mengetahui dokumennya","방문예약/접수 절차가 어렵습니다":"Prosedur reservasi kunjungan/penerimaan terasa sulit","KIIP/종합평가/면접이 어렵습니다":"KIIP/evaluasi komprehensif/wawancara terasa sulit","진행상황 확인이 어렵습니다":"Memeriksa status proses terasa sulit","귀화 후 절차가 어렵습니다":"Prosedur setelah naturalisasi terasa sulit","검토할 수 있는 경로":"Jalur yang dapat ditinjau","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Ini adalah jalur yang dekat dengan situasi yang Anda pilih. Syarat rinci setiap jalur dan apakah berlaku memerlukan konfirmasi melalui sumber resmi, dan ini merupakan arah peninjauan, bukan satu jawaban akhir.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"Panduan jalur adalah bahan rujukan yang membantu mengklasifikasikan situasi, dan tidak menjamin terpenuhinya kelayakan atau persetujuan.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Periksa syarat sesuai jalur Anda pada Undang-Undang Kewarganegaraan dan panduan kewarganegaraan/naturalisasi HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Periksa dokumen yang diperlukan pada panduan per bidang layanan di layanan daring Kementerian Kehakiman.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Lakukan reservasi kunjungan·penerimaan melalui reservasi kunjungan HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Untuk KIIP·evaluasi komprehensif·wawancara, periksa jadwal·persiapan di Jaringan Informasi Integrasi Sosial dan situs evaluasi.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Periksa status setelah pengajuan melalui 'Pengecekan status proses pemeriksaan kewarganegaraan'.","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Untuk prosedur setelah persetujuan, lihat bagian 'Prosedur Setelah Naturalisasi' dan konfirmasi pengumuman lembaran resmi negara.","다음 행동":"Tindakan berikutnya","막히는 부분에 대한 안내":"Panduan untuk bagian yang menghambat Anda","법무부·출입국":"Kementerian Kehakiman·Imigrasi","공식 확인·민원 창구":"Loket konfirmasi resmi·layanan","사회통합·평가":"Integrasi Sosial·Evaluasi","법령·관보":"Peraturan·Lembaran Resmi Negara"},"ru":{"Paradiso로 돌아가기":"Назад в Paradiso","테마 전환":"Сменить тему","밝기 전환":"Переключить яркость","닫기":"Закрыть","열기":"Открыть","다음":"Далее","이전":"Назад","처음부터":"Начать сначала","결과 보기":"Посмотреть результат","자세히 보기":"Подробнее","이런 분께":"Кому это подходит","먼저 확인하세요":"Сначала проверьте","확인할 항목":"Что нужно проверить","준비 자료(범주)":"Документы для подготовки (по категориям)","다음 단계":"Дальнейшие шаги","공식 출처":"Официальные источники","공식 출처로 확인":"Проверьте по официальным источникам","공식 사이트에서 최신 내용 확인":"Проверьте актуальную информацию на официальном сайте","적용 범위":"Сфера применения","확인일":"Дата проверки","자료일":"Дата источника","수정일":"Дата обновления","시행일":"Дата вступления в силу","향후 시행 — 현재 기준 아님":"Вступает в силу в будущем — не действующая на данный момент норма","법령":"Закон / нормативный акт","중앙정부 안내":"Портал центрального правительства","공식 서비스":"Официальный сервис","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Государственные справочные материалы","공식 사이트":"Официальный сайт","경로":"Путь","내 절차 찾기 (Waymaker)":"Найти мою процедуру (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Не удалось загрузить содержимое. Повторите попытку через некоторое время или войдите через главную страницу Paradiso.","시작하기":"Начать","KIIP·평가":"KIIP·оценивание","허가 후":"После одобрения","국적업무":"Центр по делам гражданства","Paradiso 국적·귀화 플랫폼":"Paradiso — платформа по вопросам гражданства и натурализации","나에게 맞는 국적·귀화 경로를 찾으세요":"Найдите подходящий вам путь к гражданству и натурализации","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Пошагово сопровождаем вас по натурализации, восстановлению гражданства, определению гражданства, множественному гражданству, Программе социальной интеграции, собеседованию и процедурам после натурализации.","2분 준비 점검 시작":"Начать 2-минутную проверку готовности","상황별 경로 찾기":"Найти путь по вашей ситуации","약 2분":"Около 2 минут","로그인 불필요":"Вход в систему не требуется","공식 출처 연결":"Связь с официальными источниками","지금 필요한 것부터":"Начните с того, что нужно сейчас","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Вы можете начать с вашей текущей ситуации, даже не зная юридических терминов.","귀화 준비 항목 빠르게 점검":"Быстро проверить пункты подготовки к натурализации","내 상황을 단계별로 분류":"Пошагово классифицировать мою ситуацию","공식 근거와 확인 창구 보기":"Посмотреть официальные основания и каналы для уточнения","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Вопросы гражданства могут различаться в зависимости от личных обстоятельств и актуальных законов и инструкций. Paradiso предоставляет руководство, основанное на официальных источниках, однако окончательное решение требует подтверждения в компетентном органе.","무엇을 도와드릴까요?":"Чем можем помочь?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Выберите карточку, подходящую вашей ситуации, чтобы начать. Каждый инструмент лишь упорядочивает направление для рассмотрения на основе введённых вами данных и не определяет, будет ли выдано разрешение.","귀화 준비 점검":"Проверка готовности к натурализации","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Упорядочивает по одному вопросу пункты, которые нужно проверить и подготовить, — пребывание, семейные отношения, KIIP·оценивание и другое — и направляет к соответствующему официальному источнику.","준비 점검 시작":"Начать проверку готовности","귀화 경로 찾기":"Найти путь к корейскому гражданству","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Знать юридические термины заранее необязательно. Выбирайте вашу текущую ситуацию шаг за шагом, и мы укажем пути, которые стоит рассмотреть.","경로 찾기":"Найти путь","KIIP·평가 확인":"Проверка KIIP·оценивания","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Помогает понять, чем образование и оценивание Программы социальной интеграции отличаются от процедур по гражданству, и направляет к официальным руководствам Socinet и Министерства юстиции.","준비 항목 보기":"Посмотреть пункты подготовки","귀화 후 절차":"Процедуры после натурализации","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"В виде чек-листа разбираем административные процедуры после одобрения — от проверки публикации в официальном вестнике до регистрации семейных отношений, регистрации по месту жительства и урегулирования иностранного гражданства.","체크리스트 보기":"Посмотреть чек-лист","국적업무 허브":"Центр по делам гражданства","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"В одном месте охватываем все вопросы гражданства — натурализацию, восстановление гражданства, определение гражданства, выбор гражданства, множественное гражданство, обязательство о неиспользовании иностранного гражданства и другое.","허브 열기":"Открыть центр","Waymaker — 내 절차 찾기":"Waymaker — найти мою процедуру","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Выберите статус пребывания и ситуацию, чтобы узнать, что нужно подготовить, и официальные основания. Также сопровождаем по вопросам гражданства и натурализации.","내 절차 찾기":"Найти мою процедуру","전체 흐름 미리보기":"Предпросмотр всего процесса","KIIP·평가 공식 안내":"Официальное руководство по KIIP·оцениванию","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"Образование и оценивание Программы социальной интеграции (KIIP) и процедуры по гражданству различаются между собой. Какой курс, оценивание или собеседование применимы именно к вам, а также актуальное расписание необходимо уточнять в Socinet или в компетентном органе.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP — это программа образования и оценивания в сфере социальной интеграции Министерства юстиции. Прохождение или результаты оценивания могут учитываться в некоторых процедурах пребывания и гражданства, но сами по себе не гарантируют автоматически право или разрешение.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"Прохождение курса KIIP, предварительное и промежуточное оценивание для распределения по уровням и комплексное оценивание для ПМЖ или натурализации — это разные процедуры. Собеседование при натурализации и комплексное оценивание также нельзя считать одной и той же процедурой.","내 KIIP 단계 확인":"Проверить мой уровень KIIP","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Поясняем, как проверить присвоенный уровень, следующий уровень и статус прохождения в информационной сети социальной интеграции.","평가 유형 확인":"Определить тип оценивания","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"По официальным уведомлениям выясняем, какое именно оценивание относится к вам — предварительное, промежуточное либо комплексное для ПМЖ или для натурализации.","귀화면접 공식자료 찾기":"Найти официальные материалы для собеседования при натурализации","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Проверяем в справочном разделе Министерства юстиции по делам гражданства, есть ли официальные материалы по собеседованию и актуальные руководства.","면제·인정 여부 확인":"Проверить возможность освобождения·зачёта","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Уточняйте по официальным руководствам и в компетентном органе, как прохождение KIIP и результаты оценивания учитываются в вашей процедуре. Paradiso не выносит решения об освобождении.","공식 면접자료 확인":"Проверить официальные материалы для собеседования","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Вместо неофициальных списков предполагаемых вопросов в первую очередь проверяйте опубликованные Министерством юстиции материалы по собеседованию и руководства компетентного органа.","공식 일정 확인":"Проверить официальное расписание","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Расписание оценивания и подачу заявок проверяйте напрямую в информационной сети социальной интеграции и на сайте оценивания. Paradiso не указывает расписание самостоятельно.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Расписание оценивания и подробные критерии необходимо уточнять по официальным источникам, таким как информационная сеть социальной интеграции.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Это примеры административных процедур, которые можно рассмотреть после одобрения. Пункты и их порядок могут различаться в зависимости от личной ситуации, и это не исчерпывающий перечень, одинаково применимый ко всем.","관보 고시 확인":"Проверка публикации в официальном вестнике","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Решения по натурализации и гражданству подтверждаются публикацией в официальном вестнике.","전자관보에서 본인 관련 고시를 확인하세요.":"Проверьте касающуюся вас публикацию в электронном официальном вестнике.","가족관계등록 관련 확인":"Проверка по регистрации семейных отношений","가족관계등록 절차가 필요한지 확인합니다.":"Проверяем, нужна ли процедура регистрации семейных отношений.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Уточните необходимые документы и процедуры согласно руководству компетентного органа.","주민등록 관련 확인":"Проверка по регистрации по месту жительства","거주지 주민등록 절차를 확인합니다.":"Проверяем процедуру регистрации по месту жительства.","주소지 관할 행정기관에서 절차를 확인하세요.":"Уточните процедуру в административном органе по месту вашего жительства.","주민등록증 발급":"Выдача удостоверения жителя","주민등록증 발급 절차를 확인합니다.":"Проверяем процедуру выдачи удостоверения жителя.","발급 요건·장소를 관할 기관에서 확인하세요.":"Уточните требования и место выдачи в компетентном органе.","외국인등록증 처리":"Урегулирование вида на жительство иностранца","기존 외국인등록증 처리 방법을 확인합니다.":"Проверяем, как поступить с прежним видом на жительство иностранца (ARC).","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Уточните порядок действий в HiKorea или в компетентном управлении иммиграции.","대한민국 여권 발급":"Выдача паспорта Республики Корея","대한민국 여권 발급 절차를 확인합니다.":"Проверяем процедуру выдачи паспорта Республики Корея.","여권 발급 기관 안내에 따라 준비하세요.":"Подготовьтесь согласно руководству органа, выдающего паспорта.","은행/통신/보험/학교/직장 정보 변경":"Изменение данных в банке/у оператора связи/в страховой/в учебном заведении/на работе","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Внесите изменения в учреждениях, связанных с вашими идентификационными данными.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Уточните процедуру изменения идентификационных данных в каждом учреждении.","외국국적 포기 또는 외국국적불행사서약 확인":"Проверка отказа от иностранного гражданства или обязательства о его неиспользовании","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Проверяем, какая процедура (отказ или обязательство) применима к вам.","적용 절차와 기한을 관할기관에서 확인하세요.":"Уточните применимую процедуру и сроки в компетентном органе.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Сроки могут существовать, поэтому важно проверить время их соблюдения.","복수국적 관련 후속 의무 확인":"Проверка последующих обязанностей, связанных с множественным гражданством","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Проверяем последующие обязанности, возникающие при сохранении множественного гражданства.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Уточните обязанности для вашего случая по Закону о гражданстве и в компетентном органе.","유형에 따라 의무가 다릅니다.":"Обязанности различаются в зависимости от типа.","병역 관련 확인이 필요한 경우":"Случаи, когда требуется проверка по воинской обязанности","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Если это может вас касаться, отдельно проверьте руководство по воинской обязанности.","해당 여부와 절차를 관할기관에서 확인하세요.":"Уточните в компетентном органе, относится ли это к вам, и процедуру.","개인 상황에 따라 적용이 다릅니다.":"Применение различается в зависимости от личной ситуации.","자녀/가족관계 영향 확인이 필요한 경우":"Случаи, когда нужно проверить влияние на детей/семейные отношения","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Проверяем, может ли это повлиять на детей или семейные отношения.","해당 가능성을 관할기관에서 확인하세요.":"Уточните в компетентном органе возможность такого влияния.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Этот чек-лист носит справочный характер и не является исчерпывающим перечнем, одинаково применимым ко всем. Процедуры могут различаться в разных учреждениях, поэтому требуется окончательное подтверждение.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Основные вопросы, связанные с гражданством, собраны в одном месте. Нажав на каждый пункт, вы увидите краткое пояснение, что нужно проверить в первую очередь, и официальные источники. Подробные требования необходимо уточнять по официальным источникам.","일반귀화":"Общая натурализация","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Базовая натурализация, которую рассматривают иностранцы, прожившие установленный срок и более без особых оснований.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Тем, кто проживает длительное время и имеет стабильную основу пребывания","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"Требование к сроку проживания, основа пребывания (например, ПМЖ F-5), а также статус прохождения KIIP/оценивания","간이귀화":"Упрощённая натурализация","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Натурализация, которую рассматривают при наличии определённых оснований, таких как брак или семейные отношения.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Тем, у кого есть супруг-гражданин Кореи или семейная история, связанная с корейским гражданством","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Тип применимого к вам основания (брак·семейные отношения и другое) и связанные с ним требования","특별귀화":"Особая натурализация","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Натурализация, которую рассматривают при признании особых оснований, таких как заслуги или способности.","특별 인정 사유가 있을 수 있는 분":"Тем, у кого могут быть основания для особого признания","인정 사유 해당 여부와 분야별 공식 기준":"Соответствие основанию для признания и официальные критерии по областям","기준이 분야·정책에 따라 다릅니다.":"Критерии различаются в зависимости от области и политики.","우수인재 특별귀화":"Особая натурализация для выдающихся специалистов","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Тип особой натурализации, который рассматривают при признании выдающимся специалистом в определённой области.","전문 분야 실적·추천이 있을 수 있는 분":"Тем, у кого могут быть достижения·рекомендации в профессиональной области","분야별 인정 기준과 추천·증빙 요건":"Критерии признания по областям и требования к рекомендациям·подтверждающим документам","정책에 따라 자주 갱신됩니다.":"Часто обновляется в зависимости от политики.","국적회복":"Восстановление гражданства","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Процедура восстановления гражданства для тех, кто ранее имел корейское гражданство, но утратил его или вышел из него.","과거 한국 국적 보유 이력이 있는 분":"Тем, кто ранее имел корейское гражданство","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Обстоятельства прежнего наличия·утраты гражданства, основания для отказа и влияние множественного гражданства","국적판정":"Определение гражданства","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Процедура для получения официального определения, когда неясно, имеется ли корейское гражданство.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Тем, у кого из-за сложной истории рождения·семейных отношений неясен факт наличия гражданства","출생·가족관계 기록과 국적 변동 이력":"Записи о рождении·семейных отношениях и история изменения гражданства","국적취득":"Приобретение гражданства","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Охватывает случаи приобретения гражданства по определённым основаниям, таким как брак·признание отцовства.","출생 외 사유로 국적 취득을 검토하는 분":"Тем, кто рассматривает приобретение гражданства по основаниям, отличным от рождения","본인 사유에 맞는 취득 유형과 절차":"Тип приобретения и процедура, соответствующие вашему основанию","국적선택":"Выбор гражданства","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Процедура, в рамках которой лицо с множественным гражданством выбирает гражданство в установленный срок.","복수국적이며 선택 시기가 다가오는 분":"Тем, кто имеет множественное гражданство и у кого приближается срок выбора","본인의 국적선택 기간과 방법, 관련 의무":"Ваш срок и способ выбора гражданства, а также связанные с этим обязанности","기간 경과 시 불이익이 있을 수 있습니다.":"При пропуске срока могут наступить неблагоприятные последствия.","국적상실":"Утрата гражданства","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Что нужно проверить в случаях утраты корейского гражданства по определённым основаниям.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Тем, кого интересует, утрачено ли гражданство, например, после приобретения иностранного","상실 사유 해당 여부와 신고·후속 절차":"Соответствие основанию для утраты и процедуры уведомления·последующие шаги","국적이탈":"Выход из гражданства","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Что нужно проверить в процедуре выхода (отказа) из корейского гражданства лицом с множественным гражданством.","외국에서 거주하며 국적이탈을 검토하는 분":"Тем, кто проживает за рубежом и рассматривает выход из гражданства","이탈 가능 기간·요건과 병역 등 관련 의무":"Срок·условия возможного выхода и связанные обязанности, такие как воинская обязанность","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Может быть сложным из-за связи со сроками·воинской обязанностью и прочим.","국적보유":"Сохранение гражданства","일정 경우 한국 국적을 계 окончательно наличие права·выдачу разрешения и не заменяет юридическую консультацию.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Официальные источники по гражданству·KIIP упорядочены по типу и сфере применения. Ссылки и общедоступные метаданные проверены 2026-06-28; перед подачей заявления повторно проверьте последние объявления на каждой официальной странице.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso не имеет партнёрских или иных связей с Министерством юстиции·HiKorea·Socinet·визовым порталом·зарубежными представительствами. Эти ссылки служат переходом для проверки актуальных руководств компетентного официального органа.","Paradiso 메인으로 돌아가기":"Вернуться на главную страницу Paradiso","검토 가능":"Можно рассмотреть","공식 확인 필요":"Требуется официальная проверка","준비 단계":"Этап подготовки","추가 확인 필요":"Требуется дополнительная проверка","판단 제한":"Решение ограничено","검토 가능 경로":"Пути, которые можно рассмотреть","먼저 확인할 항목":"Что проверить в первую очередь","준비하면 좋은 자료":"Материалы, которые стоит подготовить","주의할 리스크":"Риски, на которые стоит обратить внимание","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Ответив на восемь вопросов по одному за раз, вы получите упорядоченное направление о том, какие пути натурализации можно рассмотреть. Эта проверка готовности не определяет, будет ли выдано разрешение, и является справочным руководством на основе введённых вами данных.","현재 한국에 체류 중인가요?":"Вы сейчас находитесь в Корее?","예, 한국에 체류 중입니다":"Да, я нахожусь в Корее","아니요, 해외에 있습니다":"Нет, я за рубежом","잘 모르겠습니다":"Затрудняюсь ответить","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Что лучше всего описывает ваш текущий статус пребывания или положение?","F-5 영주자격":"F-5, статус постоянного жителя (ПМЖ)","F-6 결혼이민":"F-6, брачная миграция","F-4 재외동포":"F-4, зарубежный кореец","E계열 취업 체류자격":"Статусы пребывания серии E (трудоустройство)","D계열 유학/연수 체류자격":"Статусы пребывания серии D (учёба/стажировка)","기타 장기체류":"Иное долгосрочное пребывание","체류자격을 잘 모르겠습니다":"Я не уверен в своём статусе пребывания","한국에 계속 거주한 기간은 어느 정도인가요?":"Как долго вы непрерывно проживаете в Корее?","1년 미만":"Менее 1 года","1년 이상 2년 미만":"От 1 до 2 лет","2년 이상 3년 미만":"От 2 до 3 лет","3년 이상 5년 미만":"От 3 до 5 лет","5년 이상":"5 лет и более","중간에 장기출국 또는 체류 공백이 있었습니다":"В течение этого времени были длительные выезды или перерывы в пребывании","한국 국민 배우자가 있나요?":"У вас есть супруг — гражданин Кореи?","예, 혼인관계를 유지하고 있습니다":"Да, брак сохраняется","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Да, но есть изменения (развод/смерть супруга/раздельное проживание)","아니요":"Нет","답변하기 어렵습니다":"Предпочитаю не отвечать","부모 또는 가족의 한국 국적 이력이 있나요?":"Есть ли у ваших родителей или членов семьи история корейского гражданства?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Хотя бы один из родителей является или был гражданином Кореи","본인이 과거 한국 국적을 가진 적이 있습니다":"Я сам ранее имел корейское гражданство","재외동포/F-4 관련 이력이 있습니다":"У меня есть связи с зарубежными корейцами / статусом F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"Есть ли у вас история прохождения Программы социальной интеграции (KIIP) или комплексного оценивания для натурализации?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"Завершён 5-й этап KIIP и сдано комплексное оценивание для натурализации","KIIP를 일부 이수했습니다":"Я частично прошёл KIIP","귀화용 종합평가만 응시/합격했습니다":"Я только сдавал/сдал комплексное оценивание для натурализации","아직 없습니다":"Пока нет","추가 확인이 필요한 사유가 있나요?":"Есть ли обстоятельства, требующие дополнительной проверки?","장기출국 또는 체류 공백":"Длительные выезды или перерывы в пребывании","세금 체납 또는 소득 증빙 어려움":"Задолженность по налогам или сложности с подтверждением дохода","범죄·수사·행정처분 이력":"История судимостей·расследований·административных взысканий","혼인관계 또는 가족관계 증빙이 복잡함":"Сложности с подтверждением брака или семейных отношений","해당 없음":"Не относится","지금 가장 필요한 안내는 무엇인가요?":"Какое руководство нужно вам сейчас больше всего?","내가 어떤 귀화 경로를 검토할 수 있는지":"Какие пути натурализации я могу рассмотреть","먼저 F-5 또는 체류자격 정리가 필요한지":"Нужно ли мне сначала урегулировать F-5 или статус пребывания","서류와 증빙 준비":"Подготовка документов и подтверждающих материалов","KIIP/면접 준비":"Подготовка к KIIP/собеседованию","신청 후 진행상황 확인":"Проверка хода рассмотрения после подачи заявления","검토 방향 요약":"Краткое изложение направлений для рассмотрения","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Это направления, которые стоит рассмотреть на основе введённых вами данных. Ниже приведён лишь упорядоченный перечень возможностей; фактическая возможность подачи заявления и выдача разрешения требуют проверки компетентным органом и подтверждения по официальным критериям.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Этот результат является справочным руководством, основанным на предоставленной пользователем информации, и не является окончательным юридическим заключением или решением о выдаче разрешения.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Окончательная возможность подачи заявления и выдача разрешения требуют проверки компетентным органом и подтверждения по официальным критериям (Закон о гражданстве·Министерство юстиции·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Возможно, сначала будет полезно урегулировать ПМЖ (F-5) или статус пребывания. Подходящий вашей ситуации порядок действий уточните в компетентном органе.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Точное определение вашего текущего статуса пребывания облегчает рассмотрение. Проверьте его по виду на жительство иностранца или в HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Может потребоваться проверка прохождения Программы социальной интеграции (KIIP) или комплексного оценивания для натурализации. Проверьте этап и расписание в информационной сети социальной интеграции.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Полезно заранее подготовить подтверждающие материалы по личности·семейным отношениям, проживанию·пребыванию в стране и средствам к существованию.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Полезно заранее подготовить подтверждающие материалы по браку·семейным отношениям.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Необходимые документы проверьте по вашему пути в руководстве по областям обращений в онлайн-приёмной обращений Министерства юстиции.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Если у вас есть связи с зарубежными корейцами/статусом F-4, помимо натурализации рассмотрите также восстановление гражданства·определение гражданства.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Если вы уже подали заявление, статус можно проверить через «Запрос о ходе рассмотрения дела о гражданстве».","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"После одобрения следуют проверка публикации в официальном вестнике и процедуры регистрации. См. «Процедуры после натурализации».","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Для подготовки к KIIP·собеседованию используйте раздел «Подготовка к KIIP·собеседованию» вместе с информационной сетью социальной интеграции.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Длительные выезды·перерывы в пребывании могут повлиять на расчёт требования к проживанию, поэтому их нужно заранее упорядочить·проверить.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Подтверждение налогов·дохода может быть связано с проверкой способности обеспечивать средства к существованию, поэтому его нужно проверить заранее.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"История судимостей·расследований·административных взысканий может быть связана с проверкой поведения, поэтому важно проверить её заранее.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Если подтверждение брака·семейных отношений затруднено, подготовка зарубежных документов может занять время.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족
