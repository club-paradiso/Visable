<script src="assets/js/zh-traditional.js"></script>
<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  var LANG_KEY = 'paradiso:language';
  var THEME_KEY = 'paradiso:editorial-theme';
  var BRIGHT_KEY = 'paradiso:brightness';
  var SUPPORTED = ['ko', 'en', 'zh-CN', 'zh-TW'];
  // Full canonical site locale cycle, in index.html LANGUAGE_OPTIONS order. The
  // toggle must advance through EVERY site locale so a click from a globally
  // stored ja/vi/etc. lands on the genuine next locale instead of overwriting
  // the shared paradiso:language key with a coerced ko/en/zh value.
  var LANG_ORDER = ['ko', 'en', 'zh-CN', 'zh-TW', 'ja', 'vi', 'tl', 'id', 'ru', 'fr', 'es', 'ar', 'de', 'tr', 'uk'];
  var LANG_SHORT = {
    ko: 'KO', en: 'EN', 'zh-CN': '简', 'zh-TW': '繁', ja: '日', vi: 'VI',
    tl: 'TL', id: 'ID', ru: 'RU', fr: 'FR', es: 'ES', ar: 'ع', de: 'DE', tr: 'TR', uk: 'UK'
  };
  var LANG_LABEL = {
    ko: '한국어', en: 'English', 'zh-CN': '简体中文', 'zh-TW': '繁體中文', ja: '日本語',
    vi: 'Tiếng Việt', tl: 'Tagalog', id: 'Bahasa Indonesia', ru: 'Русский', fr: 'Français',
    es: 'Español', ar: 'العربية', de: 'Deutsch', tr: 'Türkçe', uk: 'Українська'
  };
  // Locales this page renders natively (content JSON carries ko/en/zh-CN; zh-TW is
  // a display layer over zh-CN). A selected locale outside this set stays selected
  // but renders via the ko fallback in pick(), flagged by the note — never coerced.
  var LANG_TRANSLATED = { ko: true, en: true, 'zh-CN': true, 'zh-TW': true };
  // Content locale that actually drives pick(): untranslated selections render ko.
  function contentLocaleFor(sel) {
    if (sel === 'zh-TW' || sel === 'zh-CN') return 'zh-CN';
    if (sel === 'en') return 'en';
    return 'ko';
  }
  // Traditional Chinese is a display layer over zh-CN content (zh-traditional.js).
  // `lang` is the content locale; `tradTW` activates the converter.
  var selectedLocale = initialSelection();
  var tradTW = (selectedLocale === 'zh-TW');
  var lang = contentLocaleFor(selectedLocale);
  var content = null;     // nationality_content.json
  var paths = null;       // nationality_paths.json (path catalog)
  var flows = null;       // nationality_flows.json (wizards)
  var sources = null;     // nationality_sources.json (registry)
  var chipMap = {};       // chip id -> chip
  var catMap = {};        // result-category id -> category
  var srcMap = {};        // sourceId -> source
  var lastFocus = null;
  var activeOverlay = null;
  var activeRebuild = null; // re-render hook for the open modal on language switch

  function initialSelection() {
    try {
      // Read the shared global choice WITHOUT coercion: any canonical site locale
      // stays selected as-is (content falls back to ko via pick() if untranslated
      // here). Garbage/unknown falls through to the navigator hint, then ko.
      var raw = (localStorage.getItem(LANG_KEY) || '');
      if (LANG_ORDER.indexOf(raw) >= 0) return raw;
    } catch (e) {}
    try {
      if ((navigator.language || '').toLowerCase().indexOf('en') === 0) return 'en';
    } catch (e) {}
    return 'ko';
  }
  function applyTradLayer(on) {
    try { var zt = window.ParadisoZhT; if (!zt) return; if (on) { if (!zt.isActive()) zt.start(); } else if (zt.isActive()) { zt.stop(); } } catch (e) {}
  }

  function pick(node) {
    if (node == null) return '';
    if (typeof node === 'string') return node;
    if (typeof node === 'object') {
      if (node[lang] != null) return node[lang];
      if (node.ko != null) return node.ko;
      if (node.en != null) return node.en;
    }
    return '';
  }

  function resolve(root, dotted) {
    return dotted.split('.').reduce(function (acc, k) { return acc == null ? acc : acc[k]; }, root);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  // ── Status chips ───────────────────────────────────────────────────────
  function chipHtml(id) {
    var c = chipMap[id];
    if (!c) return '';
    return '<span class="nh-chip" data-tone="' + esc(c.tone) + '"><span class="nh-chip-glyph" aria-hidden="true">' +
      esc(c.icon) + '</span>' + esc(pick(c)) + '</span>';
  }

  // ── Static text binding: elements carry a dotted content path attribute ──
  function applyStatic() {
    document.documentElement.lang = tradTW ? 'zh-TW' : lang;
    applyTradLayer(tradTW);
    document.querySelectorAll('[data-c]').forEach(function (node) {
      var val = resolve(content, node.getAttribute('data-c'));
      if (val != null) node.textContent = pick(val);
    });
    var langBtn = document.getElementById('langBtn');
    // Show the CURRENT selected locale, not the fallback content locale.
    if (langBtn) {
      // Same control as the Visable landing: code badge + native name.
      langBtn.innerHTML = '<span class="nh-lang-code" aria-hidden="true">' + esc(LANG_SHORT[selectedLocale] || LANG_SHORT.ko) + '</span>' +
        '<span class="nh-lang-name">' + esc(LANG_LABEL[selectedLocale] || selectedLocale) + '</span>';
      langBtn.setAttribute('data-s2t', 'off');
      langBtn.setAttribute('aria-label', pick({ ko: '언어 선택', en: 'Choose language', 'zh-CN': '选择语言' }) + ' · ' + (LANG_LABEL[selectedLocale] || selectedLocale));
    }
    renderLangMenu();
    updateLangNote(selectedLocale);
    syncThemeLabel();
    // Locale-aware accessibility labels. These are attributes, so applyStatic's
    // [data-c] textContent pass does not reach them — they must be swapped here so
    // English-mode screen-reader users do not hear Korean labels.
    var a11y = {
      themeBtn: { ko: '테마 전환', en: 'Toggle theme' },
      brightBtn: { ko: '밝기 전환', en: 'Toggle brightness' },
      close: { ko: '닫기', en: 'Close' }
    };
    var themeBtnEl = document.getElementById('themeBtn');
    if (themeBtnEl) themeBtnEl.setAttribute('aria-label', pick(a11y.themeBtn));
    var brightBtnEl = document.getElementById('brightBtn');
    if (brightBtnEl) brightBtnEl.setAttribute('aria-label', pick(a11y.brightBtn));
    document.querySelectorAll('[data-action="close-modal"]').forEach(function (n) {
      n.setAttribute('aria-label', pick(a11y.close));
    });
  }

  // ── Renderers ────────────────────────────────────────────────────────────
  // Two tiers: the two interactive starting points (readiness check, path
  // finder) lead; the six guides/tools below read as one index. Order and copy
  // come from nationality_content.json unchanged.
  var PRIMARY_FEATURES = ['readiness', 'pathfinder'];
  function featureCard(f, index, primary) {
    var card = el('button', 'nh-card' + (primary ? ' nh-card--primary' : ''));
    card.type = 'button';
    card.setAttribute('data-action', f.action);
    card.setAttribute('data-variant', f.id);
    card.innerHTML =
      // 한 글자 타일(확정 시안 122:13-14). glyph 가 없으면 순번을 쓴다.
      '<span class="nh-card-icon" aria-hidden="true">' + esc(f.glyph || String(index + 1).padStart(2, '0')) + '</span>' +
      '<span class="nh-card-body">' +
      '<span class="nh-card-label">' + esc(pick(f.label)) + '</span>' +
      '<span class="nh-card-desc">' + esc(pick(f.desc)) + '</span>' +
      '<span class="nh-card-cta">' + esc(pick(f.cta)) + '</span>' +
      '</span>';
    return card;
  }
  function renderFeatures() {
    var grid = document.getElementById('featureGrid');

  // 정착 여정 스테퍼 — 확정 시안 123:9. 원 + 연결선 + 라벨.
  // 시안의 ✓ 는 "스크롤에 따라 한 걸음씩 그려지는 길"이라는 연출이지
  // 사용자의 실제 진행 상황이 아니다. 개인 진행이나 심사 결과로 읽히지
  // 않도록 아래에 그 뜻을 명시하고, 원 안에는 항상 단계 번호를 쓴다.
  function renderJourney() {
    var wrap = document.getElementById('journeySteps');
    if (!wrap) return;
    var stages = pick(content.pathwayPreview.stages) || [];
    wrap.innerHTML = '';
    stages.forEach(function (label, i) {
      if (i > 0) wrap.appendChild(el('span', 'nh-journey-link'));
      var step = el('span', 'nh-journey-step',
        '<span class="nh-journey-dot">' + (i + 1) + '</span>' +
        '<span class="nh-journey-label">' + esc(label) + '</span>');
      wrap.appendChild(step);
    });
    observeJourney(wrap);
  }

  function observeJourney(wrap) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var steps = wrap.querySelectorAll('.nh-journey-step');
    var links = wrap.querySelectorAll('.nh-journey-link');
    function draw() {
      steps.forEach(function (n, i) { setTimeout(function () { n.classList.add('is-drawn'); }, reduce ? 0 : i * 140); });
      links.forEach(function (n, i) { setTimeout(function () { n.classList.add('is-drawn'); }, reduce ? 0 : 70 + i * 140); });
    }
    if (!('IntersectionObserver' in window)) { draw(); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { draw(); io.disconnect(); } });
    }, { threshold: 0.35 });
    io.observe(wrap);
  }

  // Field helpers: support both {ko,en} objects and Ko/En-suffixed fields.
  function fld(obj, base) {
    if (!obj) return '';
    if (obj[base] != null) return pick(obj[base]);
    var ko = obj[base + 'Ko'], en = obj[base + 'En'];
    if (ko != null || en != null) return pick({ ko: ko, en: en });
    return '';
  }
  function fldArr(obj, base) {
    var v = obj && obj[base];
    if (!v) return [];
    if (Array.isArray(v)) return v;
    var a = pick(v);
    return Array.isArray(a) ? a : [];
  }
  function srcTitle(s) { return (lang === 'en' && s.titleEn) ? s.titleEn : s.title; }
  function sourceById(id) { return srcMap[id]; }
  function sourceClassLabel(s) {
    var labels = content && content.ui && content.ui.sourceClassLabels;
    return labels && labels[s.sourceClass] ? pick(labels[s.sourceClass]) : (s.sourceType || '');
  }
  function srcChipsHtml(ids) {
    if (!ids || !ids.length) return '';
    var chips = ids.map(function (id) {
      var s = srcMap[id];
      if (!s) return '';
      return '<a class="nh-src-chip" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(srcTitle(s)) + '</a>';
    }).join('');
    return '<div class="nh-src-chips">' + chips + '</div>';
  }

  function richPathCardHtml(p) {
    var li = function (s) { return '<li>' + esc(s) + '</li>'; };
    var kc = fldArr(p, 'keyChecks').map(li).join('');
    var ev = fldArr(p, 'requiredEvidenceGroups').map(li).join('');
    var ns = fldArr(p, 'nextSteps').map(li).join('');
    var pathIndex = (paths.paths || []).findIndex(function (item) { return item.id === p.id; });
    var pathNumber = String(pathIndex >= 0 ? pathIndex + 1 : 1).padStart(2, '0');
    return '<div class="nh-path-card" data-path="' + esc(p.id) + '">' +
      '<button type="button" class="nh-path-head" aria-expanded="false">' +
      '<span class="nh-path-icon" aria-hidden="true">' + pathNumber + '</span>' +
      '<span class="nh-path-head-text"><strong>' + esc(fld(p, 'title')) + '</strong>' +
      '<span>' + esc(fld(p, 'summary')) + '</span></span>' +
      chipHtml(p.chip) +
      '<span class="nh-path-toggle" aria-hidden="true">▾</span>' +
      '</button>' +
      '<div class="nh-path-body"><div class="nh-path-detail">' +
      '<div><h5>' + esc(pick(content.ui.whoLabel)) + '</h5><ul><li>' + esc(fld(p, 'who')) + '</li></ul></div>' +
      (kc ? '<div><h5>' + esc(pick(content.ui.keyChecksLabel)) + '</h5><ul>' + kc + '</ul></div>' : '') +
      (ev ? '<div><h5>' + esc(pick(content.ui.evidenceLabel)) + '</h5><ul>' + ev + '</ul></div>' : '') +
      (ns ? '<div><h5>' + esc(pick(content.ui.nextStepsLabel)) + '</h5><ul>' + ns + '</ul></div>' : '') +
      '<div class="nh-path-caution">' + esc(fld(p, 'caution')) + '</div>' +

  function renderAll() {
    // The delegated click handler (incl. the language toggle) is live before the
    // content JSON resolves; without content the renderers below dereference null
    // (content.features/…) and throw. No-op until the payload has loaded — boot()
    // calls renderAll again once it is ready.
    if (!content) return;
    applyStatic();
    renderFeatures();
    renderPathway();
    renderKiip();
    renderAfter();
    renderHub();
    renderSources();
    if (activeOverlay && activeRebuild) activeRebuild();

  // ── Modal plumbing ───────────────────────────────────────────────────────
  function focusables(container) {
    return Array.prototype.slice.call(container.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(function (n) { return !n.disabled && n.offsetParent !== null; });
  }

  function trap(e) {
    if (e.key !== 'Tab' || !activeOverlay) return;
    var f = focusables(activeOverlay);
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function openOverlay(id, rebuild) {
    var ov = document.getElementById(id);
    if (!ov) return;
    lastFocus = document.activeElement;
    activeOverlay = ov;
    activeRebuild = rebuild || null;
    ov.classList.add('active');
    ov.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', trap);
    var preferred = ov.querySelector('legend[tabindex="-1"], [data-nh-result] h3[tabindex="-1"]');
    var f = focusables(ov);
    if (preferred) preferred.focus();
    else if (f.length) f[0].focus();
  }

  function closeOverlay() {
    if (!activeOverlay) return;
    activeOverlay.classList.remove('active');
    activeOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', trap);
    activeOverlay = null;
    activeRebuild = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  // ── Readiness check (one question per screen) ──────────────────────────────
  var readinessAnswers = {};
  var readinessStep = 0;

  function fillTemplate(str, vars) {
    return String(str == null ? '' : str).replace(/\{(\w+)\}/g, function (m, k) {
      return vars[k] != null ? vars[k] : m;
    });
  }

  function buildReadinessStep() {
    var r = flows.readiness;
    var qs = r.questions;
    if (readinessStep < 0) readinessStep = 0;
    if (readinessStep >= qs.length) { showReadinessResult(); return; }
    var q = qs[readinessStep];
    var isLast = readinessStep === qs.length - 1;
    document.getElementById('readinessTitle').textContent = pick(r.title);
    var body = document.getElementById('readinessBody');
    var foot = document.getElementById('readinessFoot');

    body.innerHTML = '';
    var progressText = fillTemplate(pick(r.progressLabel), { current: readinessStep + 1, total: qs.length });
    var progress = el('p', 'nh-progress', esc(progressText));
    progress.setAttribute('role', 'progressbar');
    progress.setAttribute('aria-valuemin', '1');
    progress.setAttribute('aria-valuemax', String(qs.length));
    progress.setAttribute('aria-valuenow', String(readinessStep + 1));
    progress.setAttribute('aria-valuetext', progressText);
    body.appendChild(progress);
    if (readinessStep === 0) body.appendChild(el('p', 'nh-section-intro', esc(pick(r.intro))));

    var fs = el('fieldset', 'nh-q');
    var legend = el('legend', null, esc(pick(q.q)));
    legend.setAttribute('tabindex', '-1');
    fs.appendChild(legend);
    var opts = el('div', 'nh-q-options');
    q.options.forEach(function (o) {
      var checked = readinessAnswers[q.id] === o.value ? ' checked' : '';
      var label = el('label', 'nh-opt',
        '<input type="radio" name="' + esc(q.id) + '" value="' + esc(o.value) + '"' + checked + '>' +
        '<span>' + esc(pick(o.label)) + '</span>');
      opts.appendChild(label);
    });
    fs.appendChild(opts);
    body.appendChild(fs);

    foot.innerHTML = '';
    // 확정 시안(116:27, "Btn / 닫기 — 라이브 미구현 · 반영 후보")대로 첫 질문에서는
    // 비어 있던 '이전' 자리에 '닫기'를 둔다. 헤더 ✕ 만으로도 나갈 수는 있었지만,
    // 푸터에서 손이 머무는 자리에 나가는 길이 없던 것이 시안이 지적한 지점이다.
    var back;
    if (readinessStep === 0) {
      back = el('button', 'nh-btn-sm', esc(pick(content.ui.close)));
      back.type = 'button';
      back.addEventListener('click', function () { closeOverlay(); });
    } else {
      back = el('button', 'nh-btn-sm', esc(pick(content.ui.back)));
      back.type = 'button';
      back.addEventListener('click', function () { readinessStep--; buildReadinessStep(); });
    }

    var next = el('button', 'nh-btn-sm primary', esc(pick(isLast ? content.ui.viewResult : content.ui.next)));
    next.type = 'button';
    next.disabled = readinessAnswers[q.id] == null;
    next.addEventListener('click', function () {
      if (readinessAnswers[q.id] == null) return;
      if (isLast) showReadinessResult();
      else { readinessStep++; buildReadinessStep(); }
    });

    opts.addEventListener('change', function (e) {
      if (e.target && e.target.name) {
        readinessAnswers[e.target.name] = e.target.value;
        next.disabled = false;
      }
    });

    foot.appendChild(back);
    foot.appendChild(next);
    legend.focus();
  }

  function evaluateReadiness(a) {
    var cats = { review: [], firstcheck: [], materials: [], official: [], risk: [] };
    var addP = function (id) { if (cats.review.indexOf(id) < 0) cats.review.push(id); };
    var addN = function (c, m) { if (cats[c].indexOf(m) < 0) cats[c].push(m); };
    var hasF5 = a.r_status === 'f5';

    if (a.r_spouse === 'intact' || a.r_spouse === 'changed') addP('marriage');
    if (a.r_family === 'parent') addP('family');
    if (a.r_family === 'selfPast') { addP('restoration'); addP('determination'); }
    if (a.r_family === 'overseas') { addP('family'); addP('restoration'); addP('determination'); addN('firstcheck', 'overseasInfo'); }
    if (hasF5 || a.r_residence === 'ge5') addP('general');

    if (a.r_status === 'unsure' || a.r_inkorea === 'unsure') addN('firstcheck', 'confirmStatus');
    var shortStay = a.r_residence === 'lt1' || a.r_residence === '1to2' || a.r_residence === '2to3' || a.r_residence === '3to5';
    if (a.r_need === 'f5first' || (!hasF5 && cats.review.indexOf('marriage') < 0 && cats.review.indexOf('family') < 0 && shortStay)) addN('firstcheck', 'needF5First');

    addN('official', 'officialAlways');
    if (a.r_kiip && a.r_kiip !== 'done') addN('official', 'kiipNeeded');

    addN('materials', 'materialsGeneral');
    if (cats.review.indexOf('marriage') >= 0) addN('materials', 'materialsMarriage');
    if (a.r_need === 'docs') addN('materials', 'materialsDocs');
    if (a.r_need === 'kiip') addN('materials', 'kiipPrep');
    if (a.r_need === 'progress') addN('materials', 'progressInfo');
    if (a.r_need === 'after') addN('materials', 'afterInfo');

    if (a.r_risk === 'absence' || a.r_residence === 'gap') addN('risk', 'riskAbsence');
    if (a.r_risk === 'tax') addN('risk', 'riskTax');
    if (a.r_risk === 'criminal') addN('risk', 'riskCriminal');
    if (a.r_risk === 'complexFamily') addN('risk', 'riskComplexFamily');

    if (cats.review.length === 0) addN('firstcheck', 'limited');
    return cats;
  }

  function showReadinessResult() {
    var r = flows.readiness;
    var body = document.getElementById('readinessBody');
    var foot = document.getElementById('readinessFoot');
    var cats = evaluateReadiness(readinessAnswers);
    body.innerHTML = '';
    var head = el('div', null, '');
    head.setAttribute('data-nh-result', '1');
    var resultHeading = el('h3', null, esc(pick(r.resultTitle)));
    resultHeading.setAttribute('tabindex', '-1');
    head.appendChild(resultHeading);
    head.appendChild(el('p', 'nh-section-intro', esc(pick(r.resultIntro))));
    body.appendChild(head);

    var order = ['review', 'firstcheck', 'materials', 'official', 'risk'];
    order.forEach(function (catId) {
      var entries = cats[catId];
      if (!entries || !entries.length) return;
      var cat = catMap[catId] || { ko: catId, en: catId, tone: 'neutral', icon: '·' };
      var block = el('div', 'nh-result-cat');
      block.setAttribute('data-tone', cat.tone || 'neutral');
      block.appendChild(el('p', 'nh-result-cat-head',
        '<span class="nh-chip-glyph" aria-hidden="true">' + esc(cat.icon) + '</span>' + esc(pick(cat))));
      if (catId === 'review') {
        entries.forEach(function (pid) {
          var p = pathById(pid);
          if (p) block.insertAdjacentHTML('beforeend', richPathCardHtml(p));
        });
      } else {
        entries.forEach(function (mid) {
          var msg = r.messages[mid];
          if (msg) block.appendChild(el('div', 'nh-result-note', esc(pick(msg))));
        });
      }
      body.appendChild(block);
    });
    wirePathCards(body);
    body.appendChild(el('p', 'nh-inline-note', esc(pick(r.disclaimer))));

    foot.innerHTML = '';
    var again = el('button', 'nh-btn-sm', esc(pick(content.ui.restart)));
    again.type = 'button';
    again.addEventListener('click', function () { readinessStep = 0; readinessAnswers = {}; buildReadinessStep(); });
    var pf = el('button', 'nh-btn-sm primary', esc(pick(flows.pathFinder.title)));
    pf.type = 'button';
    pf.addEventListener('click', function () { closeOverlay(); openPathfinder(); });
    foot.appendChild(again);
    foot.appendChild(pf);
    body.scrollTop = 0;
    requestAnimationFrame(function () { resultHeading.focus(); });
  }

  function openReadiness() {
    readinessStep = 0;
    readinessAnswers = {};
    buildReadinessStep();
    openOverlay('readinessModal', function () {
      var inResult = document.querySelector('#readinessBody [data-nh-result]');
      if (inResult) showReadinessResult(); else buildReadinessStep();
    });
  }

  // ── Path finder ──────────────────────────────────────────────────────────
  function pathById(id) {
    return (paths.paths || []).filter(function (p) { return p.id === id; })[0];
  }

  var pfAnswers = {};
  var pfStep = 0;

  function pfSteps(a) {
    var pf = flows.pathFinder;
    var variant = (a.pf_start && pf.step2.byChoice[a.pf_start]) ? pf.step2.byChoice[a.pf_start] : pf.step2.fallback;
    return [
      { id: pf.step1.id, q: pf.step1.q, options: pf.step1.options },
      { id: pf.step2.id, q: pf.step2.q, options: variant },
      { id: pf.step3.id, q: pf.step3.q, options: pf.step3.options }
    ];
  }

  function buildPathfinderStep() {
    var pf = flows.pathFinder;
    var steps = pfSteps(pfAnswers);
    if (pfStep < 0) pfStep = 0;
    if (pfStep >= steps.length) { showPathfinderResult(); return; }
    var step = steps[pfStep];
    var isLast = pfStep === steps.length - 1;
    document.getElementById('pathfinderTitle').textContent = pick(pf.title);
    var body = document.getElementById('pathfinderBody');
    var foot = document.getElementById('pathfinderFoot');

    body.innerHTML = '';
    var progressText = fillTemplate(pick(pf.progressLabel), { current: pfStep + 1, total: steps.length });
    var progress = el('p', 'nh-progress', esc(progressText));
    progress.setAttribute('role', 'progressbar');
    progress.setAttribute('aria-valuemin', '1');
    progress.setAttribute('aria-valuemax', String(steps.length));
    progress.setAttribute('aria-valuenow', String(pfStep + 1));
    progress.setAttribute('aria-valuetext', progressText);
    body.appendChild(progress);
    if (pfStep === 0) body.appendChild(el('p', 'nh-section-intro', esc(pick(pf.intro))));
    var fs = el('fieldset', 'nh-q');
    var legend = el('legend', null, esc(pick(step.q)));
    legend.setAttribute('tabindex', '-1');
    fs.appendChild(legend);
    var opts = el('div', 'nh-q-options');
    step.options.forEach(function (o) {
      var checked = pfAnswers[step.id] === o.value ? ' checked' : '';
      opts.appendChild(el('label', 'nh-opt',
        '<input type="radio" name="' + esc(step.id) + '" value="' + esc(o.value) + '"' + checked + '><span>' + esc(pick(o.label)) + '</span>'));
    });
    fs.appendChild(opts);
    body.appendChild(fs);

    foot.innerHTML = '';
    var back = el('button', 'nh-btn-sm', esc(pick(content.ui.back)));
    back.type = 'button';
    back.style.visibility = pfStep === 0 ? 'hidden' : 'visible';
    back.addEventListener('click', function () { pfStep--; buildPathfinderStep(); });
    var next = el('button', 'nh-btn-sm primary', esc(pick(isLast ? content.ui.viewResult : content.ui.next)));
    next.type = 'button';
    next.disabled = pfAnswers[step.id] == null;
    next.addEventListener('click', function () {
      if (pfAnswers[step.id] == null) return;
      if (isLast) showPathfinderResult();
      else { pfStep++; buildPathfinderStep(); }
    });
    opts.addEventListener('change', function (e) {
      if (e.target && e.target.name) {
        pfAnswers[e.target.name] = e.target.value;
        // Branching: clear downstream answers so step 2/3 stay consistent.
        var ss = pfSteps(pfAnswers);
        for (var j = pfStep + 1; j < ss.length; j++) { delete pfAnswers[ss[j].id]; }
        next.disabled = false;
      }
    });
    foot.appendChild(back);
    foot.appendChild(next);
    legend.focus();
  }

  function pfRoutes(a) {
    var pf = flows.pathFinder;
    var opt = (pf.step1.options || []).filter(function (o) { return o.value === a.pf_start; })[0];
    var routes = opt ? (opt.routesTo || []).slice() : [];
    if (a.pf_start === 'overseas' && a.pf_situation === 'restoreVsNat') routes = ['restoration', 'determination', 'general'];
    if (a.pf_start === 'restore' && a.pf_situation === 'lostByForeign') routes = ['restoration'];
    if (a.pf_start === 'applied') routes = ['after'];
    if (a.pf_start === 'dual') routes = ['dual'];
    if (!routes.length) routes = ['general', 'marriage', 'family', 'restoration'];
    return routes;
  }

  function showPathfinderResult() {
    var pf = flows.pathFinder;
    var body = document.getElementById('pathfinderBody');
    var foot = document.getElementById('pathfinderFoot');
    body.innerHTML = '';
    var head = el('div', null, '');
    head.setAttribute('data-nh-result', '1');
    var resultHeading = el('h3', null, esc(pick(pf.resultTitle)));
    resultHeading.setAttribute('tabindex', '-1');
    head.appendChild(resultHeading);
    head.appendChild(el('p', 'nh-section-intro', esc(pick(pf.resultIntro))));
    body.appendChild(head);
    pfRoutes(pfAnswers).forEach(function (id) {
      var p = pathById(id);
      if (p) body.insertAdjacentHTML('beforeend', richPathCardHtml(p));
    });
    wirePathCards(body);
    var bn = pf.blockerNotes[pfAnswers.pf_blocker];
    if (bn) body.appendChild(el('div', 'nh-result-note', '<strong>' + esc(pick(pf.nextActionLabel)) + ':</strong> ' + esc(pick(bn))));
    body.appendChild(el('p', 'nh-inline-note', esc(pick(pf.disclaimer))));

    foot.innerHTML = '';
    var again = el('button', 'nh-btn-sm', esc(pick(content.ui.restart)));
    again.type = 'button';
    again.addEventListener('click', function () { pfStep = 0; pfAnswers = {}; buildPathfinderStep(); });
    var wm = el('a', 'nh-btn-sm primary', esc(pick(content.ui.openWaymaker)));
    wm.href = 'ai.html?domain=nationality';
    foot.appendChild(again);
    foot.appendChild(wm);
    body.scrollTop = 0;
    requestAnimationFrame(function () { resultHeading.focus(); });
  }

  function openPathfinder() {
    pfStep = 0;
    pfAnswers = {};
    buildPathfinderStep();
    openOverlay('pathfinderModal', function () {
      var inResult = document.querySelector('#pathfinderBody [data-nh-result]');
      if (inResult) showPathfinderResult(); else buildPathfinderStep();
    });
  }

  // ── Hub detail ───────────────────────────────────────────────────────────
  function openHubDetail(id) {
    var item = content.hub.items.filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    document.getElementById('detailTitle').textContent = pick(item.label);
    var body = document.getElementById('detailBody');
    var foot = document.getElementById('detailFoot');
    var rows = '<div class="nh-detail-row"><p>' + esc(pick(item.desc)) + '</p></div>';
    if (item.who) rows += '<div class="nh-detail-row"><h4>' + esc(pick(content.ui.whoLabel)) + '</h4><p>' + esc(pick(item.who)) + '</p></div>';
    if (item.firstCheck) rows += '<div class="nh-detail-row"><h4>' + esc(pick(content.ui.firstCheckLabel)) + '</h4><p>' + esc(pick(item.firstCheck)) + '</p></div>';
    if (item.caution) rows += '<div class="nh-path-caution">' + esc(pick(item.caution)) + '</div>';
    if (item.sourceIds && item.sourceIds.length) rows += '<div class="nh-detail-row"><h4>' + esc(pick(content.ui.sourcesLabel)) + '</h4>' + srcChipsHtml(item.sourceIds) + '</div>';
    rows += '<p class="nh-inline-note">' + esc(pick(content.hub.expansionNote)) + '</p>';
    body.innerHTML = rows;
    foot.innerHTML = '';
    foot.appendChild(el('span', 'nh-modal-disclaimer', esc(pick(content.notice))));
    var wm = el('a', 'nh-btn-sm primary', esc(pick(content.ui.openWaymaker)));
    wm.href = 'ai.html?domain=nationality';
    foot.appendChild(wm);
    openOverlay('detailModal', function () { openHubDetail(id); });
  }

  // ── Theme / brightness / language ────────────────────────────────────────
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'archive_diary' ? 'archive_diary' : 'civic_editorial';
  }
  function toggleTheme() {
    var next = currentTheme() === 'civic_editorial' ? 'archive_diary' : 'civic_editorial';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    syncThemeLabel();
    syncMeta();
  }
  // The style button is icon-only; its current style travels in the hidden
  // label and the tooltip.
  function syncThemeLabel() {
    var name = currentTheme() === 'archive_diary' ? 'Editorial-pop' : 'Editorial';
    var label = document.getElementById('themeBtnLabel');
    if (label) label.textContent = name;
    var btn = document.getElementById('themeBtn');
    if (btn) btn.setAttribute('title', pick({ ko: '화면 스타일', en: 'Page style', 'zh-CN': '页面风格' }) + ' · ' + name);
  }
  function toggleBrightness() {
    var dark = document.body.getAttribute('data-theme') === 'dark';
    if (dark) document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', 'dark');
    try { localStorage.setItem(BRIGHT_KEY, dark ? 'light' : 'dark'); } catch (e) {}
    syncMeta();
  }
  // Show an unobtrusive note near the control when the selected locale is not
  // fully translated on this page (rendered via the ko fallback).
  function updateLangNote(sel) {
    // A full-width strip under the bar: a floating tooltip here covered the
    // hero on phones.
    var bar = document.querySelector('.nh-topbar');
    if (!bar) return;
    var note = document.getElementById('nhLangNote');
    var untranslated = sel !== 'ko' && !LANG_TRANSLATED[sel];
    if (untranslated) {
      if (!note) {
        note = document.createElement('p');
        note.id = 'nhLangNote';
        note.className = 'nh-lang-note';
        note.setAttribute('role', 'note');
        note.setAttribute('data-s2t', 'off');
        bar.insertAdjacentElement('afterend', note);
      }
      note.textContent = '이 페이지는 선택한 언어 번역 준비 중입니다 · This page is not yet translated into the selected language.';
    } else if (note) {
      note.remove();
    }
  }
  function renderLangMenu() {
    var menu = document.getElementById('nhLangMenu');
    if (!menu) return;
    menu.innerHTML = LANG_ORDER.map(function (code) {
      var selected = code === selectedLocale;
      var translated = !!LANG_TRANSLATED[code];
      var note = translated ? '' : '<span class="nh-lang-option-note">이 페이지 번역 준비 중</span>';
      return '<button type="button" class="nh-lang-option" role="option" aria-selected="' + (selected ? 'true' : 'false') +
        '" data-action="select-language" data-lang="' + esc(code) + '">' +
        '<span class="nh-lang-option-code">' + esc(LANG_SHORT[code] || code.toUpperCase()) + '</span>' +
        '<span class="nh-lang-option-name">' + esc(LANG_LABEL[code] || code) + note + '</span>' +
        '<span class="nh-lang-option-state" aria-hidden="true">' + (selected ? '✓' : '') + '</span></button>';
    }).join('');
  }
  function toggleLangMenu(forceOpen) {
    var menu = document.getElementById('nhLangMenu');
    var btn = document.getElementById('langBtn');
    if (!menu || !btn) return;
    var open = forceOpen === undefined ? !menu.classList.contains('open') : !!forceOpen;
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) renderLangMenu();
  }
  function setLanguage(code) {
    if (LANG_ORDER.indexOf(code) < 0) return;
    selectedLocale = code;
    tradTW = (selectedLocale === 'zh-TW');
    lang = contentLocaleFor(selectedLocale);
    // Preserve the shared global language choice across Visable surfaces.
    try { localStorage.setItem(LANG_KEY, selectedLocale); } catch (e) {}
    applyTradLayer(tradTW);
    toggleLangMenu(false);
    renderAll();
  }
  function syncMeta() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    var bg = getComputedStyle(document.body).getPropertyValue('--bg0').trim();
    if (bg) meta.setAttribute('content', bg);
  }

  // ── Action dispatch ──────────────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    var handlers = {
      'toggle-lang-menu': function () { toggleLangMenu(); },
      'select-language': function () { setLanguage(t.getAttribute('data-lang')); },
      'toggle-theme': toggleTheme,
      'toggle-brightness': toggleBrightness,
      'open-readiness': openReadiness,
      'open-pathfinder': openPathfinder,
      'close-modal': closeOverlay,
      'open-hub': function () { openHubDetail(t.getAttribute('data-id')); },
      'open-waymaker': function () { window.location.href = 'ai.html?domain=nationality'; },
      'scroll-kiip': function () { scrollTo('kiip'); },
      'scroll-after': function () { scrollTo('after'); },
      'scroll-hub': function () { scrollTo('hub'); },
      'scroll-interview': function () { scrollTo('interviewBridge'); },
      'scroll-sources': function () { scrollTo('sources'); }
    };
    if (handlers[action]) {
      if (t.tagName !== 'A') e.preventDefault();
      handlers[action]();
    }
  });

  // Backdrop click closes the active modal; outside click closes the language menu.
  document.addEventListener('click', function (e) {
    if (activeOverlay && e.target === activeOverlay) closeOverlay();
    var wrap = document.getElementById('nhLangWrap');
    var menu = document.getElementById('nhLangMenu');
    if (wrap && menu && menu.classList.contains('open') && !wrap.contains(e.target)) toggleLangMenu(false);
  });

  // ESC closes the language menu first, then the active modal.
  document.addEventListener('keydown', function (e) {
    var menu = document.getElementById('nhLangMenu');
    if (e.key === 'Escape' && menu && menu.classList.contains('open')) {
      e.preventDefault();
      toggleLangMenu(false);
      var btn = document.getElementById('langBtn');
      if (btn) btn.focus();
      return;
    }
    if (e.key === 'Escape' && activeOverlay) { e.preventDefault(); closeOverlay(); }
  });

  function scrollTo(id) {
    var n = document.getElementById(id);
    if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // In-page navigation marks the section being read (aria-current), so the
  // sticky bar also works as a "you are here".
  function watchSections() {
    if (!('IntersectionObserver' in window)) return;
    var links = Array.prototype.slice.call(document.querySelectorAll('.nh-section-nav a[href^="#"]'));
    var byId = {};
    links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      var current = null;
      links.forEach(function (a) { var id = a.getAttribute('href').slice(1); if (!current && visible[id]) current = id; });
      links.forEach(function (a) {
        if (a.getAttribute('href').slice(1) === current) a.setAttribute('aria-current', 'true');
        else a.removeAttribute('aria-current');
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    Object.keys(byId).forEach(function (id) { var n = document.getElementById(id); if (n) io.observe(n); });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  function showLoadError() {
    var main = document.getElementById('nhMain');
    if (main) {
      main.innerHTML = '<div class="nh-loaderr"><p>콘텐츠를 불러오지 못했습니다. / Content could not be loaded.</p>' +
        '<p><a href="index.html">← Visable</a></p></div>';
    }
  }

  function getJson(path, label) {
    return fetch(path, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(label); return r.json(); });
  }

  function boot() {
    Promise.all([
      getJson('data/nationality_content.json', 'content'),
      getJson('data/nationality_paths.json', 'paths'),
      getJson('data/nationality_flows.json', 'flows'),
      getJson('data/nationality_sources.json', 'sources')
    ]).then(function (res) {
      content = res[0];
      paths = res[1];
      flows = res[2];
      sources = res[3];
      (flows.statusChips || []).forEach(function (c) { chipMap[c.id] = c; });
      (flows.resultCategories || []).forEach(function (c) { catMap[c.id] = c; });
      (sources.sources || []).forEach(function (s) { srcMap[s.sourceId] = s; });
      if (SUPPORTED.indexOf(lang) < 0) lang = 'ko';
      try {
        var savedBrightness = localStorage.getItem(BRIGHT_KEY);
        var useDark = savedBrightness === 'dark' ||
          (savedBrightness === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (useDark) document.body.setAttribute('data-theme', 'dark');
        else document.body.removeAttribute('data-theme');
      } catch (e) {}
      renderAll();
      syncMeta();
      watchSections();
    }).catch(function () { showLoadError(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
