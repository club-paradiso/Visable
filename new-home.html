جعة استناداً إلى المعلومات التي تُدخلها فحسب، ولا تقرّر الموافقة من عدمها.","귀화 준비 점검":"فحص جاهزية التجنّس","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"ننظّم بنود التحقّق المتعلّقة بالإقامة والعلاقات الأسرية وKIIP والتقييم سؤالاً تلو الآخر، ونوصلك بالمسار الرسمي المعنيّ.","준비 점검 시작":"ابدأ الفحص","귀화 경로 찾기":"اعثر على مسار التجنّس","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"لا حاجة لمعرفة المصطلحات القانونية أولاً. اختر وضعك الحالي خطوة بخطوة لنرشدك إلى المسارات التي تستحقّ المراجعة.","경로 찾기":"البحث عن المسار","KIIP·평가 확인":"التحقّق من KIIP والتقييم","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"تحقّق من أوجه الاختلاف بين تعليم وتقييم برنامج الاندماج الاجتماعي وإجراءات الجنسية، وننقلك إلى الإرشاد الرسمي من Socinet ووزارة العدل.","준비 항목 보기":"عرض بنود التجهيز","귀화 후 절차":"إجراءات ما بعد التجنّس","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"نستعرض في صورة قائمة تحقّق الإجراءات الإدارية بعد الموافقة — من التحقّق من إعلان الجريدة الرسمية إلى تسجيل العلاقات الأسرية وتسجيل المقيمين وتسوية الجنسية الأجنبية.","체크리스트 보기":"عرض قائمة التحقّق","국적업무 허브":"مركز شؤون الجنسية","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"نستعرض في مكان واحد مجمل شؤون الجنسية: التجنّس واستعادة الجنسية وتحديد الجنسية واختيار الجنسية وتعدّد الجنسيات وتعهّد عدم ممارسة الجنسية الأجنبية وغيرها.","허브 열기":"فتح المركز","Waymaker — 내 절차 찾기":"Waymaker — البحث عن إجراءاتي","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"اختر وضع إقامتك وحالتك لتتحقّق ممّا يجب تجهيزه ومن الأسس الرسمية. ونرشدك أيضاً في مجال الجنسية والتجنّس.","내 절차 찾기":"البحث عن إجراءاتي","전체 흐름 미리보기":"معاينة المسار الكامل","KIIP·평가 공식 안내":"الإرشاد الرسمي لـ KIIP والتقييم","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"تعليم وتقييم برنامج الاندماج الاجتماعي (KIIP) منفصلان عن إجراءات الجنسية. يجب التحقّق من الدورة والتقييم والمقابلة المنطبقة عليك ومن أحدث المواعيد عبر Socinet أو الجهة المختصّة.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP هو برنامج التعليم والتقييم للاندماج الاجتماعي التابع لوزارة العدل. قد يُؤخذ إتمامه أو نتيجة تقييمه بعين الاعتبار في بعض إجراءات الإقامة أو الجنسية، لكنه بحدّ ذاته لا يضمن تلقائياً الأهلية أو الموافقة.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"إتمام دورة KIIP، والتقييم المسبق والتقييم المتوسّط لتحديد المرحلة، والتقييم الشامل لأغراض الإقامة الدائمة أو التجنّس، إجراءات مختلفة بعضها عن بعض. كما لا يمكن الجزم بأنّ مقابلة التجنّس والتقييم الشامل إجراء واحد.","내 KIIP 단계 확인":"تحقّق من مرحلة KIIP الخاصة بك","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"ننظّم كيفية التحقّق من المرحلة المخصّصة لك والمرحلة التالية وحالة الإتمام عبر شبكة معلومات الاندماج الاجتماعي.","평가 유형 확인":"تحديد نوع التقييم","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"تحقّق عبر الإعلانات الرسمية من نوع التقييم المعنيّ بك: التقييم المسبق أم المتوسّط أم الشامل لأغراض الإقامة الدائمة أو التجنّس.","귀화면접 공식자료 찾기":"البحث عن المواد الرسمية لمقابلة التجنّس","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"تحقّق من وجود مواد رسمية وأحدث إرشاد بشأن فحص المقابلة في دليل خدمات شؤون الجنسية لدى وزارة العدل.","면제·인정 여부 확인":"التحقّق من الإعفاء أو الاعتراف","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"تحقّق عبر الإرشاد الرسمي والجهة المختصّة من كيفية الاعتراف بإتمام KIIP أو نتيجة التقييم في إجراءاتك. لا تبتّ Paradiso في الإعفاءات.","공식 면접자료 확인":"مراجعة المواد الرسمية للمقابلة","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"أعطِ الأولوية لمواد المقابلة التي تنشرها وزارة العدل ولإرشاد الجهة المختصّة بدلاً من قوائم الأسئلة المتوقّعة غير الرسمية.","공식 일정 확인":"التحقّق من الموعد الرسمي","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"تحقّق من مواعيد التقييم والتقديم مباشرةً عبر شبكة معلومات الاندماج الاجتماعي / موقع التقييم. لا تذكر Paradiso المواعيد من تلقاء نفسها.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"يجب التحقّق من مواعيد التقييم ومعاييره التفصيلية عبر مصادر رسمية مثل شبكة معلومات الاندماج الاجتماعي.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"أمثلة على الإجراءات الإدارية التي يمكن الاطّلاع عليها بعد الموافقة. قد تختلف البنود وترتيبها تبعاً للظروف الشخصية، وهذه ليست قائمة كاملة تنطبق على الجميع بالتساوي.","관보 고시 확인":"التحقّق من إعلان الجريدة الرسمية","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"تُؤكَّد القرارات المتعلّقة بالتجنّس والجنسية عبر إعلان الجريدة الرسمية.","전자관보에서 본인 관련 고시를 확인하세요.":"تحقّق من الإعلان الخاص بك في الجريدة الرسمية الإلكترونية.","가족관계등록 관련 확인":"التحقّق المتعلّق بتسجيل العلاقات الأسرية","가족관계등록 절차가 필요한지 확인합니다.":"تحقّق ممّا إذا كان إجراء تسجيل العلاقات الأسرية مطلوباً.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"تحقّق من المستندات والإجراءات المطلوبة وفقاً لإرشاد الجهة المختصّة.","주민등록 관련 확인":"التحقّق المتعلّق بتسجيل المقيمين","거주지 주민등록 절차를 확인합니다.":"تحقّق من إجراء تسجيل المقيمين لمكان إقامتك.","주소지 관할 행정기관에서 절차를 확인하세요.":"تحقّق من الإجراء لدى الجهة الإدارية المختصّة بعنوانك.","주민등록증 발급":"إصدار بطاقة تسجيل المقيمين","주민등록증 발급 절차를 확인합니다.":"تحقّق من إجراء إصدار بطاقة تسجيل المقيمين.","발급 요건·장소를 관할 기관에서 확인하세요.":"تحقّق من متطلّبات الإصدار ومكانه لدى الجهة المختصّة.","외국인등록증 처리":"معالجة بطاقة تسجيل الأجانب","기존 외국인등록증 처리 방법을 확인합니다.":"تحقّق من كيفية معالجة بطاقة تسجيل الأجانب السابقة.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"تحقّق من كيفية المعالجة عبر HiKorea / مكتب الهجرة المختصّ.","대한민국 여권 발급":"إصدار جواز سفر جمهورية كوريا","대한민국 여권 발급 절차를 확인합니다.":"تحقّق من إجراء إصدار جواز سفر جمهورية كوريا.","여권 발급 기관 안내에 따라 준비하세요.":"جهّز وفقاً لإرشاد جهة إصدار جوازات السفر.","은행/통신/보험/학교/직장 정보 변경":"تحديث بيانات البنك والاتصالات والتأمين والمدرسة وجهة العمل","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"اعكس التغيير لدى الجهات المرتبطة بسجلّات هويتك.","각 기관별 신원 정보 변경 절차를 확인하세요.":"تحقّق من إجراء تحديث بيانات الهوية لدى كل جهة.","외국국적 포기 또는 외국국적불행사서약 확인":"التحقّق من التخلّي عن الجنسية الأجنبية أو تعهّد عدم ممارستها","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 대한 안내입니다.":"إرشاد حول مرحلة الفحص التي تتحقّق من المتطلّبات والسلوك بعد تقديم طلب التجنّس.","귀화 신청을 준비하거나 심사를 앞둔 분":"من يجهّز لتقديم طلب التجنّس أو يوشك على الفحص","심사에서 확인될 수 있는 항목과 본인 준비 상태":"البنود التي قد تُفحَص وحالة جاهزيتك","국적 심사 진행상황 조회":"الاستعلام عن سير فحص الجنسية","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"إرشاد حول خدمة التحقّق من حالة السير عبر الإنترنت بعد التقديم.","이미 신청하고 결과를 기다리는 분":"من قدّم الطلب وينتظر النتيجة","조회에 필요한 정보와 접속 경로":"المعلومات اللازمة للاستعلام ومسار الدخول","귀화허가 등 처분은 관보 고시로 확인합니다.":"تُؤكَّد القرارات مثل الموافقة على التجنّس عبر إعلان الجريدة الرسمية.","허가 여부·시점을 확인하려는 분":"من يريد التحقّق من الموافقة وتوقيتها","전자관보 국적·귀화 테마에서 본인 관련 고시":"الإعلان الخاص بك في قسم الجنسية/التجنّس بالجريدة الرسمية الإلكترونية","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"تُعزَّز المتطلّبات التفصيلية والمستندات والإجراءات لكل بند تدريجياً بعد التحقّق من المصادر الرسمية.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker هو دليل إجرائي يلملم بناءً على المصادر الرسمية إجراءاتك ومستنداتك وحجزك وخطوتك التالية. يقتصر دور الذكاء الاصطناعي على شرح الإرشاد المُولَّد، ولا ينشئ مستندات أو رسوماً أو مهلاً جديدة. أجرِ التحقّق النهائي عبر HiKorea·1345·مكتب الهجرة المختصّ.","국적민원·귀화면접 준비":"شؤون الجنسية وتجهيز مقابلة التجنّس","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"تحقّق في مكان واحد من التجنّس واستعادة الجنسية وفقدانها أو التخلّي عنها وتعدّد الجنسيات وقَسَم المواطنة وتجهيز مقابلة التجنّس. يمكنك الاطّلاع على المسار الأقرب إلى وضعك استناداً إلى القوانين والإرشادات الرسمية.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"بطاقات الأسئلة المتوقّعة · تدريب على المقابلة التجريبية · مقاطع مرجعية · مدرّب Waymaker","준비 시작하기":"ابدأ التجهيز","꼭 확인하세요":"يُرجى أخذ ما يلي في الحسبان","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"تتوقّف نتائج اكتساب الجنسية والتجنّس على الوقائع المحدّدة لكل شخص وعلى فحص الجهة المختصّة. إرشاد Paradiso مادة استرشادية تساعد على تنظيم الاتجاه، ولا يبتّ في الأهلية أو الموافقة النهائية ولا يحلّ محلّ الاستشارة القانونية.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"نظّمنا المصادر الرسمية المتعلّقة بالجنسية وKIIP حسب النوع ونطاق التطبيق. جرى التحقّق من الروابط والبيانات الوصفية العامة بتاريخ 2026-06-28، فيُرجى التحقّق مجدداً من أحدث إعلان في كل صفحة رسمية قبل التقديم.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso ليست لها علاقة شراكة أو تبعية مع وزارة العدل·HiKorea·Socinet·بوّابة التأشيرات·البعثات الخارجية. هذه الروابط للوصل بهدف التحقّق من أحدث إرشاد للجهة الرسمية المختصّة.","Paradiso 메인으로 돌아가기":"العودة إلى الصفحة الرئيسية لـ Paradiso","검토 가능":"قابل للمراجعة","공식 확인 필요":"يلزم تحقّق رسمي","준비 단계":"مرحلة التجهيز","추가 확인 필요":"يلزم تحقّق إضافي","판단 제한":"البتّ محدود","검토 가능 경로":"المسارات القابلة للمراجعة","먼저 확인할 항목":"البنود التي يجب التحقّق منها أولاً","준비하면 좋은 자료":"مواد يُستحسن تجهيزها","주의할 리스크":"مخاطر يجب الانتباه إليها","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"بالإجابة عن الأسئلة الثمانية، واحداً تلو الآخر، ننظّم لك اتجاه أيّ مسارات التجنّس يمكنك مراجعتها. هذا الفحص التحضيري لا يقرّر الموافقة من عدمها، وهو إرشاد استرشادي مبنيّ على المعلومات التي تُدخلها.","현재 한국에 체류 중인가요?":"هل أنت مقيم حالياً في كوريا؟","예, 한국에 체류 중입니다":"نعم، أنا مقيم في كوريا","아니요, 해외에 있습니다":"لا، أنا في الخارج","잘 모르겠습니다":"لست متأكّداً","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"ما الأقرب إلى وضع إقامتك أو صفتك الحالية؟","F-5 영주자격":"F-5 صفة الإقامة الدائمة","F-6 결혼이민":"F-6 الهجرة بالزواج","F-4 재외동포":"F-4 الكوريون في الخارج","E계열 취업 체류자격":"صفة إقامة عمل من فئة E","D계열 유학/연수 체류자격":"صفة إقامة دراسة/تدريب من فئة D","기타 장기체류":"إقامة طويلة الأمد أخرى","체류자격을 잘 모르겠습니다":"لست متأكّداً من وضع إقامتي","한국에 계속 거주한 기간은 어느 정도인가요?":"كم تبلغ مدة إقامتك المتواصلة في كوريا؟","1년 미만":"أقل من سنة","1년 이상 2년 미만":"سنة فأكثر وأقل من سنتين","2년 이상 3년 미만":"سنتان فأكثر وأقل من 3 سنوات","3년 이상 5년 미만":"3 سنوات فأكثر وأقل من 5 سنوات","5년 이상":"5 سنوات فأكثر","중간에 장기출국 또는 체류 공백이 있었습니다":"كانت هناك مغادرة طويلة أو فجوة في الإقامة في الأثناء","한국 국민 배우자가 있나요?":"هل لديك زوج/زوجة من المواطنين الكوريين؟","예, 혼인관계를 유지하고 있습니다":"نعم، والعلاقة الزوجية قائمة","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"نعم، لكن مع تغيّرات مثل الطلاق/الترمّل/الانفصال","아니요":"لا","답변하기 어렵습니다":"يصعب عليّ الإجابة","부모 또는 가족의 한국 국적 이력이 있나요?":"هل لدى أحد والديك أو أفراد أسرتك سجلّ جنسية كورية؟","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"أحد الوالدين أو كلاهما مواطن كوري أو كان مواطناً كورياً سابقاً","본인이 과거 한국 국적을 가진 적이 있습니다":"سبق أن حملتُ الجنسية الكورية","재외동포/F-4 관련 이력이 있습니다":"لديّ صلة بالكوريين في الخارج / F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"هل لديك سجلّ في برنامج الاندماج الاجتماعي (KIIP) أو في التقييم الشامل لأغراض التجنّس؟","KIIP 5단계 수료 및 귀화용 종합평가 합격":"أتممتُ المرحلة الخامسة من KIIP واجتزتُ التقييم الشامل لأغراض التجنّس","KIIP를 일부 이수했습니다":"أتممتُ جزءاً من KIIP","귀화용 종합평가만 응시/합격했습니다":"تقدّمتُ فقط للتقييم الشامل لأغراض التجنّس / اجتزتُه","아직 없습니다":"ليس بعد","추가 확인이 필요한 사유가 있나요?":"هل هناك أسباب تستلزم تحقّقاً إضافياً؟","장기출국 또는 체류 공백":"مغادرة طويلة أو فجوة في الإقامة","세금 체납 또는 소득 증빙 어려움":"تأخّر في سداد الضرائب أو صعوبة في إثبات الدخل","범죄·수사·행정처분 이력":"سجلّ جنائي·تحقيقي·إجراء إداري","혼인관계 또는 가족관계 증빙이 복잡함":"إثبات العلاقة الزوجية أو الأسرية معقّد","해당 없음":"لا ينطبق","지금 가장 필요한 안내는 무엇인가요?":"ما الإرشاد الذي تحتاجه أكثر الآن؟","내가 어떤 귀화 경로를 검토할 수 있는지":"أيّ مسارات التجنّس يمكنني مراجعتها","먼저 F-5 또는 체류자격 정리가 필요한지":"ما إذا كان عليّ ترتيب F-5 أو وضع الإقامة أولاً","서류와 증빙 준비":"تجهيز المستندات والإثباتات","KIIP/면접 준비":"تجهيز KIIP / المقابلة","신청 후 진행상황 확인":"التحقّق من سير الإجراء بعد التقديم","검토 방향 요약":"ملخّص اتجاهات المراجعة","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"هذه اتجاهات تستحقّ الاطّلاع بناءً على المعلومات التي أدخلتها. وما يلي تنظيم للاحتمالات فحسب، أمّا إمكانية التقديم الفعلية والموافقة فتتطلّبان فحص الجهة المختصّة والتحقّق من المعايير الرسمية.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"هذه النتيجة إرشاد استرشادي مبنيّ على المعلومات التي قدّمها المستخدم، وليست بتّاً قانونياً نهائياً ولا قرار موافقة.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"إمكانية التقديم النهائية والموافقة من عدمها تتطلّبان فحص الجهة المختصّة والتحقّق من المعايير الرسمية (قانون الجنسية·وزارة العدل·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"قد يفيدك ترتيب الإقامة الدائمة (F-5) أو وضع الإقامة أولاً. تحقّق من الترتيب الملائم لوضعك لدى الجهة المختصّة.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"يصبح الاطّلاع أيسر عند التحقّق بدقّة من وضع إقامتك الحالي. تحقّق منه عبر بطاقة تسجيل الأجانب أو HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"قد يلزم التحقّق من إتمام برنامج الاندماج الاجتماعي (KIIP) أو من التقييم الشامل لأغراض التجنّس. تحقّق من المرحلة والموعد عبر شبكة معلومات الاندماج الاجتماعي.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"يفيدك أن تنظّم مسبقاً إثباتات الهوية والعلاقات الأسرية والإقامة في الداخل وسبل المعيشة.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"يفيدك أن تنظّم مسبقاً الإثباتات المتعلّقة بالزواج والعلاقات الأسرية.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"تحقّق من المستندات المطلوبة بما يناسب مسارك في دليل الإرشاد حسب مجال المعاملة في خدمة المعاملات الإلكترونية لوزارة العدل.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"إذا كان لديك سجلّ متعلّق بالكوريين في الخارج / F-4، فادرس أيضاً استعادة الجنسية وتحديد الجنسية إلى جانب التجنّس.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"إذا سبق أن قدّمت الطلب، يمكنك التحقّق من الحالة عبر «الاستعلام عن سير فحص الجنسية».","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"بعد الموافقة يتبع ذلك التحقّق من إعلان الجريدة الرسمية وإجراءات التسجيل. راجع «إجراءات ما بعد التجنّس».","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"لتجهيز KIIP·المقابلة، استعن بقسم «تجهيز KIIP·المقابلة» مع شبكة معلومات الاندماج الاجتماعي.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"قد تؤثّر المغادرة الطويلة·فجوة الإقامة في احتساب متطلّب الإقامة، لذا يلزم تنظيمها والتحقّق منها مسبقاً.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"قد يرتبط إثبات الضرائب·الدخل بالتحقّق من القدرة على إعالة النفس، لذا يلزم فحصه مسبقاً.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"قد يرتبط السجلّ الجنائي·التحقيقي·الإجراء الإداري بالفحص المتعلّق بالسلوك، لذا فإنّ التحقّق المسبق مهمّ.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"عند تعقّد إثبات الزواج·العلاقات الأسرية، قد يستغرق تجهيز المستندات الأجنبية وقتاً.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"يصعب تضييق الاتجاه بما يكفي بالاعتماد على المعلومات التي أدخلتها وحدها. تحقّق من وضع الإقامة·مدة الإقامة·العلاقات الأسرية ثمّ أعد الفحص، أو جرّب وضع استشارة الجنسية في Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"لا حاجة لمعرفة المصطلحات القانونية أولاً. سؤالاً واحداً في كل مرة، اختر الأقرب إلى وضعك الحالي لنرشدك إلى المسارات التي تستحقّ المراجعة.","무엇을 준비하고 있나요?":"ماذا تجهّز؟","한국 국적을 취득하고 싶어요":"أريد اكتساب الجنسية الكورية","한국 국민 배우자가 있어요":"لديّ زوج/زوجة من المواطنين الكوريين","부모 또는 가족의 한국 국적 이력이 있어요":"لدى والديّ أو أحد أفراد أسرتي سجلّ جنسية كورية","재외동포/F-4 관련 경로가 궁금해요":"أتساءل عن المسار المتعلّق بالكوريين في الخارج / F-4","국적회복을 알아보고 있어요":"أبحث عن استعادة الجنسية","이미 신청했고 다음 절차가 궁금해요":"قدّمتُ الطلب بالفعل وأتساءل عن الإجراء التالي","복수국적 또는 외국국적불행사서약이 궁금해요":"أتساءل عن تعدّد الجنسيات أو تعهّد عدم ممارسة الجنسية الأجنبية","현재 상황에 가장 가까운 것은 무엇인가요?":"ما الأقرب إلى وضعك الحالي؟","한국에 오래 거주했거나 장기체류 중입니다":"أقمتُ في كوريا مدة طويلة أو أنا في إقامة طويلة الأمد","F-5 영주자격을 가지고 있습니다":"أحمل صفة الإقامة الدائمة F-5","F-5는 아직 없습니다":"ليس لديّ F-5 بعد","혼인관계를 유지하고 있습니다":"العلاقة الزوجية قائمة","이혼/사별/실종/별거 등 변동이 있습니다":"هناك تغيّرات مثل الطلاق/الترمّل/الفقدان/الانفصال","미성년 자녀를 양육 중입니다":"أعول طفلاً قاصراً","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"أحد الوالدين أو كلاهما مواطن كوري أو كان مواطناً كورياً سابقاً","입양 또는 출생 관련 이력이 있습니다":"هناك سجلّ متعلّق بالتبنّي أو الميلاد","F-4 체류자격을 가지고 있습니다":"أحمل صفة الإقامة F-4","F-4 신청을 준비 중입니다":"أجهّز لتقديم طلب F-4","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"لا أعرف ما المناسب لي بين استعادة الجنسية والتجنّس","외국국적을 취득하면서 한국 국적을 상실했습니다":"فقدتُ الجنسية الكورية باكتساب جنسية أجنبية","과거 국적이탈/포기를 한 적이 있습니다":"سبق أن تخلّيتُ عن الجنسية / تنازلتُ عنها","상실 경위가 분명하지 않습니다":"ملابسات الفقدان غير واضحة","접수 후 대기 중입니다":"تمّ تسجيل الطلب وأنا في الانتظار","종합평가/면접 안내를 받았습니다":"تلقّيتُ إشعار التقييم الشامل/المقابلة","보완서류 요청을 받았습니다":"تلقّيتُ طلباً بمستندات تكميلية","허가 통보 이후 절차가 궁금합니다":"أتساءل عن الإجراء بعد إشعار الموافقة","출생 등으로 복수국적이 된 경우입니다":"حالة من أصبح مزدوج الجنسية بالميلاد ونحوه","귀화 후 외국국적불행사서약이 궁금합니다":"أتساءل عن تعهّد عدم ممارسة الجنسية الأجنبية بعد التجنّس","국적선택 기간/의무가 궁금합니다":"أتساءل عن مدة اختيار الجنسية/واجبه","위 상황과 정확히 맞지 않습니다":"لا تتطابق مع الوضع أعلاه تماماً","현재 가장 막히는 부분은 무엇인가요?":"ما الجزء الأكثر إعاقةً لك الآن؟","요건을 모르겠습니다":"لا أعرف المتطلّبات","서류를 모르겠습니다":"لا أعرف المستندات","방문예약/접수 절차가 어렵습니다":"حجز الزيارة/إجراء التسجيل صعب","KIIP/종합평가/면접이 어렵습니다":"KIIP/التقييم الشامل/المقابلة صعب","진행상황 확인이 어렵습니다":"التحقّق من سير الإجراء صعب","귀화 후 절차가 어렵습니다":"إجراءات ما بعد التجنّس صعبة","검토할 수 있는 경로":"المسارات التي يمكنك مراجعتها","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"هذه مسارات قريبة من الوضع الذي اخترته. تتطلّب تفاصيل كل مسار وانطباقه من عدمه تحقّقاً رسمياً، وهي اتجاهات للمراجعة وليست إجابة نهائية واحدة.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"إرشاد المسارات مادة استرشادية تساعد على تصنيف الوضع، ولا يضمن استيفاء الأهلية أو الموافقة.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"تحقّق من المتطلّبات بما يناسب مسارك عبر قانون الجنسية ودليل الجنسية/التجنّس في HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"تحقّق من المستندات المطلوبة في دليل الإرشاد حسب مجال المعاملة في خدمة المعاملات الإلكترونية لوزارة العدل.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"أجرِ حجز الزيارة·التسجيل عبر حجز الزيارة في HiKorea.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"تحقّق من مواعيد KIIP·التقييم الشامل·المقابلة وتجهيزها عبر شبكة معلومات الاندماج الاجتماعي وموقع التقييم.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"تحقّق من الحالة بعد التقديم عبر «الاستعلام عن سير فحص الجنسية».","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"للإجراء بعد الموافقة، راجع قسم «إجراءات ما بعد التجنّس» والتحقّق من إعلان الجريدة الرسمية.","다음 행동":"الخطوة التالية","막히는 부분에 대한 안내":"إرشاد بشأن الجزء المُعيق لك","법무부·출입국":"وزارة العدل·الهجرة","공식 확인·민원 창구":"جهات التحقّق الرسمي·المعاملات","사회통합·평가":"الاندماج الاجتماعي·التقييم","법령·관보":"القوانين·الجريدة الرسمية"},"de":{"Paradiso로 돌아가기":"Zurück zu Paradiso","테마 전환":"Thema wechseln","밝기 전환":"Helligkeit umschalten","닫기":"Schließen","열기":"Öffnen","다음":"Weiter","이전":"Zurück","처음부터":"Von vorn beginnen","결과 보기":"Ergebnis ansehen","자세히 보기":"Details ansehen","이런 분께":"Für wen das gedacht ist","먼저 확인하세요":"Bitte zuerst prüfen","확인할 항목":"Zu prüfende Punkte","준비 자료(범주)":"Vorzubereitende Nachweise (nach Kategorie)","다음 단계":"Nächste Schritte","공식 출처":"Offizielle Quellen","공식 출처로 확인":"Über offizielle Quellen prüfen","공식 사이트에서 최신 내용 확인":"Aktuelle Inhalte auf der offiziellen Website prüfen","적용 범위":"Geltungsbereich","확인일":"Abgerufen am","자료일":"Stand der Quelle","수정일":"Aktualisiert am","시행일":"In Kraft seit","향후 시행 — 현재 기준 아님":"Künftiges Inkrafttreten — nicht der aktuelle Rechtsstand","법령":"Gesetz / Rechtsvorschrift","중앙정부 안내":"Portal der Zentralregierung","공식 서비스":"Offizieller Dienst","KIIP·Socinet":"KIIP·Socinet","정부 참고자료":"Behördliche Referenz","공식 사이트":"Offizielle Website","경로":"Pfad","내 절차 찾기 (Waymaker)":"Mein Verfahren finden (Waymaker)","콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도하거나 Paradiso 메인에서 접속해 주세요.":"Die Inhalte konnten nicht geladen werden. Bitte versuchen Sie es in Kürze erneut oder kehren Sie über die Paradiso-Startseite zurück.","시작하기":"Beginnen","KIIP·평가":"KIIP·Bewertung","허가 후":"Nach der Genehmigung","국적업무":"Staatsangehörigkeitszentrum","Paradiso 국적·귀화 플랫폼":"Paradiso Plattform für Staatsangehörigkeit·Einbürgerung","나에게 맞는 국적·귀화 경로를 찾으세요":"Finden Sie den für Sie passenden Weg zu Staatsangehörigkeit·Einbürgerung","귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램, 면접, 귀화 후 절차까지 단계별로 안내합니다.":"Schritt-für-Schritt-Anleitung von Einbürgerung, Wiedererlangung der Staatsangehörigkeit, Staatsangehörigkeitsfeststellung, Mehrstaatigkeit, Programm zur sozialen Integration, Interview bis hin zu den Schritten nach der Einbürgerung.","2분 준비 점검 시작":"2-minütige Bereitschaftsprüfung starten","상황별 경로 찾기":"Weg nach Situation finden","약 2분":"Etwa 2 Minuten","로그인 불필요":"Keine Anmeldung erforderlich","공식 출처 연결":"Mit offiziellen Quellen verknüpft","지금 필요한 것부터":"Beginnen Sie mit dem, was Sie jetzt brauchen","법률 용어를 몰라도 현재 상황에서 시작할 수 있습니다.":"Sie können bei Ihrer aktuellen Situation beginnen — ganz ohne juristische Fachbegriffe.","귀화 준비 항목 빠르게 점검":"Vorbereitungspunkte zur Einbürgerung schnell prüfen","내 상황을 단계별로 분류":"Meine Situation Schritt für Schritt einordnen","공식 근거와 확인 창구 보기":"Offizielle Grundlagen und Anlaufstellen ansehen","국적 업무는 개인 사정과 최신 법령·지침에 따라 달라질 수 있습니다. Paradiso는 공식 근거 기반의 안내를 제공하며, 최종 판단은 관할기관 확인이 필요합니다.":"Staatsangehörigkeitsangelegenheiten können je nach persönlichen Umständen und aktuellen Gesetzen·Richtlinien unterschiedlich ausfallen. Paradiso bietet eine auf offiziellen Grundlagen beruhende Orientierung; die endgültige Entscheidung muss bei der zuständigen Behörde bestätigt werden.","무엇을 도와드릴까요?":"Womit können wir Ihnen helfen?","상황에 맞는 카드를 선택해 시작하세요. 각 도구는 입력하신 정보를 바탕으로 검토 방향을 정리할 뿐, 허가 여부를 결정하지 않습니다.":"Wählen Sie die zu Ihrer Situation passende Karte aus, um zu beginnen. Jedes Werkzeug ordnet lediglich auf Grundlage Ihrer Angaben eine Prüfrichtung; es entscheidet nicht über eine Genehmigung.","귀화 준비 점검":"Bereitschaftsprüfung zur Einbürgerung","체류, 가족관계, KIIP·평가 등 준비할 확인 항목을 한 질문씩 정리하고 해당 공식 경로로 연결합니다.":"Wir ordnen die vorzubereitenden Prüfpunkte zu Aufenthalt, Familienverhältnissen, KIIP·Bewertung usw. Frage für Frage und verweisen auf den jeweils zuständigen offiziellen Weg.","준비 점검 시작":"Bereitschaftsprüfung starten","귀화 경로 찾기":"Ihren Weg zur koreanischen Staatsangehörigkeit finden","법률 용어를 먼저 몰라도 됩니다. 지금 상황을 한 단계씩 고르면 검토할 수 있는 경로로 안내합니다.":"Sie müssen die juristischen Begriffe nicht vorab kennen. Wählen Sie Ihre aktuelle Situation Schritt für Schritt aus, und wir weisen Ihnen die prüfenswerten Wege.","경로 찾기":"Weg finden","KIIP·평가 확인":"KIIP·Bewertung prüfen","사회통합프로그램의 교육·평가와 국적 절차가 서로 다른 점을 확인하고, Socinet과 법무부 공식 안내로 연결합니다.":"Erkennen Sie die Unterschiede zwischen Schulung·Bewertung des Programms zur sozialen Integration und dem Staatsangehörigkeitsverfahren und gelangen Sie zu Socinet und den offiziellen Hinweisen des Justizministeriums.","준비 항목 보기":"Vorbereitung ansehen","귀화 후 절차":"Schritte nach der Einbürgerung","관보 고시 확인부터 가족관계등록, 주민등록, 외국국적 정리까지 허가 후 행정절차를 체크리스트로 짚어봅니다.":"Eine Checkliste der Verwaltungsschritte nach der Genehmigung — von der Prüfung der Bekanntmachung im Amtsblatt über die Eintragung der Familienverhältnisse und die Einwohnermeldung bis zur Regelung der ausländischen Staatsangehörigkeit.","체크리스트 보기":"Checkliste ansehen","국적업무 허브":"Staatsangehörigkeitszentrum","귀화·국적회복·국적판정·국적선택·복수국적·외국국적불행사서약 등 국적 업무 전반을 한곳에서 살펴봅니다.":"Sehen Sie das gesamte Feld der Staatsangehörigkeitsangelegenheiten an einem Ort — Einbürgerung·Wiedererlangung der Staatsangehörigkeit·Staatsangehörigkeitsfeststellung·Staatsangehörigkeitswahl·Mehrstaatigkeit·Erklärung über die Nichtausübung der ausländischen Staatsangehörigkeit und mehr.","허브 열기":"Zentrum öffnen","Waymaker — 내 절차 찾기":"Waymaker — Mein Verfahren finden","체류자격과 상황을 선택해 준비할 일과 공식 근거를 확인하세요. 국적·귀화 영역도 함께 안내합니다.":"Wählen Sie Ihren Aufenthaltstitel und Ihre Situation, um die vorzubereitenden Schritte und die offiziellen Grundlagen zu sehen. Auch der Bereich Staatsangehörigkeit·Einbürgerung wird mit abgedeckt.","내 절차 찾기":"Mein Verfahren finden","전체 흐름 미리보기":"So verläuft der gesamte Weg","KIIP·평가 공식 안내":"Offizieller KIIP·Bewertungsleitfaden","사회통합프로그램(KIIP)의 교육·평가와 국적 절차는 서로 구분됩니다. 본인에게 적용되는 과정·평가·면접과 최신 일정은 Socinet 또는 관할기관에서 확인해야 합니다.":"Schulung·Bewertung des Programms zur sozialen Integration (KIIP) und das Staatsangehörigkeitsverfahren sind voneinander zu unterscheiden. Welcher Kurs, welche Bewertung oder welches Interview für Sie gilt — und der aktuelle Terminplan — muss bei Socinet oder der zuständigen Behörde überprüft werden.","KIIP는 법무부의 사회통합 교육·평가 프로그램입니다. 이수나 평가 결과가 일부 체류·국적 절차에서 고려될 수 있지만, 그 자체로 자격이나 허가를 자동으로 보장하지 않습니다.":"KIIP ist das Schulungs- und Bewertungsprogramm zur sozialen Integration des Justizministeriums. Abschluss oder Bewertungsergebnisse können in manchen Aufenthalts- oder Staatsangehörigkeitsverfahren berücksichtigt werden, begründen jedoch von sich aus weder eine Berechtigung noch automatisch eine Genehmigung.","KIIP 과정 이수, 단계 배정을 위한 사전평가·중간평가, 영주·귀화용 종합평가는 서로 다른 절차입니다. 귀화면접과 종합평가도 같은 절차로 단정할 수 없습니다.":"Der Abschluss eines KIIP-Kurses, die Vorab- und Zwischenbewertung zur Stufeneinordnung sowie die umfassende Bewertung für den Daueraufenthalt·die Einbürgerung sind unterschiedliche Verfahren. Auch das Einbürgerungsinterview und die umfassende Bewertung dürfen nicht als dasselbe Verfahren angesehen werden.","내 KIIP 단계 확인":"Meine KIIP-Stufe prüfen","배정 단계와 다음 단계, 이수 현황을 사회통합정보망에서 확인하는 방법을 정리합니다.":"Wir erläutern, wie Sie Ihre eingeordnete Stufe, die nächste Stufe und Ihren Abschlussstand im Informationsnetz zur sozialen Integration prüfen.","평가 유형 확인":"Bewertungsart prüfen","사전평가·중간평가·영주용 또는 귀화용 종합평가 중 어떤 평가가 관련되는지 공식 공지에서 확인합니다.":"Prüfen Sie anhand der offiziellen Bekanntmachungen, welche Bewertung relevant ist — Vorabbewertung·Zwischenbewertung·umfassende Bewertung für den Daueraufenthalt oder für die Einbürgerung.","귀화면접 공식자료 찾기":"Offizielle Interviewmaterialien finden","법무부 국적업무 민원 안내에서 면접심사 관련 공식자료와 최신 안내가 있는지 확인합니다.":"Prüfen Sie in den Bürgerservice-Hinweisen zu Staatsangehörigkeitsangelegenheiten des Justizministeriums, ob es offizielle Materialien und aktuelle Hinweise zur Interviewprüfung gibt.","면제·인정 여부 확인":"Befreiung·Anerkennung prüfen","KIIP 이수·평가 결과가 본인 절차에서 어떻게 인정되는지 공식 안내와 관할기관에서 확인합니다. Paradiso는 면제를 판정하지 않습니다.":"Prüfen Sie über die offiziellen Hinweise und die zuständige Behörde, wie KIIP-Abschluss·Bewertungsergebnisse in Ihrem Verfahren anerkannt werden. Paradiso entscheidet nicht über Befreiungen.","공식 면접자료 확인":"Offizielle Interviewmaterialien prüfen","비공식 예상문제 대신 법무부가 공개한 면접 관련 자료와 관할기관 안내를 우선 확인합니다.":"Prüfen Sie vorrangig die vom Justizministerium veröffentlichten Interviewmaterialien und die Hinweise der zuständigen Behörde statt inoffizieller Fragenlisten.","공식 일정 확인":"Offiziellen Terminplan prüfen","평가 일정과 신청은 사회통합정보망·평가 홈페이지에서 직접 확인하세요. Paradiso는 일정을 임의로 표기하지 않습니다.":"Bewertungstermine und Anmeldungen prüfen Sie bitte direkt im Informationsnetz zur sozialen Integration·auf der Bewertungs-Website. Paradiso gibt Termine nicht eigenmächtig an.","평가 일정과 세부 기준은 사회통합정보망 등 공식 출처 확인이 필요합니다.":"Bewertungstermine und detaillierte Kriterien müssen über offizielle Quellen wie das Informationsnetz zur sozialen Integration geprüft werden.","허가 후 살펴볼 수 있는 행정절차 예시입니다. 개인 상황에 따라 항목과 순서가 달라질 수 있으며, 모든 분께 동일하게 적용되는 완전한 목록은 아닙니다.":"Dies sind Beispiele für Verwaltungsschritte, die Sie nach der Genehmigung prüfen können. Punkte und Reihenfolge können je nach persönlicher Situation abweichen; es handelt sich nicht um eine vollständige, für alle gleichermaßen geltende Liste.","관보 고시 확인":"Bekanntmachung im Amtsblatt prüfen","귀화·국적 관련 처분은 관보 고시로 확인됩니다.":"Entscheidungen zu Einbürgerung·Staatsangehörigkeit werden über die Bekanntmachung im Amtsblatt bestätigt.","전자관보에서 본인 관련 고시를 확인하세요.":"Prüfen Sie im elektronischen Amtsblatt die Sie betreffende Bekanntmachung.","가족관계등록 관련 확인":"Prüfung zur Eintragung der Familienverhältnisse","가족관계등록 절차가 필요한지 확인합니다.":"Prüfen Sie, ob ein Verfahren zur Eintragung der Familienverhältnisse erforderlich ist.","관할 기관 안내에 따라 필요한 서류와 절차를 확인하세요.":"Prüfen Sie die erforderlichen Unterlagen und Schritte gemäß den Hinweisen der zuständigen Behörde.","주민등록 관련 확인":"Prüfung zur Einwohnermeldung","거주지 주민등록 절차를 확인합니다.":"Prüfen Sie das Einwohnermeldeverfahren für Ihren Wohnsitz.","주소지 관할 행정기관에서 절차를 확인하세요.":"Prüfen Sie das Verfahren bei der für Ihre Adresse zuständigen Verwaltungsbehörde.","주민등록증 발급":"Ausstellung des Personalausweises (Einwohnermeldeausweis)","주민등록증 발급 절차를 확인합니다.":"Prüfen Sie das Verfahren zur Ausstellung des Personalausweises (Einwohnermeldeausweis).","발급 요건·장소를 관할 기관에서 확인하세요.":"Prüfen Sie die Ausstellungsvoraussetzungen·den Ort bei der zuständigen Behörde.","외국인등록증 처리":"Behandlung des Ausländerausweises","기존 외국인등록증 처리 방법을 확인합니다.":"Prüfen Sie, wie der bisherige Ausländerausweis (ARC) zu behandeln ist.","처리 방법을 하이코리아·관할 출입국관서에서 확인하세요.":"Prüfen Sie das Vorgehen bei HiKorea·der zuständigen Einwanderungsbehörde.","대한민국 여권 발급":"Ausstellung des Reisepasses der Republik Korea","대한민국 여권 발급 절차를 확인합니다.":"Prüfen Sie das Verfahren zur Ausstellung des Reisepasses der Republik Korea.","여권 발급 기관 안내에 따라 준비하세요.":"Bereiten Sie sich gemäß den Hinweisen der Passausstellungsbehörde vor.","은행/통신/보험/학교/직장 정보 변경":"Daten bei Bank/Telekommunikation/Versicherung/Schule/Arbeitsplatz ändern","신분 정보가 연결된 기관에 변경 사항을 반영합니다.":"Geben Sie die Änderungen an die Stellen weiter, die mit Ihren Identitätsdaten verknüpft sind.","각 기관별 신원 정보 변경 절차를 확인하세요.":"Prüfen Sie das Verfahren zur Änderung der Identitätsdaten bei jeder einzelnen Stelle.","외국국적 포기 또는 외국국적불행사서약 확인":"Verzicht auf die ausländische Staatsangehörigkeit oder Erklärung über die Nichtausübung der ausländischen Staatsangehörigkeit prüfen","본인에게 어떤 절차(포기 또는 서약)가 적용되는지 확인합니다.":"Prüfen Sie, welches Verfahren (Verzicht oder Erklärung) für Sie gilt.","적용 절차와 기한을 관할기관에서 확인하세요.":"Prüfen Sie das anzuwendende Verfahren und die Frist bei der zuständigen Behörde.","기한이 있을 수 있어 시기 확인이 중요합니다.":"Es können Fristen bestehen — der Zeitpunkt ist wichtig.","복수국적 관련 후속 의무 확인":"Folgepflichten im Zusammenhang mit Mehrstaatigkeit prüfen","복수국적이 유지되는 경우 따르는 후속 의무를 확인합니다.":"Prüfen Sie die Folgepflichten, die gelten, wenn die Mehrstaatigkeit bestehen bleibt.","본인 유형의 의무를 국적법령·관할기관에서 확인하세요.":"Prüfen Sie die Pflichten für Ihren Fall über das Staatsangehörigkeitsgesetz·die zuständige Behörde.","유형에 따라 의무가 다릅니다.":"Die Pflichten unterscheiden sich je nach Fallart.","병역 관련 확인이 필요한 경우":"Falls eine Prüfung in Bezug auf den Wehrdienst erforderlich ist","해당될 수 있는 경우 병역 관련 안내를 별도로 확인합니다.":"Falls es zutreffen könnte, prüfen Sie die Hinweise zum Wehrdienst gesondert.","해당 여부와 절차를 관할기관에서 확인하세요.":"Prüfen Sie die Anwendbarkeit und das Verfahren bei der zuständigen Behörde.","개인 상황에 따라 적용이 다릅니다.":"Die Anwendung hängt von der persönlichen Situation ab.","자녀/가족관계 영향 확인이 필요한 경우":"Falls Auswirkungen auf Kinder/Familienverhältnisse zu prüfen sind","자녀나 가족관계에 영향이 있을 수 있는지 확인합니다.":"Prüfen Sie, ob es Auswirkungen auf Kinder oder Familienverhältnisse geben könnte.","해당 가능성을 관할기관에서 확인하세요.":"Prüfen Sie die mögliche Anwendbarkeit bei der zuständigen Behörde.","이 체크리스트는 참고용이며 모든 분께 동일하게 적용되는 완전한 목록이 아닙니다. 기관별로 절차가 다를 수 있으니 최종 확인이 필요합니다.":"Diese Checkliste dient nur zur Orientierung und ist keine vollständige, für alle gleichermaßen geltende Liste. Da die Verfahren je nach Behörde unterschiedlich sein können, ist eine abschließende Prüfung erforderlich.","국적 관련 주요 업무를 한곳에 정리했습니다. 각 항목을 누르면 짧은 설명과 먼저 확인할 사항, 공식 출처를 볼 수 있습니다. 세부 요건은 공식 출처 확인이 필요합니다.":"Die wichtigsten Staatsangehörigkeitsangelegenheiten an einem Ort. Tippen Sie auf einen Punkt, um eine kurze Erläuterung, die zuerst zu prüfenden Punkte und die offiziellen Quellen zu sehen. Die genauen Voraussetzungen müssen über offizielle Quellen geprüft werden.","일반귀화":"Allgemeine Einbürgerung","특별한 사유 없이 일정 기간 이상 거주한 외국인이 검토하는 기본 귀화입니다.":"Die Grund-Einbürgerung, die von Ausländern in Betracht gezogen wird, die ohne besonderen Grund mindestens einen bestimmten Zeitraum lang ihren Wohnsitz hatten.","장기 거주 중이며 안정적 체류 기반을 갖춘 분":"Personen mit langjährigem Wohnsitz und stabiler Aufenthaltsgrundlage","거주 기간 요건과 영주(F-5) 등 체류 기반, KIIP/평가 이수 여부":"Die Wohnsitzdauer-Voraussetzung, die Aufenthaltsgrundlage wie der Daueraufenthalt (F-5) und der KIIP/Bewertungs-Abschlussstand","간이귀화":"Vereinfachte Einbürgerung","혼인 또는 가족관계 등 일정 사유가 있는 경우 검토하는 귀화입니다.":"Eine Einbürgerung, die in Betracht gezogen wird, wenn bestimmte Gründe wie Eheschließung oder Familienverhältnis vorliegen.","한국 국민 배우자가 있거나 가족 국적 이력이 있는 분":"Personen mit koreanischem Ehepartner oder mit einer Staatsangehörigkeitsvorgeschichte in der Familie","본인에게 적용되는 사유 유형(혼인·가족관계 등)과 관련 요건":"Welcher Grund für Sie gilt (Eheschließung·Familienverhältnis usw.) und dessen Voraussetzungen","특별귀화":"Besondere Einbürgerung","공로·능력 등 특별한 사유가 인정될 때 검토하는 귀화입니다.":"Eine Einbürgerung, die in Betracht gezogen wird, wenn besondere Gründe wie Verdienste·Fähigkeiten anerkannt werden.","특별 인정 사유가 있을 수 있는 분":"Personen, bei denen besondere Anerkennungsgründe vorliegen könnten","인정 사유 해당 여부와 분야별 공식 기준":"Ob ein anerkannter Grund vorliegt und die fachspezifischen offiziellen Kriterien","기준이 분야·정책에 따라 다릅니다.":"Die Kriterien unterscheiden sich je nach Bereich·Politik.","우수인재 특별귀화":"Besondere Einbürgerung für herausragende Fachkräfte","특정 분야 우수 인재로 인정되는 경우 검토하는 특별귀화 유형입니다.":"Eine Form der besonderen Einbürgerung, die in Betracht gezogen wird, wenn man als herausragende Fachkraft in einem bestimmten Bereich anerkannt wird.","전문 분야 실적·추천이 있을 수 있는 분":"Personen, die möglicherweise Leistungen·Empfehlungen in einem Fachgebiet vorweisen können","분야별 인정 기준과 추천·증빙 요건":"Die fachspezifischen Anerkennungskriterien und die Anforderungen an Empfehlung·Nachweise","정책에 따라 자주 갱신됩니다.":"Wird je nach Politik häufig aktualisiert.","국적회복":"Wiedererlangung der Staatsangehörigkeit","과거 한국 국적을 가졌다가 상실·이탈한 분이 국적을 회복하는 절차입니다.":"Ein Verfahren zur Wiedererlangung der Staatsangehörigkeit für Personen, die früher die koreanische Staatsangehörigkeit besaßen und sie verloren·aufgegeben haben.","과거 한국 국적 보유 이력이 있는 분":"Personen, die früher die koreanische Staatsangehörigkeit besaßen","과거 국적 보유·상실 경위와 결격사유, 복수국적 영향":"Der Hergang des früheren Besitzes·Verlusts der Staatsangehörigkeit, Ausschlussgründe und Auswirkungen der Mehrstaatigkeit","국적판정":"Staatsangehörigkeitsfeststellung","한국 국적 보유 여부가 불분명할 때 이를 판정받는 절차입니다.":"Ein Verfahren zur Feststellung der Staatsangehörigkeit, wenn unklar ist, ob die koreanische Staatsangehörigkeit besteht.","출생·가족관계가 복잡해 국적 보유 여부가 불분명한 분":"Personen, bei denen wegen komplexer Geburts-·Familienverhältnisse unklar ist, ob die Staatsangehörigkeit besteht","출생·가족관계 기록과 국적 변동 이력":"Geburts-·Familienstandsunterlagen und die Vorgeschichte von Staatsangehörigkeitsänderungen","국적취득":"Erwerb der Staatsangehörigkeit","혼인·인지 등 일정한 사유로 국적을 취득하는 경우를 다룹니다.":"Behandelt Fälle, in denen die Staatsangehörigkeit aus bestimmten Gründen wie Eheschließung·Anerkennung erworben wird.","출생 외 사유로 국적 취득을 검토하는 분":"Personen, die den Erwerb der Staatsangehörigkeit aus anderen Gründen als der Geburt in Betracht ziehen","본인 사유에 맞는 취득 유형과 절차":"Die zu Ihrem Grund passende Erwerbsart und das passende Verfahren","국적선택":"Staatsangehörigkeitswahl","복수국적자가 정해진 기간 내 국적을 선택하는 절차입니다.":"Das Verfahren, mit dem eine Person mit mehreren Staatsangehörigkeiten innerhalb einer festgelegten Frist eine Staatsangehörigkeit wählt.","복수국적이며 선택 시기가 다가오는 분":"Mehrstaater, deren Wahlzeitpunkt naht","본인의 국적선택 기간과 방법, 관련 의무":"Ihre Frist und Methode zur Staatsangehörigkeitswahl sowie die damit verbundenen Pflichten","기간 경과 시 불이익이 있을 수 있습니다.":"Bei Fristversäumnis können Nachteile entstehen.","국적상실":"Verlust der Staatsangehörigkeit","일정 사유로 한국 국적을 상실하는 경우의 확인 사항입니다.":"Zu prüfende Punkte für Fälle, in denen die koreanische Staatsangehörigkeit aus bestimmten Gründen verloren geht.","외국국적 취득 등으로 상실 여부가 궁금한 분":"Personen, die sich fragen, ob ein Verlust eingetreten ist, etwa durch Erwerb einer ausländischen Staatsangehörigkeit","상실 사유 해당 여부와 신고·후속 절차":"Ob ein Verlustgrund vorliegt sowie die Melde-·Folgeverfahren","국적이탈":"Aufgabe der Staatsangehörigkeit","복수국적자가 한국 국적을 이탈(포기)하는 절차의 확인 사항입니다.":"Zu prüfende Punkte für das Verfahren, mit dem ein Mehrstaater die koreanische Staatsangehörigkeit aufgibt (darauf verzichtet).","외국에서 거주하며 국적이탈을 검토하는 분":"Personen, die im Ausland leben und die Aufgabe der Staatsangehörigkeit in Betracht ziehen","이탈 가능 기간·요건과 병역 등 관련 의무":"Die Frist·Voraussetzungen für die Aufgabe sowie damit verbundene Pflichten wie der Wehrdienst","기간·병역 등과 연결되어 복잡할 수 있습니다.":"Kann wegen der Verknüpfung mit Fristen·Wehrdienst usw. komplex sein.","국적보유":"Beibehaltung der Staatsangehörigkeit","일정 경우 한국 국적을 계속 보유하기 위한 신고 등 확인 사항입니다.":"Zu prüfende Punkte wie die Beibehaltungserklärung, um die koreanische Staatsangehörigkeit in bestimmten Fällen weiter zu behalten.","출생 등으로 복수국적이 되었고 보유를 원하는 분":"Personen, die durch Geburt usw. zu Mehrstaatern wurden und die Beibehaltung wünschen","보유 신고 대상·기간 여부":"Ob eine Beibehaltungserklärung erforderlich ist und welche Frist dafür gilt","복수국적":"Mehrstaatigkeit","복수국적이 허용·제한되는 경우와 관련 확인 사항을 다룹니다.":"Behandelt die Fälle, in denen Mehrstaatigkeit zulässig·eingeschränkt ist, und die damit verbundenen zu prüfenden Punkte.","복수국적 유지 가능 여부가 궁금한 분":"Personen, die sich fragen, ob sie die Mehrstaatigkeit behalten können","본인 유형의 허용·제한 여부와 관련 의무":"Ob Ihr Fall zulässig·eingeschränkt ist und die damit verbundenen Pflichten","외국국적불행사서약":"Erklärung über die Nichtausübung der ausländischen Staatsangehörigkeit","한국에서 외국국적을 행사하지 않겠다고 서약하는 제도의 확인 사항입니다.":"Zu prüfende Punkte zum System der Erklärung, in Korea die ausländische Staatsangehörigkeit nicht auszuüben.","귀화·국적회복 후 서약 적용이 궁금한 분":"Personen, die sich fragen, ob die Erklärung nach der Einbürgerung·Wiedererlangung der Staatsangehörigkeit gilt","서약 적용 대상 여부와 절차·기한":"Ob Sie zum Kreis der Erklärungspflichtigen gehören sowie das Verfahren·die Frist","귀화적격심사":"Prüfung der Einbürgerungseignung","귀화 신청 후 요건·품행 등을 확인하는 심사 단계에 대한 안내입니다.":"Hinweise zur Prüfungsstufe, in der nach dem Einbürgerungsantrag die Voraussetzungen·das Verhalten usw. überprüft werden.","귀화 신청을 준비하거나 심사를 앞둔 분":"Personen, die einen Einbürgerungsantrag vorbereiten oder vor der Prüfung stehen","심사에서 확인될 수 있는 항목과 본인 준비 상태":"Die in der Prüfung möglicherweise überprüften Punkte und Ihr Vorbereitungsstand","국적 심사 진행상황 조회":"Abfrage des Bearbeitungsstands der Staatsangehörigkeitsprüfung","신청 후 진행 상태를 온라인으로 확인하는 서비스 안내입니다.":"Hinweise zum Dienst, mit dem Sie den Bearbeitungsstand nach dem Antrag online prüfen können.","이미 신청하고 결과를 기다리는 분":"Personen, die bereits einen Antrag gestellt haben und auf das Ergebnis warten","조회에 필요한 정보와 접속 경로":"Die für die Abfrage erforderlichen Informationen und der Zugangsweg","귀화허가 등 처분은 관보 고시로 확인합니다.":"Entscheidungen wie die Einbürgerungsgenehmigung werden über die Bekanntmachung im Amtsblatt bestätigt.","허가 여부·시점을 확인하려는 분":"Personen, die prüfen möchten, ob und wann eine Genehmigung erfolgt ist","전자관보 국적·귀화 테마에서 본인 관련 고시":"Die Sie betreffende Bekanntmachung im Themenbereich Staatsangehörigkeit·Einbürgerung des elektronischen Amtsblatts","각 항목의 상세 요건·서류·절차는 공식 출처 확인 후 단계적으로 보강됩니다.":"Die genauen Voraussetzungen·Unterlagen·Verfahren zu jedem Punkt werden nach Prüfung der offiziellen Quellen schrittweise ergänzt.","Waymaker는 공식 출처를 바탕으로 내 절차, 서류, 예약, 다음 행동을 정리하는 절차 길찾기입니다. AI는 생성된 안내를 설명하는 보조 역할만 하며, 서류·수수료·기한을 새로 만들지 않습니다. 최종 확인은 HiKorea·1345·관할 출입국기관에서 하세요.":"Waymaker ist ein Verfahrenswegweiser, der auf Grundlage offizieller Quellen Ihr Verfahren, Ihre Unterlagen, Ihre Terminbuchung und Ihre nächste Handlung ordnet. Die KI hat nur eine unterstützende Rolle, indem sie die erzeugte Anleitung erläutert; sie erfindet keine neuen Unterlagen·Gebühren·Fristen. Bestätigen Sie abschließend bei HiKorea·1345·der zuständigen Einwanderungsbehörde.","국적민원·귀화면접 준비":"Staatsangehörigkeits-Bürgerservice·Vorbereitung auf das Einbürgerungsinterview","귀화, 국적회복, 국적상실·이탈, 복수국적, 국민선서와 귀화면접 준비까지 한곳에서 확인하세요. 공식 법령과 안내를 바탕으로 내 상황에 가까운 흐름을 살펴볼 수 있습니다.":"Von der Einbürgerung, der Wiedererlangung der Staatsangehörigkeit, dem Verlust·der Aufgabe der Staatsangehörigkeit, der Mehrstaatigkeit, dem Bürgereid bis zur Vorbereitung auf das Einbürgerungsinterview — alles an einem Ort. Auf Grundlage offizieller Gesetze und Hinweise können Sie einen Ablauf nahe an Ihrer Situation betrachten.","예상 질문 카드 · 모의면접 연습 · 참고 영상 · Waymaker 코치":"Karten mit voraussichtlichen Fragen · Übungs-Probeinterview · Referenzvideos · Waymaker-Coach","준비 시작하기":"Mit der Vorbereitung beginnen","꼭 확인하세요":"Bitte unbedingt beachten","국적 취득·귀화의 결과는 개인의 구체적 사실관계와 관할기관의 심사에 따라 달라집니다. Paradiso의 안내는 방향을 정리하는 참고 자료이며, 최종 자격·허가 여부를 단정하거나 법률 자문을 대신하지 않습니다.":"Das Ergebnis des Erwerbs der Staatsangehörigkeit·der Einbürgerung hängt vom konkreten Sachverhalt der einzelnen Person und der Prüfung durch die zuständige Behörde ab. Die Hinweise von Paradiso sind Referenzmaterial, das eine Richtung ordnet; sie treffen keine endgültige Aussage über Berechtigung·Genehmigung und ersetzen keine Rechtsberatung.","국적·KIIP 관련 공식 출처를 종류와 적용 범위별로 정리했습니다. 링크와 공개 메타데이터는 2026-06-28에 확인했으며, 신청 전 각 공식 페이지의 최신 공지를 다시 확인하세요.":"Die offiziellen Quellen zu Staatsangehörigkeit·KIIP sind nach Art und Geltungsbereich geordnet. Links und öffentliche Metadaten wurden am 2026-06-28 geprüft; prüfen Sie vor der Antragstellung erneut die aktuellste Bekanntmachung auf jeder offiziellen Seite.","Paradiso는 법무부·HiKorea·Socinet·비자포털·재외공관과 제휴 또는 소속 관계가 없습니다. 이 링크는 관할 공식기관의 최신 안내를 확인하기 위한 연결입니다.":"Paradiso steht in keiner Partnerschafts- oder Zugehörigkeitsbeziehung zum Justizministerium·HiKorea·Socinet·zum Visumportal·zu Auslandsvertretungen. Diese Links dienen lediglich der Weiterleitung, um die aktuellsten Hinweise der zuständigen offiziellen Stelle zu prüfen.","Paradiso 메인으로 돌아가기":"Zur Paradiso-Startseite zurückkehren","검토 가능":"Prüfenswert","공식 확인 필요":"Offizielle Prüfung erforderlich","준비 단계":"Vorbereitungsphase","추가 확인 필요":"Weitere Angaben erforderlich","판단 제한":"Beurteilung eingeschränkt","검토 가능 경로":"Prüfenswerte Wege","먼저 확인할 항목":"Zuerst zu prüfende Punkte","준비하면 좋은 자료":"Hilfreiche Unterlagen zur Vorbereitung","주의할 리스크":"Zu beachtende Risiken","여덟 개의 질문에 한 번에 하나씩 답하면, 어떤 귀화 경로를 검토할 수 있는지 방향을 정리해 드립니다. 이 준비 점검은 허가 여부를 결정하지 않으며, 입력하신 정보 기준의 참고 안내입니다.":"Wenn Sie acht Fragen nacheinander beantworten, ordnen wir für Sie die Richtung, welche Einbürgerungswege Sie prüfen können. Diese Bereitschaftsprüfung entscheidet nicht über eine Genehmigung; sie ist eine Orientierungshilfe auf Grundlage Ihrer Angaben.","현재 한국에 체류 중인가요?":"Halten Sie sich derzeit in Korea auf?","예, 한국에 체류 중입니다":"Ja, ich bin in Korea","아니요, 해외에 있습니다":"Nein, ich bin im Ausland","잘 모르겠습니다":"Ich bin mir nicht sicher","현재 체류자격 또는 신분에 가장 가까운 것은 무엇인가요?":"Welcher Status beschreibt Sie derzeit am besten?","F-5 영주자격":"F-5 Daueraufenthalt","F-6 결혼이민":"F-6 Heiratsmigration","F-4 재외동포":"F-4 Auslandskoreaner","E계열 취업 체류자격":"Aufenthaltstitel der E-Reihe (Beschäftigung)","D계열 유학/연수 체류자격":"Aufenthaltstitel der D-Reihe (Studium/Ausbildung)","기타 장기체류":"Sonstiger Langzeitaufenthalt","체류자격을 잘 모르겠습니다":"Ich kenne meinen Aufenthaltstitel nicht genau","한국에 계속 거주한 기간은 어느 정도인가요?":"Wie lange haben Sie ununterbrochen in Korea gelebt?","1년 미만":"Weniger als 1 Jahr","1년 이상 2년 미만":"1 bis unter 2 Jahre","2년 이상 3년 미만":"2 bis unter 3 Jahre","3년 이상 5년 미만":"3 bis unter 5 Jahre","5년 이상":"5 Jahre oder mehr","중간에 장기출국 또는 체류 공백이 있었습니다":"Es gab zwischenzeitlich längere Auslandsaufenthalte oder Aufenthaltslücken","한국 국민 배우자가 있나요?":"Sind Sie mit einem koreanischen Staatsangehörigen verheiratet?","예, 혼인관계를 유지하고 있습니다":"Ja, die Ehe besteht weiterhin","예, 그러나 이혼/사별/별거 등 변동이 있습니다":"Ja, aber mit Änderungen (Scheidung/Verwitwung/Getrenntleben)","아니요":"Nein","답변하기 어렵습니다":"Möchte ich nicht angeben","부모 또는 가족의 한국 국적 이력이 있나요?":"Haben Ihre Eltern oder Familienangehörigen eine koreanische Staatsangehörigkeitsvorgeschichte?","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민이었습니다":"Mindestens ein Elternteil ist oder war koreanischer Staatsangehöriger","본인이 과거 한국 국적을 가진 적이 있습니다":"Ich selbst besaß früher die koreanische Staatsangehörigkeit","재외동포/F-4 관련 이력이 있습니다":"Ich habe Bezüge als Auslandskoreaner/zu F-4","사회통합프로그램(KIIP) 또는 귀화용 종합평가 이력이 있나요?":"Haben Sie eine Vorgeschichte beim Programm zur sozialen Integration (KIIP) oder bei der umfassenden Bewertung für die Einbürgerung?","KIIP 5단계 수료 및 귀화용 종합평가 합격":"KIIP-Stufe 5 abgeschlossen und umfassende Bewertung für die Einbürgerung bestanden","KIIP를 일부 이수했습니다":"Ich habe KIIP teilweise abgeschlossen","귀화용 종합평가만 응시/합격했습니다":"Ich habe nur an der umfassenden Bewertung für die Einbürgerung teilgenommen/sie bestanden","아직 없습니다":"Noch nicht","추가 확인이 필요한 사유가 있나요?":"Gibt es Faktoren, die eine zusätzliche Prüfung erfordern?","장기출국 또는 체류 공백":"Längere Auslandsaufenthalte oder Aufenthaltslücken","세금 체납 또는 소득 증빙 어려움":"Steuerrückstände oder Schwierigkeiten beim Einkommensnachweis","범죄·수사·행정처분 이력":"Vorgeschichte von Straftaten·Ermittlungen·Verwaltungsmaßnahmen","혼인관계 또는 가족관계 증빙이 복잡함":"Komplizierte Nachweise zu Ehe- oder Familienverhältnissen","해당 없음":"Trifft nicht zu","지금 가장 필요한 안내는 무엇인가요?":"Welche Orientierung brauchen Sie jetzt am dringendsten?","내가 어떤 귀화 경로를 검토할 수 있는지":"Welche Einbürgerungswege ich prüfen kann","먼저 F-5 또는 체류자격 정리가 필요한지":"Ob ich zuerst F-5 oder meinen Aufenthaltstitel klären sollte","서류와 증빙 준비":"Vorbereitung von Unterlagen und Nachweisen","KIIP/면접 준비":"Vorbereitung auf KIIP/Interview","신청 후 진행상황 확인":"Bearbeitungsstand nach der Antragstellung prüfen","검토 방향 요약":"Zusammenfassung der Prüfrichtungen","입력하신 정보 기준으로 살펴볼 만한 방향입니다. 아래는 가능성을 정리한 것이며, 실제 신청 가능 여부와 허가는 관할기관의 심사와 공식 기준 확인이 필요합니다.":"Dies sind auf Grundlage Ihrer Angaben prüfenswerte Richtungen. Das Folgende ordnet lediglich Möglichkeiten; ob Sie tatsächlich einen Antrag stellen können und ob eine Genehmigung erfolgt, erfordert die Prüfung durch die zuständige Behörde und die Prüfung der offiziellen Kriterien.","이 결과는 사용자가 제공한 정보에 기반한 참고용 안내이며, 최종적인 법적 판단이나 허가 결정이 아닙니다.":"Dieses Ergebnis ist eine Orientierungshilfe auf Grundlage der von Ihnen bereitgestellten Informationen und keine endgültige rechtliche Beurteilung oder Genehmigungsentscheidung.","최종 신청 가능 여부와 허가 여부는 관할기관의 심사와 공식 기준(국적법령·법무부·하이코리아) 확인이 필요합니다.":"Ob Sie letztlich einen Antrag stellen können und ob eine Genehmigung erfolgt, erfordert die Prüfung durch die zuständige Behörde und die Prüfung der offiziellen Kriterien (Staatsangehörigkeitsgesetz·Justizministerium·HiKorea).","먼저 영주(F-5) 또는 체류자격을 정리하는 것이 도움이 될 수 있습니다. 본인 상황에 맞는 순서는 관할기관에서 확인하세요.":"Es kann hilfreich sein, zuerst den Daueraufenthalt (F-5) oder Ihren Aufenthaltstitel zu klären. Die für Ihre Situation passende Reihenfolge prüfen Sie bitte bei der zuständigen Behörde.","현재 체류자격을 정확히 확인하면 검토가 수월해집니다. 외국인등록증 또는 하이코리아에서 확인하세요.":"Wenn Sie Ihren aktuellen Aufenthaltstitel genau kennen, fällt die Prüfung leichter. Prüfen Sie ihn anhand des Ausländerausweises oder bei HiKorea.","사회통합프로그램(KIIP) 이수 또는 귀화용 종합평가 확인이 필요할 수 있습니다. 사회통합정보망에서 단계와 일정을 확인하세요.":"Möglicherweise müssen Sie den Abschluss des Programms zur sozialen Integration (KIIP) oder die umfassende Bewertung für die Einbürgerung prüfen. Prüfen Sie Stufe und Termine im Informationsnetz zur sozialen Integration.","신원·가족관계, 국내 거주·체류, 생계 관련 증빙을 미리 정리해 두면 도움이 됩니다.":"Es ist hilfreich, Nachweise zu Identität·Familienverhältnissen, zum inländischen Wohnsitz·Aufenthalt und zum Lebensunterhalt im Voraus zu ordnen.","혼인·가족관계 관련 증빙을 정리해 두면 도움이 됩니다.":"Es ist hilfreich, die Nachweise zu Ehe-·Familienverhältnissen im Voraus zu ordnen.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 본인 경로에 맞게 확인하세요.":"Die erforderlichen Unterlagen prüfen Sie für Ihren Weg im Bürgerservice-Leitfaden nach Sachgebieten des Online-Bürgerservices des Justizministeriums.","재외동포/F-4 이력이 있는 경우 귀화 외에 국적회복·국적판정도 함께 검토해 보세요.":"Wenn Sie Bezüge als Auslandskoreaner/zu F-4 haben, ziehen Sie neben der Einbürgerung auch die Wiedererlangung der Staatsangehörigkeit·die Staatsangehörigkeitsfeststellung in Betracht.","이미 신청한 경우 '국적 심사 진행상황 조회'로 상태를 확인할 수 있습니다.":"Wenn Sie bereits einen Antrag gestellt haben, können Sie den Stand über die „Abfrage des Bearbeitungsstands der Staatsangehörigkeitsprüfung“ prüfen.","허가 이후에는 관보 고시 확인과 등록 절차가 이어집니다. '귀화 후 절차'를 참고하세요.":"Nach der Genehmigung folgen die Prüfung der Bekanntmachung im Amtsblatt und die Eintragungsverfahren. Siehe „Schritte nach der Einbürgerung“.","KIIP·면접 준비는 'KIIP·면접 준비' 섹션과 사회통합정보망을 함께 활용하세요.":"Für die Vorbereitung auf KIIP·Interview nutzen Sie den Abschnitt „KIIP·Interviewvorbereitung“ zusammen mit dem Informationsnetz zur sozialen Integration.","장기출국·체류 공백은 거주 요건 계산에 영향을 줄 수 있어 미리 정리·확인이 필요합니다.":"Längere Auslandsaufenthalte·Aufenthaltslücken können sich auf die Berechnung der Wohnsitzvoraussetzung auswirken und müssen daher im Voraus geordnet·geprüft werden.","세금·소득 증빙은 생계유지능력 확인과 관련될 수 있어 미리 점검이 필요합니다.":"Steuer-·Einkommensnachweise können mit der Prüfung der Fähigkeit zur Sicherung des Lebensunterhalts zusammenhängen und sollten daher im Voraus überprüft werden.","범죄·수사·행정처분 이력은 품행 관련 심사와 연결될 수 있어 사전 확인이 중요합니다.":"Eine Vorgeschichte von Straftaten·Ermittlungen·Verwaltungsmaßnahmen kann mit der Prüfung des Verhaltens zusammenhängen, daher ist eine vorherige Prüfung wichtig.","혼인·가족관계 증빙이 복잡한 경우 해외 서류 준비에 시간이 걸릴 수 있습니다.":"Wenn die Nachweise zu Ehe-·Familienverhältnissen kompliziert sind, kann die Beschaffung ausländischer Unterlagen Zeit in Anspruch nehmen.","입력하신 정보만으로는 방향을 충분히 좁히기 어렵습니다. 체류자격·거주기간·가족관계를 확인한 뒤 다시 점검하거나, Waymaker 국적 상담 모드를 이용해 보세요.":"Allein mit Ihren Angaben lässt sich die Richtung nicht ausreichend eingrenzen. Prüfen Sie Ihren Aufenthaltstitel·Ihre Wohnsitzdauer·Ihre Familienverhältnisse und führen Sie die Prüfung erneut durch, oder nutzen Sie den Staatsangehörigkeits-Beratungsmodus von Waymaker.","법률 용어를 먼저 알 필요는 없습니다. 한 번에 하나씩, 지금 상황에 가장 가까운 것을 고르면 검토할 수 있는 경로로 안내합니다.":"Sie müssen die juristischen Begriffe nicht vorab kennen. Wählen Sie eine Frage nach der anderen das aus, was Ihrer aktuellen Situation am nächsten kommt, und wir weisen Ihnen die prüfenswerten Wege.","무엇을 준비하고 있나요?":"Was möchten Sie vorbereiten?","한국 국적을 취득하고 싶어요":"Ich möchte koreanischer Staatsbürger werden","한국 국민 배우자가 있어요":"Ich bin mit einem koreanischen Staatsangehörigen verheiratet","부모 또는 가족의 한국 국적 이력이 있어요":"Meine Eltern oder Familienangehörigen haben eine koreanische Staatsangehörigkeitsvorgeschichte","재외동포/F-4 관련 경로가 궁금해요":"Mich interessieren die Wege für Auslandskoreaner/F-4","국적회복을 알아보고 있어요":"Ich informiere mich über die Wiedererlangung der Staatsangehörigkeit","이미 신청했고 다음 절차가 궁금해요":"Ich habe bereits einen Antrag gestellt und möchte die nächsten Schritte erfahren","복수국적 또는 외국국적불행사서약이 궁금해요":"Mich interessiert die Mehrstaatigkeit oder die Erklärung über die Nichtausübung der ausländischen Staatsangehörigkeit","현재 상황에 가장 가까운 것은 무엇인가요?":"Welche Situation kommt Ihrer aktuellen am nächsten?","한국에 오래 거주했거나 장기체류 중입니다":"Ich lebe seit Langem in Korea oder befinde mich im Langzeitaufenthalt","F-5 영주자격을 가지고 있습니다":"Ich besitze den Daueraufenthalt F-5","F-5는 아직 없습니다":"F-5 habe ich noch nicht","혼인관계를 유지하고 있습니다":"Die Ehe besteht weiterhin","이혼/사별/실종/별거 등 변동이 있습니다":"Es gibt Änderungen (Scheidung/Verwitwung/Verschollenheit/Getrenntleben)","미성년 자녀를 양육 중입니다":"Ich ziehe ein minderjähriges Kind auf","부모 중 한 명 이상이 한국 국민이거나 과거 한국 국민입니다":"Mindestens ein Elternteil ist oder war koreanischer Staatsangehöriger","입양 또는 출생 관련 이력이 있습니다":"Es besteht eine adoptions- oder geburtsbezogene Vorgeschichte","F-4 체류자격을 가지고 있습니다":"Ich besitze den Aufenthaltstitel F-4","F-4 신청을 준비 중입니다":"Ich bereite einen F-4-Antrag vor","국적회복과 귀화 중 무엇이 맞는지 모르겠습니다":"Ich weiß nicht, ob die Wiedererlangung der Staatsangehörigkeit oder die Einbürgerung für mich passt","외국국적을 취득하면서 한국 국적을 상실했습니다":"Ich habe durch den Erwerb einer ausländischen Staatsangehörigkeit die koreanische verloren","과거 국적이탈/포기를 한 적이 있습니다":"Ich habe in der Vergangenheit die Staatsangehörigkeit aufgegeben/auf sie verzichtet","상실 경위가 분명하지 않습니다":"Der Hergang des Verlusts ist unklar","접수 후 대기 중입니다":"Eingereicht und in Bearbeitung","종합평가/면접 안내를 받았습니다":"Ich habe eine Benachrichtigung zur umfassenden Bewertung/zum Interview erhalten","보완서류 요청을 받았습니다":"Ich wurde zur Nachreichung von Unterlagen aufgefordert","허가 통보 이후 절차가 궁금합니다":"Mich interessieren die Schritte nach der Genehmigungsmitteilung","출생 등으로 복수국적이 된 경우입니다":"Ich bin durch Geburt o. Ä. Mehrstaater geworden","귀화 후 외국국적불행사서약이 궁금합니다":"Mich interessiert die Erklärung über die Nichtausübung der ausländischen Staatsangehörigkeit nach der Einbürgerung","국적선택 기간/의무가 궁금합니다":"Mich interessieren die Frist/Pflicht der Staatsangehörigkeitswahl","위 상황과 정확히 맞지 않습니다":"Keine der obigen Situationen trifft genau zu","현재 가장 막히는 부분은 무엇인가요?":"Wo hakt es derzeit am meisten?","요건을 모르겠습니다":"Ich kenne die Voraussetzungen nicht","서류를 모르겠습니다":"Ich kenne die Unterlagen nicht","방문예약/접수 절차가 어렵습니다":"Die Terminbuchung/Einreichung ist schwierig","KIIP/종합평가/면접이 어렵습니다":"KIIP/umfassende Bewertung/Interview sind schwierig","진행상황 확인이 어렵습니다":"Den Bearbeitungsstand zu prüfen ist schwierig","귀화 후 절차가 어렵습니다":"Die Schritte nach der Einbürgerung sind schwierig","검토할 수 있는 경로":"Wege, die Sie prüfen können","선택하신 상황에 가까운 경로입니다. 각 경로의 세부 요건과 적용 여부는 공식 출처 확인이 필요하며, 하나의 최종 답이 아니라 검토 방향입니다.":"Dies sind Wege, die der von Ihnen gewählten Situation nahekommen. Die genauen Voraussetzungen jedes Wegs und ob er zutrifft, müssen über offizielle Quellen geprüft werden; es handelt sich um Prüfrichtungen, nicht um eine einzige endgültige Antwort.","경로 안내는 상황 분류를 돕는 참고 자료이며, 자격 충족이나 허가를 보장하지 않습니다.":"Die Wegweisung ist Referenzmaterial, das bei der Einordnung der Situation hilft; sie garantiert weder die Erfüllung der Voraussetzungen noch eine Genehmigung.","요건은 국적법령과 하이코리아 국적/귀화 안내에서 본인 경로에 맞게 확인하세요.":"Die Voraussetzungen prüfen Sie für Ihren Weg im Staatsangehörigkeitsgesetz und im Staatsangehörigkeits-/Einbürgerungsleitfaden von HiKorea.","필요 서류는 법무부 온라인 민원의 민원분야별 안내에서 확인하세요.":"Die erforderlichen Unterlagen prüfen Sie im Bürgerservice-Leitfaden nach Sachgebieten des Online-Bürgerservices des Justizministeriums.","방문예약·접수는 하이코리아 방문예약에서 진행하세요.":"Die Terminbuchung·Einreichung führen Sie über die Terminbuchung von HiKorea durch.","KIIP·종합평가·면접은 사회통합정보망과 평가 홈페이지에서 일정·준비를 확인하세요.":"Termine·Vorbereitung zu KIIP·umfassender Bewertung·Interview prüfen Sie im Informationsnetz zur sozialen Integration und auf der Bewertungs-Website.","신청 후 상태는 '국적 심사 진행상황 조회'로 확인하세요.":"Den Stand nach der Antragstellung prüfen Sie über die „Abfrage des Bearbeitungsstands der Staatsangehörigkeitsprüfung“.","허가 후 절차는 '귀화 후 절차' 섹션과 관보 고시 확인을 참고하세요.":"Für die Schritte nach der Genehmigung beachten Sie den Abschnitt „Schritte nach der Einbürgerung“ und die Prüfung der Bekanntmachung im Amtsblatt.","다음 행동":"Nächste Handlung","막히는 부분에 대한 안내":"Orientierung für die Stelle, an der es hakt","법무부·출입국":"Justizministerium·Einwanderung","공식 확인·민원 창구":"Offizielle Anlaufstellen für Bestätigung·Bürgerservice","사회통합·평가":"Soziale Integration·Bewertung","법령·관보":"Gesetze·Amtsblatt"}};

<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  var LANG_KEY = 'paradiso:language';
  var THEME_KEY = 'paradiso:editorial-theme';
  var BRIGHT_KEY = 'paradiso:nh-brightness';
  var SUPPORTED = ['ko', 'en', 'zh-CN', 'zh-TW', 'ja', 'vi', 'tl', 'id', 'ru', 'fr', 'es', 'ar', 'de'];
  // Content locales each new language resolves to itself; zh-TW renders the
  // zh-CN content pack with a runtime Traditional conversion layer.
  var CONTENT_LANGS = ['ja', 'vi', 'tl', 'id', 'ru', 'fr', 'es', 'ar', 'de'];
  var RTL_LOCALES = ['ar'];
  // Each new locale resolves to its own content fields; zh-TW → zh-CN content.
  function deriveLang(locale) {
    if (locale === 'zh-TW' || locale === 'zh-CN') return 'zh-CN';
    if (locale === 'en') return 'en';
    if (CONTENT_LANGS.indexOf(locale) >= 0) return locale;
    return 'ko';
  }
  // Traditional Chinese is a display layer over zh-CN content (zh-traditional.js).
  // `lang` is the content locale; `tradTW` activates the converter.
  var selectedLocale = initialSelection();
  var tradTW = (selectedLocale === 'zh-TW');
  var lang = deriveLang(selectedLocale);
  var content = null;     // nationality_content.json
  var paths = null;       // nationality_paths.json (path catalog)
  var flows = null;       // nationality_flows.json (wizards)
  var sources = null;     // nationality_sources.json (registry)
  var chipMap = {};       // chip id -> chip
  var catMap = {};        // result-category id -> category
  var srcMap = {};        // sourceId -> source
  var lastFocus = null;
  var activeOverlay = null;
  var activeRebuild = null; // re-render hook for the open modal on language switch

  function initialSelection() {
    try {
      var raw = (localStorage.getItem(LANG_KEY) || '');
      if (raw === 'zh-CN' || raw === 'zh-TW') return raw;
      if (CONTENT_LANGS.indexOf(raw) >= 0) return raw;
      var s = raw.toLowerCase();
      if (s.indexOf('en') === 0) return 'en';
      if (s.indexOf('ko') === 0) return 'ko';
      // Generic prefix match for the new content locales (e.g. "fr-FR").
      for (var i = 0; i < CONTENT_LANGS.length; i++) {
        if (s.indexOf(CONTENT_LANGS[i]) === 0) return CONTENT_LANGS[i];
      }
    } catch (e) {}
    try {
      if ((navigator.language || '').toLowerCase().indexOf('en') === 0) return 'en';
    } catch (e) {}
    return 'ko';
  }
  function applyTradLayer(on) {
    try { var zt = window.ParadisoZhT; if (!zt) return; if (on) { if (!zt.isActive()) zt.start(); } else if (zt.isActive()) { zt.stop(); } } catch (e) {}
  }

  function pick(node) {
    if (node == null) return '';
    if (typeof node === 'string') return node;
    if (typeof node === 'object') {
      if (node[lang] != null) return node[lang];
      if (node.ko != null) return node.ko;
      if (node.en != null) return node.en;
    }
    return '';
  }

  function resolve(root, dotted) {
    return dotted.split('.').reduce(function (acc, k) { return acc == null ? acc : acc[k]; }, root);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  // ── Status chips ───────────────────────────────────────────────────────
  function chipHtml(id) {
    var c = chipMap[id];
    if (!c) return '';
    return '<span class="nh-chip" data-tone="' + esc(c.tone) + '"><span class="nh-chip-glyph" aria-hidden="true">' +
      esc(c.icon) + '</span>' + esc(pick(c)) + '</span>';
  }

  // ── Static text binding: elements carry a dotted content path attribute ──
  function applyStatic() {
    document.documentElement.lang = tradTW ? 'zh-TW' : selectedLocale;
    document.documentElement.dir = (RTL_LOCALES.indexOf(selectedLocale) >= 0) ? 'rtl' : 'ltr';
    applyTradLayer(tradTW);

  // Field helpers: support both {ko,en} objects and Ko/En-suffixed fields.
  function fld(obj, base) {
    if (!obj) return '';
    if (obj[base] != null) return pick(obj[base]);
    var ko = obj[base + 'Ko'], en = obj[base + 'En'];
    if (ko != null || en != null) return pick({ ko: ko, en: en });
    return '';
  }
  function fldArr(obj, base) {
    var v = obj && obj[base];
    if (!v) return [];
    if (Array.isArray(v)) return v;
    var a = pick(v);
    return Array.isArray(a) ? a : [];
  }

  function sourceById(id) { return srcMap[id]; }
  function sourceClassLabel(s) {
    var labels = content && content.ui && content.ui.sourceClassLabels;

  // ── Modal plumbing ───────────────────────────────────────────────────────
  function focusables(container) {
    return Array.prototype.slice.call(container.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(function (n) { return !n.disabled && n.offsetParent !== null; });
  }

  function trap(e) {
    if (e.key !== 'Tab' || !activeOverlay) return;
    var f = focusables(activeOverlay);
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function openOverlay(id, rebuild) {
    var ov = document.getElementById(id);
    if (!ov) return;
    lastFocus = document.activeElement;
    activeOverlay = ov;
    activeRebuild = rebuild || null;
    ov.classList.add('active');
    ov.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', trap);
    var preferred = ov.querySelector('legend[tabindex="-1"], [data-nh-result] h3[tabindex="-1"]');
    var f = focusables(ov);
    if (preferred) preferred.focus();
    else if (f.length) f[0].focus();
  }

  function closeOverlay() {
    if (!activeOverlay) return;
    activeOverlay.classList.remove('active');
    activeOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', trap);
    activeOverlay = null;
    activeRebuild = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  // ── Readiness check (one question per screen) ──────────────────────────────
  var readinessAnswers = {};
  var readinessStep = 0;

  function fillTemplate(str, vars) {
    return String(str == null ? '' : str).replace(/\{(\w+)\}/g, function (m, k) {
      return vars[k] != null ? vars[k] : m;
    });
  }

  function buildReadinessStep() {
    var r = flows.readiness;
    var qs = r.questions;
    if (readinessStep < 0) readinessStep = 0;
    if (readinessStep >= qs.length) { showReadinessResult(); return; }
    var q = qs[readinessStep];
    var isLast = readinessStep === qs.length - 1;
    document.getElementById('readinessTitle').textContent = pick(r.title);
    var body = document.getElementById('readinessBody');
    var foot = document.getElementById('readinessFoot');

    body.innerHTML = '';
    var progressText = fillTemplate(pick(r.progressLabel), { current: readinessStep + 1, total: qs.length });
    var progress = el('p', 'nh-progress', esc(progressText));
    progress.setAttribute('role', 'progressbar');
    progress.setAttribute('aria-valuemin', '1');
    progress.setAttribute('aria-valuemax', String(qs.length));
    progress.setAttribute('aria-valuenow', String(readinessStep + 1));
    progress.setAttribute('aria-valuetext', progressText);
    body.appendChild(progress);
    if (readinessStep === 0) body.appendChild(el('p', 'nh-section-intro', esc(pick(r.intro))));

    var fs = el('fieldset', 'nh-q');
    var legend = el('legend', null, esc(pick(q.q)));
    legend.setAttribute('tabindex', '-1');
    fs.appendChild(legend);
    var opts = el('div', 'nh-q-options');
    q.options.forEach(function (o) {
      var checked = readinessAnswers[q.id] === o.value ? ' checked' : '';
      var label = el('label', 'nh-opt',
        '<input type="radio" name="' + esc(q.id) + '" value="' + esc(o.value) + '"' + checked + '>' +
        '<span>' + esc(pick(o.label)) + '</span>');
      opts.appendChild(label);
    });
    fs.appendChild(opts);
    body.appendChild(fs);

    foot.innerHTML = '';
    var back = el('button', 'nh-btn-sm', esc(pick(content.ui.back)));
    back.type = 'button';
    back.style.visibility = readinessStep === 0 ? 'hidden' : 'visible';
    back.addEventListener('click', function () { readinessStep--; buildReadinessStep(); });

    var next = el('button', 'nh-btn-sm primary', esc(pick(isLast ? content.ui.viewResult : content.ui.next)));
    next.type = 'button';
    next.disabled = readinessAnswers[q.id] == null;
    next.addEventListener('click', function () {
      if (readinessAnswers[q.id] == null) return;
      if (isLast) showReadinessResult();
      else { readinessStep++; buildReadinessStep(); }
    });

    opts.addEventListener('change', function (e) {
      if (e.target && e.target.name) {
        readinessAnswers[e.target.name] = e.target.value;
        next.disabled = false;
      }
    });

    foot.appendChild(back);
    foot.appendChild(next);
    legend.focus();
  }

  function evaluateReadiness(a) {
    var cats = { review: [], firstcheck: [], materials: [], official: [], risk: [] };
    var addP = function (id) { if (cats.review.indexOf(id) < 0) cats.review.push(id); };
    var addN = function (c, m) { if (cats[c].indexOf(m) < 0) cats[c].push(m); };
    var hasF5 = a.r_status === 'f5';

    if (a.r_spouse === 'intact' || a.r_spouse === 'changed') addP('marriage');
    if (a.r_family === 'parent') addP('family');
    if (a.r_family === 'selfPast') { addP('restoration'); addP('determination'); }
    if (a.r_family === 'overseas') { addP('family'); addP('restoration'); addP('determination'); addN('firstcheck', 'overseasInfo'); }
    if (hasF5 || a.r_residence === 'ge5') addP('general');

    if (a.r_status === 'unsure' || a.r_inkorea === 'unsure') addN('firstcheck', 'confirmStatus');
    var shortStay = a.r_residence === 'lt1' || a.r_residence === '1to2' || a.r_residence === '2to3' || a.r_residence === '3to5';
    if (a.r_need === 'f5first' || (!hasF5 && cats.review.indexOf('marriage') < 0 && cats.review.indexOf('family') < 0 && shortStay)) addN('firstcheck', 'needF5First');

    addN('official', 'officialAlways');
    if (a.r_kiip && a.r_kiip !== 'done') addN('official', 'kiipNeeded');

    addN('materials', 'materialsGeneral');
    if (cats.review.indexOf('marriage') >= 0) addN('materials', 'materialsMarriage');
    if (a.r_need === 'docs') addN('materials', 'materialsDocs');
    if (a.r_need === 'kiip') addN('materials', 'kiipPrep');
    if (a.r_need === 'progress') addN('materials', 'progressInfo');
    if (a.r_need === 'after') addN('materials', 'afterInfo');

    if (a.r_risk === 'absence' || a.r_residence === 'gap') addN('risk', 'riskAbsence');
    if (a.r_risk === 'tax') addN('risk', 'riskTax');
    if (a.r_risk === 'criminal') addN('risk', 'riskCriminal');
    if (a.r_risk === 'complexFamily') addN('risk', 'riskComplexFamily');

    if (cats.review.length === 0) addN('firstcheck', 'limited');
    return cats;
  }

  function showReadinessResult() {
    var r = flows.readiness;
    var body = document.getElementById('readinessBody');
    var foot = document.getElementById('readinessFoot');
    var cats = evaluateReadiness(readinessAnswers);
    body.innerHTML = '';
    var head = el('div', null, '');
    head.setAttribute('data-nh-result', '1');
    var resultHeading = el('h3', null, esc(pick(r.resultTitle)));
    resultHeading.setAttribute('tabindex', '-1');
    head.appendChild(resultHeading);
    head.appendChild(el('p', 'nh-section-intro', esc(pick(r.resultIntro))));
    body.appendChild(head);

    var order = ['review', 'firstcheck', 'materials', 'official', 'risk'];
    order.forEach(function (catId) {
      var entries = cats[catId];
      if (!entries || !entries.length) return;
      var cat = catMap[catId] || { ko: catId, en: catId, tone: 'neutral', icon: '·' };
      var block = el('div', 'nh-result-cat');
      block.setAttribute('data-tone', cat.tone || 'neutral');
      block.appendChild(el('p', 'nh-result-cat-head',
        '<span class="nh-chip-glyph" aria-hidden="true">' + esc(cat.icon) + '</span>' + esc(pick(cat))));
      if (catId === 'review') {
        entries.forEach(function (pid) {
          var p = pathById(pid);
          if (p) block.insertAdjacentHTML('beforeend', richPathCardHtml(p));
        });
      } else {
        entries.forEach(function (mid) {
          var msg = r.messages[mid];
          if (msg) block.appendChild(el('div', 'nh-result-note', esc(pick(msg))));
        });
      }
      body.appendChild(block);
    });
    wirePathCards(body);
    body.appendChild(el('p', 'nh-inline-note', esc(pick(r.disclaimer))));

    foot.innerHTML = '';
    var again = el('button', 'nh-btn-sm', esc(pick(content.ui.restart)));
    again.type = 'button';
    again.addEventListener('click', function () { readinessStep = 0; readinessAnswers = {}; buildReadinessStep(); });
    var pf = el('button', 'nh-btn-sm primary', esc(pick(flows.pathFinder.title)));
    pf.type = 'button';
    pf.addEventListener('click', function () { closeOverlay(); openPathfinder(); });
    foot.appendChild(again);
    foot.appendChild(pf);
    body.scrollTop = 0;
    requestAnimationFrame(function () { resultHeading.focus(); });
  }

  function openReadiness() {
    readinessStep = 0;
    readinessAnswers = {};
    buildReadinessStep();
    openOverlay('readinessModal', function () {
      var inResult = document.querySelector('#readinessBody [data-nh-result]');
      if (inResult) showReadinessResult(); else buildReadinessStep();
