<!DOCTYPE html>
<html lang="ko" data-theme="civic_editorial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<meta name="description" content="New Home by Paradiso — 귀화, 국적회복, 국적판정, 복수국적, 사회통합프로그램(KIIP), 면접, 귀화 후 절차까지 단계별 안내. Step-by-step guidance for Korean nationality and naturalization.">
<title>New Home by Paradiso — 국적·귀화 안내</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/visable-favicon.svg?v=1">

<!-- Editorial theme bootstrap (shared with the Paradiso main page). Runs before
     paint so the page never flashes the wrong palette. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('paradiso:editorial-theme');
    if (t === 'civic_editorial' || t === 'archive_diary') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>

<!-- Pretendard — already used across Paradiso; no new external font is introduced. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ── Design tokens (mirrors the Paradiso main page so the look is shared) ── */
:root {
  --ff: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --bg0: #F4EFE4; --bg1: #FFFCF5; --bg2: #ECE5D6; --bg3: #E0D8C6;
  --bd: #d1c6b4; --bd2: #ddd3c3;
  --t1: #073B32; --t2: #3A544C; --t3: #6E7A74;
  --ac: #0E8A6B; --ac2: #073B32; --acG: rgba(47,94,103,0.10); --acL: #e1eaec;
  --ac-ink: #fff;
  --cy: #FF6B5B; --cyL: #FFE2DB; --cyT: #8A3426;
  --ok: #0EA37B; --warn: #E68A3A;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 26px;
  --sh1: 0 1px 2px rgba(24,28,26,0.05);
  --sh2: 0 10px 28px -10px rgba(24,28,26,0.18);
  --shCard: 0 2px 12px rgba(31,107,94,0.08);
  --maxw: 1040px;
}
/* Brightness: dark mode lives on <body data-theme="dark"> */
[data-theme="dark"] {
  --bg0: #0B2A24; --bg1: #113B32; --bg2: #184B40; --bg3: #205A4E;
  --bd: #2D5A50; --bd2: #224A41;
  --t1: #F3EEDF; --t2: #C7BFA8; --t3: #8C8572;
  --ac: #3BE4B8; --ac2: #22C9A0; --acG: rgba(52,212,168,0.14); --acL: #163E36;
  /* 다크 accent(#3BE4B8)는 밝은 민트라 흰 텍스트가 1.62:1로 사실상 안 보였다.
     진한 잉크로 8.02:1 확보 — 라이트는 흰 텍스트 그대로 둔다(4.32:1, 이미 정상). */
  --ac-ink: #083830;
  --cy: #FF8B7A; --cyL: #3A1E1A; --cyT: #FFB5A5;
  --sh1: 0 1px 4px rgba(0,0,0,0.35);
  --sh2: 0 12px 32px -10px rgba(0,0,0,0.55);
  --shCard: 0 6px 20px rgba(0,0,0,0.4);
}
/* Editorial-pop (kitsch) theme — shared archive_diary palette */
:root[data-theme="archive_diary"] {
  --k-cream: #FFF7E8; --k-ink: #141414; --k-pink: #FF8ED1; --k-pink-deep: #F451B0;
  --k-blue: #2F5EFC; --k-butter: #FFE45E; --k-lime: #C2FF44;
  --bg0: #EEF3FF; --bg1: #FFFFFF; --bg2: #F4F7FF; --bg3: #E6EDFF;
  --bd: #C2D2EE; --bd2: #DCE5F8;
  --t1: #141414; --t2: #353A45; --t3: #6B7280;
  --ac: #2F5EFC; --ac2: #1B36C9; --acG: rgba(47,94,252,0.12); --acL: #E3EAFF;
  --cy: #F451B0; --cyL: #FFE3F4; --cyT: #8A0F58;
  --ok: #1F8A5B; --warn: #EF8A2C;
  --shCard: 4px 4px 0 var(--k-ink);
  --sh2: 5px 6px 0 rgba(20,20,40,0.14);
}
:root[data-theme="archive_diary"] [data-theme="dark"] {
  --bg0: #14182B; --bg1: #1B2138; --bg2: #232B47; --bg3: #2C3656;
  --bd: #38456A; --bd2: #2B3658;
  --t1: #EEF2FF; --t2: #BAC5E4; --t3: #8C97BE;
  --ac: #6EC6FF; --ac2: #2F5EFC; --acG: rgba(110,198,255,0.14); --acL: #1E2746;
  --cy: #FF8ED1; --cyL: #2E1B2A; --cyT: #FFC4E8;
  --shCard: 4px 4px 0 #0A0D17;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--ff);
  background: var(--bg0);
  color: var(--t1);
  line-height: 1.6;
  font-size: clamp(15px, 1.2vw, 16px);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ac); }
h1, h2, h3 { line-height: 1.25; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 4px; }

/* ── Top bar ── */
.nh-topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  padding: 0.7rem clamp(1rem, 4vw, 2rem);
  background: color-mix(in srgb, var(--bg1) 86%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd2);
}
.nh-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  min-height: 40px; padding: 0 0.85rem;
  font-weight: 700; font-size: 0.9rem; text-decoration: none;
  color: var(--t1); border: 1px solid var(--bd); border-radius: 999px; background: var(--bg2);
  transition: border-color 0.18s, background 0.18s, transform 0.18s;
}
.nh-back:hover { border-color: var(--ac); transform: translateX(-2px); }
.nh-back-label-short { display: none; }
.nh-controls { display: flex; gap: 0.4rem; position: relative; }
.nh-lang-note {
  position: absolute; top: 100%; inset-inline-end: 0; margin-top: 0.35rem; z-index: 60;
  max-width: 280px; padding: 0.35rem 0.55rem;
  border: 1px solid var(--bd); border-radius: 10px; background: var(--bg1); box-shadow: var(--sh2);
  font-size: 0.7rem; line-height: 1.45; font-weight: 400; color: var(--t3); text-align: start;
}
.nh-ctl {
  min-height: 40px; min-width: 40px; padding: 0 0.75rem;
  font-family: var(--ff); font-weight: 700; font-size: 0.85rem;
  color: var(--t2); background: var(--bg2); border: 1px solid var(--bd); border-radius: 999px; cursor: pointer;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}
.nh-ctl:hover { border-color: var(--ac); color: var(--t1); }

.nh-section-nav {
  position: sticky; top: 64px; z-index: 45;
  display: flex; justify-content: center; gap: 0.35rem;
  padding: 0.45rem clamp(1rem, 4vw, 2rem);
  overflow-x: auto; scrollbar-width: none;
  background: color-mix(in srgb, var(--bg0) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd2);
}
.nh-section-nav::-webkit-scrollbar { display: none; }
.nh-section-nav a {
  flex: 0 0 auto; padding: 0.42rem 0.72rem; border-radius: 999px;
  color: var(--t2); text-decoration: none; font-size: 0.78rem; font-weight: 800;
  border: 1px solid transparent;
}
.nh-section-nav a:hover, .nh-section-nav a:focus-visible { color: var(--t1); border-color: var(--bd); background: var(--bg1); }

main { display: block; }
.nh-wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }

/* ── Hero ── */
.nh-hero {
  position: relative; overflow: hidden;
  padding: clamp(2.4rem, 6vw, 4.2rem) clamp(1rem, 4vw, 2rem) clamp(1.8rem, 4vw, 2.6rem);
  background:
    radial-gradient(120% 90% at 90% -10%, var(--cyL) 0%, transparent 55%),
    radial-gradient(110% 80% at -10% 0%, var(--acL) 0%, transparent 50%),
    var(--bg1);
  border-bottom: 1px solid var(--bd2);
}
.nh-hero-inner { max-width: var(--maxw); margin: 0 auto; position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, 0.7fr); gap: clamp(1.4rem, 4vw, 3rem); align-items: center; }
.nh-hero-copy { min-width: 0; }
.nh-kicker {
  display: inline-block; margin: 0 0 0.8rem;
  font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ac2); padding: 0.3rem 0.7rem; border: 1px solid var(--bd); border-radius: 999px; background: var(--bg2);
}
.nh-title { margin: 0; font-size: clamp(2rem, 6vw, 3.3rem); font-weight: 800; }
.nh-tagline { margin: 0.35rem 0 0; font-size: clamp(1.1rem, 2.6vw, 1.5rem); font-weight: 700; font-style: italic; color: var(--cyT); }
.nh-lead { margin: 1rem 0 0; max-width: 60ch; font-size: clamp(0.98rem, 1.6vw, 1.1rem); color: var(--t2); }
.nh-cta-row { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; }
.nh-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 50px; padding: 0 1.4rem;
  font-family: var(--ff); font-weight: 800; font-size: 0.98rem; cursor: pointer;
  border-radius: var(--r-md); border: 1px solid transparent; text-decoration: none;
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s, border-color 0.18s;
}
.nh-btn-primary { background: var(--ac); color: var(--ac-ink); box-shadow: var(--sh2); }
.nh-btn-primary:hover { transform: translateY(-2px); }
.nh-btn-secondary { background: var(--bg1); color: var(--t1); border-color: var(--bd); }
.nh-btn-secondary:hover { border-color: var(--ac); transform: translateY(-2px); }
.nh-proof-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.85rem; }
.nh-proof-row span { padding: 0.28rem 0.62rem; border-radius: 999px; border: 1px solid var(--bd); background: color-mix(in srgb, var(--bg1) 86%, transparent); color: var(--t2); font-size: 0.76rem; font-weight: 750; }
.nh-hero-guide { padding: 1.1rem; border: 1px solid var(--bd); border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg1) 88%, transparent); box-shadow: var(--shCard); }
.nh-hero-guide h2 { margin: 0 0 0.25rem; font-size: 1rem; }
.nh-hero-guide p { margin: 0 0 0.75rem; color: var(--t2); font-size: 0.82rem; }
.nh-guide-link { width: 100%; display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: 0.55rem; padding: 0.68rem 0.72rem; margin-top: 0.45rem; border: 1px solid var(--bd); border-radius: var(--r-md); background: var(--bg1); color: var(--t1); font-family: var(--ff); text-align: left; text-decoration: none; cursor: pointer; }
.nh-guide-link:hover { border-color: var(--ac); }
.nh-guide-num, .nh-card-icon, .nh-path-icon { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.nh-guide-num { font-size: 0.72rem; font-weight: 900; color: var(--ac); }
.nh-guide-link strong { font-size: 0.86rem; }
.nh-guide-arrow { color: var(--ac); font-weight: 900; }
.nh-notice {
  display: flex; gap: 0.6rem; align-items: flex-start;
  margin-top: 1.6rem; max-width: 72ch; padding: 0.85rem 1rem;
  background: var(--acG); border: 1px solid color-mix(in srgb, var(--ac) 28%, transparent);
  border-radius: var(--r-md); color: var(--t2); font-size: 0.88rem;
}
.nh-notice-icon { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border: 1px solid var(--bd); border-radius: 999px; color: var(--ac); font-size: 0.72rem; font-weight: 900; font-family: ui-serif, Georgia, serif; }

/* ── Sections ── */
section.nh-block, .nh-dashboard, .nh-pathway, .nh-caution, .nh-sources { padding: clamp(2rem, 5vw, 3rem) 0; }
.nh-section-h { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.nh-section-h h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); }
.nh-section-intro { margin: 0.6rem 0 1.4rem; max-width: 70ch; color: var(--t2); }

/* ── Dashboard grid ── */
.nh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: clamp(0.8rem, 1.6vw, 1.1rem); }
.nh-card {
  display: flex; flex-direction: column; gap: 0.5rem; text-align: left;
  padding: 1.2rem 1.25rem; min-height: 168px;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-lg);
  box-shadow: var(--shCard); cursor: pointer; font-family: var(--ff); color: var(--t1);
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
}
.nh-card:hover, .nh-card:focus-visible { transform: translateY(-3px); border-color: var(--ac); }
.nh-card-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 12px; font-size: 0.78rem; font-weight: 900;
  background: var(--acG); border: 1px solid color-mix(in srgb, var(--ac) 24%, transparent);
}
.nh-card-label { font-size: 1.08rem; font-weight: 800; }
.nh-card-desc { font-size: 0.88rem; color: var(--t2); flex: 1; }
.nh-card-cta { font-size: 0.85rem; font-weight: 800; color: var(--ac); display: inline-flex; align-items: center; gap: 0.3rem; }
.nh-card-cta::after { content: "→"; transition: transform 0.18s; }
.nh-card:hover .nh-card-cta::after { transform: translateX(3px); }
.nh-card[data-variant="waymaker"] .nh-card-icon { background: var(--cyL); border-color: color-mix(in srgb, var(--cy) 40%, transparent); color: var(--cyT); }

/* ── Pathway preview ── */
.nh-pathway { background: var(--bg2); border-top: 1px solid var(--bd2); border-bottom: 1px solid var(--bd2); }
.nh-pathway-steps { list-style: none; counter-reset: step; margin: 1.2rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: stretch; }
.nh-pathway-steps li {
  counter-increment: step; position: relative; flex: 1 1 170px;
  padding: 0.9rem 1rem 0.9rem 2.6rem;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md);
  font-size: 0.88rem; font-weight: 600; color: var(--t1);
}
.nh-pathway-steps li::before {
  content: counter(step); position: absolute; left: 0.8rem; top: 0.85rem;
  width: 1.4rem; height: 1.4rem; border-radius: 999px; background: var(--ac); color: var(--ac-ink);
  font-size: 0.78rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
}

/* ── Generic content blocks ── */
.nh-block { border-bottom: 1px solid var(--bd2); }
.nh-sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.8rem; margin-top: 1.2rem; }
.nh-sub-item { padding: 1rem 1.1rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); }
.nh-sub-item h3 { margin: 0 0 0.35rem; font-size: 0.98rem; }
.nh-sub-item p { margin: 0; font-size: 0.85rem; color: var(--t2); }
.nh-inline-note {
  margin-top: 1.1rem; padding: 0.75rem 0.95rem; font-size: 0.85rem; color: var(--t2);
  background: color-mix(in srgb, var(--warn) 10%, var(--bg1)); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent); border-radius: var(--r-md);
}

/* ── Checklist ── */
.nh-checklist { list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: 0.55rem; }
.nh-checklist li { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.8rem 1rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); }
.nh-check-box { flex-shrink: 0; width: 1.3rem; height: 1.3rem; border: 2px solid var(--ac); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--ac); font-size: 0.85rem; font-weight: 800; }
.nh-check-body strong { display: block; font-size: 0.95rem; }
.nh-check-body span { font-size: 0.83rem; color: var(--t2); }
.nh-check-caution { color: var(--cyT) !important; font-weight: 700; }

/* ── Hub ── */
.nh-hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.7rem; margin-top: 1.2rem; }
.nh-hub-item { text-align: left; padding: 1rem 1.05rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); cursor: pointer; font-family: var(--ff); color: var(--t1); transition: transform 0.18s, border-color 0.18s; }
.nh-hub-item:hover, .nh-hub-item:focus-visible { transform: translateY(-2px); border-color: var(--ac); }
.nh-hub-item h3 { margin: 0 0 0.3rem; font-size: 0.98rem; }
.nh-hub-item p { margin: 0; font-size: 0.82rem; color: var(--t2); }

/* ── Waymaker block ── */
.nh-waymaker .nh-waymaker-inner {
  display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;
  margin-top: 1.2rem; padding: 1.4rem 1.5rem;
  background: linear-gradient(120deg, var(--acG), var(--cyL));
  border: 1px solid var(--bd); border-radius: var(--r-lg);
}
.nh-waymaker-text { max-width: 56ch; }
.nh-waymaker-text h3 { margin: 0 0 0.4rem; font-size: 1.15rem; }
.nh-waymaker-text p { margin: 0; font-size: 0.9rem; color: var(--t2); }
.nh-waymaker-note { margin-top: 0.7rem !important; font-size: 0.8rem !important; color: var(--t3) !important; }

/* ── Caution + sources ── */
.nh-caution .nh-caution-inner { padding: 1.4rem 1.5rem; background: color-mix(in srgb, var(--warn) 9%, var(--bg1)); border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent); border-radius: var(--r-lg); }
.nh-caution h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
.nh-caution p { margin: 0; color: var(--t2); }
.nh-source-list { list-style: none; margin: 1.1rem 0 0; padding: 0; display: grid; gap: 0.5rem; }
.nh-source-list li { display: flex; flex-wrap: wrap; gap: 0.5rem 0.7rem; align-items: center; padding: 0.7rem 0.95rem; background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-md); font-size: 0.88rem; }
.nh-source-flag { font-size: 0.72rem; font-weight: 800; color: var(--t3); border: 1px dashed var(--bd); border-radius: 999px; padding: 0.1rem 0.5rem; }

/* ── Status chips (never color-only: each has a glyph + text) ── */
.nh-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.2rem 0.6rem; border-radius: 999px;
  font-size: 0.76rem; font-weight: 800; line-height: 1.3;
  border: 1px solid var(--bd); background: var(--bg2); color: var(--t2);
}
.nh-chip-glyph { font-size: 0.8rem; }
.nh-chip[data-tone="go"] { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, var(--bg1)); color: color-mix(in srgb, var(--ok) 72%, var(--t1)); }
.nh-chip[data-tone="warn"] { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, var(--bg1)); color: color-mix(in srgb, var(--warn) 72%, var(--t1)); }
.nh-chip[data-tone="neutral"] { border-color: var(--bd); background: var(--bg2); color: var(--t2); }

/* ── Footer ── */
.nh-footer { padding: 2rem clamp(1rem,4vw,2rem) 3rem; background: var(--bg2); border-top: 1px solid var(--bd2); }
.nh-footer-inner { max-width: var(--maxw); margin: 0 auto; display: flex; flex-direction: column; gap: 0.8rem; }
/* 면책 문구다 — --t3 는 다크 푸터(#184B40)에서 2.70:1 로 AA 미달이었다.
   --t2 는 라이트 6.56:1 / 다크 5.40:1 로 양쪽 통과한다. */
.nh-footer p { margin: 0; font-size: 0.85rem; color: var(--t2); max-width: 80ch; }
.nh-footer a { font-weight: 800; text-decoration: none; }
.nh-footer a:hover { text-decoration: underline; }

/* ── Modal ── */
.nh-modal-overlay {
  position: fixed; inset: 0; z-index: 200; display: none;
  align-items: center; justify-content: center; padding: 1rem;
  background: rgba(12,16,14,0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity 0.25s;
}
.nh-modal-overlay.active { display: flex; opacity: 1; }
.nh-modal {
  width: 100%; max-width: 680px; max-height: 90vh; display: flex; flex-direction: column;
  background: var(--bg1); border: 1px solid var(--bd); border-radius: var(--r-xl);

<script src="assets/js/zh-traditional.js"></script>
<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  var LANG_KEY = 'paradiso:language';
  var THEME_KEY = 'paradiso:editorial-theme';
  var BRIGHT_KEY = 'paradiso:brightness';
  var SUPPORTED = ['ko', 'en', 'zh-CN', 'zh-TW'];
  // Full canonical site locale cycle, in index.html LANGUAGE_OPTIONS order. The
  // toggle must advance through EVERY site locale so a click from a globally
  // stored ja/vi/etc. lands on the genuine next locale instead of overwriting
  // the shared paradiso:language key with a coerced ko/en/zh value.
  var LANG_ORDER = ['ko', 'en', 'zh-CN', 'zh-TW', 'ja', 'vi', 'tl', 'id', 'ru', 'fr', 'es', 'ar', 'de', 'tr', 'uk'];
  var LANG_SHORT = {
    ko: '한', en: 'EN', 'zh-CN': '简', 'zh-TW': '繁', ja: '日', vi: 'VI',
    tl: 'TL', id: 'ID', ru: 'RU', fr: 'FR', es: 'ES', ar: 'ع', de: 'DE', tr: 'TR', uk: 'UK'
  };
  // Locales this page renders natively (content JSON carries ko/en/zh-CN; zh-TW is
  // a display layer over zh-CN). A selected locale outside this set stays selected
  // but renders via the ko fallback in pick(), flagged by the note — never coerced.
  var LANG_TRANSLATED = { ko: true, en: true, 'zh-CN': true, 'zh-TW': true };
  // Content locale that actually drives pick(): untranslated selections render ko.
  function contentLocaleFor(sel) {
    if (sel === 'zh-TW' || sel === 'zh-CN') return 'zh-CN';
    if (sel === 'en') return 'en';
    return 'ko';
  }
  // Traditional Chinese is a display layer over zh-CN content (zh-traditional.js).
  // `lang` is the content locale; `tradTW` activates the converter.
  var selectedLocale = initialSelection();
  var tradTW = (selectedLocale === 'zh-TW');
  var lang = contentLocaleFor(selectedLocale);
  var content = null;     // nationality_content.json
  var paths = null;       // nationality_paths.json (path catalog)
  var flows = null;       // nationality_flows.json (wizards)
  var sources = null;     // nationality_sources.json (registry)
  var chipMap = {};       // chip id -> chip
  var catMap = {};        // result-category id -> category
  var srcMap = {};        // sourceId -> source
  var lastFocus = null;
  var activeOverlay = null;
  var activeRebuild = null; // re-render hook for the open modal on language switch

  function initialSelection() {
    try {
      // Read the shared global choice WITHOUT coercion: any canonical site locale
      // stays selected as-is (content falls back to ko via pick() if untranslated
      // here). Garbage/unknown falls through to the navigator hint, then ko.
      var raw = (localStorage.getItem(LANG_KEY) || '');
      if (LANG_ORDER.indexOf(raw) >= 0) return raw;
    } catch (e) {}
    try {
      if ((navigator.language || '').toLowerCase().indexOf('en') === 0) return 'en';
    } catch (e) {}
    return 'ko';
  }
  function applyTradLayer(on) {
    try { var zt = window.ParadisoZhT; if (!zt) return; if (on) { if (!zt.isActive()) zt.start(); } else if (zt.isActive()) { zt.stop(); } } catch (e) {}
  }

  function pick(node) {
    if (node == null) return '';
    if (typeof node === 'string') return node;
    if (typeof node === 'object') {
      if (node[lang] != null) return node[lang];
      if (node.ko != null) return node.ko;
      if (node.en != null) return node.en;
    }
    return '';
  }

  function resolve(root, dotted) {
    return dotted.split('.').reduce(function (acc, k) { return acc == null ? acc : acc[k]; }, root);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  // ── Status chips ───────────────────────────────────────────────────────
  function chipHtml(id) {
    var c = chipMap[id];
    if (!c) return '';
    return '<span class="nh-chip" data-tone="' + esc(c.tone) + '"><span class="nh-chip-glyph" aria-hidden="true">' +
      esc(c.icon) + '</span>' + esc(pick(c)) + '</span>';
  }

  // ── Static text binding: elements carry a dotted content path attribute ──
  function applyStatic() {
    document.documentElement.lang = tradTW ? 'zh-TW' : lang;
    applyTradLayer(tradTW);
    document.querySelectorAll('[data-c]').forEach(function (node) {
      var val = resolve(content, node.getAttribute('data-c'));
      if (val != null) node.textContent = pick(val);
    });
    var langBtn = document.getElementById('langBtn');
    // The cycle button shows the CURRENT selected locale (not the content locale,
    // so an untranslated selection like ja still reads 日, not the ko fallback).
    if (langBtn) { langBtn.textContent = LANG_SHORT[selectedLocale] || LANG_SHORT.ko; langBtn.setAttribute('data-s2t', 'off'); }
    updateLangNote(selectedLocale);
    var themeLabel = document.getElementById('themeBtnLabel');
    if (themeLabel) themeLabel.textContent = currentTheme() === 'archive_diary' ? 'Editorial-pop' : 'Editorial';
    // Locale-aware accessibility labels. These are attributes, so applyStatic's
    // [data-c] textContent pass does not reach them — they must be swapped here so
    // English-mode screen-reader users do not hear Korean labels.
    var a11y = {
      themeBtn: { ko: '테마 전환', en: 'Toggle theme' },
      brightBtn: { ko: '밝기 전환', en: 'Toggle brightness' },
      close: { ko: '닫기', en: 'Close' }
    };
    var themeBtnEl = document.getElementById('themeBtn');
    if (themeBtnEl) themeBtnEl.setAttribute('aria-label', pick(a11y.themeBtn));
    var brightBtnEl = document.getElementById('brightBtn');
    if (brightBtnEl) brightBtnEl.setAttribute('aria-label', pick(a11y.brightBtn));
    document.querySelectorAll('[data-action="close-modal"]').forEach(function (n) {
      n.setAttribute('aria-label', pick(a11y.close));
    });
  }

  // ── Renderers ────────────────────────────────────────────────────────────
  function renderFeatures() {
    var grid = document.getElementById('featureGrid');
    grid.innerHTML = '';
    content.features.forEach(function (f, index) {
      var card = el('button', 'nh-card');
      card.type = 'button';
      card.setAttribute('data-action', f.action);
      card.setAttribute('data-variant', f.id);
      card.innerHTML =
        // 확정 시안(122:13-14)의 44×44 한 글자 아이콘 타일. glyph 가 없으면
        // 예전처럼 순번을 쓴다.
        '<span class="nh-card-icon" aria-hidden="true">' + esc(f.glyph || String(index + 1).padStart(2, '0')) + '</span>' +
        '<span class="nh-card-label">' + esc(pick(f.label)) + '</span>' +
        '<span class="nh-card-desc">' + esc(pick(f.desc)) + '</span>' +
        '<span class="nh-card-cta">' + esc(pick(f.cta)) + '</span>';
      grid.appendChild(card);
    });
  }

  function renderPathway() {
    var ol = document.getElementById('pathwaySteps');
    ol.innerHTML = '';
    (pick(content.pathwayPreview.steps) || []).forEach(function (s) {
      ol.appendChild(el('li', null, esc(s)));
    });
    renderJourney();
  }

  // 정착 여정 스테퍼 — 확정 시안 123:9. 원 + 연결선 + 라벨.
  // 시안의 ✓ 는 "스크롤에 따라 한 걸음씩 그려지는 길"이라는 연출이지
  // 사용자의 실제 진행 상황이 아니다. 개인 진행이나 심사 결과로 읽히지
  // 않도록 아래에 그 뜻을 명시하고, 원 안에는 항상 단계 번호를 쓴다.
  function renderJourney() {
    var wrap = document.getElementById('journeySteps');
    if (!wrap) return;
    var stages = pick(content.pathwayPreview.stages) || [];
    wrap.innerHTML = '';
    stages.forEach(function (label, i) {
      if (i > 0) wrap.appendChild(el('span', 'nh-journey-link'));
      var step = el('span', 'nh-journey-step',
        '<span class="nh-journey-dot">' + (i + 1) + '</span>' +
        '<span class="nh-journey-label">' + esc(label) + '</span>');
      wrap.appendChild(step);
    });
    observeJourney(wrap);
  }

  function observeJourney(wrap) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var steps = wrap.querySelectorAll('.nh-journey-step');
    var links = wrap.querySelectorAll('.nh-journey-link');
    function draw() {
      steps.forEach(function (n, i) { setTimeout(function () { n.classList.add('is-drawn'); }, reduce ? 0 : i * 140); });
      links.forEach(function (n, i) { setTimeout(function () { n.classList.add('is-drawn'); }, reduce ? 0 : 70 + i * 140); });
    }
    if (!('IntersectionObserver' in window)) { draw(); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { draw(); io.disconnect(); } });
    }, { threshold: 0.35 });
    io.observe(wrap);
  }

  // Field helpers: support both {ko,en} objects and Ko/En-suffixed fields.
  function fld(obj, base) {
    if (!obj) return '';
    if (obj[base] != null) return pick(obj[base]);
    var ko = obj[base + 'Ko'], en = obj[base + 'En'];
    if (ko != null || en != null) return pick({ ko: ko, en: en });
    return '';
  }
  function fldArr(obj, base) {
    var v = obj && obj[base];
    if (!v) return [];
    if (Array.isArray(v)) return v;
    var a = pick(v);
    return Array.isArray(a) ? a : [];
  }
  function srcTitle(s) { return (lang === 'en' && s.titleEn) ? s.titleEn : s.title; }
  function sourceById(id) { return srcMap[id]; }
  function sourceClassLabel(s) {
    var labels = content && content.ui && content.ui.sourceClassLabels;
    return labels && labels[s.sourceClass] ? pick(labels[s.sourceClass]) : (s.sourceType || '');
  }
  function srcChipsHtml(ids) {
    if (!ids || !ids.length) return '';
    var chips = ids.map(function (id) {
      var s = srcMap[id];
      if (!s) return '';
      return '<a class="nh-src-chip" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(srcTitle(s)) + '</a>';
    }).join('');
    return '<div class="nh-src-chips">' + chips + '</div>';
  }

  function richPathCardHtml(p) {
    var li = function (s) { return '<li>' + esc(s) + '</li>'; };
    var kc = fldArr(p, 'keyChecks').map(li).join('');
    var ev = fldArr(p, 'requiredEvidenceGroups').map(li).join('');
    var ns = fldArr(p, 'nextSteps').map(li).join('');
    var pathIndex = (paths.paths || []).findIndex(function (item) { return item.id === p.id; });
    var pathNumber = String(pathIndex >= 0 ? pathIndex + 1 : 1).padStart(2, '0');
    return '<div class="nh-path-card" data-path="' + esc(p.id) + '">' +
      '<button type="button" class="nh-path-head" aria-expanded="false">' +
      '<span class="nh-path-icon" aria-hidden="true">' + pathNumber + '</span>' +
      '<span class="nh-path-head-text"><strong>' + esc(fld(p, 'title')) + '</strong>' +
      '<span>' + esc(fld(p, 'summary')) + '</span></span>' +
      chipHtml(p.chip) +
      '<span class="nh-path-toggle" aria-hidden="true">▾</span>' +
      '</button>' +
      '<div class="nh-path-body"><div class="nh-path-detail">' +
      '<div><h5>' + esc(pick(content.ui.whoLabel)) + '</h5><ul><li>' + esc(fld(p, 'who')) + '</li></ul></div>' +
      (kc ? '<div><h5>' + esc(pick(content.ui.keyChecksLabel)) + '</h5><ul>' + kc + '</ul></div>' : '') +
      (ev ? '<div><h5>' + esc(pick(content.ui.evidenceLabel)) + '</h5><ul>' + ev + '</ul></div>' : '') +
      (ns ? '<div><h5>' + esc(pick(content.ui.nextStepsLabel)) + '</h5><ul>' + ns + '</ul></div>' : '') +
      '<div class="nh-path-caution">' + esc(fld(p, 'caution')) + '</div>' +
      '<div><h5>' + esc(pick(content.ui.sourcesLabel)) + '</h5>' + srcChipsHtml(p.sourceIds) + '</div>' +
      '</div></div>' +
      '</div>';
  }
  function wirePathCards(container) {
    container.querySelectorAll('.nh-path-head').forEach(function (head) {
      head.addEventListener('click', function () {
        var card = head.closest('.nh-path-card');
        var open = card.classList.toggle('open');
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });
  }

  function renderKiip() {
    var k = content.kiip;
    var box = document.getElementById('kiipBody');
    if (!box) return;
    var html = '';
    html += '<p class="nh-section-intro">' + esc(pick(k.intro)) + '</p>';
    html += '<div class="nh-kiip-card"><h3>KIIP</h3><p>' + esc(pick(k.whatIs)) + '</p></div>';
    html += '<div class="nh-kiip-card"><p>' + esc(pick(k.distinction)) + '</p></div>';
    html += '<div class="nh-sub-grid">';
    k.subsections.forEach(function (s) {
      html += '<div class="nh-sub-item"><h3>' + esc(pick(s.label)) + '</h3><p>' + esc(pick(s.desc)) + '</p>' + srcChipsHtml(s.sourceIds) + '</div>';
    });
    html += '</div>';
    var helps = (pick(k.helps) || []).map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
    var nots = (pick(k.notClaims) || []).map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('');
    var helpsTitle = lang === 'zh-CN' ? 'New Home by Paradiso 能帮的' : lang === 'en' ? 'What New Home by Paradiso helps with' : 'New Home by Paradiso가 돕는 것';
    var notsTitle = lang === 'zh-CN' ? 'New Home by Paradiso 不会断定的' : lang === 'en' ? "What New Home by Paradiso won't claim" : 'New Home by Paradiso가 단정하지 않는 것';
    html += '<div class="nh-cols">' +
      '<div class="nh-pill-card"><h4>' + esc(helpsTitle) + '</h4><ul class="nh-pill-list yes">' + helps + '</ul></div>' +
      '<div class="nh-pill-card"><h4>' + esc(notsTitle) + '</h4><ul class="nh-pill-list no">' + nots + '</ul></div>' +
      '</div>';
    html += '<p class="nh-inline-note">' + esc(pick(k.note)) + '</p>';
    box.innerHTML = html;
  }

  function renderAfter() {
    var list = document.getElementById('afterList');
    list.innerHTML = '';
    content.afterApproval.groups.forEach(function (g) {
      var caution = g.caution ? '<span class="nh-check-caution"> ⚠ ' + esc(pick(g.caution)) + '</span>' : '';
      list.appendChild(el('li', null,
        '<span class="nh-check-box" aria-hidden="true">✓</span>' +
        '<span class="nh-check-body"><strong>' + esc(pick(g.label)) + '</strong>' +
        '<span>' + esc(pick(g.explain)) + ' · ' + esc(pick(g.prepare)) + caution + '</span>' +
        srcChipsHtml(g.sourceIds) + '</span>'));
    });
  }

  function renderHub() {
    var grid = document.getElementById('hubGrid');
    grid.innerHTML = '';
    grid.className = '';
    var order = [];
    var byGroup = {};
    content.hub.items.forEach(function (it) {
      var g = lang === 'en' ? (it.groupEn || 'Other') : (it.groupKo || '기타');
      if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
      byGroup[g].push(it);
    });
    order.forEach(function (g) {
      var section = el('div', 'nh-hub-group');
      section.appendChild(el('p', 'nh-hub-group-title', esc(g)));
      var cards = el('div', 'nh-hub-grid');
      byGroup[g].forEach(function (it) {
        var b = el('button', 'nh-hub-item');
        b.type = 'button';
        b.setAttribute('data-action', 'open-hub');
        b.setAttribute('data-id', it.id);
        b.innerHTML = '<h3>' + esc(pick(it.label)) + '</h3><p>' + esc(pick(it.desc)) + '</p>';
        cards.appendChild(b);
      });
      section.appendChild(cards);
      grid.appendChild(section);
    });
  }

  function renderSources() {
    var panel = document.getElementById('sourcePanel');
    if (!panel || !sources) return;
    panel.innerHTML = '';
    var verify = pick(content.ui.verifyBadge);
    (sources.groups || []).forEach(function (grp) {
      var items = (sources.sources || []).filter(function (s) { return s.group === grp.id; });
      if (!items.length) return;
      var wrap = el('div', 'nh-source-group');
      wrap.appendChild(el('p', 'nh-source-group-title', esc(pick(grp))));
      items.forEach(function (s) {
        var flag = s.contentVerified ? '' : '<span class="nh-source-flag">' + esc(verify) + '</span>';

  function renderAll() {
    // The delegated click handler (incl. the language toggle) is live before the
    // content JSON resolves; without content the renderers below dereference null
    // (content.features/…) and throw. No-op until the payload has loaded — boot()
    // calls renderAll again once it is ready.
    if (!content) return;
    applyStatic();
    renderFeatures();
    renderPathway();
    renderKiip();
    renderAfter();
    renderHub();
    renderSources();
    if (activeOverlay && activeRebuild) activeRebuild();
  }

  // ── Modal plumbing ───────────────────────────────────────────────────────
  function focusables(container) {
    return Array.prototype.slice.call(container.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(function (n) { return !n.disabled && n.offsetParent !== null; });
  }

  function trap(e) {
    if (e.key !== 'Tab' || !activeOverlay) return;
    var f = focusables(activeOverlay);
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function openOverlay(id, rebuild) {
    var ov = document.getElementById(id);
    if (!ov) return;
    lastFocus = document.activeElement;
    activeOverlay = ov;
    activeRebuild = rebuild || null;
    ov.classList.add('active');
    ov.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', trap);
    var preferred = ov.querySelector('legend[tabindex="-1"], [data-nh-result] h3[tabindex="-1"]');
    var f = focusables(ov);
    if (preferred) preferred.focus();
    else if (f.length) f[0].focus();
  }

  function closeOverlay() {
    if (!activeOverlay) return;
    activeOverlay.classList.remove('active');
    activeOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', trap);
    activeOverlay = null;
    activeRebuild = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  // ── Readiness check (one question per screen) ──────────────────────────────
  var readinessAnswers = {};
  var readinessStep = 0;

  function fillTemplate(str, vars) {
    return String(str == null ? '' : str).replace(/\{(\w+)\}/g, function (m, k) {
      return vars[k] != null ? vars[k] : m;
    });
  }

  function buildReadinessStep() {
    var r = flows.readiness;
    var qs = r.questions;
    if (readinessStep < 0) readinessStep = 0;
    if (readinessStep >= qs.length) { showReadinessResult(); return; }
    var q = qs[readinessStep];
    var isLast = readinessStep === qs.length - 1;
    document.getElementById('readinessTitle').textContent = pick(r.title);
    var body = document.getElementById('readinessBody');
    var foot = document.getElementById('readinessFoot');

    body.innerHTML = '';
    var progressText = fillTemplate(pick(r.progressLabel), { current: readinessStep + 1, total: qs.length });
    var progress = el('p', 'nh-progress', esc(progressText));
    progress.setAttribute('role', 'progressbar');
    progress.setAttribute('aria-valuemin', '1');
    progress.setAttribute('aria-valuemax', String(qs.length));
    progress.setAttribute('aria-valuenow', String(readinessStep + 1));
    progress.setAttribute('aria-valuetext', progressText);
    body.appendChild(progress);
    if (readinessStep === 0) body.appendChild(el('p', 'nh-section-intro', esc(pick(r.intro))));

    var fs = el('fieldset', 'nh-q');
    var legend = el('legend', null, esc(pick(q.q)));
    legend.setAttribute('tabindex', '-1');
    fs.appendChild(legend);
    var opts = el('div', 'nh-q-options');
    q.options.forEach(function (o) {
      var checked = readinessAnswers[q.id] === o.value ? ' checked' : '';
      var label = el('label', 'nh-opt',
        '<input type="radio" name="' + esc(q.id) + '" value="' + esc(o.value) + '"' + checked + '>' +
        '<span>' + esc(pick(o.label)) + '</span>');
      opts.appendChild(label);
    });
    fs.appendChild(opts);
    body.appendChild(fs);

    foot.innerHTML = '';
    // 확정 시안(116:27, "Btn / 닫기 — 라이브 미구현 · 반영 후보")대로 첫 질문에서는
    // 비어 있던 '이전' 자리에 '닫기'를 둔다. 헤더 ✕ 만으로도 나갈 수는 있었지만,
    // 푸터에서 손이 머무는 자리에 나가는 길이 없던 것이 시안이 지적한 지점이다.
    var back;
    if (readinessStep === 0) {
      back = el('button', 'nh-btn-sm', esc(pick(content.ui.close)));
      back.type = 'button';
      back.addEventListener('click', function () { closeOverlay(); });
    } else {
      back = el('button', 'nh-btn-sm', esc(pick(content.ui.back)));
      back.type = 'button';
      back.addEventListener('click', function () { readinessStep--; buildReadinessStep(); });
    }

    var next = el('button', 'nh-btn-sm primary', esc(pick(isLast ? content.ui.viewResult : content.ui.next)));
    next.type = 'button';
    next.disabled = readinessAnswers[q.id] == null;
    next.addEventListener('click', function () {
      if (readinessAnswers[q.id] == null) return;
      if (isLast) showReadinessResult();
      else { readinessStep++; buildReadinessStep(); }
    });

    opts.addEventListener('change', function (e) {
      if (e.target && e.target.name) {
        readinessAnswers[e.target.name] = e.target.value;
        next.disabled = false;
      }
    });

    foot.appendChild(back);
    foot.appendChild(next);
    legend.focus();
  }

  function evaluateReadiness(a) {
    var cats = { review: [], firstcheck: [], materials: [], official: [], risk: [] };
    var addP = function (id) { if (cats.review.indexOf(id) < 0) cats.review.push(id); };
    var addN = function (c, m) { if (cats[c].indexOf(m) < 0) cats[c].push(m); };
    var hasF5 = a.r_status === 'f5';

    if (a.r_spouse === 'intact' || a.r_spouse === 'changed') addP('marriage');
    if (a.r_family === 'parent') addP('family');
    if (a.r_family === 'selfPast') { addP('restoration'); addP('determination'); }
    if (a.r_family === 'overseas') { addP('family'); addP('restoration'); addP('determination'); addN('firstcheck', 'overseasInfo'); }
    if (hasF5 || a.r_residence === 'ge5') addP('general');

    if (a.r_status === 'unsure' || a.r_inkorea === 'unsure') addN('firstcheck', 'confirmStatus');
    var shortStay = a.r_residence === 'lt1' || a.r_residence === '1to2' || a.r_residence === '2to3' || a.r_residence === '3to5';
    if (a.r_need === 'f5first' || (!hasF5 && cats.review.indexOf('marriage') < 0 && cats.review.indexOf('family') < 0 && shortStay)) addN('firstcheck', 'needF5First');

    addN('official', 'officialAlways');
    if (a.r_kiip && a.r_kiip !== 'done') addN('official', 'kiipNeeded');

    addN('materials', 'materialsGeneral');
    if (cats.review.indexOf('marriage') >= 0) addN('materials', 'materialsMarriage');
    if (a.r_need === 'docs') addN('materials', 'materialsDocs');
    if (a.r_need === 'kiip') addN('materials', 'kiipPrep');
    if (a.r_need === 'progress') addN('materials', 'progressInfo');
    if (a.r_need === 'after') addN('materials', 'afterInfo');

    if (a.r_risk === 'absence' || a.r_residence === 'gap') addN('risk', 'riskAbsence');
    if (a.r_risk === 'tax') addN('risk', 'riskTax');
    if (a.r_risk === 'criminal') addN('risk', 'riskCriminal');
    if (a.r_risk === 'complexFamily') addN('risk', 'riskComplexFamily');

    if (cats.review.length === 0) addN('firstcheck', 'limited');
    return cats;
  }

  function showReadinessResult() {
    var r = flows.readiness;
    var body = document.getElementById('readinessBody');

  function openReadiness() {

  // ── Path finder ──────────────────────────────────────────────────────────
  function pathById(id) {
    return (paths.paths || []).filter(function (p) { return p.id === id; })[0];
  }

  var pfAnswers = {};
  var pfStep = 0;

  function pfSteps(a) {
    var pf = flows.pathFinder;
    var variant = (a.pf_start && pf.step2.byChoice[a.pf_start]) ? pf.step2.byChoice[a.pf_start] : pf.step2.fallback;
    return [
      { id: pf.step1.id, q: pf.step1.q, options: pf.step1.options },
      { id: pf.step2.id, q: pf.step2.q, options: variant },
      { id: pf.step3.id, q: pf.step3.q, options: pf.step3.options }
    ];
  }

  function buildPathfinderStep() {
    var pf = flows.pathFinder;
    var steps = pfSteps(pfAnswers);
    if (pfStep < 0) pfStep = 0;
    if (pfStep >= steps.length) { showPathfinderResult(); return; }
    var step = steps[pfStep];
    var isLast = pfStep === steps.length - 1;
    document.getElementById('pathfinderTitle').textContent = pick(pf.title);
    var body = document.getElementById('pathfinderBody');
    var foot = document.getElementById('pathfinderFoot');

    body.innerHTML = '';
    var progressText = fillTemplate(pick(pf.progressLabel), { current: pfStep + 1, total: steps.length });
    var progress = el('p', 'nh-progress', esc(progressText));
    progress.setAttribute('role', 'progressbar');
    progress.setAttribute('aria-valuemin', '1');
    progress.setAttribute('aria-valuemax', String(steps.length));
    progress.setAttribute('aria-valuenow', String(pfStep + 1));
    progress.setAttribute('aria-valuetext', progressText);
    body.appendChild(progress);
    if (pfStep === 0) body.appendChild(el('p', 'nh-section-intro', esc(pick(pf.intro))));
    var fs = el('fieldset', 'nh-q');
    var legend = el('legend', null, esc(pick(step.q)));
    legend.setAttribute('tabindex', '-1');
    fs.appendChild(legend);
    var opts = el('div', 'nh-q-options');
    step.options.forEach(function (o) {
      var checked = pfAnswers[step.id] === o.value ? ' checked' : '';
      opts.appendChild(el('label', 'nh-opt',
        '<input type="radio" name="' + esc(step.id) + '" value="' + esc(o.value) + '"' + checked + '><span>' + esc(pick(o.label)) + '</span>'));
    });
    fs.appendChild(opts);
    body.appendChild(fs);

    foot.innerHTML = '';
    var back = el('button', 'nh-btn-sm', esc(pick(content.ui.back)));
    back.type = 'button';
    back.style.visibility = pfStep === 0 ? 'hidden' : 'visible';
    back.addEventListener('click', function () { pfStep--; buildPathfinderStep(); });
    var next = el('button', 'nh-btn-sm primary', esc(pick(isLast ? content.ui.viewResult : content.ui.next)));
    next.type = 'button';
    next.disabled = pfAnswers[step.id] == null;
    next.addEventListener('click', function () {
      if (pfAnswers[step.id] == null) return;
      if (isLast) showPathfinderResult();
      else { pfStep++; buildPathfinderStep(); }
    });
    opts.addEventListener('change', function (e) {
      if (e.target && e.target.name) {
        pfAnswers[e.target.name] = e.target.value;
        // Branching: clear downstream answers so step 2/3 stay consistent.
        var ss = pfSteps(pfAnswers);
        for (var j = pfStep + 1; j < ss.length; j++) { delete pfAnswers[ss[j].id]; }
        next.disabled = false;
      }
    });
    foot.appendChild(back);
    foot.appendChild(next);
    legend.focus();
  }

  function pfRoutes(a) {
    var pf = flows.pathFinder;
    var opt = (pf.step1.options || []).filter(function (o) { return o.value === a.pf_start; })[0];
    var routes = opt ? (opt.routesTo || []).slice() : [];
    if (a.pf_start === 'overseas' && a.pf_situation === 'restoreVsNat') routes = ['restoration', 'determination', 'general'];
    if (a.pf_start === 'restore' && a.pf_situation === 'lostByForeign') routes = ['restoration'];
    if (a.pf_start === 'applied') routes = ['after'];
    if (a.pf_start === 'dual') routes = ['dual'];
    if (!routes.length) routes = ['general', 'marriage', 'family', 'restoration'];
    return routes;
  }

  function showPathfinderResult() {
    var pf = flows.pathFinder;
    var body = document.getElementById('pathfinderBody');
    var foot = document.getElementById('pathfinderFoot');
    body.innerHTML = '';
    var head = el('div', null, '');

    resultHeading.setAttribute('tabindex', '-1');
    head.appendChild(resultHeading);

    body.scrollTop = 0;
    requestAnimationFrame(function () { resultHeading.focus(); });
  }

      var inResult = document.querySelector('#pathfinderBody [data-nh-result]');
      if (inResult) showPathfinderResult(); else buildPathfinderStep();

  // ── Theme / brightness / language ────────────────────────────────────────
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'archive_diary' ? 'archive_diary' : 'civic_editorial';
  }
  function toggleTheme() {
    var next = currentTheme() === 'civic_editorial' ? 'archive_diary' : 'civic_editorial';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    var label = document.getElementById('themeBtnLabel');
    if (label) label.textContent = next === 'archive_diary' ? 'Editorial-pop' : 'Editorial';
    syncMeta();
  }
  function toggleBrightness() {
    var dark = document.body.getAttribute('data-theme') === 'dark';
    if (dark) document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', 'dark');
    try { localStorage.setItem(BRIGHT_KEY, dark ? 'light' : 'dark'); } catch (e) {}
    syncMeta();
  }
  // Show an unobtrusive note near the control when the selected locale is not
  // fully translated on this page (rendered via the ko fallback).
  function updateLangNote(sel) {
    var langBtn = document.getElementById('langBtn');
    var holder = langBtn ? langBtn.parentElement : null;
    if (!holder) return;
    var note = document.getElementById('nhLangNote');
    var untranslated = sel !== 'ko' && !LANG_TRANSLATED[sel];
    if (untranslated) {
      if (!note) {
        note = document.createElement('div');
        note.id = 'nhLangNote';
        note.className = 'nh-lang-note';
        note.setAttribute('role', 'note');
        note.setAttribute('data-s2t', 'off');
        holder.appendChild(note);
      }
      note.textContent = '이 페이지는 선택한 언어 번역 준비 중입니다 · This page is not yet translated into the selected language.';
    } else if (note) {
      note.remove();
    }
  }
  function toggleLang() {
    var idx = LANG_ORDER.indexOf(selectedLocale);
    selectedLocale = idx < 0 ? 'ko' : LANG_ORDER[(idx + 1) % LANG_ORDER.length];
    tradTW = (selectedLocale === 'zh-TW');
    lang = contentLocaleFor(selectedLocale);
    // Write the shared global key ONLY here, on an explicit user click.
    try { localStorage.setItem(LANG_KEY, selectedLocale); } catch (e) {}
    applyTradLayer(tradTW);
    renderAll();
  }
  function syncMeta() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    var bg = getComputedStyle(document.body).getPropertyValue('--bg0').trim();
    if (bg) meta.setAttribute('content', bg);
  }

  // ── Action dispatch ──────────────────────────────────────────────────────
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    var handlers = {
      'toggle-lang': toggleLang,
      'toggle-theme': toggleTheme,
      'toggle-brightness': toggleBrightness,
      'open-readiness': openReadiness,
      'open-pathfinder': openPathfinder,
      'close-modal': closeOverlay,
      'open-hub': function () { openHubDetail(t.getAttribute('data-id')); },
      'open-waymaker': function () { window.location.href = 'ai.html?domain=nationality'; },
      'scroll-kiip': function () { scrollTo('kiip'); },
      'scroll-after': function () { scrollTo('after'); },
      'scroll-hub': function () { scrollTo('hub'); },
      'scroll-interview': function () { scrollTo('interviewBridge'); },
      'scroll-sources': function () { scrollTo('sources'); }
    };
    if (handlers[action]) {
      if (t.tagName !== 'A') e.preventDefault();
      handlers[action]();
    }
  });

  // Backdrop click closes the active modal.
  document.addEventListener('click', function (e) {
    if (activeOverlay && e.target === activeOverlay) closeOverlay();
  });

  // ESC closes the active modal.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && activeOverlay) { e.preventDefault(); closeOverlay(); }
  });

  function scrollTo(id) {
    var n = document.getElementById(id);
    if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  function showLoadError() {
    var main = document.getElementById('nhMain');
    if (main) {
      main.innerHTML = '<div class="nh-loaderr"><p>콘텐츠를 불러오지 못했습니다. / Content could not be loaded.</p>' +
        '<p><a href="index.html">← Visable</a></p></div>';
    }
  }

  function getJson(path, label) {
    return fetch(path, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(label); return r.json(); });
  }

  function boot() {
    Promise.all([
      getJson('data/nationality_content.json', 'content'),
      getJson('data/nationality_paths.json', 'paths'),
      getJson('data/nationality_flows.json', 'flows'),
      getJson('data/nationality_sources.json', 'sources')
    ]).then(function (res) {
      content = res[0];
      paths = res[1];
      flows = res[2];
      sources = res[3];
      (flows.statusChips || []).forEach(function (c) { chipMap[c.id] = c; });
      (flows.resultCategories || []).forEach(function (c) { catMap[c.id] = c; });
      (sources.sources || []).forEach(function (s) { srcMap[s.sourceId] = s; });
      if (SUPPORTED.indexOf(lang) < 0) lang = 'ko';
      try {
        var savedBrightness = localStorage.getItem(BRIGHT_KEY);
        var useDark = savedBrightness === 'dark' ||
          (savedBrightness === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (useDark) document.body.setAttribute('data-theme', 'dark');
        else document.body.removeAttribute('data-theme');
      } catch (e) {}
      renderAll();
      syncMeta();
    }).catch(function () { showLoadError(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
