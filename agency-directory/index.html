<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163d2f">
<meta name="description" content="2026년 6월 30일 기준 출입국업무 민원신청대행 등록기관 검색">
<title>민원신청대행 등록기관 찾기</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <div class="shell">
    <h1>민원신청대행 등록기관 찾기</h1>
    <p class="dataset-meta">2026.06.30 기준 · 고유 기관 <b id="su">-</b>곳 · 원본 <b id="sr">-</b>행</p>
  </div>
</header>

<section class="dock">
  <div class="shell">
    <div class="panel">
      <form id="form" class="searchrow">
        <div class="searchbox">
          <svg class="glass" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m21 20.3-5.2-5.2a7.5 7.5 0 1 0-.7.7l5.2 5.2.7-.7ZM4.5 10a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg>
          <label class="sr-only" for="q">기관명, 주소 또는 전화번호 검색</label>
          <input id="q" type="search" autocomplete="off" placeholder="기관명, 주소, 전화번호 또는 초성 검색">
          <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
          <div id="suggest" class="suggest" hidden></div>
        </div>
        <button class="go">검색</button>
      </form>

      <div class="filters">
        <select id="prov" aria-label="시도 선택"><option value="">전체 시도</option></select>
        <select id="city" aria-label="시군구 선택" disabled><option value="">전체 시군구</option></select>
        <select id="sort" aria-label="정렬 기준"><option value="rel">관련도순</option><option value="name">기관명순</option><option value="addr">주소순</option></select>
        <button id="dup" class="toggle" type="button">중복 제외</button>
        <button id="reset" class="reset" type="button">초기화</button>
      </div>

      <div id="regions" class="chips"></div>
      <div id="recent" class="recent" hidden></div>
    </div>
  </div>
</section>

<main class="shell">
  <div class="head">
    <div>
      <h2>검색 결과</h2>
      <div id="meta">자료를 불러오는 중입니다.</div>
    </div>
    <div class="head-actions">
      <button id="share" class="util" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 12h8m-4-4 4 4-4 4M6 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2m12-14h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
        링크 복사
      </button>
      <button id="csv" class="util" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
        CSV
      </button>
      <div class="views">
        <button id="listv" class="on" type="button" aria-label="목록 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </button>
        <button id="gridv" type="button" aria-label="격자 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="active" hidden></div>
  <div id="loading" class="loading">기관 목록을 불러오는 중입니다.</div>
  <div id="list" hidden></div>
  <div id="empty" class="empty" hidden><b>검색 결과가 없습니다.</b><br>검색어나 지역 조건을 조정해 보세요.</div>
  <div id="morewrap" class="morewrap" hidden><button id="more" type="button">결과 더 보기</button></div>
  <p class="disclaimer">비공식 정적 목록입니다. 실제 의뢰 전 등록 상태와 연락처를 다시 확인하세요.</p>
</main>

<div id="toast"></div>
<script>window.D=window.Z=[]</script>

<script src="./app.js"></script>
</body>
</html>
